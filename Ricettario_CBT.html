    2.  Apri 3 uova e adagiale nel nido di spinaci.
    3.  Fai colare a giro la fonduta di Parmigiano Reggiano e servi.

### Yakitori laccati agli umami

#### Yakitori
*   **Ingredienti:** 1 kg sovracosce di pollo, 2 l acidificazione forte, 200 g purea di limoni per marinare CBT, Olio all'aglio CBT, Olio al peperoncino CBT, 200 g olio neutro.
*   **Procedimento:**
    1.  Elimina la pelle, disossa le sovracosce e tagliale a bocconcini da 20/25 g l'uno.
    2.  Acidificale per 10 minuti, poi amalgamale nella purea di limone e condizionale sottovuoto per 12 ore.
    3.  Trascorso questo tempo, apri la busta ed elimina buona parte della purea di limoni.
    4.  Amalgama l'olio neutro agli oli aromatici.
    5.  Inserisci i bocconcini nella busta da cottura insieme all'olio e condizionali sottovuoto, applicando il cuscinetto largo.
    6.  Cuoci a 62°C per 2 ore.
    7.  A fine cottura apri la busta e separa la carne dal liquido di cottura.
    8.  Abbattila in positivo ed elimina il liquido di cottura.
    9.  Conservala sottovuoto in frigorifero fino al momento dell'utilizzo.

*   **Finitura del piatto:**
    *   **Ingredienti:** Umami di cipolle CBT, Umami di peperoni rossi CBT, Umami di pomodori CBT.
    *   **Procedimento:**
        1.  Mescolai gli umami e successivamente usali per condire i bocconcini di pollo.
        2.  Infilali sugli spiedini di legno e falli dorare in forno a 200°C per qualche minuto.
        3.  Trascorso questo tempo, toglili dal forno e spennella un ulteriore sottile strato di mix di umami.
        4.  Rimetti in forno e fai laccare la superficie del pollo.
        5.  Ripeti questa operazione altre due volte, quindi servi.

### Mezze maniche alla carbonara

#### Guanciale stagionato
*   **Ingredienti:** 1 guanciale di maiale stagionato.
*   **Procedimento:**
    1.  Lava e spazzola il guanciale sotto l'acqua fredda corrente per eliminare le muffe, il pepe e qualsiasi residuo della stagionatura.
    2.  Asciugalo e con un coltello separa la cotenna stando attento a non lasciare alcuna traccia di grasso attaccato ad essa.
    3.  Rifila tutto il guanciale, togliendo uno strato di mezzo centimetro abbondante dalla superficie, poi squadralo.
    4.  Tieni da parte cotenna, rifilature e i ritagli della squadratura per la realizzazione dell'essenza di guanciale (ricetta seguente).
    5.  Condiziona sottovuoto il guanciale squadrato nella busta da cottura e cuocilo a 68°C per 24 ore, dopodiché abbattilo in positivo.

#### Essenza di guanciale stagionato
*   **Ingredienti:** 1 kg cotenne, rifilature e ritagli di guanciale stagionato, 1 l acqua.
*   **Procedimento:**
    1.  Inserisci nella busta da cottura le cotenne, le rifilature e i ritagli del guanciale stagionato insieme all'acqua.
    2.  Trasferisci in abbattitore per stabilizzare i liquidi.
    3.  Condiziona sottovuoto e cuoci a 86°C per 15 ore.
    4.  A fine cottura apri e scola il contenuto della busta, attraverso un setaccio a rete fine, per trattenere anche i più piccoli residui.
    5.  Delle parti solide rimaste nel setaccio, conserva la cotenna (ti servirà per altre ricette) ed elimina i resti di carne e grasso, non più utili per altre preparazioni.
    6.  Abbatti i liquidi e successivamente elimina il grasso solidificato che si formerà per decantazione naturale sulla superficie.
    7.  La parte acquosa sottostante al grasso è l'essenza di guanciale, che allo stato freddo si presenta come una gelatina morbida, per effetto del connettivo rilasciato in cottura dalla cotenna.
    8.  L'essenza di guanciale andrà conservata sottovuoto, in positivo o in negativo secondo le esigenze.

#### Salsa carbonara
*   **Ingredienti:** 500 g tuorlo setacciato, 450 g essenza di guanciale stagionato CBT, 240 g Pecorino Romano grattugiato, Olio al pepe nero CBT, 20 g amido di mais, 20 g amido di riso.
*   **Procedimento:**
    1.  Mescola bene gli amidi e il Pecorino Romano.
    2.  In una bastardella unisci il tuorlo, l'essenza di guanciale e qualche goccia di olio al pepe nero.
    3.  Aggiungi il mix di amidi e Pecorino Romano amalgamandoli senza incorporare aria.
    4.  Metti in abbattitore per stabilizzare i liquidi poi sgasi più volte finché smetteranno di gonfiarsi sotto l'azione della macchina sottovuoto.
    5.  Trasferisci il composto nella busta da cottura e condiziona sottovuoto.
    6.  Lascia la busta in frigorifero per 3 ore affinché il formaggio si reidrati.
    7.  Cuoci a 66°C per 75 minuti mescolando ogni 15 minuti.
    8.  A cottura terminata abbatti in positivo.

*   **Finitura del piatto:**
    *   **Ingredienti:** Mezze maniche, Pecorino Romano grattugiato, Pepe nero in grani.
    *   **Procedimento:**
        1.  In una padella riscalda delicatamente il pepe nero, poi fallo raffreddare a temperatura ambiente. Appena sarà raffreddato, pestalo grossolanamente in un mortaio e tienilo da parte. Questa operazione andrà fatta pochi attimi prima dell'utilizzo.
        2.  Taglia il guanciale a fette alte mezzo cm, quindi ricava dei pezzi lunghi 3 cm.
        3.  In una padella, fallo rosolare a fuoco dolce su tutti i lati.
        4.  Una volta rosolato, togli il guanciale dalla padella.
        5.  Conserva la padella a parte con il grasso che avrà rilasciato.
        6.  Rigenera a 60°C la salsa carbonara.
        7.  Cuoci la pasta al dente, scolala e mettila nella padella con il grasso di guanciale precedentemente intiepidito (conserva dell'acqua di cottura).
        8.  A fuoco spento condisci velocemente la pasta, poi aggiungi la salsa carbonara, nella misura di 50/60 g a testa per 80/90 g di pasta. Regola di densità aggiungendo al bisogno poca acqua di cottura e distribuisci la pasta nelle fondine, aggiungi il guanciale caldo e spolvera generosamente il Pecorino Romano grattugiato ed il pepe nero pestato al mortaio.

### Ravioli di carbonara affumicata, bacon meatballs

#### Essenza di pancetta affumicata stagionata
*   **Ingredienti:** 1 kg pancetta affumicata stagionata con la cotenna, 500 g acqua.
*   **Procedimento:**
    1.  Elimina, se presenti, le cartilagini dure che si trovano nelle carni della pancetta.
    2.  Tagliala a cubetti e passala al tritacarne con la piastra da 3 mm.
    3.  Inserisci la pancetta macinata nella busta da cottura insieme all'acqua.
    4.  Condiziona sottovuoto e mescola per distribuire l'acqua uniformemente nella carne.
    5.  Cuoci a 86°C per 15 ore e a cottura terminata apri e scola il contenuto della busta attraverso un setaccio a rete fine per trattenere anche i più piccoli residui.
    6.  Abbatti in positivo il liquido di cottura e la carne.
    7.  Una volta freddi separa il grasso solidificato che decanterà sulla superficie (sia carne che grasso saranno utili per altre preparazioni come le bacon meatballs).
    8.  Filtra e chiarifica.
    9.  Trasferisci l'essenza di pancetta affumicata nella busta da conservazione e condizionala sottovuoto.
    10. Conservala in positivo o negativo secondo necessità.

#### Carbonara affumicata
*   **Ingredienti:** 500 g tuorlo setacciato, 450 g essenza di pancetta affumicata stagionata CBT (ric. prec.), 240 g Parmigiano Reggiano grattugiato, Olio al pepe nero CBT, 20 g amido di mais, 20 g amido di riso.
*   **Procedimento:**
    1.  Mescola bene gli amidi e il formaggio.
    2.  In una bastardella unisci il tuorlo, l'essenza di pancetta affumicata e qualche goccia di olio al pepe nero.
    3.  Aggiungi il mix di amidi e formaggio amalgamandoli senza incorporare aria.
    4.  Mettila in abbattitore per stabilizzare i liquidi, poi sgasa più volte finché smetterà di gonfiarsi sotto l'azione della macchina sottovuoto.
    5.  Trasferisci il composto in una o più grandi buste da cottura e condiziona sottovuoto.
    6.  Lascia la busta in frigorifero per 3 ore affinché il formaggio si reidrati.
    7.  Cuoci a 66°C per 75 minuti, mescolando in busta ogni 15 minuti.
    8.  A fine cottura abbatti in positivo.

#### Ravioli di carbonara affumicata
*   **Ingredienti:** Pasta all'uovo ricca di tuorli, Carbonara affumicata CBT (ric. prec.).
*   **Procedimento:**
    1.  Metti la carbonara affumicata in un sac-à-poche e abbati per stabilizzarla.
    2.  Stendi la pasta all'uovo molto sottile e confeziona con la carbonara affumicata dei ravioli rettangolari.
    3.  Abbattili in negativo e conservali fino al momento dell'utilizzo.

#### Bacon meatballs
*   **Ingredienti:** 500 g pancetta affumicata stagionata CBT (ric. prec.), 70 g uova intere sbattute, 70 g Parmigiano Reggiano grattugiato, Olio per friggere.
*   **Procedimento:**
    1.  Impasta la pancetta affumicata cotta con le uova ed il Parmigiano Reggiano, regolando eventualmente di sapore (ma di norma sarà già sufficientemente saporita).
    2.  Con le mani forma delle piccole polpette di 1,5 cm di diametro.
    3.  Abbattile in negativo, poi friggile da surgelate a 170°C fino a doratura.
    4.  Tienile in caldo.

*   **Finitura del piatto:**
    *   **Ingredienti:** Grasso di pancetta affumicata stagionata CBT, Parmigiano Reggiano grattugiato, Pepe nero pestato al mortaio.
    *   **Procedimento:**
        1.  Cuoci i ravioli da surgelati in abbondante acqua salata per 4 minuti circa.
        2.  Nel frattempo fondi il grasso di pancetta affumicata in una padella.
        3.  Quando i ravioli saranno cotti, scolali e mettili nella padella con il grasso fuso e falli mantecare velocemente a fuoco dolce, aggiungendo poca acqua di cottura.
        4.  Spolvera i piatti di Parmigiano Reggiano e pepe nero, poi adagia i ravioli e le bacon meat balls ben calde.

### Zuppetta di lenticchie nere, cotenne e essenza di pancetta affumicata stagionata

#### Lenticchie nere stufate
*   **Ingredienti:** 500 g lenticchie nere, 2 l acqua per ammollo, 2 l acqua per cottura, 15 g sale, 2 spicchi di aglio in camicia, Alloro, rosmarino, salvia.
*   **Procedimento:**
    1.  Sciacqua le lenticchie e inseriscile nella busta da conservazione insieme all'acqua di ammollo.
    2.  Condizionale sottovuoto e lasciale idratare in frigorifero per 4 ore.
    3.  Nel frattempo, stempera il sale nell'acqua per cottura.
    4.  Trascorso questo tempo apri la busta, scolale e sciacquale sotto l'acqua corrente.
    5.  Pesa le lenticchie ammollate e trasferiscile nella busta da cottura insieme allo stesso peso di acqua salata, poi unisci l'aglio e un bouquet di erbe aromatiche.
    6.  Abbatti per stabilizzare i liquidi e condiziona sottovuoto praticando 3 sgasature.
    7.  Cuoci a 88°C per 4 ore, quindi abbatti in positivo.

#### Cotenne morbide di pancetta affumicata stagionata
*   **Ingredienti:** 500 g cotenna di pancetta affumicata stagionata, 500 g acqua.
*   **Procedimento:**
    1.  Pulisci le cotenne e inseriscile nella busta da cottura insieme all'acqua.
    2.  Condizionale sottovuoto e cuocile a 86°C per 15 ore.
    3.  A cottura ultimata, apri la busta, dividi le cotenne dal liquido di cottura e abbattili separatamente.
    4.  Condiziona sottovuoto le cotenne e conservale in frigorifero.
    5.  Separa i liquidi dalla parte grassa e chiarificali per farli diventare un'essenza.

*   **Finitura del piatto:**
    *   **Ingredienti:** Lenticchie nere CBT, Cotenne affumicate CBT, Verdure per soffritto CBT, Olio al carbone di porri CBT, Essenza di cotenne di pancetta affumicata CBT (ric. prec.).
    *   **Procedimento:**
        1.  Taglia le cotenne a quadratini.
        2.  Apri la busta delle lenticchie, scolale dal liquido di cottura ed elimina aglio ed erbe aromatiche.
        3.  Metti in una casseruola un filo d'olio insieme alle verdure per il soffritto e stufale per un minuto.
        4.  Aggiungi le lenticchie, i dadi di cotenna, l'essenza di pancetta affumicata, un pò di acqua di cottura delle lenticchie e fai cuocere per altri 2 minuti a fuoco dolce regolando di sapore e densità.
        5.  Una volta pronta servila e condiscila con qualche goccia di olio al carbone di porri.

### Gnocchi di patate viola al burro alla salvia

#### Gnocchi di patate viola
*   **Ingredienti:** 1 kg patate viola, 150 g farina di riso, 1 uovo, Sale.
*   **Procedimento:**
    1.  Pela le patate e affettale, poi inseriscile nella busta da cottura e condizionale sottovuoto praticando una sgasatura.
    2.  Cuoci a 88°C per 1 ora.
    3.  A fine cottura, abbatti in positivo e conserva almeno 12 ore prima di utilizzarla per retrogadare gli amidi.
    4.  Al momento dell'utilizzo rigenera a 88°C per 20 minuti poi apri la busta, passale nello schiacciapatate e falle raffreddare a temperatura ambiente.
    5.  Quando si saranno raffreddate impastale velocemente con l'uovo, la farina di riso e il sale.
    6.  Forma degli gnocchi e tienili da parte.

#### Burro alla salvia
*   **Ingredienti:** 100 g burro, 25 g foglie di salvia.
*   **Procedimento:**
    1.  Inserisci le foglie di salvia intere nella busta da cottura insieme al burro.
    2.  Condiziona sottovuoto praticando 3 sgasature.
    3.  Cuoci a 65°C per 2 ore.
    4.  Trascorso questo tempo, trasferisci la busta nella vasca a ultrasuoni a 50°C per 2 ore.
    5.  Apri la busta e setaccia pressando le foglie di salvia per ottenere tutto il liquido.
    6.  Abbattilo in un bagnomaria ghiacciato mescolando con una frusta per ripristinare l'emulsione fino a quando non raggiungerà una consistenza cremosa.
    7.  Trasferisci il burro in uno stampo e abbattilo in positivo.
    8.  Quando si sarà solidificato, condizionalo sottovuoto e conservalo in frigorifero.

*   **Finitura del piatto:**
    1.  Fai bollire gli gnocchi per pochi minuti in abbondante acqua salata.
    2.  Nel frattempo taglia il burro a dadini.
    3.  Scolali e mettili in una bastardella insieme al burro alla salvia, mescolando per farli mantecare.
    4.  Impiatta e servi.

### Ostrica, cipolla rossa brasata e la sua emulsione

#### Ostriche al naturale
*   **Ingredienti:** 12 ostriche, Soluzione salina all'1,5%.
*   **Procedimento:**
    1.  Posiziona le ostriche una a fianco all'altra nelle buste da cottura, in un numero idoneo per riempirle a metà.
    2.  Unisci la soluzione salina alle ostriche fino a sommergerle completamente.
    3.  Abbatti per stabilizzare i liquidi, poi condiziona sottovuoto praticando 3 sgasature.
    4.  Cuoci a 58°C per 30 minuti e abbatti in positivo.

#### Cipolle rosse brasate
*   **Ingredienti:** 1 kg cipolle rosse, 60 g zucchero, 60 g aceto di vino lambrusco, 120 g burro morbido, 10 g burro al pepe nero CBT, 0,2 g xantano, 12 g sale.
*   **Procedimento:**
    1.  Metti in un blender tutti gli ingredienti tranne le cipolle e frulla fino ad ottenere una crema omogenea.
    2.  Pela, taglia le cipolle a fette fini e amalgamale con la crema.
    3.  Inserisci il composto nella busta da cottura e condiziona sottovuoto praticando 3 sgasature.
    4.  Cuoci a 88°C per 3 ore.
    5.  A cottura ultimata apri la busta, separa le cipolle dal liquido di cottura e abbattili in positivo.

#### Emulsione di cipolle rosse brasate
*   **Ingredienti:** I liquidi di cottura delle cipolle rosse brasate CBT (ric. prec.), Poco xantano.
*   **Procedimento:**
    1.  Metti i liquidi di cottura in una casseruola e falli ridurre di un terzo a fuoco dolce.
    2.  Toglili dal fuoco ed emulsionali in un blender aggiungendo all'occorrenza poco xantano fino ad ottenere una salsa vellutata.
    3.  Regola di sapore, abbatti in positivo e conserva sottovuoto fino al momento dell'utilizzo.

*   **Finitura del piatto:**
    1.  Crea una base con del sale grosso in una ciotola poco profonda.
    2.  Apri e sgocciola le ostriche dal liquido di cottura.
    3.  Scola tutta l'acqua all'interno del frutto senza staccarlo dalla conchiglia, poi posizionalo sulla base di sale.
    4.  Aggiungi un ciuffo di cipolle rosse brasate appena intiepidite e qualche goccia di emulsione.

### Gamberi rosa, sedano rapa e polvere di funghi porcini secchi

#### Gamberi rosa al naturale
*   **Ingredienti:** 1 kg gamberi rosa, 2 l acidificazione forte, Olio EVO, Sale.
*   **Procedimento:**
    1.  Ricava le code dai gamberi rosa, sgusciale e elimina il budello.
    2.  Falle acidificare per 10 minuti e scolale.
    3.  Sala le code e inseriscile nelle buste da cottura.
    4.  Aggiungi l'olio nella misura sufficiente a tenerle in sospensione e separate fra loro.
    5.  Abbatti per stabilizzare i liquidi, poi condiziona sottovuoto e applica il cuscinetto largo.
    6.  Cuoci a 48°C per 20 minuti, quindi abbatti in positivo.

#### Polvere di funghi porcini secchi
*   **Ingredienti:** 100 g funghi porcini secchi, 200 g acqua, 1 g sale.
*   **Procedimento:**
    1.  Inserisci i funghi insieme all'acqua e al sale nella busta da cottura.
    2.  Condizionali sottovuoto praticando 3 sgasature e lasciali idratare per 30 minuti.
    3.  Trascorso questo tempo cuocili a 88°C per 2 ore, poi abbattili in positivo.
    4.  Scola i funghi dall'acqua e frullali.
    5.  Stendi uno strato sottile sul tappetino antiaderente e metti in essiccatore a 60°C/70°C fino a completa disidratazione.
    6.  Una volta seccati, polverizzali finemente e conservali sottovuoto.

#### Sedano rapa ai funghi porcini secchi
*   **Ingredienti:** 1 grosso sedano rapa, 50 g polvere di funghi porcini secchi CBT (ric. prec.), Sale.
*   **Procedimento:**
    1.  Lava, pela e taglia il sedano rapa a grossi parallelepipedi.
    2.  Condisci con il sale e fai macerare per 10 minuti.
    3.  Elimina i liquidi della macerazione e ricopri con uno strato di polvere di funghi.
    4.  Inserisci nella busta da cottura e condiziona sottovuoto praticando 5 sgasature.
    5.  Cuoci a 88°C per 2 ore e abbatti in positivo.

*   **Finitura del piatto:**
    1.  Scola i gamberi dall'olio.
    2.  Affetta il sedano rapa per ottenere dei quadrati regolari.
    3.  Sul piatto disponi nove quadrati di sedano rapa a scacchiera.
    4.  Aggiungi cinque gamberi e spolvera un angolo del piatto con la polvere di funghi.

### Gamberi rossi agli agrumi

#### Code di gamberi rossi agli agrumi
*   **Ingredienti:** 12 gamberi rossi del mediterraneo, 1 l acidificazione forte, Olio neutro, Olio al limone CBT, Olio al lemongrass CBT, Olio all'arancia CBT, Sale.
*   **Procedimento:**
    1.  Stacca la testa ai gamberi (serviranno per le ricetta successiva), sguscia le code mantenendo attaccata la parte finale ed elimina il budello.
    2.  Acidifica le code per 10 minuti, poi scolale e condiscile prima con il sale, dopo con qualche goccia di olio al limone e all'arancia.
    3.  Inseriscile nella busta da cottura insieme all'olio neutro nella misura sufficiente a tenerle in sospensione e separate.
    4.  Condiziona sottovuoto applicando il cuscinetto largo.
    5.  Cuoci a 48°C per 25 minuti, poi abbatti in positivo.

#### Salsa di corallo e polvere di gamberi rossi agli agrumi
*   **Ingredienti:** Le teste dei gamberi rossi (ric. prec.), Olio di vinacciolo, Olio al limone CBT, Olio al lemongrass CBT, Olio all'arancia CBT, Xantano, Sale.
*   **Procedimento:**
    1.  Pulisci le teste del gambero tagliando rostro e occhi e privandole dello stomaco.
    2.  Inseriscile nella busta da cottura e condizionale sottovuoto.
    3.  Cuoci a 52°C per 20 minuti e abbatti in positivo.
    4.  Frulla il contenuto della busta con un Thermomix ma senza scaldarlo, poi filtralo con un setaccio di acciaio a rete finissima, conservando sia il corallo che la parte solida delle teste.
    5.  Recupera il corallo liquido, aggiungi qualche goccia di olio all'arancia, limone e lemongrass, una piccola dose di xantano ed infine l'olio di vinacciolo a filo, fino ad ottenere una emulsione densa e stabile. Regola di sapore e conserva la salsa in frigorifero fino al momento dell'utilizzo.
    6.  Stendi la parte solida delle teste di gambero su tappetini antiaderenti e mettila nell'essiccatore a 60°C fino a completa disidratazione.
    7.  Polverizzala finemente aggiungendo poco sale, poi conserva sottovuoto in frigorifero.

*   **Finitura del piatto:**
    1.  Scola i gamberi dall'olio e posizionali sul piatto.
    2.  Aggiungi qualche goccia di salsa e dei pizzichi di polvere di gamberi.

### Astice come una catalana

#### Astice confit
*   **Ingredienti:** 1 astice vivo, 1 l acidificazione forte, 200 g olio EVO, Sale e pepe.
*   **Procedimento:**
    1.  Metti in abbattitore l'astice per semi congelarlo, quando le carni si saranno rassodate lo sguscerai con più facilità.
    2.  Una volta ricavate coda e chele sgusciate, acidificale per 10 minuti.
    3.  Scolale e condiscile generosamente con sale e pepe e lasciale insaporire per un'ora in frigorifero.
    4.  Trascorso questo tempo, inseriscile nella busta da cottura e condizionale sottovuoto applicando un cuscinetto stretto.
    5.  Cuoci a 54°C per 45 minuti e abbatti in positivo.

#### Cipolle rosse in agrodolce leggero
*   **Ingredienti:** 2 cipolle rosse, 100 g acqua, 50 g aceto di vino bianco, 5 g sale, 38 g zucchero.
*   **Procedimento:**
    1.  Pela e taglia le cipolle a rondelle di mezzo centimetro.
    2.  Prepara l'agrodolce leggero scaldando tutti gli ingredienti fino a scioglimento, poi abbatti in positivo.
    3.  Inserisci nella busta da cottura le cipolle e l'agrodolce, quindi condiziona sottovuoto praticando 2 sgasature.
    4.  Cuoci a 86°C per 1 ora e abbatti in positivo.

#### Emulsione di pomodori ciliegini
*   **Ingredienti:** 1 kg pomodori ciliegini con i rametti, Olio EVO, Xantano, Sale.
*   **Procedimento:**
    1.  Lava i pomodori e i rametti, poi trasferisci tutto nella busta da cottura.
    2.  Condiziona sottovuoto praticando 2 sgasature.
    3.  Cuoci a 86°C per 1 ora e abbatti in positivo.
    4.  Togli il contenuto della busta ed elimina i rametti (serviranno ad amplificare il profumo dei pomodori).
    5.  Passa i pomodori all'estrattore, eliminando semi e bucce.
    6.  Recupera la polpa e mettila a scolare attraverso un canovaccio pulito finché non sarà molto densa.
    7.  Monta la polpa con l'olio EVO, il sale e una punta di xantano fino ad ottenere un'emulsione morbida, poi trasferiscila in un biberon da cucina.

*   **Finitura del piatto:**
    *   **Ingredienti:** Polvere di peperoni gialli CBT.
    *   **Procedimento:**
        1.  Scola l'astice dall'olio e porzionalo secondo le tue necessità.
        2.  Scola le cipolle e tagliale in piccoli bastoncini.
        3.  Disponi sul piatto l'astice, le cipolle in agrodolce leggero e l'emulsione di pomodori ciliegini.
        4.  Decora con la polvere di peperoni gialli e servi.

### Alici marinate, gel di aglio, prezzemolo e limone

#### Alici marinate
*   **Ingredienti:** 30 alici freschissime, 1 l acidificazione forte, 1 l marinatura 35:20, 200 g olio neutro, Olio all'aglio CBT, Olio al limone CBT.
*   **Procedimento:**
    1.  Pulisci le alici togliendo la testa e le interiora, lava via completamente il sangue sotto l'acqua corrente.
    2.  Acidificale per 10 minuti e scolale.
    3.  Immergile nella marinatura per 3 ore, poi scolale per bene.
    4.  Mescola l'olio neutro ai due oli aromatici secondo il tuo gusto e inseriscilo nella busta da cottura insieme alle alici.
    5.  Abbatti per stabilizzare i liquidi, poi condiziona sottovuoto e applica un cuscinetto largo.
    6.  Cuoci a 40°C per 20 minuti, dopodiché abbatti in negativo e conserva in surgelatore per il tempo necessario alla bonifica dall'Anisakis.
    7.  Al momento dell'uso, degcongela le alici.

#### Clorofilla di prezzemolo
*   **Ingredienti:** 100 g foglie di prezzemolo, 400 g acqua fredda a 2°C.
*   **Procedimento:**
    1.  Metti a ghiacciare due litri di acqua in un contenitore abbastanza capiente per ottenere uno strato di ghiaccio di 3-4 cm e tienilo così fino al momento dell'utilizzo.
    2.  Monda e lava accuratamente le foglie di prezzemolo, trasferiscile in un frullatore insieme all'acqua.
    3.  Frullale velocemente senza scaldare il composto, dopodiché setaccialo attraverso un'etamina, strizzando bene il residuo solido, che andrà eliminato.
    4.  Trasferisci il liquido nella busta da cottura, abbatti per stabilizzarlo, poi condizionalo sottovuoto.
    5.  Cuoci a 64°C per 1 ora, mescolando ogni 10 minuti.
    6.  A fine cottura appoggia un canovaccio a trame fitte, bagnato e strizzato, ben steso sulla superficie del contenitore in cui si trova la lastra di ghiaccio, affinché lo copra completamente e che fuoriescano i lembi del canovaccio dai bordi del contenitore.
    7.  Apri la busta e versa sul canovaccio il contenuto, distribuendolo su tutta la superficie. In questo modo il ghiaccio raffredderà immediatamente la clorofilla preservandone le caratteristiche ed il colore, mentre lo straccio farà scolare l'acqua che si sarà separata durante la cottura.
    8.  Quando il composto si sarà raffreddato (ci vorranno 5/7 minuti), trasferisci il canovaccio sopra una griglia forata sempre tenendolo ben steso, per permettere all'acqua residua di gocciolare. Metti la griglia forata in frigorifero per 1 ora. In questa fase la clorofilla non andrà toccata.
    9.  Trascorso questo tempo, raccogli con una spatola la clorofilla, che risulterà molto densa e di un colore verde vivace. Inseriscila nella busta, condizionala sottovuoto e abbattila in negativo.
    10. Una volta scongelata si sarà separata l'acqua residua dalla clorofilla. Filtrala ulteriormente utilizzando un'etamina, per ottenere una clorofilla molto concentrata.

#### Gel di prezzemolo, aglio e limone
*   **Ingredienti:** 80 g acqua, 12 g riduzione di aceto di vino bianco, 2,5 g kappa, 0,3 g tara, 0,2 g citrato di sodio, 10 g destrosio, 2 g sale, 10 g clorofilla di prezzemolo CBT, 1 g olio al limone CBT, 1 g olio all'aglio CBT.
*   **Procedimento:**
    1.  Mescola il destrosio, il sale, la tara, la kappa ed il citrato di sodio, poi inseriscili nella busta da cottura insieme all'acqua e all'aceto.
    2.  Abbatti per stabilizzare i liquidi, condiziona sottovuoto e mescola per sciogliere ed amalgamare il composto.
    3.  Cuoci a 90°C per 30 minuti mescolando ogni 10 minuti, poi abbatti in positivo.
    4.  Al momento dell'utilizzo, trasferisci il contenuto della busta in una caraffa e aggiungi la clorofilla e i due oli aromatici, quindi frulla con un mixer ad immersione fino ad ottenere un composto liscio ed omogeneo.
    5.  Sgasa il gel di polpo ottenuto e conservalo sottovuoto in frigorifero.

*   **Finitura del piatto:**
    1.  Apri la busta delle alici ed elimina l'olio. Sfilettale con delicatezza, mantenendo attaccata la coda.
    2.  Disponile sul piatto, decorando con puntini di gel di prezzemolo, aglio e limone.

### Palamita confit, peperoncini sott'olio e spuma calda di aglione della Valdichiana

#### Palamita confit
*   **Ingredienti:** 1 palamita, 2 l acidificazione forte, 200 g sale fine, 200 g zucchero, Olio EVO.
*   **Procedimento:**
    1.  Mescola sale e zucchero.
    2.  Sfiletta la palamita con cura, poi seleziona la parte alta del filetto e taglia dei trancetti da 2 cm di spessore.
    3.  Acidificali per 10 minuti, dopodiché scolali e falli rotolare nella miscela di sale e zucchero affinché tutta la superficie ne sia ricoperta da uno strato abbondante.
    4.  Trasferiscili nella busta da conservazione e condizionali sottovuoto.
    5.  Falli marinare in frigorifero per 2 ore.
    6.  Trascorso questo tempo, apri la busta e sciacqua i trancetti di palamita sotto acqua corrente fredda.
    7.  Asciugali sommariamente e inseriscili, nel numero che preferisci, nelle buste da cottura insieme ad una quantità di olio EVO sufficiente a ricoprirli ed a tenerli separati fra loro.
    8.  Abbatti per stabilizzare i liquidi e condiziona sottovuoto applicando un cuscinetto largo.
    9.  Cuoci a 42°C per 25 minuti, dopodiché abbatti in negativo e conserva in surgelatore per il tempo necessario alla bonifica dall'Anisakis.

#### Peperoncini sott'olio
*   **Ingredienti:** 200 g peperoncini freschi, 200 g olio EVO, Sale.
*   **Procedimento:**
    1.  Lava e pulisci i peperoncini da picciolo e semi, poi tagliali a rondelle di mezzo cm.
    2.  Salale generosamente e falli macerare per 30 minuti.
    3.  Trascorso questo tempo, sciacquali sotto l'acqua corrente fredda, scola e asciuga.
    4.  Trasferiscili nella busta da cottura insieme all'olio.
    5.  Abbatti per stabilizzare i liquidi, poi condiziona sottovuoto praticando 3 sgasature e applicando il cuscinetto stretto.
    6.  Cuoci a 88°C per 20 minuti e abbatti in positivo.

#### Spuma di aglione della Valdichiana
*   **Ingredienti:** 400 g purea di aglione della Valdichiana CBT, 200 g panna, 150 g latte, 100 g acqua, 7 g zucchero, 8 g sale, 2,5 g iota, 1 g xantano.
*   **Procedimento:**
    1.  Mescola zucchero, sale, iota e xantano.
    2.  Nella busta da cottura inserisci panna, latte, acqua, la purea di aglione ed infine le polveri.
    3.  Abbatti per stabilizzare i liquidi, condiziona sottovuoto, poi mescola il contenuto della busta per sciogliere gli ingredienti.
    4.  Cuoci a 85°C per 30 minuti mescolando ogni 5 minuti, quindi apri la busta e setacciala.
    5.  Trasferisci il composto in un sifone e caricalo con due cartucce.
    6.  Tieni il sifone in caldo a 50°C.

*   **Finitura del piatto:**
    1.  Apri la busta dei peperoncini e scolali dall'olio.
    2.  Rigenera la palamita a 40°C, poi apri la busta sulla placca forata e fai scolare l'olio.
    3.  Posiziona sul piatto due trancetti di palamita e completalo con un ciuffo di spuma di aglione e due rondelle di peperoncini sott'olio.

### Salmone confit, cipolla rossa in agrodolce di lamponi, emulsione di agrodolce

#### Salmone confit
*   **Ingredienti:** 500 g cuore di filetto di salmone, con la pelle squamata, 2 l acidificazione forte, 100 g sale, 100 g zucchero, 200 g olio di vinacciolo, Olio al limone CBT, Olio al pepe bianco CBT.
*   **Procedimento:**
    1.  Mescola sale e zucchero.
    2.  Mescola l'olio di vinacciolo a qualche goccia di olio al limone e al pepe bianco.
    3.  Taglia il filetto di salmone a bocconi da 30 g l'uno.
    4.  Acidificali per 10 minuti, poi scolali.
    5.  Falli rotolare nella miscela di sale e zucchero affinché tutta la superficie ne sia ricoperta da uno strato abbondante.
    6.  Trasferiscili nella busta da conservazione e condizionali sottovuoto.
    7.  Falli marinare in frigorifero per 2 ore, così da far agire il sale e lo zucchero.
    8.  Trascorso questo tempo, apri la busta e sciacqua il salmone sotto l'acqua corrente fredda.
    9.  Asciugalo sommariamente, inseriscilo nella busta da cottura e aggiungi il mix di olio di vinacciolo.
    10. Abbatti per stabilizzare i liquidi e condiziona sottovuoto applicando un cuscinetto largo.
    11. Cuoci a 48°C per 18 minuti, dopodiché abbatti in positivo.

#### Cipolle rosse in agrodolce di lamponi
*   **Ingredienti:** 3 cipolle rosse, 200 g aceto di vino rosso, 200 g acqua, 150 g zucchero, 200 g lamponi, 16 g sale.
*   **Procedimento:**
    1.  In una pentola fai bollire per 2 minuti tutti gli ingredienti tranne le cipolle.
    2.  A cottura ultimata setaccia l'agrodolce per togliere i residui solidi e abbatti in positivo.
    3.  Pela le cipolle e tagliale a petali dello spessore di 1 cm.
    4.  Inserisci l'agrodolce e le cipolle nella busta da cottura e condizionale sottovuoto praticando 3 sgasature.
    5.  Cuocile a 84°C per 40 minuti, poi raffredda e abbattile in positivo.
    6.  Conserva in frigorifero fino al momento dell'uso.

#### Emulsione di agrodolce alle cipolle e lamponi
*   **Ingredienti:** 300 g liquido di cottura dell'agrodolce di cipolle e lamponi CBT (ric. prec.), 100 g olio di vinacciolo, 0,3 g xantano.
*   **Procedimento:**
    1.  Fai ridurre in una casseruola a fuoco dolce il liquido dell'agrodolce a 500 g.
    2.  Quando avrà raggiunto una consistenza sciropposa abbattilo in positivo.
    3.  Trasferisci la riduzione in una caraffa insieme all'olio e allo xantano e montala con un frullatore a immersione senza incorporare aria.
    4.  Ottenuta l'emulsione regola di sapore e conservala sottovuoto in frigorifero.

*   **Finitura del piatto:**
    1.  Apri la busta del salmone sulla placca forata e scola l'olio.
    2.  Posizionalo sul piatto insieme a qualche petalo di cipolla in agrodolce.
    3.  Aggiungi qualche goccia di emulsione e servi.

### Seppia, crema di piselli, polvere di olio al limone

#### Seppie alla marinara
*   **Ingredienti:** 4 seppie pulite da 150 g l'una, 1 l acidificazione leggera, 1 l marinatura 25:15, Olio al limone CBT, Olio all'aglio CBT, Olio al pepe bianco CBT.
*   **Procedimento:**
    1.  Togli la pellicina coriacea dalle seppie, pulisci i ciuffi e acidifica il tutto per 10 minuti, poi immergi nella marinatura per 4 ore.
    2.  Trascorso questo tempo, scola bene e condisci con poche gocce di olio al limone, pepe bianco e aglio.
    3.  Inserisci i mantelli delle seppie ben stesi ed i ciuffi in due buste da cottura separate, quindi condiziona sottovuoto.
    4.  Cuoci a 60°C per 20 minuti i mantelli e 25 i ciuffi, poi abbatti in positivo.

#### Crema di piselli
*   **Ingredienti:** 500 g piselli, Olio EVO, Sale.
*   **Procedimento:**
    1.  Inserisci i piselli nella busta da cottura, condiziona sottovuoto praticando una sgasatura e cuocili a 84°C per 20 minuti, poi abbatti in positivo.
    2.  Preleva i piselli dalla busta, frullali e setacciali per eliminare tutte le bucce.
    3.  Trasferisci la purea di piselli in un blender e frulla aggiungendo l'olio EVO a filo, fino ad ottenere una crema morbida.
    4.  Regola di sale e condiziona sottovuoto.
    5.  Conserva in frigorifero fino al momento dell'utilizzo.

#### Polvere di olio al limone
*   **Ingredienti:** Olio al limone CBT, Maltodestrine di tapioca.
*   **Procedimento:**
    1.  Metti le maltodestrine in una bastardella, poi aggiungi poco per volta l'olio al limone mescolando con una frusta per favorire l'assorbimento da parte delle maltodestrine.
    2.  Aggiungi olio finché non raggiungerai la consistenza desiderata.

*   **Finitura del piatto:**
    *   **Ingredienti:** Olio EVO.
    *   **Procedimento:**
        1.  Apri le buste delle seppie, mantelli e ciuffi.
        2.  Taglia i mantelli a listarelle e i ciuffi in due o tre pezzi e condiscili con poco olio EVO.
        3.  Disponi la crema di piselli a specchio sul piatto e posiziona tre piccoli mucchietti di mantelli a listarelle e tre pezzi di ciuffi.
        4.  Decora con la polvere di olio al limone e servi.

### Bianco e nero di seppia

#### Velo bianco di seppia
*   **Ingredienti:** 500 g mantelli di seppia, 100 g panna fresca, 1 g olio al lemongrass CBT, 2 g olio al pepe bianco CBT, 3 g sale.
*   **Procedimento:**
    1.  Pulisci e taglia la seppia in piccoli pezzi, acidificala per 10 minuti, poi scolala.
    2.  Frullala con un thermomix o un pacojet, per ottenere una pasta liscia e omogenea.
    3.  Condiscila con la panna, gli oli aromatici e il sale.
    4.  Abbattila in positivo per stabilizzarla e sgasala per eliminare tutta l'aria incorporata durante la lavorazione.
    5.  Trasferiscila nella busta da cottura e condizionala sottovuoto per ottenere un velo.
    6.  Cuocila a 52°C per 10 minuti, poi abbatti in positivo.

#### Velo nero di seppia
*   **Ingredienti:** 500 g mantelli di seppia, 50 g panna, 50 g nero di seppia, 1 g olio all'aglio CBT, 2 g olio al pepe nero CBT, 2 g sale.
*   **Procedimento:**
    1.  Pulisci e taglia la seppia in piccoli pezzi, acidificala per 10 minuti e scolala.
    2.  Frullala con un thermomix o un pacojet, per ottenere una pasta liscia e omogenea.
    3.  Condiscila con la panna, il nero di seppia, l'olio aromatico e il sale.
    4.  Abbattila in positivo per stabilizzarla e sgasala per eliminare tutta l'aria incorporata durante la lavorazione.
    5.  Trasferiscila nella busta da cottura e condizionala sottovuoto per ottenere un velo.
    6.  Cuocila a 52°C per 10 minuti, poi abbatti in positivo.

*   **Finitura del piatto:**
    1.  Apri le buste dei veli di seppia e sovrapponili alternando i colori.
    2.  Tagliali e sovrapponili fino ad ottenere una mattonella composta da cinque strisce per colore e servi.

### Polpo croccante, crema di carote alla panna acida e zenzero, terra di mandorle alla paprika

#### Polpo al naturale
*   **Ingredienti:** 1 polpo da 1,5 kg.
*   **Procedimento:**
    1.  Pulisci il polpo e taglialo per separare i tentacoli e la testa.
    2.  Elimina la pelle dalla testa e fai arricciare i tentacoli tuffandoli per pochi secondi in acqua bollente e salata, dopodiché abbattili in positivo.
    3.  Una volta raffreddati, inserisci i tentacoli e la testa nella busta da cottura e condiziona sottovuoto.
    4.  Cuocili a 72°C per 7 ore.
    5.  A cottura ultimata apri la busta, separa il polpo dal liquido di cottura e abbattilo in positivo.
    6.  Trasferisci il liquido di cottura in una casseruola e fallo ridurre della metà, poi filtralo e abbattilo in positivo.

#### Crema di carote alla panna acida e zenzero
*   **Ingredienti:** 500 g carote, 150 g panna, 20 g succo di limone, 1 g acido citrico, 5 g umami di carote CBT, Zenzero in polvere, Sale.
*   **Procedimento:**
    1.  Stempera l'acido citrico nel succo di limone.
    2.  Metti la panna in una bastardella e aggiungi il succo di limone poco per volta nella panna, mescolando per amalgamarlo rapidamente.
    3.  Subito la panna comincerà ad addensarsi, fino a diventare una crema abbastanza densa.
    4.  Lava, pela e affetta finemente le carote.
    5.  Salale leggermente e falle macerare per 10 minuti, poi trasferiscile nella busta da cottura e condizionale sottovuoto.
    6.  Cuocile a 88°C per 1 ora e mezza.
    7.  A cottura ultimata apri la busta e inserisci il contenuto in un blender e frullalo aggiungendo la panna, l'umami di carote, lo zenzero e il sale fino ad ottenere una salsa liscia.
    8.  Abbattila in positivo.

#### Terra di mandorle, carote e paprika
*   **Ingredienti:** 200 g mandorle pelate, 500 g acqua, 30 g sale, 10 g polvere di carote CBT, Paprika dolce, Olio per friggere.
*   **Procedimento:**
    1.  Stempera il sale nell'acqua, aggiungi le mandorle e inseriscile nella busta da conservazione.
    2.  Condizionale sottovuoto e falle idratare per 12 ore.
    3.  Trascorso questo tempo, scolale e falle essiccare a 70°C fino a che non saranno completamente disidratate.
    4.  Friggile a 170°C fino a completa doratura, poi asciugale e lasciale raffreddare.
    5.  Mettile in un blender insieme alla paprika e alla polvere di carote, quindi frullale ad impulsi fino ad ottenere una terra.

*   **Finitura del piatto:**
    *   **Ingredienti:** Olio EVO.
    *   **Procedimento:**
        1.  Apri la busta del polpo e dividi i tentacoli in due, tagliandoli perfettamente nella linea centrale delle ventose.
        2.  Falli rosolare lentamente in padella con poco olio, partendo prima dal lato della pelle per renderla croccante.
        3.  Posiziona il tentacolo ricomponendolo sul piatto, stendi accanto una cucchiaiata di salsa di carote e un mucchietto di sabbia di mandorle.

### Baccalà alla vaniglia, cannella e pepe, carciofi al carbone di porri e crema di cavolfiori

#### Riduzione di panna speziata al baccalà
*   **Ingredienti:** 1 l panna fresca, 100 g jus di baccalà CBT, I semi di una bacca di vaniglia, 4 g cannella regina in polvere, 1,5 g pepe Voatsiperifery macinato al mortaio, Sale.
*   **Procedimento:**
    1.  Amalgama la panna con la cannella, la vaniglia e il pepe.
    2.  Trasferiscila in una casseruola insieme allo jus di baccalà e falla ridurre a fuoco dolce finché non raggiungerà la consistenza di una salsa densa.
    3.  Filtrala per eliminare i residui solidi delle spezie, regola di sale e abbatti in positivo.

#### Crema di cavolfiori e riduzione di panna speziata al baccalà
*   **Ingredienti:** 400 g cavolfiore, 400 g riduzione di panna e spezie CBT (ric. prec.), Sale.
*   **Procedimento:**
    1.  Pulisci, affetta il cavolfiore e salalo leggermente.
    2.  Fallo macerare per 10 minuti, poi elimina i liquidi che avrà rilasciato.
    3.  Inseriscilo nella busta da cottura e condizionalo sottovuoto praticando 3 sgasature.
    4.  Cuoci a 88°C per 40 minuti e abbatti in positivo.
    5.  Frulla il cavolfiore insieme alla riduzione di panna.
    6.  Trasferiscilo in una casseruola e fallo ridurre alla consistenza di una crema, regolando di sapore.

#### Baccalà alla vaniglia, cannella e pepe
*   **Ingredienti:** 6 tranci da 200 g di baccalà dissalato, 1 l acidificazione forte, 200 g riduzione di panna speziata al baccalà CBT (ric. prec.).
*   **Procedimento:**
    1.  Acidifica i tranci di baccalà per 10 minuti, poi scolali.
    2.  Spalma un generoso strato di riduzione di panna sulla superficie dei tranci di baccalà.
    3.  Inserisci singolarmente ogni trancio nella busta da cottura.
    4.  Abbatti per stabilizzare i liquidi, condiziona sottovuoto e applica un cuscinetto stretto.
    5.  Cuoci a 46°C per 20 minuti, dopodiché abbatti in negativo per il tempo necessario alla bonifica dall'Anisakis.
    6.  Al momento dell'uso decongela il baccalà come da procedura.

#### Carciofi all'olio al carbone di porri
*   **Ingredienti:** 6 carciofi spinosi, Olio al carbone di porri CBT, Sale e pepe macinato.
*   **Procedimento:**
    1.  Pulisci i carciofi, tagliali a spicchi e condiscili con sale, pepe e l'olio al carbone di porri.
    2.  Inseriscili ordinatamente nella busta da cottura e condiziona sottovuoto praticando 5 sgasature.
    3.  Cuoci a 90°C per 30 minuti e abbatti in positivo.

*   **Finitura del piatto:**
    *   **Ingredienti:** Burro, Sale e pepe macinato.
    *   **Procedimento:**
        1.  Rigenera il baccalà nel bagno termostatico e poi scolalo sulla placca forata.
        2.  Fondi una noce di burro in una padella, aggiungi tutto il contenuto della busta dei carciofi, fai ridurre i liquidi a fuoco dolce e regola di sapore.
        3.  Scalda la crema di cavolfiori alla panna speziata.
        4.  Scola il baccalà sulla placca forata.
        5.  Posizionalo sul piatto ben caldo, qualche spicchio di carciofo e una cucchiaiata di salsa alla panna, servi.

### Baccalà mantecato ai semi di finocchio, pelle di baccalà soffiata e salsa di olive nolche

#### Baccalà mantecato ai semi di finocchio
*   **Ingredienti:** 500 g baccalà dissalato, 1 l acidificazione forte, 100 g jus di baccalà CBT, 1 g olio al pepe nero CBT, 1 g olio al pepe bianco CBT, 2 g olio ai semi di finocchio CBT, 40 g burro di qualità, 30 g olio neutro.
*   **Procedimento:**
    1.  Taglia il baccalà in grossi pezzi, elimina le lische, sciacqualo e controlla che la dissalatura sia stata fatta a dovere.
    2.  Se non è così, prosegui la dissalatura fino al raggiungimento del grado di sapidità ideale.
    3.  Acidifica il baccalà per 10 minuti, scolalo e inseriscilo nella busta da cottura.
    4.  Condiziona sottovuoto e cuoci a 54°C per 15 minuti.
    5.  A cottura ultimata scola il baccalà dai liquidi di cottura, elimina la pelle e trasferiscilo in una planetaria.
    6.  Nel frattempo, in una casseruola monta lo jus di baccalà con il burro e successivamente aggiungi gli oli aromatizzati.
    7.  Fai montare il baccalà aggiungendo lo jus montato e ben caldo, fino ad ottenere un composto soffice e omogeneo, aggiungendo se necessario una parte dei liquidi di cottura per raggiungere la consistenza desiderata.

#### Pelle di baccalà soffiata
*   **Ingredienti:** 500 g pelli di baccalà, 1 l acidificazione leggera, 500 g acqua, Olio per friggere, 5 g sale.
*   **Procedimento:**
    1.  Pulisci le pelli da eventuali residui di polpa di pesce, lavale e poi falle acidificare per 10 minuti.
    2.  Scolale e inseriscile nella busta da cottura insieme ad acqua e sale.
    3.  Abbatti per stabilizzare i liquidi, condiziona sottovuoto e cuoci a 70°C per 30 minuti.
    4.  A cottura terminata apri la busta e scola con delicatezza le pelli dal liquido di cottura.
    5.  Stendile sui fogli antiaderenti, trasferiscili in essiccatore a 70°C.
    6.  Quando saranno completamente disidratate e secche ponile in un contenitore ermetico e conservale in un luogo asciutto.
    7.  Attendi almeno 24 ore prima di utilizzarle.
    8.  Per soffiare le pelli, friggile in olio abbondante a 190°C per pochi secondi e scolale su carta assorbente.

#### Salsa di olive nolche
*   **Ingredienti:** 500 g olive nolche, Olio EVO, Sale.
*   **Procedimento:**
    1.  Lava le olive e inseriscile nella busta da cottura stendendole bene.
    2.  Condizionale sottovuoto praticando una sgasatura.
    3.  Precuoci a 55°C per 30 minuti, poi abbatti in positivo.
    4.  Successivamente cuocile a 84°C per 20 minuti e abbatti in positivo.
    5.  Una volta raffreddate, schiaccia le olive nella busta ancora chiusa, spappolandole completamente per ricavare dalle olive la prima purea grossolana.
    6.  Apri la busta e setaccia finemente il contenuto eliminando noccioli e bucce.
    7.  Recupera la polpa e frullala aggiungendo poco olio EVO e sale, quindi abbatti in positivo.

*   **Finitura del piatto:**
    1.  Riscalda la purea in una casseruola a fuoco dolce per pochi attimi.
    2.  Rigenera a 40°C il baccalà mantecato e poi forma delle quenelle.
    3.  Distribuisci la salsa sul piatto, disponi una quenelle e decora con qualche oliva intera.
    4.  Aggiungi un pezzo di pelle di baccalà soffiata e servi.

### Trippa di baccalà, essenza di branzino allo zafferano e erbe di Provenza

#### Trippa di baccalà al naturale
*   **Ingredienti:** 1 kg trippe di baccalà, 2 l acidificazione leggera, 1,5 l acqua, 10 g sale.
*   **Procedimento:**
    1.  Pulisci le trippe di baccalà, tagliale a listarelle e acidificale per 10 minuti.
    2.  Inseriscile nella busta da cottura insieme all'acqua e al sale, poi condiziona sottovuoto.
    3.  Cuocile a 74°C per 2 ore e abbattile in positivo.

#### Essenza di branzino
*   **Ingredienti:** 1,5 kg teste, lische e pance di branzino, 750 g acqua fredda.
*   **Procedimento:**
    1.  Pulisci le lische e le teste di pesce branzino dalle pinne, occhi e da tutto il sangue.
    2.  Inseriscile nella busta da cottura insieme all'acqua, poi abbatti per stabilizzare i liquidi.
    3.  Condiziona sottovuoto e cuoci a 86°C per 4 ore.
    4.  A fine cottura apri la busta e scola il contenuto per filtrarlo e ridurlo.

*   **Finitura del piatto:**
    *   **Ingredienti:** 100 g brunoise di cipolle CBT, Erbe di Provenza, Zafferano in pistilli, Olio al pepe bianco CBT.
    *   **Procedimento:**
        1.  Scalda l'essenza ridotta di pesce in una casseruola capiente, dopodiché aggiungi la brunoise di cipolle e fai cuocere per 2 minuti a fuoco dolce senza mai raggiungere il bollore, poi regola di sapore con il sale.
        2.  Aggiungi le erbe di Provenza e lo zafferano secondo il tuo gusto e lascia in infusione a fuoco spento per 5 minuti.
        3.  Nel frattempo, rigenera le trippe a 70°C per 20 minuti.
        4.  Apri la busta, scolale dall'acqua di cottura e aggiungile nella casseruola insieme all'essenza.
        5.  Fai insaporire per 2 minuti a fuoco dolce, quindi servi concludendo con qualche goccia di olio al pepe bianco.

### Branzino, crema di porri, polvere di prezzemolo

#### Branzino al naturale
*   **Ingredienti:** 1 branzino da 2/3 kg, 2 l acidificazione forte, 2 l marinatura 35:20, Olio EVO.
*   **Procedimento:**
    1.  Squama e sfiletta il branzino e dalla parte alta ricava dei cubi regolari di 3 cm di lato.
    2.  Acidificali per 10 minuti poi trasferiscili nella marinatura per 6 ore.
    3.  Trascorso questo tempo, scolali e inseriscili nel numero che preferisci nelle buste da cottura aggiungendo una dose di olio sufficiente a mantenere i filetti in sospensione e separati fra loro.
    4.  Abbatti per stabilizzare i liquidi e condiziona sottovuoto applicando il cuscinetto stretto.
    5.  Cuoci a 52°C per 15 minuti e abbattili in negativo e conservali in surgelatore per il tempo necessario alla bonifica dall'Anisakis.

#### Polvere di prezzemolo
*   **Ingredienti:** 250 g foglie di prezzemolo, 0,8 g sale.
*   **Procedimento:**
    1.  Lava le foglie di prezzemolo mantenendole umide, poi salale e lasciale macerare per 30 minuti.
    2.  Trasferiscile nella busta da cottura e condiziona sottovuoto praticando 3 sgasature.
    3.  Cuoci a 88°C per 30 minuti e abbatti in positivo.
    4.  Preleva il prezzemolo dalla busta e tritalo grossolanamente.
    5.  Stendilo su tappetini antiaderenti e mettilo in essiccatore a 60°C fino a completa disidratazione.
    6.  Polverizzalo finemente, quindi conservalo sottovuoto.

#### Crema di porri
*   **Ingredienti:** 4 porri, Burro, Sale, Olio al pepe bianco CBT.
*   **Procedimento:**
    1.  Pulisci e lava i porri, poi affettali e salali leggermente.
    2.  Falli macerare per 10 minuti, elimina l'acqua che avranno rilasciato e trasferiscili nella busta da cottura e condiziona sottovuoto praticando 3 sgasature.
    3.  Cuocili a 88°C per 40 minuti e abbattili in positivo.
    4.  Estrai i porri dalla busta e frullali in un thermomix o un blender, poi setacciali per ottenere una purea liscia e senza filamenti.
    5.  Trasferisci la purea ottenuta in una casseruola e falla ridurre a fuoco dolce.
    6.  Aggiungi del burro per montare la salsa e regolala di sapore con sale e olio al pepe bianco.

*   **Finitura del piatto:**
    1.  Scola il branzino dalla busta e rosolalo sulla pelle.
    2.  Scalda la crema di porri.
    3.  Disponi sul piatto il branzino, la crema di porri e la polvere di prezzemolo, quindi servi.

### Filetto di ricciola, asparagi e salsa di asparagi

#### Filetto di ricciola al naturale
*   **Ingredienti:** 6 tranci di ricciola da 160 g dello spessore di 3 cm con la pelle squamata, 2 l acidificazione forte, 2 l marinatura 35:20, Olio neutro.
*   **Procedimento:**
    1.  Acidifica i tranci di ricciola per 10 minuti, poi scolali e immergili nella marinatura per 6 ore.
    2.  Trascorso questo tempo, estraili dalla marinatura e inserisci singolarmente ogni trancio nelle buste da cottura.
    3.  Aggiungi l'olio nella misura sufficiente a tenerli in sospensione e separati fra loro.
    4.  Condiziona sottovuoto applicando il cuscinetto stretto.
    5.  Cuoci a 46°C per 20 minuti, quindi abbatti in negativo e conserva in surgelatore per il tempo sufficiente alla bonifica dall'Anisakis.

#### Asparagi al naturale
*   **Ingredienti:** 1 kg asparagi, 1 l acqua, 15 g sale.
*   **Procedimento:**
    1.  Pulisci, lava gli asparagi e separa le punte dai gambi che serviranno per la ricetta successiva.
    2.  Stempera il sale nell'acqua.
    3.  Inserisci gli asparagi nella busta da cottura insieme ad una quantità di acqua e sale pari a metà del loro peso, poi condiziona sottovuoto praticando 5 sgasature.
    4.  Cuoci a 86°C per 18 minuti e abbatti in positivo.

#### Salsa agli asparagi
*   **Ingredienti:** Gambi di asparagi, Olio EVO, Sale, Olio al pepe nero CBT, Xantano.
*   **Procedimento:**
    1.  Sala i gambi di asparagi e lasciali macerare per 10 minuti.
    2.  Trasferiscili nella busta da cottura e condizionali sottovuoto praticando 5 sgasature.
    3.  Cuocili a 86°C per 20 minuti e abbattili in positivo.
    4.  Toglili dalla busta e scolali dall'acqua che avranno rilasciato in cottura, poi frullali e setacciali finemente.
    5.  Metti la passata di asparagi in una caraffa, aggiungi poco xantano e stemperalo con un frullatore ad immersione senza incorporare aria.
    6.  Aggiungi l'olio EVO a filo per creare una emulsione soda, vellutata e stabile.
    7.  Regola di sapore con olio al pepe e sale, quindi sgasala e condizionala sottovuoto.
    8.  Conservala in positivo fino al momento dell'utilizzo.

*   **Finitura del piatto:**
    *   **Ingredienti:** Olio EVO.
    *   **Procedimento:**
        1.  Rigenera la ricciola a 45°C per 12 minuti, apri la busta e scolala sulla placca forata.
        2.  Rigenera gli asparagi a 80°C per 5 minuti, poi apri la busta e condiscili con olio EVO.
        3.  Scalda la salsa di asparagi.
        4.  Fai uno splash di salsa sul piatto, poi posiziona gli asparagi a formare un quadrato stretto e adagia al centro la ricciola.

### Guance di rana pescatrice alle erbe aromatiche, patate ratte al grasso di pancetta affumicata stagionata

#### Guance di rana pescatrice alle erbe aromatiche
*   **Ingredienti:** 1 kg guance di rana pescatrice, 2 l acidificazione forte, 2 l marinatura 35:20, 300 g olio EVO, 5 g olio al pepe bianco CBT, 5 g finocchietto fresco, 5 g dragoncello, 5 g cerfoglio.
*   **Procedimento:**
    1.  Pulisci le guance dalle pellicine e acidificale per 10 minuti.
    2.  Scolale e inseriscile nella marinatura per 6 ore.
    3.  Frulla l'olio EVO con le erbe aromatiche e qualche goccia di olio al pepe.
    4.  Trascorso questo tempo, togli le guance dalla marinatura e asciugale.
    5.  Inserisci le guance di rana pescatrice nel numero che preferisci nelle buste da cottura e successivamente dividi equamente il composto di olio alle erbe in ogni busta.
    6.  Abbatti per stabilizzare i liquidi, condiziona sottovuoto applicando il cuscinetto largo.
    7.  Cuoci a 54°C per 20 minuti.
    8.  A cottura terminata abbatti in negativo e conserva in surgelatore per il tempo necessario alla bonifica dall'Anisakis.

#### Patate ratte al grasso di pancetta affumicata stagionata
*   **Ingredienti:** 1 kg patate ratte, 100 g grasso di pancetta affumicata stagionata CBT, Sale.
*   **Procedimento:**
    1.  Lava le patate e tagliale in due nel senso della lunghezza.
    2.  Salale abbondantemente e lasciale macerare per 20 minuti.
    3.  Scolale dall'acqua rilasciata in macerazione, asciugale e amalgamale al grasso di pancetta affumicata.
    4.  Inseriscile nella busta da cottura e condizionale sottovuoto praticando una sgasatura.
    5.  Cuocile a 88°C per 25 minuti e abbatti in positivo.

*   **Finitura del piatto:**
    *   **Ingredienti:** Burro, Sale.
    *   **Procedimento:**
        1.  Apri la busta delle patate e scola il contenuto, compreso il grasso, su una teglia con carta assorbente. Questo servirà ad asciugare l'acqua di cottura, che non serve.
        2.  Scalda una padella e fai fondere poco burro con il grasso di pancetta affumicata, adagia le patate e falle rosolare prima dalla parte del taglio e poi sulla buccia, infine regola di sale e metti da parte.
        3.  Rigenera le guance di rana pescatrice a 50°C per 10 minuti, quindi scolale sulla placca forata.
        4.  Posiziona sul piatto le patate e le guance di rana pescatrice, condiscile con poco olio EVO e servi.

### Bruschetta di anguria, gelato alla mozzarella di bufala e polvere di capperi

#### Anguria per bruschetta
*   **Ingredienti:** 1,5 kg anguria senza semi, 120 g umami di pomodori CBT, 20 g olio all'origano CBT, 20 g olio ai semi di finocchio CBT, 20 g olio al pepe nero CBT, 20 g olio all'aglio CBT, 40 g olio EVO, 1 g xantano, Sale.
*   **Procedimento:**
    1.  Taglia l'anguria in parallelepipedi di 3 cm di lato e di 1,5 cm di spessore, condiscila con il sale e falla macerare per 10 minuti, dopodiché scolala dal liquido che avrà rilasciato, conservandone 50 g.
    2.  Frulla insieme gli oli aromatici, l'olio EVO, l'umami di pomodori, i 50 g di liquido della salatura e lo xantano, fino ad ottenere una salsa liscia ed omogenea.
    3.  Condisci l'anguria con questo composto e trasferiscila nella busta da cottura.
    4.  Condiziona sottovuoto praticando 5 sgasature.
    5.  Precuoci a 55°C per 30 minuti e abbatti in positivo.
    6.  Successivamente cuoci a 84°C per 15 minuti e a cottura terminata apri la busta, dividi l'anguria dal liquido di cottura e abbattila in positivo.
    7.  Trasferisci il liquido di cottura in una casseruola e fallo ridurre a fuoco dolce fino ad ottenere una salsa densa, poi abbattila in positivo.
    8.  Amalgama l'anguria alla salsa, condizionala sottovuoto e conservala in frigorifero fino al momento dell'uso.

#### Polvere di capperi al vino moscato
*   **Ingredienti:** 200 g capperi sotto sale, 200 g riduzione di vino moscato.
*   **Procedimento:**
    1.  Sciacqua e fai dissalare i capperi in acqua fredda, cambiandola di tanto in tanto.
    2.  Una volta dissalati inseriscili nella busta da cottura insieme al vino bianco e condizionali sottovuoto praticando una sgasatura.
    3.  Cuocili a 86°C per 2 ore e a cottura ultimata estraili dalla busta eliminando tutto il liquido di cottura.
    4.  Frullali fino ad ottenere una pasta liscia.
    5.  Stendila su tappetini antiaderenti e mettila in essiccatore a 60°C/70°C finché sarà completamente seccata.
    6.  Polverizzala finemente aggiungendo poco sale, poi conservala sottovuoto.

#### Gelato gastronomico alla mozzarella di bufala
*   **Ingredienti:** 390 g latte fresco, 150 g panna fresca, 210 g essenza di mozzarella di bufala CBT, 145 g trealosio, 45 g destrosio, 15 g latte in polvere, 3 g farina di semi di carrube, 8 g sale.
*   **Procedimento:**
    1.  Miscela tutti gli ingredienti in polvere, poi frulla insieme latte, panna ed essenza di mozzarella per pochi secondi e senza incorporare aria.
    2.  Inseriscili nella busta da cottura e abbatti per stabilizzare i liquidi.
    3.  Condiziona sottovuoto e mescola per sciogliere ed amalgamare il composto.
    4.  Cuoci a 76°C per 40 minuti mescolando ogni 5 minuti e abbatti in positivo.
    5.  Successivamente posiziona la busta in frigorifero per almeno 12 ore per far maturare la miscela.
    6.  Trascorso questo tempo frulla la base per gelato alla massima potenza per 2 minuti, poi falla mantecare.

*   **Finitura del piatto:**
    *   **Ingredienti:** Fette di pane casereccio, Olio EVO.
    *   **Procedimento:**
        1.  Estrai l'anguria dalla busta, scola i liquidi e condiscila con l'olio EVO.
        2.  Abbrustolisci le fette di pane.
        3.  Posiziona dei pezzi di anguria sul pane, aggiungi una quenelle di gelato alla mozzarella di bufala e spolvera con la polvere di capperi.

### Finocchi allo zafferano

#### Finocchi allo zafferano
*   **Ingredienti:** 1 finocchio, 10 g riduzione di aceto di vino bianco, 60 g burro morbido, 0,5 g zafferano in polvere, 30 g zucchero, 6 g sale, Poca curcuma in polvere, Poco xantano.
*   **Procedimento:**
    1.  Lava e taglia il finocchio a spicchi di 3 cm.
    2.  Metti il resto degli ingredienti in un bicchiere e omogeneizzali con un frullatore ad immersione.
    3.  Mescolali ai finocchi, poi trasferisci il tutto nella busta da cottura.
    4.  Abbatti in positivo per stabilizzare i liquidi e condiziona sottovuoto praticando 3 sgasature.
    5.  Cuoci a 86°C per 30 minuti, poi abbatti in positivo.
    6.  Conservalo in frigorifero per 24 ore prima di utilizzarlo, affinché il finocchio possa insaporirsi a fondo.

*   **Finitura del piatto:**
    *   **Ingredienti:** Qualche pistillo di zafferano.
    *   **Procedimento:**
        1.  Rigenera la busta dei finocchi a 80°C per 12 minuti, poi apri e scola la busta, separando i finocchi dalla salsa.
        2.  Frulla velocemente la salsa per uniformarla e regola di sapore.
        3.  Metti la salsa a specchio sul piatto e adagia uno spicchio di finocchio.
        4.  Decora con qualche pistillo di zafferano e servi.

### Melanzana con la parmigiana

#### Melanzana baby al naturale
*   **Ingredienti:** 12 melanzane baby, Sale.
*   **Procedimento:**
    1.  Pela le melanzane lasciando il picciolo, poi condiscile con poco sale.
    2.  Inseriscile nella busta da cottura e condiziona sottovuoto praticando 5 sgasature.
    3.  Cuoci a 88°C per 25 minuti e abbatti in positivo.

#### Filetti di pomodori perini
*   **Ingredienti:** 1 kg pomodori perini, 7 g aglio, 3 g origano, 1 g pepe nero macinato, 30 g olio Evo, Sale.
*   **Procedimento:**
    1.  Lava i pomodori e tagliali per il senso della lunghezza, poi condiscili con il sale e falli macerare per 10 minuti.
    2.  Trascorso questo tempo, elimina l'acqua che avranno rilasciato e unisci l'aglio affettato finemente, l'origano e l'olio evo, amalgamando il tutto.
    3.  Trasferisci il composto nelle buste da cottura e condiziona sottovuoto praticando 3 sgasature.
    4.  Precuoci a 55°C per 30 minuti e abbatti in positivo.
    5.  Cuoci a 86°C per 30 minuti e abbatti in positivo.
    6.  Apri la busta, scola i liquidi di cottura e tienili da parte.
    7.  Elimina la pelle e i semi, poi taglia la polpa a filetti e uniscila al liquido di cottura amalgamando bene.
    8.  Condiziona sottovuoto e conservali in frigorifero fino al momento dell'uso.

#### Gel di mozzarella di bufala
*   **Ingredienti:** 800 g essenza di mozzarella di bufala CBT, 100 g amido di mais, 100 g amido di riso.
*   **Procedimento:**
    1.  Mescola gli amidi poi stemperali in 400 g di essenza di mozzarella di bufala, ma senza incorporare aria.
    2.  Inserisci il composto nella busta da cottura, poi unisci la restante essenza e massaggia la busta per mescolarlo.
    3.  Abbatti per stabilizzare i liquidi, poi condiziona sottovuoto.
    4.  Cuoci a 86°C per 30 minuti mescolando ogni 5 minuti.
    5.  Abbatti in positivo e conserva in frigorifero.

*   **Finitura del piatto:**
    *   **Ingredienti:** Gel di Parmigiano Reggiano CBT, Umami di pomodori perini CBT, Umami di melanzane CBT, Terra di melanzane CBT.
    *   **Procedimento:**
        1.  Con un coltellino pratica un'incisione perpendicolare nella parte centrale delle melanzane, poi svuotale dai semi.
        2.  Farcisci le melanzane con il gel di Parmigiano Reggiano, ricreandone la forma originale.
        3.  Amalgama l'umami di pomodori e l'umami di melanzane.
        4.  Spennellale con gli umami e falle laccare in forno a 180°C.
        5.  Ripeti questa operazione un'altra volta, quindi abbassa il forno a 120°C e glassale per altre 2 volte, fino ad ottenere una laccatura lucida e consistente.
        6.  Rigenera i filetti di pomodori e il gel di mozzarella di bufala.
        7.  Con un setaccio distribuisci la terra di melanzane sul piatto, poi posiziona i filetti di pomodori inframezzati dal gel di mozzarella di bufala.
        8.  Adagia la melanzana nella parte centrale del piatto e servi.

### Solo melanzana

#### Melanzana viola al naturale
*   **Ingredienti:** 1 grossa melanzana viola, Sale.
*   **Procedimento:**
    1.  Pela la melanzana e tagliala a cubi di 5/6 cm di lato.
    2.  Salala generosamente e falla macerare per 10 minuti.
    3.  Elimina l'acqua che avrà rilasciato e trasferiscila nella busta da cottura.
    4.  Condizionala sottovuoto praticando 5 sgasature.
    5.  Cuoci a 86°C per 30 minuti, poi abbatti in positivo.

#### Umami di melanzane
*   **Ingredienti:** 2 kg melanzane.
*   **Procedimento:**
    1.  Pela e taglia a dadini le melanzane.
    2.  Trasferiscile nella busta da cottura e condizionale sottovuoto praticando 5 sgasature.
    3.  Cuoci a 88°C per 2 ore.
    4.  A cottura ultimata, apri la busta e trasferisci il contenuto su un setaccio di acciaio a rete fine, quindi strizza bene la polpa di melanzane per ricavare tutto il succo.
    5.  Filtra ulteriormente il succo di melanzane per renderlo limpido, poi trasferiscilo in una casseruola e fallo ridurre a fuoco dolce fino a raggiungere la temperatura di 102°C e abbatti in positivo.
    6.  Tieni da parte la polpa strizzata, ti servirà per la ricetta seguente.

#### Terra di melanzane
*   **Ingredienti:** La polpa asciutta delle melanzane CBT (ric. prec.), Olio all'aglio CBT, Olio al peperoncino CBT, Olio Evo, Sale.
*   **Procedimento:**
    1.  Scalda una padella antiaderente, aggiungi un filo di olio EVO e a fuoco dolce fai caramellare la polpa delle melanzane, regolando di sale.
    2.  Una volta caramellata, trasferiscila in un Thermomix e frullala fino ad ottenere una pasta liscia, aggiungendo qualche goccia di olio all'aglio e olio al peperoncino.
    3.  Stendi su dei fogli antiaderenti degli strati sottili di questa polpa e falla essiccare a 60°C/70°C.
    4.  Quando sarà completamente disidratata, polverizzala fino a che risulti granulosa come una terra fine.

*   **Finitura del piatto:**
    *   **Ingredienti:** Olio EVO.
    *   **Procedimento:**
        1.  Togli i dadi di melanzana dalla busta e asciugali.
        2.  Spennellali con gli umami e falli laccare in forno a 180°C.
        3.  Ripeti questa operazione un'altra volta, abbassa il forno a 120°C e glassali per altre 2 volte, fino ad ottenere una laccatura lucida e consistente.
        4.  Metti uno strato di terra di melanzana al centro del piatto, adagia la melanzana laccata e servi.

### Patate fritte ultrasoniche e ketchup di carote nere

#### Patate fritte ultrasoniche
*   **Ingredienti:** 4 grosse patate da friggere, 1 l acqua, 15 g sale.
*   **Procedimento:**
    1.  Sciogli a freddo il sale nell'acqua.
    2.  Pela le patate e tagliale per ricavare dei grossi parallelepipedi.
    3.  Inseriscile nella busta da cottura insieme all'acqua pari a metà del loro peso.
    4.  Condiziona sottovuoto praticando una sgasatura, poi cuoci a 88°C per 30 minuti.
    5.  A cottura ultimata, trasferisci con delicatezza la busta delle patate nella lavatrice a ultrasuoni.
    6.  Fai sonicare per 1 ora e mezza in acqua fredda muovendo per una volta la busta dopo 45 minuti.
    7.  Successivamente apri la busta sulla placca forata e scola le patate avendo cura di non romperle.
    8.  Trasferiscile sulle griglie di un essiccatore e falle disidratare a freddo per almeno 2 ore, finché la superficie non sarà completamente asciutta.
    9.  Trascorso questo tempo, friggile in abbondante olio a 160°C per 5/7 minuti, dopodiché abbattile in negativo.

#### Ketchup di carote nere
*   **Ingredienti:** 600 g carote nere, 400 g succo di mele CBT, 40 g miele, 60 g zucchero, 70 g riduzione di aceto di vino rosso, 8 g Worcestershire sauce, 8 g sale.
*   **Procedimento:**
    1.  Pela e affetta finemente le carote, poi inseriscile nella busta da cottura e cuocile a 88°C per 1 ora.
    2.  A fine cottura toglile dalla busta e frullale con tutti gli altri ingredienti fino ad ottenere una consistenza liscia.
    3.  Trasferisci il composto in una casseruola e a fuoco dolce fai ridurre i liquidi a fuoco dolce fino ad arrivare alla temperatura di 102°C.
    4.  Raggiunta questa temperatura, abbatti in positivo e conserva sottovuoto.

*   **Finitura del piatto:**
    1.  Friggi le patate ancora surgelate a 190°C fino a completa doratura.
    2.  Disponi il ketchup di carote nere in una ciotola.
    3.  Condisci le patate con il sale, posizionale sul piatto e servile accanto al ketchup di carote nere.

### Peperoni di Carmagnola, bagna caoda, umami e polveri di peperoni

#### Peperoni stufati
*   **Ingredienti:** 2 kg peperoni di Carmagnola, Olio all'aglio CBT, Olio al pepe bianco CBT, Sale.
*   **Procedimento:**
    1.  Lava e asciuga i peperoni, poi brucia con un cannello la pelle ed eliminala sciacquandoli sotto l'acqua corrente.
    2.  Con un coltello tagliali a falde ed elimina tutti i semi, per ricavarne dei filetti della larghezza di 1 cm.
    3.  Pesa i filetti e condiscili con 5 g di sale per ogni kg e falli macerare per 10 minuti.
    4.  Scola e trasferisci nella busta da cottura e condiziona sottovuoto praticando 3 sgasature.
    5.  Cuoci a 88°C per 1 ora, poi apri la busta e metti a scolare i peperoni dal liquido di cottura per 20 minuti, poi abbattili in positivo.
    6.  Metti il liquido di cottura in una casseruola e riducilo a fuoco dolce finché non raggiungerà la temperatura di 102°C, poi abbatti in positivo.
    7.  Quando sarà freddo, uniscilo ai filetti di peperoni aggiungendo qualche goccia di olio all'aglio e di olio al pepe bianco.
    8.  Regola di sale e condiziona sottovuoto.

#### Bagna caoda
*   **Ingredienti:** 400 g aglio pelato, 500 g latte, 800 g burro di qualità, 600 g acciughe dissalate, 1 g xantano.
*   **Procedimento:**
    1.  Inserisci nella busta da cottura il latte e l'aglio, pulito solo della radice.
    2.  Abbatti per stabilizzare i liquidi, poi condiziona sottovuoto praticando 3 sgasature.
    3.  Cuoci a 86°C per 1 ora e abbatti in positivo.
    4.  Attendi 24 ore prima di utilizzarlo.
    5.  Trascorso questo periodo, scola l'aglio dal latte.
    6.  Inserisci nella busta da cottura l'aglio cotto, il burro, le acciughe e lo xantano.
    7.  Condiziona sottovuoto e cuoci a 86°C per 5 ore mescolando ogni 30 minuti.
    8.  A cottura ultimata versa il contenuto della busta in un blender e frullalo fino ad ottenere un composto liscio ed omogeneo.
    9.  Trasferisci il composto in una bastardella e abbatti in positivo, mescolando di tanto in tanto per mantenere stabile l'emulsione.
    10. Quando sarà raffreddata, condiziona sottovuoto e conserva in frigorifero.

*   **Finitura del piatto:**
    *   **Ingredienti:** Umami di peperoni rossi e gialli CBT, Polvere di peperoni rossi e gialli CBT.
    *   **Procedimento:**
        1.  Apri la busta dei peperoni, versa il contenuto in una casseruola e fai scaldare riducendo i liquidi quanto il più possibile.
        2.  Posiziona i peperoni sul piatto, aggiungi dei ciuffi di bagna caoda e decora con gli umami e le polveri di peperoni.

### Mela e melagrana

#### Dadini di mele al naturale
*   **Ingredienti:** 4 mele golden.
*   **Procedimento:**
    1.  Pela le mele e ricava dalla polpa dei dadini di 5 mm di lato.
    2.  Inseriscili nella busta da cottura e condizionali sottovuoto praticando 3 sgasature.
    3.  Precuocili a 55°C per 30 minuti e abbatti in positivo.
    4.  Successivamente cuocili a 84°C per 12 minuti, quindi abbatti in positivo.

#### Succo e purea asciutta di mele
*   **Ingredienti:** 2 kg mele.
*   **Procedimento:**
    1.  Pela ed elimina il torsolo alle mele, affettale a spicchi regolari e condizionale sottovuoto praticando 3 sgasature.
    2.  Cuocile a 86°C per 30 minuti, poi toglile dalla busta e frullale fino ad ottenere una purea liscia.
    3.  Trasferisci la purea su di un'etamina e fanne gocciolare tutta la parte liquida finché non risulti completamente asciutta.
    4.  Abbatti in positivo succo e purea di mele e conservali sottovuoto in frigorifero fino al momento dell'uso.

#### Spuma di mele
*   **Ingredienti:** 500 g succo di mele CBT (ric. prec.), 60 g zucchero, 10 g colla di pesce spezzettata, 1,5 g xantano.
*   **Procedimento:**
    1.  Mescola lo xantano allo zucchero e stemperalo nella metà del succo.
    2.  Inseriscilo nella busta da cottura aggiungendo il restante succo e la colla di pesce.
    3.  Abbatti per stabilizzare i liquidi, condiziona sottovuoto e mescola il contenuto della busta per sciogliere gli ingredienti.
    4.  Cuoci a 60°C per 20 minuti, mescolando ogni 5 minuti.
    5.  A cottura ultimata, apri la busta e inseriscilo in un sifone caricandolo con 2 o 3 cartucce.
    6.  Abbattilo in positivo e lascialo in frigorifero per 3 ore prima di utilizzarlo.

#### Apple caramel
*   **Ingredienti:** 500 g purea asciutta di mele CBT (ric. prec.), 75 g burro morbido, 40 g zucchero, 10 g sciroppo di glucosio, 1 g sale.
*   **Procedimento:**
    1.  Frulla tutti gli ingredienti, ottenendo una crema liscia e densa.
    2.  Stendila su una teglia ricoperta da un foglio antiaderente e infornala a 160°C per 1 ora mescolandola ogni 8/10 minuti circa.
    3.  Al termine della cottura frulla il composto e stendilo su dei fogli antiaderenti in modo uniforme ad uno spessore di 2/3 mm.
    4.  Fallo essiccare per 4 ore a 50°C.
    5.  Trascorso questo tempo, condiziona i fogli sottovuoto tenendoli ben stesi e conservali in positivo.

#### Lemon curd
*   **Ingredienti:** 100 g succo di limone, 100 g tuorlo setacciato, 60 g uovo intero, 250 g zucchero, 20 g olio al limone CBT, 15 g colla di pesce, 220 g burro.
*   **Procedimento:**
    1.  Spezzetta la colla di pesce e taglia il burro a dadini.
    2.  Stempera lo zucchero con il succo di limone e inseriscilo nella busta da cottura insieme agli altri ingredienti.
    3.  Abbatti per stabilizzare i liquidi poi condiziona sottovuoto.
    4.  Mescola il contenuto nella busta, poi cuoci a 66°C per 40 minuti mescolando ogni 10 minuti.
    5.  A cottura ultimata abbatti in positivo.

#### Gel fluido di melagrane
*   **Ingredienti:** 500 g succo di melagrane CBT, 100 g zucchero, 15 g gellan, 1 g xantano.
*   **Procedimento:**
    1.  Mescola lo zucchero, il gellan e lo xantano.
    2.  Inserisci nella busta da cottura il succo delle melagrane e il mix di polveri.
    3.  Manipola il fondo della busta per sciogliere gli ingredienti, poi abbatti in positivo.
    4.  Cuoci a 90°C per 30 minuti mescolando ogni 10 minuti e abbatti in positivo.
    5.  Una volta raffreddato togli dalla busta il blocco di gelatina che si sarà formato.
    6.  Frullalo fino ad ottenere un gel denso, poi sgasalo e condizionalo sottovuoto.

*   **Finitura del piatto:**
    1.  In un piatto a cappello di prete metti nel centro un punto di gel di melagrane, poi con il lemon curd disegna una spirale sui bordi.
    2.  Aggiungi sopra al gel di melagrane una cucchiaiata di dadini di mele.
    3.  Applica una bocchetta liscia al sifone e copri tutti gli ingredienti con la spuma di mele fino a creare una semisfera grande come il fondo del piatto.
    4.  Con un coppapasta ricava delle sagome di mele dall'apple caramel e posizionale all'ultimo momento sulla spuma.

### Mousse di fragole al lemongrass, fragole candite e gel di fragole

#### Mousse di fragole al lemongrass
*   **Ingredienti:** 1 kg fragole, 400 g zucchero, 100 g sciroppo di glucosio in polvere, 2 stecche di lemongrass.
*   **Procedimento:**
    1.  Mescola lo zucchero e lo sciroppo di glucosio in polvere.
    2.  Togli il picciolo e lava le fragole, poi mescolale al mix di zuccheri.
    3.  Trasferiscile nella busta da cottura e unisci il lemongrass pestato e tagliato a pezzi.
    4.  Condiziona sottovuoto praticando 3 sgasature.
    5.  Cuoci a 84°C per 20 minuti mescolando ogni 5 minuti.
    6.  A fine cottura apri la busta, elimina il lemongrass e filtra il contenuto attraverso un setaccio, per separare lo sciroppo dalle fragole.
    7.  Abbatti in positivo sia fragole che sciroppo.
    8.  Una volta fredde, frulla le fragole con un frullatore ad immersione, cercando di incorporare più aria possibile, poi setaccia il composto per eliminare i semini ancora intatti.
    9.  Tieni da parte lo sciroppo per la ricetta seguente.

#### Gel di fragole
*   **Ingredienti:** 200 g sciroppo di fragole CBT (ric. prec.), 4 g kappa, 0,5 g tara, 1,2 g acido citrico.
*   **Procedimento:**
    1.  Sciogli la kappa, la tara e l'acido citrico nello sciroppo utilizzando un frullatore ad immersione, ma senza incorporare aria.
    2.  Abbatti per stabilizzare i liquidi, quindi inserisci nella busta da cottura e condiziona sottovuoto.
    3.  Cuoci a 92°C per 30 minuti mescolando ogni 10 minuti.
    4.  A fine cottura abbatti in positivo e successivamente frulla e sgasa il gel di fragole.

*   **Finitura del piatto:**
    *   **Ingredienti:** Fragole candite CBT.
    *   **Procedimento:**
        1.  Inserisci la mousse di fragole in un sac-à-poche e decora il piatto.
        2.  Aggiungi le fragole candite e decora con punti di gel di fragole.

### Pere Martin Sec al vin brulé, crema pasticcera speziata

#### Pere Martin Sec al vin brulé
*   **Ingredienti:** 12 pere Martin Sec, 2 l vino rosso corposo, 500 g zucchero, 5 chiodi di garofano, 2 stecche di cannella, La scorza di mezza arancia, La scorza di mezzo limone, 2 bacche di anice stellato.
*   **Procedimento:**
    1.  Metti il vino a sobbollire, poco per volta, fino a che non sarà ridotto a 500 g.
    2.  Aggiungi lo zucchero e le spezie e fai sobbollire per 5 minuti, poi abbatti in positivo.
    3.  Una volta raffreddato, filtralo dalle spezie e tienilo da parte.
    4.  Pela le pere e inseriscile nella busta da cottura insieme allo sciroppo di vin brulé.
    5.  Condiziona sottovuoto praticando 5 sgasature, poi applica un cuscinetto stretto.
    6.  Precuocile a 55°C per 30 minuti e abbatti in positivo.
    7.  Successivamente cuoci a 88°C per 1 ora, poi abbatti in positivo.
    8.  Attendi 24 ore prima di utilizzarle.

#### Crema pasticcera speziata
*   **Ingredienti:** 750 g latte, 250 g panna, 250 g tuorlo setacciato, 250 g zucchero, 35 g amido di mais, 35 g amido di riso, 1 g sale, 1 bacca di vaniglia, Qualche pistillo di zafferano, 5 fiori di cannella, La scorza di mezzo limone, 10 g colla di pesce spezzettata.
*   **Procedimento:**
    1.  Mescola zuccheri, amidi, sale e spezie.
    2.  Inserisci nella busta da cottura panna, latte, tuorli, scorza di limone, semi della bacca di vaniglia, colla di pesce ed infine il mix di polveri.
    3.  Abbatti per stabilizzare i liquidi, condiziona sottovuoto, quindi mescola il contenuto della busta per sciogliere gli ingredienti.
    4.  Cuoci a 84°C per 1 ora, mescolando il contenuto della busta ogni 10 minuti, poi abbatti in positivo.
    5.  Una volta raffreddata, apri la busta, setacciala per eliminare le spezie e mescolala vigorosamente con una spatola per uniformarla e renderla lucida.

*   **Finitura del piatto:**
    1.  Disponi sul piatto un cerchio di crema pasticcera, poi adagia una pera nel centro e decorala con un filo di sciroppo di vin brulé.

### Spuma di zabaione al marsala nel caffè

#### Spuma di zabaione al marsala
*   **Ingredienti:** 250 g tuorlo setacciato, 350 g marsala, 330 g zucchero, 0,3 g tara.
*   **Procedimento:**
    1.  Prendi 200 g di marsala e fallo dealcolare in una casseruola a fuoco dolce. Sarà pronto quando ne saranno evaporati 50 g, poi abbattilo in positivo.
    2.  Inserisci tutti gli ingredienti nella busta da cottura.
    3.  Abbatti per stabilizzare i liquidi e condiziona sottovuoto.
    4.  Cuoci a 66°C per 25 minuti, mescolando ogni 5 minuti, poi abbatti in positivo.
    5.  Quando sarà freddo, apri la busta e filtralo per eliminare eventuali grumi.
    6.  Trasferiscilo in un sifone e montalo con 2 o 3 cartucce.
    7.  Agitalo bene e fallo riposare per 2 ore prima di utilizzarlo.
    8.  Conservalo in frigorifero.

*   **Finitura del piatto:**
    *   **Ingredienti:** Caffè espresso.
    *   **Procedimento:**
        1.  Prepara un caffè espresso stretto e ricoprilo con la spuma di zabaione.
        2.  Servi subito.
</script>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const rawMarkdown = document.getElementById('markdown-data').textContent;
        const recipeList = document.getElementById('recipe-list');
        const searchInput = document.getElementById('search-input');
        const noResults = document.getElementById('no-results');

        // Funzione semplice per convertire il markdown specifico di questo libro in HTML
        function parseRecipes(md) {
            const lines = md.split('\n');
            let html = '';
            let currentCategory = '';
            let recipes = [];
            let currentRecipe = null;

            lines.forEach(line => {
                line = line.trim();
                
                // Categoria Principale (##)
                if (line.startsWith('## ')) {
                    currentCategory = line.replace('## ', '').trim();
                }
                // Sottocategoria (###) - La usiamo come prefisso o la ignoriamo, qui la ignoriamo per semplicità o la accodiamo
                else if (line.startsWith('### ')) {
                    // Opzionale: potremmo aggiornare la categoria
                }
                // Titolo Ricetta (####) - Inizia una nuova card
                else if (line.startsWith('#### ')) {
                    if (currentRecipe) recipes.push(currentRecipe);
                    currentRecipe = {
                        title: line.replace('#### ', '').trim(),
                        category: currentCategory,
                        content: ''
                    };
                }
                // Contenuto della ricetta
                else if (currentRecipe) {
                    // Formattazione base Markdown -> HTML
                    let formattedLine = line;
                    
                    // Grassetto
                    formattedLine = formattedLine.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                    
                    // Liste
                    if (formattedLine.startsWith('* ')) {
                        formattedLine = `<li>${formattedLine.substring(2)}</li>`;
                    } else if (formattedLine.match(/^\d+\./)) {
                        formattedLine = `<li>${formattedLine.replace(/^\d+\.\s*/, '')}</li>`;
                    } else if (formattedLine === '') {
                        formattedLine = '<br>';
                    } else {
                        formattedLine = `<p>${formattedLine}</p>`;
                    }

                    currentRecipe.content += formattedLine;
                }
            });
            if (currentRecipe) recipes.push(currentRecipe); // Aggiungi l'ultima

            return recipes;
        }

        const recipes = parseRecipes(rawMarkdown);

        // Renderizza le ricette nel DOM
        function renderRecipes(recipesToRender) {
            recipeList.innerHTML = '';
            
            if (recipesToRender.length === 0) {
                noResults.style.display = 'block';
                return;
            } else {
                noResults.style.display = 'none';
            }

            recipesToRender.forEach(recipe => {
                const card = document.createElement('div');
                card.className = 'recipe-card';
                
                // Pulizia liste HTML grezze (un po' hacky ma funziona per questo formato)
                let cleanContent = recipe.content
                    .replace(/<\/li><br><li>/g, '</li><li>')
                    .replace(/<br>/g, '');
                
                // Avvolgi le liste in <ul> o <ol> se ci sono molti <li> consecutivi
                // Per semplicità in questo script leggero, lasciamo i li come block elements o usiamo un div wrapper
                // Miglioramento visivo semplice:
                cleanContent = cleanContent.replace(/<li>/g, '<div style="margin-bottom:4px; padding-left:15px; position:relative;"><span style="position:absolute; left:0;">•</span> ').replace(/<\/li>/g, '</div>');


                card.innerHTML = `
                    <div class="recipe-category">${recipe.category}</div>
                    <h3>${recipe.title}</h3>
                    <div class="recipe-content">${cleanContent}</div>
                `;
                recipeList.appendChild(card);
            });
        }

        // Render iniziale
        renderRecipes(recipes);

        // Logica di Ricerca
        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            
            const filtered = recipes.filter(recipe => {
                return recipe.title.toLowerCase().includes(term) || 
                       recipe.content.toLowerCase().includes(term) ||
                       recipe.category.toLowerCase().includes(term);
            });

            renderRecipes(filtered);
        });
    });
</script>
