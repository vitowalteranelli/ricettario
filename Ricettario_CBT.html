# CBT - LE RICETTE
*Trascrizione completa dal libro "CBT #sousvide"*

---

## CARNI

### MANZO

#### Burger di picanha
*   **Ingredienti:** 1 kg picanha con grasso, 2 l acidificazione forte, 8 g sale, 1,5 g acido ascorbico, 50 g acqua gasata.
*   **Procedimento:**
    1.  Acidifica la picanha per 10 minuti, poi tagliala e macinala con la piastra da 7 mm (operazione da fare nel minor tempo possibile con attrezzatura refrigerata).
    2.  Stempera l'acido ascorbico nell'acqua gasata e successivamente il sale.
    3.  Aggiungi questo composto alla carne macinata mescolando bene l'impasto.
    4.  Forma dei burger negli anelli alti 2 cm e abbattili per stabilizzarli.
    5.  Inseriscili nelle buste da cottura e condizionali sottovuoto.
    6.  Cuocili a 48°C per 1 ora, poi abbattili in positivo.
    7.  Toglili dalla busta e dagli anelli, asciugali e falli rosolare con il metodo che preferisci.

#### Burger sottili di manzo
*   **Ingredienti:** 1 kg reale di manzo, 2 l acidificazione forte, 8 g sale, 1,5 g acido ascorbico, 50 g acqua gasata.
*   **Procedimento:**
    1.  Acidifica il reale per 10 minuti, poi taglialo e macinalo con la piastra da 4 mm (attrezzatura refrigerata).
    2.  Stempera l'acido ascorbico nell'acqua gasata e successivamente il sale.
    3.  Aggiungi il composto alla carne macinata mescolando bene.
    4.  Riempi le buste da cottura per un quarto del volume, condiziona sottovuoto e con un mattarello livella il contenuto fino a ottenere uno spessore omogeneo di mezzo centimetro.
    5.  Cuocilo a 48°C per 40 minuti, poi abbattilo in positivo.
    6.  Toglilo dalla busta, taglia il foglio di carne nella misura che preferisci, asciuga i pezzi e falli rosolare velocemente sulla piastra.

#### Bollito di reale di manzo classico
*   **Ingredienti:** 2 kg reale di manzo, 3 l acidificazione leggera, 800 g essenza vegetale CBT, 2 chiodi di garofano, 1 foglia di alloro, 1 g pepe nero in grani, 15 g sale.
*   **Procedimento:**
    1.  Taglia il reale in due, legalo per ottenere due arrosti, poi acidificalo per 10 minuti e scolalo.
    2.  Stempera il sale nell'essenza vegetale, poi inseriscila nella busta da cottura insieme alla carne e al pepe.
    3.  Abbatti per stabilizzare i liquidi, poi condiziona sottovuoto.
    4.  Cuoci a 60°C per 24 ore, poi abbatti in positivo.
    5.  Apri la busta, separa il liquido di cottura dalla carne e procedi a chiarificazione e riduzione fino ad ottenere un brodo concentrato e saporito.
    6.  Inserisci la carne e il brodo concentrato nella busta da cottura, poi condiziona sottovuoto.
    7.  Per l'utilizzo, rigenera a 75°C per 20 minuti.

#### Bollito di reale di manzo umami
*   **Ingredienti:** 1 kg reale di manzo, 2 l acidificazione leggera, 2 l marinatura 30:30, 10 g umami di cipolle CBT, 5 g umami di carote CBT, 3 g umami di sedano CBT, 20 g grasso di rognone all'alloro CBT, 20 g grasso di rognone ai chiodi di garofano CBT, 20 g grasso di rognone al pepe nero CBT.
*   **Procedimento:**
    1.  Taglia il reale in due, legalo, acidifica per 10 minuti e immergi nella marinatura per 24 ore.
    2.  Scola la carne e asciugala.
    3.  Mescola insieme gli umami, poi spennellali sulla superficie della carne.
    4.  Inserisci la carne nella busta insieme ai grassi aromatizzati e condiziona sottovuoto.
    5.  Cuoci a 60°C per 24 ore, massaggiando la busta dopo 20 minuti per distribuire i grassi sciolti.
    6.  A cottura terminata abbatti in positivo.
    7.  Per l'utilizzo, rigenera a 70°C per 20 minuti.

#### Arrosto di reale di manzo
*   **Ingredienti:** 1 kg reale di manzo, 2 l acidificazione forte, 2 l marinatura 30:30, 100 g grasso di rognone neutro CBT, 5 g aglio, 4 g aghi di rosmarino, 1 foglia di alloro, 2 g pepe nero in grani, 2 g pepe bianco in grani, Burro di qualità.
*   **Procedimento:**
    1.  Pulisci il reale, acidificalo per 10 minuti, poi immergilo nella marinatura per 24 ore.
    2.  Scola, asciuga e lega con lo spago.
    3.  Frulla il grasso di rognone con le spezie e le erbe, poi inseriscilo nella busta da cottura.
    4.  Condiziona sottovuoto e cuoci a 58°C per 24 ore, poi abbatti in positivo e attendi 12 ore prima di utilizzarlo.
    5.  Togli l'arrosto dalla busta, asciugalo. Spennellalo di burro fuso e fallo rosolare in forno a 250°C fino a doratura.

#### Bistecca fiorentina di manzo al sangue
*   **Ingredienti:** 1 bistecca fiorentina da 1,5 kg, 2 l acidificazione forte, 2 l marinatura 25:15, Olio EVO, Fiocchi di sale, Pepe nero macinato grosso.
*   **Procedimento:**
    1.  Acidifica la bistecca per 10 minuti, poi immergila nella marinatura per 12 ore.
    2.  Scolala e asciugala.
    3.  Inseriscila nella busta da cottura e condiziona sottovuoto.
    4.  Cuoci a 48°C per 4 ore, dopodiché abbatti in positivo e attendi 24 ore prima di consumarla.
    5.  Togli la fiorentina dalla busta e asciugala, poi spennellala con l'olio evo e falla rosolare velocemente sulla griglia o nel bbq a 300°C.
    6.  Tagliala e aggiungi fiocchi di sale e pepe nero.

#### Cappello del prete di manzo brasato
*   **Ingredienti:** 3 kg cappello del prete, 3 l acidificazione leggera, 3 l marinatura 30:30, 1 l riduzione di vino rosso, 600 g brunoise per soffritto CBT, 200 g brunoise di patate CBT, 200 g brunoise di funghi champignon CBT, spezie (chiodi di garofano, ginepro, cannella, pepe nero, fava di Tonka, alloro), 100 g burro chiarificato CBT, 60 g burro di qualità.
*   **Procedimento:**
    1.  Pulisci il cappello del prete, legalo, fallo acidificare per 10 minuti poi immergilo nella marinatura per 24 ore.
    2.  Scolalo, asciugalo e legalo. Fallo rosolare col burro chiarificato e abbatti in positivo.
    3.  Fai un pacchetto con le spezie nella pellicola.
    4.  Inserisci nella busta la carne, la riduzione di vino, le brunoise e il pacchetto di spezie.
    5.  Abbatti per stabilizzare i liquidi, condiziona sottovuoto (4 sgasature).
    6.  Cuoci a 64°C per 24 ore.
    7.  Scola la carne, slega il brasato e condizionalo sottovuoto nella busta da cottura.
    8.  Elimina le spezie dal fondo, fai ridurre il liquido, aggiungi le verdure e il burro. Amalgama e conserva.
    9.  Rigenera a 80°C per 30 minuti.

#### Costine di manzo laccate
*   **Ingredienti:** 1 kg costine di manzo (pezzo intero), 2 l acidificazione leggera, 2 l marinatura 50:50, 100 g grasso di pancetta affumicata stagionata CBT, Olio all'aglio CBT, pepe nero, pepe bianco, umami di cipolle, umami di pomodori, riduzione aceto vino rosso, Xantano.
*   **Procedimento:**
    1.  Pulisci e acidifica le costine per 10 minuti, poi marinale per 24 ore.
    2.  Scola, asciuga e fai affumicare a freddo per 1 ora, poi abbatti in positivo.
    3.  Pesta i pepi, aggiungili al grasso di pancetta con qualche goccia di olio all'aglio e spalmalo sulla carne.
    4.  Cuoci a 64°C per 36 ore.
    5.  Scola le costine e abbattile.
    6.  Unisci gli umami, l'aceto e poco xantano e frulla per ottenere la glassa.
    7.  Spennella sulle costine e fai laccare in forno ventilato a 160°C (ripeti due volte).

#### Finto arrosto di stinco di manzo
*   **Ingredienti:** 1 stinco di manzo da 4 kg, 3 l acidificazione leggera, 3 l marinatura 40:40, 10 g transglutaminasi sciolti in 40 g acqua, 200 g jus di manzo CBT, 30 g riduzione di vermouth, 400 g brunoise di verdure CBT, Olio al pepe nero CBT, Sale.
*   **Procedimento:**
    1.  Disossa lo stinco eliminando il connettivo ma mantenendo attaccati i due muscoli. Elimina la vena tra i muscoli, poi acidifica per 10 minuti.
    2.  Immergi nella marinatura per 24 ore, poi scola e asciuga.
    3.  Spennella l'interno con la transglutaminasi, ricomponi lo stinco, arrotolalo nella pellicola, condiziona sottovuoto e lascia agire la colla per 12 ore in frigo.
    4.  Cuoci a 66°C per 30 ore, poi abbatti in positivo.
    5.  Apri la busta, dividi carne da liquido e condiziona sottovuoto.
    6.  Sgrassa, chiarisci e riduci il liquido. Fondi lo jus, aggiungi il liquido ridotto, la riduzione di vermouth e le verdure, poi monta col burro e regola di sapore.
    7.  Rigenera lo stinco a 65°C per 30 minuti.

#### Magatello di manzo per carpaccio
*   **Ingredienti:** 1 magatello intero, 5 l acidificazione forte, 5 l marinatura 40:40.
*   **Procedimento:**
    1.  Pulisci e acidifica il magatello per 10 minuti, poi immergilo nella marinatura per 24 ore.
    2.  Scolalo e inseriscilo nella busta da cottura.
    3.  Condiziona sottovuoto e cuocilo a 54°C per 3 ore, poi abbatti in positivo e attendi 24 ore prima di utilizzarlo.
    4.  Togli dalla busta, asciugalo e affettalo finemente.

#### Flat iron steak
*   **Ingredienti:** 1 flat iron steak, 2 l acidificazione forte, 2 l marinatura 25:15, Olio EVO, Pepe nero, Fiocchi di sale.
*   **Procedimento:**
    1.  Acidifica per 10 minuti, poi immergi nella marinatura per 24 ore.
    2.  Scola, trasferisci nella busta e condiziona sottovuoto.
    3.  Cuoci a 51°C per 7 ore, poi abbatti in positivo e attendi 24 ore.
    4.  Togli dalla busta, asciuga, spennella d'olio.
    5.  Falla arrostire velocemente in griglia o BBQ, poi affetta e condisci.

#### Medaglioni di filetto di manzo
*   **Ingredienti:** 1 kg filetto scordonato, 2 l acidificazione forte, 2 l marinatura 25:15, Burro chiarificato CBT, Burro di qualità, Aglio e timo fresco, Pepe nero, Fiocchi di sale.
*   **Procedimento:**
    1.  Pulisci il filetto, acidificalo per 10 minuti, poi marinalo per 12 ore.
    2.  Scolalo e asciugalo. Arrotolalo nella pellicola per ottenere un cilindro, fora la pellicola e condiziona sottovuoto.
    3.  Cuoci a 48°C per 2 ore, poi abbatti in positivo e attendi 24 ore.
    4.  Estrai, asciuga e taglia a medaglioni.
    5.  Rosola velocemente in padella con burro chiarificato, poi scola e aggiungi burro fresco facendolo schiumare con aglio e timo.

#### Pastrami di manzo
*   **Ingredienti:** 2 kg punta di petto, 4 l acidificazione forte, 4 l marinatura 40:40, Olio alle spezie per pastrami CBT.
*   **Procedimento:**
    1.  Pulisci la punta di petto, acidificala per 10 minuti, poi immergila nella marinatura per 72 ore (capovolgendola ogni 24).
    2.  Scolala e falla affumicare a freddo.
    3.  Inseriscila nella busta insieme all'olio e spezie, condiziona sottovuoto.
    4.  Cuoci a 58°C per 72 ore, poi abbatti in positivo.
    5.  Falla riposare in frigo per 24 ore prima di utilizzarla.
    6.  Estrai, asciuga dall'olio e taglia delle fette spesse.

#### Picanha di manzo al rosmarino
*   **Ingredienti:** 1 picanha con copertina di grasso, 2 l acidificazione forte, 2 l marinatura 25:15, Olio al rosmarino CBT, Olio EVO, Fiocchi di sale.
*   **Procedimento:**
    1.  Pulisci la picanha dalla membrana, acidificala per 10 minuti poi marinala per 24 ore.
    2.  Estrai, asciuga e spennellala con l'olio al rosmarino.
    3.  Inseriscila nella busta e condiziona sottovuoto.
    4.  Cuocila a 51°C per 7 ore, poi abbatti in positivo e attendi 24 ore.
    5.  Togli dalla busta, asciuga e tagliala a fette spesse 4 cm.
    6.  Ungi le fette con olio EVO, rosola velocemente dalla parte del grasso, tagliale a fette e condisci.

#### Roast beef di manzo
*   **Ingredienti:** 3 kg controfiletto di manzo, 5 l acidificazione forte, 5 l marinatura 40:40, Olio al rosmarino CBT, Olio all'aglio CBT, Olio alla salvia CBT, Olio EVO.
*   **Procedimento:**
    1.  Acidifica il controfiletto per 10 minuti, poi immergilo nella marinatura per 24 ore.
    2.  Scola, asciuga e lega con lo spago.
    3.  Fai un mix con gli oli aromatici e spennellalo sulla carne.
    4.  Inserisci nella busta e condiziona sottovuoto.
    5.  Cuoci a 52°C per 4 ore, poi abbatti in positivo e attendi 24 ore.
    6.  Togli dalla busta, asciuga e ungi con olio EVO.
    7.  Fai rosolare in forno a 300°C per il tempo necessario a colorare la parte esterna.

#### Tagliata di manzo
*   **Ingredienti:** 3 kg scamone di manzo, 5 l acidificazione forte, 5 l marinatura 25:25.
*   **Procedimento:**
    1.  Pulisci lo scamone e acidificalo per 10 minuti, poi immergilo nella marinatura per 24 ore.
    2.  Scola e inseriscilo nella busta da cottura.
    3.  Condiziona sottovuoto e cuoci a 51°C per 10 ore, poi abbatti in positivo.
    4.  Apri la busta ed elimina i liquidi.
    5.  Se serve, porziona le tagliate, condiziona sottovuoto in buste singole e poi abbatti.
    6.  Per la finitura, andranno rosolate velocemente.

#### Carpaccio di cuore di manzo al carbone di porri
*   **Ingredienti:** 1 cuore di manzo, 2 l acidificazione forte, 2 l marinatura 25:15, 200 g grasso di rognone CBT, Olio al carbone di porri CBT, Olio al pepe nero CBT, Sale in fiocchi.
*   **Procedimento:**
    1.  Pulisci il cuore, taglialo in quattro pezzi. Acidificalo per 10 minuti, poi marinalo per 12 ore.
    2.  Scola e inseriscilo nella busta insieme al grasso di rognone.
    3.  Condiziona sottovuoto e cuocilo a 50°C per 6 ore, poi abbatti in positivo.
    4.  Fallo riposare almeno 24 ore.
    5.  Affettalo sottilmente in obliquo. Disponilo sul piatto e condiscilo con gli oli e il sale.

#### Tartare di cuore di manzo al naturale
*   **Ingredienti:** 1 cuore di manzo, 2 l acidificazione forte, 2 l marinatura 25:15, Olio EVO, Sale, Olio al pepe nero CBT.
*   **Procedimento:**
    1.  Pulisci il cuore, taglialo in quattro pezzi. Acidificalo per 10 minuti, poi marinalo per 12 ore.
    2.  Scola e inseriscilo nella busta.
    3.  Condiziona sottovuoto e cuocilo a 48°C per 6 ore, poi abbatti in positivo.
    4.  Fallo riposare almeno 24 ore.
    5.  Rifila col coltello eliminando le parti non rosse. Taglialo come una tartare, condisci e servi.

#### Lampredotto di manzo in umido
*   **Ingredienti:** 1 lampredotto, 2 l acidificazione leggera, 2 l marinatura 40:40, 1 l essenza vegetale CBT, 100 g brunoise per soffritto CBT, Olio all'aglio CBT, Olio al rosmarino CBT, Olio al pepe nero CBT, Olio EVO, Sale.
*   **Procedimento:**
    1.  Affetta e acidifica il lampredotto per 10 minuti, poi immergilo nella marinatura per 24 ore.
    2.  Scola e inseriscilo nella busta insieme all'essenza vegetale. Abbatti per stabilizzare i liquidi poi condiziona sottovuoto.
    3.  Cuoci a 68°C per 12 ore, poi abbatti in positivo.
    4.  Separa il lampredotto dal liquido. Chiarifica e riduci il liquido di due terzi, poi aggiungi la brunoise, gli oli aromatici e l'olio EVO.
    5.  Riunisci lampredotto e salsa in una casseruola e riscalda.

#### Trippa di manzo nido d'ape al naturale
*   **Ingredienti:** 1 trippa di manzo, 2 l acidificazione leggera, 2 l marinatura 40:40, Acqua.
*   **Procedimento:**
    1.  Taglia la trippa in due, acidificala per 10 minuti.
    2.  Trasferiscila nella marinatura per 12 ore.
    3.  Scola e inseriscila nelle buste tenendola ben stesa. Aggiungi metà del suo peso di acqua, poi condiziona sottovuoto.
    4.  Cuoci a 74°C per 24 ore, poi abbatti in positivo.

#### Trippa mista di manzo alla milanese
*   **Ingredienti:** 1 kg trippa mista, 2 l acidificazione leggera, 2 l marinatura 40:40, 300 g brunoise per soffritto CBT, 100 g salsa di pomodoro CBT, 200 g fagioli bianchi di Spagna CBT, 60 g lardo stagionato CBT, 20 g burro alla salvia e rosmarino CBT, Jus di trippa CBT.
*   **Procedimento:**
    1.  Pulisci e acidifica la trippa per 10 minuti. Trasferiscila nella marinatura per 12 ore.
    2.  Scola e inseriscila nelle buste tenendola ben stesa. Aggiungi metà del suo peso di acqua, poi condiziona sottovuoto.
    3.  Cuoci a 74°C per 24 ore, poi abbatti in positivo.
    4.  Apri la busta, dividi la trippa dal liquido e affettala.
    5.  In una casseruola rosola il lardo tagliato a dadini e la brunoise. Unisci la trippa, la salsa di pomodoro, lo jus e i fagioli.
    6.  Aggiungi il liquido di cottura poco per volta fino alla densità voluta. Profuma col burro aromatizzato.

#### Coda di manzo al pepe
*   **Ingredienti:** 2 code di manzo, 3 l acidificazione leggera, 3 l marinatura 30:30, 300 g grasso di rognone al pepe nero CBT, 100 g jus di manzo CBT, Burro di qualità, Sale.
*   **Procedimento:**
    1.  Taglia la coda a vertebre singole, acidificala per 10 minuti.
    2.  Trasferiscila nella marinatura per 24 ore, poi scolala.
    3.  Inseriscila nella busta con il grasso di rognone.
    4.  Cuoci a 72°C per 48 ore, poi estraila separando i liquidi.
    5.  Disossa la coda ancora calda. Separa dai liquidi la parte grassa e lavora la parte acquosa per ottenere uno jus CBT.
    6.  Unisci lo jus ottenuto allo jus di manzo e montalo con il burro.
    7.  Unisci lo jus montato alla coda amalgamando bene, poi abbatti in positivo.
    8.  Rigenera a 75°C per 20 minuti.

#### Coda di manzo alla vaccinara
*   **Ingredienti:** 1 coda di manzo, 2 l acidificazione leggera, 2 l marinatura 30:30, 80 g lardo stagionato tritato, 300 g brunoise per soffritto CBT, 150 g salsa di pomodoro CBT, 150 g riduzione di vino bianco, 60 g jus di manzo CBT, 20 g cioccolato fondente, 2 foglie di alloro, Olio al pepe nero CBT, Sale.
*   **Procedimento:**
    1.  Taglia la coda, acidificale per 10 minuti poi marinale per 24 ore.
    2.  Scola e asciuga. Metti la coda in una bastardella, unisci tutti gli ingredienti, amalgama bene.
    3.  Trasferisci nella busta e condiziona sottovuoto.
    4.  Cuoci a 72°C per 48 ore.
    5.  Apri la busta, scola i liquidi e falli ridurre della metà. Disossa i pezzi di coda ancora caldi, uniscili alle verdure e al liquido ridotto.
    6.  Amalgama bene e abbatti in positivo.

#### Midollo di manzo gratinato
*   **Ingredienti:** 6 ossa con midollo tagliate a barchetta, 2 l acidificazione leggera, 2 l marinatura 40:40, 150 g panko, Olio all'aglio CBT, Olio al pepe nero CBT, Polvere di cipolle CBT, Polvere di olio al limone CBT.
*   **Procedimento:**
    1.  Acidifica le ossa per 10 minuti, poi immergile nella marinatura per 12 ore.
    2.  Scolale bene e inseriscile nella busta da cottura.
    3.  Condizionale sottovuoto e cuocile a 58°C per 1 ora, poi abbatti in positivo.
    4.  Mescola il panko con gli oli aromatici e le polveri.
    5.  Togli le ossa dalla busta, posizionale sulla teglia, distribuisci il panko aromatizzato sul midollo.
    6.  Falle gratinare in forno a 160°C per pochi minuti.

#### Spuma di midollo di manzo
*   **Ingredienti:** 400 g midollo disossato. *1° preparazione:* 150 g panna, 5 g zucchero, 7 g sale, 20 g acqua. *2° preparazione:* 150 g acqua, 150 g latte, 2 g iota, 5 g olio al pepe CBT, 5 g olio all'aglio CBT, 1 g xantano.
*   **Procedimento:**
    1.  Inserisci il midollo nella busta, condiziona sottovuoto e cuocilo a 58°C per 1 ora, mescolando ogni 15 minuti.
    2.  Filtra il contenuto attraverso un setaccio per ricavare il midollo puro. Abbatti il midollo liquido mescolandolo per emulsionare.
    3.  In un Thermomix metti tutti gli ingredienti della prima preparazione e scaldali a 65°C. Aggiungi il midollo tagliato a pezzi e frulla bene.
    4.  Nel frattempo unisci gli ingredienti della seconda preparazione e scaldala a 80°C per un minuto.
    5.  Uniscilo al composto di midollo frullandolo fino a che non sarà omogeneo.
    6.  Filtra e inserisci la crema in un sifone, caricalo con 2 cartucce e scaldalo a 50°C.

#### Lingua di manzo al naturale
*   **Ingredienti:** 1 lingua di manzo, 2 l acidificazione leggera, 2 l marinatura 40:40.
*   **Procedimento:**
    1.  Lava e spazzola la lingua. Tagliala per squadrarla.
    2.  Acidificala per 10 minuti, poi scola e asciuga.
    3.  Metti a marinare la parte squadrata per 24 ore.
    4.  Scola e inseriscila nella busta da cottura.
    5.  Condiziona sottovuoto e cuoci a 66°C per 24 ore.
    6.  A cottura ultimata apri la busta, separa la lingua dal liquido ed elimina subito la pelle, poi abbattila in positivo.

#### Lingua di manzo salmistrata
*   **Ingredienti:** 1 lingua di manzo, 1 l acidificazione leggera, 900 g acqua, 100 g riduzione vermouth, 80 g sale, 40 g zucchero, 1 g salnitro, 1 spicchio aglio, spezie (pepe nero, pepe bianco, alloro, bacche ginepro, chiodi garofano, macis).
*   **Procedimento:**
    1.  Frulla l'acqua e il vermouth con tutte le spezie, inserisci nella busta con sale, zucchero e salnitro. Abbatti per stabilizzare, condiziona sottovuoto e cuoci a 86°C per 1 ora.
    2.  Trasferisci la busta in vasca a ultrasuoni a 50°C, poi abbatti. Filtra il liquido.
    3.  Acidifica la lingua per 10 minuti, poi inseriscila nella busta con la marinatura. Lasciala marinare in frigo per 5 giorni, massaggiandola.
    4.  Scola la lingua. Inseriscila nella busta da cottura con metà peso di acqua e cuocila a 64°C per 30 ore.
    5.  A cottura ultimata elimina la pelle e abbatti in positivo.

#### Ragù di lingua di manzo
*   **Ingredienti:** 1 kg lingua di manzo, 2 acidificazione leggera, 2 l marinatura 40:40, 150 g grasso di rognone neutro CBT, grassi di rognone aromatizzati (alloro, pepe nero, rosmarino, salvia), 300 g salsa pomodoro CBT, 200 g jus di manzo neutro CBT, 400 g brunoise soffritto CBT, 80 g vino bianco, Burro chiarificato CBT, Burro di qualità, Sale.
*   **Procedimento:**
    1.  Pela la lingua e tagliala a dadini di 1 cm. Acidificala per 10 minuti, poi marinala per 24 ore.
    2.  Scola e asciuga. Inseriscila nella busta insieme al grasso neutro e ai grassi aromatizzati.
    3.  Cuoci a 64°C per 22 ore.
    4.  Scola la carne. Sgrassa, chiarifica e riduci il liquido di cottura come fosse uno jus CBT.
    5.  Fondi lo jus neutro e lo jus di lingua, monta col burro e poi unisci il vino bianco.
    6.  Aggiungi la salsa di pomodoro e regola di sapore.
    7.  Rosola velocemente la lingua nel burro chiarificato poi fai lo stesso con la brunoise.
    8.  Unisci lo jus, la lingua e la brunoise. Amalgama bene e abbatti.

#### Testina di manzo bollita
*   **Ingredienti:** 1 testina di manzo, 3 l acidificazione forte, 1,5 l essenza vegetale CBT, 15 g sale, spezie (pepe nero, ginepro, chiodi garofano, anice stellato, semi coriandolo, alloro).
*   **Procedimento:**
    1.  Fiammeggia e pulisci la testina. Acidificala per 10 minuti.
    2.  Inseriscila nella busta insieme all'essenza, al sale e alle spezie. Abbatti per stabilizzare i liquidi, poi condiziona sottovuoto.
    3.  Cuoci a 74°C per 48 ore.
    4.  Scola la testina ed elimina le spezie. Abbatti in positivo la testina.
    5.  Sgrassa, filtra e chiarifica il brodo di cottura, poi abbattilo.
    6.  Taglia la testina e dividi il brodo nelle porzioni. Inserisci in buste da cottura.
    7.  Per rigenerare scalda le buste a 80°C per 15 minuti.

#### Ganascino di manzo al vino rosso
*   **Ingredienti:** 2 ganascini di manzo, 2 l acidificazione leggera, 2 l marinatura 30:30, 250 g riduzione vino rosso, 8 g umami cipolle CBT, 5 g umami carote CBT, 3 g umami sedano CBT, 3 g umami champignon CBT, Olio al pepe nero CBT, Burro di qualità.
*   **Procedimento:**
    1.  Pulisci e acidifica i ganascini per 10 minuti, poi falli marinare per 24 ore.
    2.  Scola e asciuga. Stempera gli umami nella riduzione di vino rosso e inseriscili nella busta insieme ai ganascini e qualche goccia di olio al pepe.
    3.  Condiziona sottovuoto e cuoci a 68°C per 36 ore.
    4.  Scola la carne. Sgrassa, filtra e riduci il liquido di cottura come fosse uno jus CBT, montalo con il burro freddo.
    5.  Impiatta il ganascino e nappalo con la salsa.

#### Tettina di vacca alla brace
*   **Ingredienti:** 2 kg tettina di vacca giovane, 4 l acidificazione forte, 4 l marinatura 50:20, Sale in fiocchi, Pepe bianco macinato.
*   **Procedimento:**
    1.  Pulisci e sciacqua la tettina, falla acidificare per 10 minuti.
    2.  Falla marinare per 24 ore, poi scola e asciuga.
    3.  Trasferiscila nella busta da cottura e condiziona sottovuoto.
    4.  Cuoci a 62°C per 24 ore, poi abbatti in positivo.
    5.  Estrai la tettina, asciugala, tagliala a dadini e falla arrostire sulle braci.

#### Nervetti di manzo
*   **Ingredienti:** 2 zampe di bovino, 5 l acidificazione forte, 3 l acqua, 60 g sale, spezie (pepe nero, cannella, ginepro, chiodi garofano, anice stellato, coriandolo, alloro), Sale, Pepe.
*   **Procedimento:**
    1.  Fiammeggia e pulisci le zampe. Acidifica per 10 minuti.
    2.  Inseriscile in una grossa busta insieme all'acqua, al sale e alle spezie. Abbatti per stabilizzare i liquidi, poi condiziona sottovuoto.
    3.  Cuoci a 74°C per 48 ore.
    4.  Terminata la cottura, scola il contenuto separando i liquidi.
    5.  Spolpa e disossa le zampe con cura, tenendo solo i tendini, le cartilagini e la pelle che dovrà essere affettata finemente.
    6.  Trasferisci il tutto in una bastardella e amalgama velocemente prima che si raffreddi, regolando di sale e pepe.
    7.  Versa l'impasto in un contenitore quadrato, pressando bene. Abbatti in positivo, poi affetta e servi.

### VITELLO

#### Cotoletta di vitello alla milanese
*   **Ingredienti:** 1 kg carrè di vitello pulito, 4 l acidificazione forte, 4 l marinatura 40:40, 300 g uova intere, 2 g iota, 1 g xantano, 150 g farina, 250 g pangrattato, 300 g burro chiarificato CBT, Sale.
*   **Procedimento:**
    1.  Pulisci il carrè, acidificalo per 10 minuti, poi fallo marinare per 24 ore.
    2.  Scola, asciuga e legalo coprendo anche le ossa.
    3.  Inserisci nella busta e condiziona sottovuoto. Cuoci a 54°C per 3 ore, poi abbatti in positivo. Attendi almeno 24 ore.
    4.  Frulla le uova con lo xantano e la iota.
    5.  Togli la carne dalla busta, slegala, asciugala e taglia le cotolette.
    6.  Infarinale, passale nell'uovo e successivamente nel pangrattato (ripeti uovo e pangrattato).
    7.  Friggi nel burro chiarificato a 190°C un minuto per lato.

#### Pancia di vitello glassata
*   **Ingredienti:** 1,5 kg pancia di vitello, 3 l acidificazione leggera, 2 l marinatura 30:30, Burro chiarificato CBT, Burro di qualità, 10 g umami di cipolle CBT, 100 g jus di vitello CBT, Olio al rosmarino CBT, Olio al pepe nero CBT.
*   **Procedimento:**
    1.  Pulisci la pancia, acidificala per 10 minuti, poi immergila nella marinatura per 24 ore.
    2.  Scola, asciuga e inseriscila nella busta da cottura. Condiziona sottovuoto.
    3.  Cuocila a 64°C per 30 ore.
    4.  A cottura ultimata, apri la busta, separa la carne dal liquido e abbattili separatamente.
    5.  Sgrassa, chiarifica e riduci il liquido di cottura.
    6.  Fondi lo jus di vitello e unisci il fondo di cottura. Montalo con il burro, poi aromatizzalo con l'umami di cipolle e gli oli.
    7.  Taglia la pancia a fette e rosolala in padella con il burro chiarificato. Servi nappata dallo jus.

#### Ossobuco di vitello alla milanese
*   **Ingredienti:** 4 ossibuchi di vitello, 2 l acidificazione leggera, 2 l marinatura 30:30, 200 g essenza vegetale CBT, 60 g salsa di pomodoro CBT, 10 g umami di cipolle, 30 g riduzione di vino bianco, Amido di riso, Burro chiarificato CBT, 30 g burro di qualità, Olio al pepe nero CBT, Sale, Gel di prezzemolo aglio e limone CBT.
*   **Procedimento:**
    1.  Incidi la copertina degli ossibuchi, acidificali per 10 minuti.
    2.  Trasferiscili nella marinatura per 12 ore, poi scolali e asciugali.
    3.  Rosolali velocemente con poco burro chiarificato, poi abbattili in positivo.
    4.  Inserisci nella busta gli ossibuchi, l'essenza vegetale e la riduzione di vino.
    5.  Condiziona sottovuoto e cuoci a 68°C per 12 ore, poi abbatti.
    6.  Scola il liquido, filtralo, chiarificalo e riducilo della metà.
    7.  Unisci la salsa di pomodoro e l'umami di cipolle, poi aggiungi il burro fresco e lega la salsa con poco amido di riso. Regola di sapore.
    8.  Rigenera gli ossibuchi a 70°C per 10 minuti, nappali con la salsa e decora con il gel.

#### Magatello di vitello per tonnato
*   **Ingredienti:** 1 magatello di vitello, 2 l acidificazione forte, 2 l marinatura 40:40, 10 g umami di cipolle CBT, 5 g umami di sedano CBT, 5 g umami di carote CBT.
*   **Procedimento:**
    1.  Pulisci e acidifica il magatello per 10 minuti, poi immergilo nella marinatura per 24 ore.
    2.  Unisci i tre umami amalgamando bene.
    3.  Scola il magatello, asciugalo e spennellalo con il mix dei tre umami.
    4.  Inseriscilo nella busta da cottura e condiziona sottovuoto.
    5.  Cuoci a 56°C per 3 ore, poi abbatti in positivo e attendi 24 ore.
    6.  Toglilo dalla busta, asciugalo e affettalo.

#### Carpaccio di fegato di vitello all'alloro
*   **Ingredienti:** 1 kg fegato di vitello, 2 l acidificazione forte, 2 l marinatura 30:15, 300 g grasso di rognone all'alloro CBT.
*   **Procedimento:**
    1.  Pulisci il fegato, acidificalo per 10 minuti, poi mettilo a marinare per 12 ore.
    2.  Scola, asciuga e inseriscilo nella busta insieme al grasso di rognone tritato.
    3.  Condiziona sottovuoto e cuoci a 63°C per 1 ora.
    4.  A fine cottura abbatti in positivo. Attendi 24 ore.
    5.  Togli il fegato dalla busta, asciugalo e affettalo finemente.

#### Fegato di vitello al naturale
*   **Ingredienti:** 1 kg fegato di vitello, 2 l acidificazione forte, 2 l marinatura 30:15.
*   **Procedimento:**
    1.  Pulisci il fegato, acidificalo per 10 minuti, poi mettilo a marinare per 12 ore.
    2.  Scola, asciuga e inseriscilo nella busta da cottura.
    3.  Condiziona sottovuoto e cuoci a 63°C per 1 ora.
    4.  A fine cottura abbatti in positivo, poi attendi 24 ore.
    5.  Apri la busta, asciuga il fegato e taglialo nelle forme che preferisci.
    6.  Rosolalo velocemente a calore moderato.

#### Patè fegato di vitello allo sherry
*   **Ingredienti:** 1 kg fegato di vitello già pulito, 2 l acidificazione leggera, 100 g riduzione di sherry, 200 g burro di qualità morbido, 20 g umami di cipolle CBT, 100 g jus di manzo neutro CBT, Olio al pepe nero, Sale.
*   **Procedimento:**
    1.  Taglia il fegato a piccoli pezzi, poi acidificalo per 10 minuti.
    2.  Scolalo e inseriscilo nella busta da cottura. Condiziona sottovuoto e cuoci a 63°C per 1 ora, poi abbatti in positivo.
    3.  Trasferisci il fegato nei bicchieri del Pacojet e abbattili in negativo, poi pacossare per 2 volte (o usa un macinacarne).
    4.  Trasferisci il macinato in una bastardella e unisci la riduzione di sherry, lo jus fuso, l'umami di cipolle, qualche goccia di olio al pepe nero e il burro tagliato a dadini. Montalo con la frusta.
    5.  Sgasa il patè per togliere l'aria incorporata.
    6.  Dividilo nelle buste da conservazione per creare una mattonella alta 2 cm. Condiziona sottovuoto, abbattila in positivo e conservala in frigorifero.

#### Animelle di vitello al burro
*   **Ingredienti:** 1 kg animelle di vitello, 2 l acidificazione leggera, 2 l marinatura 40:40, 300 g grasso di rognone neutro, Burro di qualità, Aglio, timo fresco e pepe.
*   **Procedimento:**
    1.  Pulisci le animelle, acidificale per 10 minuti poi immergile nella marinatura per 12 ore.
    2.  Scola, asciuga e inseriscile nella busta insieme al grasso di rognone.
    3.  Condiziona sottovuoto e cuoci a 66°C per 1 ora mescolando ogni 20 minuti, dopodiché abbatti in positivo.
    4.  Apri la busta, togli le animelle dal grasso e asciugale.
    5.  Falle rosolare velocemente in padella schiumandole con il burro aromatizzato con aglio, timo e pepe.

#### Cervella di vitello al naturale
*   **Ingredienti:** 1 kg cervella di vitello, 2 l acidificazione forte, 2 l marinatura 40:40, 250 g olio neutro.
*   **Procedimento:**
    1.  Pulisci le cervella, poi acidificale per 10 minuti (ripeti se necessario).
    2.  Fai marinare per 12 ore.
    3.  Scola, asciuga. Inserisci nella busta insieme all'olio, poi abbatti per stabilizzare i liquidi.
    4.  Condiziona sottovuoto applicando il cuscinetto stretto.
    5.  Cuoci a 62°C per 40 minuti, poi abbatti in positivo.

#### Lobi di rognone di vitello trifolato
*   **Ingredienti:** 1 rognone di vitello, 2 l acidificazione forte, 2 l marinatura 40:40, 200 g grasso di rognone neutro CBT, 1 spicchio di aglio, 3 foglie di alloro, 1 g pepe.
*   **Procedimento:**
    1.  Pulisci il rognone, taglialo seguendo i contorni dei lobi.
    2.  Acidifica per 10 minuti, poi immergilo nella marinatura per 12 ore.
    3.  Macina il grasso di rognone con l'aglio, l'alloro ed il pepe.
    4.  Scola il rognone, inseriscilo nella busta insieme al grasso agli aromi.
    5.  Condiziona sottovuoto e cuoci a 56°C per 1 ora e mezza mescolando ogni 20 minuti, poi abbatti in positivo.
    6.  Rigenera a 50°C per 20 minuti.

### MAIALE

#### Pancia di maiale glassata all'orientale
*   **Ingredienti:** 1 kg pancia di maiale con cotenna, 2 l acidificazione forte, 200 g salsa di soia, 50 g riduzione di sherry, 15 g olio di sesamo, 80 g zucchero, 7 g sale, 0,1 g peperoncino in polvere, 60 g zenzero fresco, 50 g stelo di cipollotto, 1 g semi di coriandolo, 0,2 g aglio in polvere, 2 g pepe nero macinato, 2 bacche di anice stellato, 1 stecca di lemongrass.
*   **Procedimento:**
    1.  Taglia la pancia in parallelepipedi (3x5x15 cm), acidificala per 10 minuti, poi scola e asciuga.
    2.  Frulla tutti gli altri ingredienti per 2 minuti.
    3.  Inserisci la pancia nella busta insieme al composto frullato. Abbatti per stabilizzare i liquidi, poi condiziona sottovuoto.
    4.  Cuoci a 72°C per 24 ore, poi abbatti in positivo e attendi 24 ore.
    5.  Apri la busta e separa la carne dal liquido. Filtra il liquido.
    6.  Metti la pancia in una padella, aggiungi metà del liquido e metti il coperchio. Fai scaldare a fuoco dolce finché il liquido sarà sciropposo.
    7.  Gira la pancia sottosopra, aggiungi il restante liquido e fallo ridurre.

#### Pancetta di maiale al mirto
*   **Ingredienti:** 1 kg pancetta di maiale con cotenna, 2 l acidificazione forte, 2 l marinatura 50:50, 8 g foglie di mirto fresche, 10 g bacche di mirto secche, 200 g olio neutro, Olio EVO.
*   **Procedimento:**
    1.  Frulla le foglie e le bacche di mirto nell'olio di semi.
    2.  Acidifica la pancetta per 10 minuti, poi trasferiscila nella marinatura per 24 ore.
    3.  Scola, asciuga. Inserisci nella busta la pancetta e l'olio con gli aromi.
    4.  Condiziona sottovuoto e massaggia la busta.
    5.  Cuoci a 72°C per 24 ore, massaggiando la busta ogni 4/5 ore.
    6.  A cottura ultimata, apri la busta e separa la carne dal liquido. Pulisci la pancetta da residui e abbattila in positivo.
    7.  Incidi dei rombi sulla cotenna. Spennellala di olio e falla rosolare in forno ventilato a 240°C.

#### Pancetta di maiale al naturale
*   **Ingredienti:** 1 kg pancetta di maiale senza cotenna, 2 l acidificazione forte, 2 l marinatura 50:50.
*   **Procedimento:**
    1.  Acidifica la pancetta per 10 minuti, poi trasferiscila nella marinatura per 24 ore.
    2.  Scola, asciuga. Inserisci nella busta e condiziona sottovuoto.
    3.  Cuoci a 68°C per 15 ore.
    4.  A cottura ultimata apri la busta e separa la carne dal liquido.
    5.  Abbattila in positivo.
    6.  Tagliala a fette spesse e falla rosolare in padella a fuoco dolce.

#### Lonza di maiale agli agrumi
*   **Ingredienti:** 2 kg lonza di maiale, 3 l acidificazione forte, 3 l marinatura 50:50, 100 purea di limoni per marinare CBT, 100 purea di arance per marinare CBT, 300 g olio neutro, Olio EVO.
*   **Procedimento:**
    1.  Pulisci la lonza e falla acidificare per 10 minuti, poi scola e asciuga.
    2.  Mescola le due puree di agrumi, spalmale sulla superficie della lonza, condizionala sottovuoto e falla marinare per 24 ore.
    3.  Scola, togli la marinatura in eccedenza. Legala con lo spago.
    4.  Inseriscila nella busta con l'olio e condiziona sottovuoto applicando il cuscinetto stretto.
    5.  Cuoci a 58°C per 5 ore, poi abbatti in positivo.
    6.  Togli la lonza dalla busta, scolala dall'olio e asciugala. Spennellala con poco olio EVO e falla dorare in forno a 240°C.

#### Lonza di maiale al naturale
*   **Ingredienti:** 2 kg lonza di maiale, 3 l acidificazione forte, 3 l marinatura 50:50, 300 g olio neutro, Olio EVO.
*   **Procedimento:**
    1.  Pulisci la lonza e falla acidificare per 10 minuti, poi immergila nella marinatura per 24 ore.
    2.  Scola, asciuga e legala con lo spago.
    3.  Inseriscila nella busta in modo che sia parallela al lato stretto. Aggiungi l'olio e condiziona sottovuoto applicando il cuscinetto stretto.
    4.  Cuoci a 58°C per 5 ore, poi abbatti in positivo.
    5.  Togli la lonza dalla busta, scolala dall'olio e asciugala. Spennellala con poco olio EVO e falla dorare in forno a 240°C.

#### Stinchi di maiale arrosto
*   **Ingredienti:** 4 stinchi di maiale con la cotenna, 3 l acidificazione forte, 3 l marinatura 50:50.
*   **Procedimento:**
    1.  Pulisci gli stinchi, acidificali per 10 minuti, poi immergili nella marinatura per 24 ore.
    2.  Scola, asciuga e inserisci nelle buste da cottura.
    3.  Condiziona sottovuoto e cuoci a 72°C per 20 ore.
    4.  A cottura ultimata, apri la busta, dividi gli stinchi dal liquido e abbattili in positivo.
    5.  Al momento dell'uso toglili dalla busta, asciugali e arrostiscili in forno a 240°C fino a che la cotenna sarà croccante.

#### Stinco di maiale alla birra
*   **Ingredienti:** 4 stinchi di maiale, 3 l acidificazione leggera, 3 l marinatura 50:50, 300 g riduzione di birra, 10 g aghi di rosmarino, 2 g pepe nero in grani, 2 g bacche di ginepro, 2 foglie di alloro, Olio EVO, Burro di qualità.
*   **Procedimento:**
    1.  Pulisci e acidifica gli stinchi per 10 minuti, poi immergili nella marinatura per 24 ore.
    2.  Frulla le erbe aromatiche e le spezie con la riduzione di birra.
    3.  Scola gli stinchi, poi inseriscili nella busta insieme alla birra e agli aromi.
    4.  Abbatti per stabilizzare i liquidi, poi condiziona sottovuoto cercando di creare un cuscinetto largo.
    5.  Lasciali marinare in frigorifero per 12 ore, poi cuocili a 68°C per 14 ore.
    6.  A cottura terminata, scola gli stinchi dal liquido e abbattili in positivo.
    7.  Filtra, sgrassa, chiarifica e riduci il liquido di cottura e montalo con il burro come per lo jus CBT.
    8.  Spennella di olio gli stinchi e rosolali in forno a 240°C. Servi nappati dallo jus alla birra.

#### Zampone
*   **Ingredienti:** 1 zampone da 1 kg, 500 g acqua fredda per ammollo, 500 g acqua fredda per la cottura, 4 g sale.
*   **Procedimento:**
    1.  Con uno stuzzicadenti buca lo zampone in diversi punti.
    2.  Inseriscilo nella busta insieme all'acqua per l'ammollo, condizionalo sottovuoto e lascialo idratare in frigorifero per 24 ore.
    3.  Successivamente togli lo zampone dall'ammollo e raschialo per eliminare le tracce di peli.
    4.  Trasferiscilo nella busta da cottura insieme all'acqua e al sale e condiziona sottovuoto.
    5.  Cuoci a 74°C per 24 ore, poi abbatti in positivo.
    6.  Apri la busta ed elimina il liquido e il grasso rilasciato. Mettilo sottovuoto in una nuova busta.
    7.  Al momento dell'uso andrà rigenerato a 80°C per 25 minuti.

#### Cotenne morbide di pancetta affumicata stagionata
*   **Ingredienti:** 1 kg cotenne di pancetta affumicata stagionata, 1 l acqua fredda.
*   **Procedimento:**
    1.  Pulisci le cotenne e inseriscile nella busta da cottura insieme all'acqua.
    2.  Condizionale sottovuoto e cuocile a 86°C per 15 ore.
    3.  A cottura ultimata, apri la busta, dividi le cotenne dal liquido di cottura e abbattili separatamente.
    4.  Condiziona sottovuoto le cotenne e conservale in frigorifero.
    5.  Separa i liquidi dalla parte grassa e chiarificali per farli diventare un'essenza.

#### Pancetta affumicata stagionata
*   **Ingredienti:** 1 kg pancetta affumicata stagionata, con cotenna.
*   **Procedimento:**
    1.  Inserisci la pancetta nella busta da cottura.
    2.  Condiziona sottovuoto e cuoci a 68°C per 12 ore, poi abbatti in positivo.
    3.  Potrai utilizzare la pancetta come un salume, oppure tagliata nella forma che preferisci per altre preparazioni.

#### Guanciale stagionato
*   **Ingredienti:** 1 guanciale di maiale stagionato.
*   **Procedimento:**
    1.  Spazzola il guanciale, se serve fiammeggia e raschia la cotenna. Lava e spazzola sotto l'acqua fredda per eliminare il pepe.
    2.  Asciugalo e rifilalo togliendo uno strato di mezzo centimetro abbondante dalla superficie, poi squadralo.
    3.  Tieni da parte cotenna e rifilature per l'essenza CBT.
    4.  Condiziona sottovuoto il guanciale squadrato e cuocilo a 68°C per 24 ore, dopodiché abbattilo in positivo.

#### Lardo stagionato
*   **Ingredienti:** 1 pezzo di lardo stagionato.
*   **Procedimento:**
    1.  Spazzola il lardo, fiammeggia e raschia la cotenna. Elimina sale, erbe e spezie.
    2.  Sciacqualo sotto l'acqua corrente, poi inseriscilo nella busta da cottura.
    3.  Condiziona sottovuoto e cuocilo a 68°C per 12 ore.
    4.  A cottura ultimata toglilo dalla busta, scola i liquidi e mettilo ad abbattere in positivo con sopra un peso sufficiente ad appiattirlo.

#### Pancetta arrotolata stagionata
*   **Ingredienti:** 1 pancetta arrotolata stagionata da 2 kg.
*   **Procedimento:**
    1.  Taglia le corde esterne e l'involucro. Spazzola eventuali tracce di muffa e sciacquala.
    2.  Inseriscila nella busta da cottura.
    3.  Condiziona sottovuoto e cuocila a 68°C per 12 ore.
    4.  A cottura ultimata toglila dalla busta, scola i liquidi e arrotolala ben stretta nella pellicola per mantenerla tale.
    5.  Abbattila in positivo.

#### Costine di maiale per cassoeula
*   **Ingredienti:** 2 kg costine di maiale alte 6 cm, 3 l acidificazione leggera, 3 l marinatura 30:30, 500 g essenza di verze CBT.
*   **Procedimento:**
    1.  Taglia le costine ad osso singolo e acidificale per 10 minuti.
    2.  Falle marinare per 24 ore, poi scolale e inseriscile nella busta da cottura insieme all'essenza di verze praticando 2 sgasature.
    3.  Cuoci a 68°C per 12 ore, poi scola la carne dal liquido e abbattila in positivo.
    4.  Abbatti il liquido di cottura, poi sgrassalo e tienilo da parte.

#### Costine di maiale per grigliata all'italiana
*   **Ingredienti:** 4 kg costine intere, 3 l acidificazione forte, 3 l marinatura 50:50, Olio al rosmarino CBT, Olio al pepe nero CBT, Olio all'origano CBT, Olio all'aglio CBT.
*   **Procedimento:**
    1.  Acidifica le costine per 10 minuti, poi immergile nella marinatura per 24 ore.
    2.  Miscela gli oli aromatici. Scola le costine, asciugale e spennellale con il mix.
    3.  Inseriscile nella busta, condiziona sottovuoto e cuoci a 64°C per 12 ore.
    4.  Terminata la cottura, apri la busta, separa la carne dal liquido e abbattila in positivo.
    5.  Al momento dell'utilizzo, grigliale da fredde.

#### Costine di maiale laccate
*   **Ingredienti:** 4 baffe di costine da 6/7 coste, 3 l acidificazione forte, 3 l marinatura 50:50, 100 g grasso di pancetta affumicata stagionata CBT, 1 g senape in polvere, 2 g paprika affumicata, 1 g aglio in polvere, 1 g origano, 2 g semi di finocchio, Pepe nero macinato. *Per la glassa:* 10 g umami di pomodori CBT, 10 g umami di cipolle CBT, 5 g olio al peperoncino CBT, 10 g riduzione di aceto di vino bianco.
*   **Procedimento:**
    1.  Acidifica le costine per 10 minuti, poi immergile nella marinatura per 24 ore.
    2.  Frulla tutte le spezie insieme al grasso di pancetta.
    3.  A marinatura ultimata scola, asciuga le costine e spennellale con il composto di grasso e spezie.
    4.  Inseriscile nella busta da cottura, condiziona sottovuoto e cuoci a 68°C per 12 ore.
    5.  Terminata la cottura, apri la busta, separa la carne dal liquido e abbattila in positivo.
    6.  Amalgama gli umami, l'olio e la riduzione di aceto per ottenere una glassa.
    7.  Spennella le costine con la glassa, poi falle rosolare in forno o nel BBQ fino a caramellizzazione (ripeti due volte).

#### Coppa di maiale per bombette o involtini
*   **Ingredienti:** 1 coppa di maiale intera, 2 l acidificazione forte, 1 l marinatura 50:30.
*   **Procedimento:**
    1.  Acidifica la coppa per 10 minuti, poi scolala e immergila nella marinatura per 36 ore.
    2.  Scola la carne e condizionala sottovuoto.
    3.  Cuocila a 58°C per 12 ore, abbatti in positivo, poi attendi 24 ore prima di utilizzarla.
    4.  Al momento dell'utilizzo sfilala dalla busta e dividila in due pezzi uguali praticando un taglio obliquo.
    5.  Per ottenere bombette o involtini la misura consigliata della lama dell'affettatrice è di 2 mm.

#### Quasi un pulled pork
*   **Ingredienti:** 1 coppa di maiale da 1,5 kg, 3 l acidificazione forte, 3 l marinatura 50:50, 100 g grasso di pancetta affumicata stagionata CBT, 10 g pepe nero in grani, 10 g chipotle, 2 g aglio in polvere.
*   **Procedimento:**
    1.  Acidifica la coppa per 10 minuti, poi scolala e inseriscila nella marinatura per 48 ore.
    2.  Scola la carne e falla affumicare a freddo per 1 ora, poi abbattila in positivo.
    3.  Frulla il grasso di pancetta con pepe, chipotle e aglio poi usalo per spennellare la superficie della carne.
    4.  Inserisci la coppa nella busta da cottura e condiziona sottovuoto. Cuoci a 64°C per 24 ore.
    5.  A cottura ultimata, apri la busta, scola la carne dal liquido e sfilacciala con le mani.
    6.  Riduci della metà il fondo di cottura in una casseruola.
    7.  Aggiungi i liquidi ridotti alla carne sfilacciata e mescola. Abbatti in positivo e condiziona sottovuoto.
    8.  Rigenera a 60° per 15 minuti.

#### Coppa di maiale iberico al naturale dorata
*   **Ingredienti:** 1 coppa di maiale iberico, 2 l acidificazione forte, 2 l marinatura 40:40.
*   **Procedimento:**
    1.  Pulisci e acidifica la coppa per 10 minuti, poi scolala e mettila a marinare per 24 ore.
    2.  Scola la carne. Avvolgila ben stretta in un rotolo di pellicola ottenendo un cilindro omogeneo, poi fora il rotolo in diversi punti.
    3.  Inserisci nella busta da cottura, condiziona sottovuoto e cuoci a 58°C per 12 ore, poi abbatti in positivo.
    4.  Puoi utilizzare la coppa sia intera che tagliata a medaglioni, rosolandola in forno, padella o piastra.

#### Secreto di maiale iberico al naturale
*   **Ingredienti:** 3 secreti di maiale iberico interi, 3 l acidificazione forte, 3 l marinatura 30:20, 15 g transglutaminasi sciolti in 75 g acqua fredda.
*   **Procedimento:**
    1.  Fai acidificare i secreti per 10 minuti, poi scola e asciuga.
    2.  Spennella la soluzione di transglutaminasi sul lato superiore del primo secreto. Posizionaci sopra il secondo secreto. Spennella anche la superficie del secondo e coprilo con l'ultimo.
    3.  Avvolgili con la pellicola formando un cilindro, poi inseriscili nella busta e condiziona sottovuoto. Metti in frigo per 12 ore.
    4.  Successivamente togli il secreto dalla busta e pellicola e fallo marinare per 24 ore.
    5.  Scola il secreto, inseriscilo nella busta da cottura e condizionalo sottovuoto.
    6.  Cuocilo a 55°C per 12 ore, poi abbatti in positivo.
    7.  Togli il secreto dalla busta, taglialo a fette spesse e fallo rosolare nel modo che preferisci.

#### Cotechini
*   **Ingredienti:** 1 cotechino da 500 g, 250 g acqua fredda, 2 g sale.
*   **Procedimento:**
    1.  Con uno stuzzicadenti buca il cotechino in diversi punti.
    2.  Inseriscilo nella busta da cottura insieme all'acqua e al sale e condizionalo sottovuoto.
    3.  Cuoci a 72°C per 18 ore, poi abbatti in positivo.
    4.  Apri la busta ed elimina il liquido e il grasso rilasciato in cottura, poi rimettilo sottovuoto in una nuova busta e conservalo in frigorifero.
    5.  Al momento dell'uso andrà rigenerato a 80°C per 25 minuti.

#### Cotenne di maiale
*   **Ingredienti:** 1 kg cotenne di maiale pulite, 2 l acidificazione leggera, 500 g acqua fredda, 5 g sale.
*   **Procedimento:**
    1.  Taglia a grossi pezzi le cotenne e acidificale per 10 minuti.
    2.  Scolale e inseriscile nella busta da cottura insieme all'acqua e sale.
    3.  Condiziona sottovuoto e cuoci a 74°C per 12 ore.
    4.  A cottura ultimata, apri la busta e separa le cotenne dal liquido di cottura.
    5.  Abbatti le cotenne in positivo, poi tagliale nella misura che preferisci.
    6.  Condizionale sottovuoto e conservale in frigorifero.
    7.  La rigenerazione avverrà in busta a 80°C per 20 minuti oppure direttamente nella ricetta in cui andrai ad inserire le cotenne.

#### Filetto di maiale al limone, aglio e rosmarino
*   **Ingredienti:** 1 filetto di maiale, 1 l acidificazione forte, 1 l marinatura 40:40, Olio al rosmarino CBT, Olio al limone CBT, Olio al pepe nero CBT, Burro chiarificato CBT, Burro di qualità, Rosmarino, Aglio in camicia, Sale in fiocchi.
*   **Procedimento:**
    1.  Pulisci il filetto e fallo acidificare per 10 minuti, poi immergilo nella marinatura per 24 ore.
    2.  Prepara un mix degli oli aromatici. Scola il filetto, asciugalo e spennellalo con gli oli.
    3.  Avvolgilo ben stretto nella pellicola per ottenere un cilindro omogeneo. Fora la pellicola in diversi punti.
    4.  Inseriscilo nella busta da cottura, condizionalo sottovuoto e cuocilo a 58°C per 1 ora e mezza, poi abbatti in positivo.
    5.  Togli il filetto da busta e pellicola, asciugalo. Taglialo a medaglioni e falli rosolare velocemente con il burro chiarificato.
    6.  Elimina il burro chiarificato e aggiungi poco burro, l'aglio in camicia e il rosmarino, schiumando velocemente con un cucchiaio.

#### Prosciutto cotto di maiale "fatto in casa"
*   **Ingredienti:** 1 pezzo di coscia di maiale da 3 kg con la cotenna, 5 l acidificazione forte, 600 g acqua, 80 g sale, 70 g zucchero, 30 g riduzione di vermouth bianco, 0,5 g nitrito di sodio, spezie (pepe bianco, pepe nero, bacche ginepro, chiodi garofano, noce moscata, cannella).
*   **Procedimento:**
    1.  Tosta le spezie, pestale, inseriscile nella busta con 200 g di acqua e cuoci a 86°C per 2 ore (o ultrasuoni a 50°C).
    2.  Scalda i restanti 400 g di acqua e aggiungi sale e zucchero, poi abbatti in positivo.
    3.  Filtra l'infusione delle spezie e aggiungila alla miscela di acqua e zucchero e al vermouth mescolando bene. Assaggia la salamoia.
    4.  Acidifica la coscia per 10 minuti poi scolala.
    5.  Con l'apposita siringa inietta con cura la marinatura in tutti i punti e successivamente inserisci nella busta da conservazione la coscia con tutta la marinatura restante.
    6.  Condiziona sottovuoto applicando un cuscinetto stretto, poi fai marinare in frigorifero per 5 giorni, capovolgendo la busta e massaggiando la carne una volta al giorno.
    7.  Trascorso questo tempo, estrai la carne dalla busta e legala.
    8.  Inseriscila nella busta da cottura e cuoci a 68°C per 15 ore.
    9.  A cottura terminata, apri la busta, separa il prosciutto dal liquido di cottura e abbattilo in positivo.
    10. Una volta freddo, rimettilo sottovuoto e attendi 48 ore prima di utilizzarlo.

#### Pluma di maiale iberico
*   **Ingredienti:** 1 pluma di maiale iberico, 2 l acidificazione forte, 2 l marinatura 30:30, Pepe nero macinato grosso, Sale in fiocchi.
*   **Procedimento:**
    1.  Acidifica la pluma per 10 minuti, poi falla marinare per 12 ore.
    2.  Scola, asciuga e legala con lo spago.
    3.  Inseriscila nella busta da cottura e cuocila a 56°C per 2 ore, poi abbattila in positivo.
    4.  Estraila dalla busta, elimina lo spago e taglia dei medaglioni.
    5.  Falli rosolare in padella con poco olio e servili con qualche fiocco di sale e pepe macinato.

#### Salamelle di maiale
*   **Ingredienti:** 1 kg salamelle di maiale fresche, 2 l acidificazione forte, 500 g acqua fredda, 3 g sale.
*   **Procedimento:**
    1.  Buca le salamelle, poi acidificale per 10 minuti.
    2.  Inseriscile nella busta da cottura insieme all'acqua e al sale, poi condizionale sottovuoto.
    3.  Cuocile a 62°C per 2 ore, poi abbatti in positivo.
    4.  Estraile dalla busta e falle rosolare per pochi minuti utilizzando il metodo che più preferisci.

#### Patè di spalla di maiale all'alloro
*   **Ingredienti:** 2 kg spalla di maiale con cotenna, 3 l acidificazione forte, 3 l marinatura 30:30, 100 g burro all'alloro CBT, Olio al pepe nero CBT, 500 g burro di qualità morbido, Sale.
*   **Procedimento:**
    1.  Taglia la spalla a pezzi da 5 cm e acidificali per 10 minuti.
    2.  Fai marinare per 24 ore, poi scola e inserisci nella busta da cottura.
    3.  Condiziona sottovuoto e cuoci a 74°C per 12 ore.
    4.  A cottura ultimata apri la busta e scola la carne dal liquido di cottura.
    5.  Distribuisci la carne nei bicchieri del Pacojet e abbatti in negativo.
    6.  Nel frattempo sgrassa, chiarifica e riduci della metà il liquido di cottura.
    7.  Fai pacossare la carne di maiale per 3 volte, dopodiché trasferisci in una planetaria il composto ottenuto.
    8.  Fallo montare con la foglia, aggiungendo il burro aromatico e il burro fresco, qualche goccia di olio al pepe e regolando di sale.
    9.  Una volta che il paté sarà pronto, fallo sgasare e rimettilo sottovuoto in buste da conservazione per mantenerlo in positivo o in negativo.

#### Coppa di maialino arrosto
*   **Ingredienti:** 1 coppa di maialino con la cotenna, 2 l acidificazione leggera, 2 l marinatura 50:30.
*   **Procedimento:**
    1.  Acidifica la coppa per 10 minuti, poi immergila nella marinatura per 24 ore.
    2.  Scola, trasferisci nella busta da cottura.
    3.  Condiziona sottovuoto e cuoci a 68°C per 12 ore, poi apri la busta e separa la coppa dal liquido.
    4.  Abbatti la coppa in positivo, poi condizionala sottovuoto e conservala in frigorifero.
    5.  Togli la coppa dalla busta, asciugala e incidi a rombi la cotenna.
    6.  Spennellala con l'olio e mettila in forno a 240°C fino a completa doratura.

#### Pancia di maialino soffiata
*   **Ingredienti:** 1 kg pancia di maialino con cotenna, 3 l acidificazione forte, 3 l marinatura 40:40, 2 l olio per friggere.
*   **Procedimento:**
    1.  Acidifica la pancia per 10 minuti, poi immergila nella marinatura per 24 ore.
    2.  Scola, inseriscila nella busta da cottura e condiziona sottovuoto.
    3.  Cuoci a 68°C per 12 ore e finito questo tempo apri la busta e separa la pancia dal liquido di cottura, poi abbatti la carne in positivo.
    4.  Una volta fredda, con una lama incidi dei rombi sulla cotenna, poi tagliala a cubi di 3 cm per lato.
    5.  Friggi i cubi di pancia a 140°C per 15/18 minuti, poi abbattile in negativo.
    6.  Al momento dell'uso friggi le porzioni di cubi di pancia senza scongelarle direttamente a 180°C finché la parte esterna non sarà soffiata e croccante.

#### Coscia di maialino arrosto
*   **Ingredienti:** 1 coscia di maialino con la cotenna da 2,5 kg, 4 l acidificazione forte, 4 l marinatura 40:40, 200 g lardo stagionato CBT, Pepe bianco, pepe nero, aglio, rosmarino, salvia, alloro, Olio EVO.
*   **Procedimento:**
    1.  Disossa la coscia aprendola il meno possibile. Acidificala per 10 minuti e immergila nella marinatura per 24 ore.
    2.  Scola e asciugala. Frulla il lardo con le erbe aromatiche ed il pepe.
    3.  Spalma il battuto di lardo nella zona dove alloggiavano le ossa.
    4.  Rimetti in forma la coscia e legala con lo spago.
    5.  Inseriscila nella busta da cottura e condiziona sottovuoto.
    6.  Cuoci a 68°C per 18 ore.
    7.  A cottura terminata, scola la carne dai liquidi di cottura e abbattila in negativo.
    8.  Una volta fredda, condizionala sottovuoto e attendi 24 ore prima di utilizzarla.
    9.  Estrai la coscia dalla busta, asciugala e incidi la cotenna a rombi.
    10. Spennellala di olio e falla rosolare in forno ventilato a 240°C fino a completa doratura.

#### Coppa di testa di maialino
*   **Ingredienti:** 8 stinchi e zampe di maialino, 2 teste di maialino tagliate a metà, 5 l acidificazione forte, 5 l marinatura 50:50, 2,5 g salnitro, 50 g fili scorze di arance e cedro leggermente sciroppate CBT, 30 g pistacchi tritati grossolanamente, 30 g pinoli tritati grossolanamente, Cannella regina in polvere, Pepe nero macinato grosso, Aglio in polvere, Sale.
*   **Procedimento:**
    1.  Pulisci, fiammeggia e raschia stinchi, zampe e teste, poi lavali sotto acqua corrente.
    2.  Stempera il salnitro con la marinatura.
    3.  Acidifica gli stinchi, le zampe e le teste per 10 minuti, poi immergili nella marinatura per 24 ore.
    4.  Trasferiscili nella busta da cottura e aggiungi metà peso in acqua. Abbatti per stabilizzare i liquidi, poi condiziona sottovuoto.
    5.  Cuoci a 72°C per 24 ore.
    6.  A cottura ultimata apri la busta e separa la carne dal liquido di cottura.
    7.  Disossa perfettamente tutte le parti, poi sfilaccia la carne e la cotenna (operazione da fare velocemente mentre le carni sono calde).
    8.  Nel frattempo sgrassa, chiarifica e riduci il liquido di cottura a 102°C.
    9.  Riunisci polpe e cotenne ancora calde in una bastardella, unisci lo jus dei succhi di cottura e successivamente aggiungi agrumi, pistacchi, pinoli, le spezie con dosi a piacere e amalgama bene il tutto regolando di sale affinché risulti ben saporito.
    10. Trasferisci il composto in un contenitore rigido che una volta pressato possa formare una mattonella alta almeno 5 cm.
    11. Abbatti in positivo e attendi 24 ore prima di utilizzarlo.
    12. Togli la mattonella di testina dal contenitore e condizionala sottovuoto fino al momento dell'utilizzo.

### AGNELLO

#### Spalla di agnello arrotolata in porchetta
*   **Ingredienti:** 1 spalla di agnello disossata, 2 l acidificazione leggera, 2 l marinatura 30:30, 200 g lardo stagionato CBT, Salvia, rosmarino, alloro, aglio, pepe, Jus di agnello CBT, Burro di qualità, Olio EVO.
*   **Procedimento:**
    1.  Taglia e pareggia la carne per uniformare le altezze. Acidifica la spalla per 10 minuti, poi immergila nella marinatura per 24 ore.
    2.  Scola e asciuga. Prepara un pesto di lardo con gli aromi e spalmalo nella parte interna della carne.
    3.  Arrotola la carne per ottenere un rotolo omogeneo, poi legala con lo spago da cucina.
    4.  Inseriscila nella busta da cottura e condizionala sottovuoto.
    5.  Cuocila a 62°C per 24 ore.
    6.  A fine cottura apri la busta e scola il liquido dalla carne. Il liquido andrà trattato come uno jus CBT e successivamente aggiunto allo jus di agnello CBT, poi fuso e montato tutto con il burro.
    7.  Abbatti in positivo la carne, poi condizionala sottovuoto e attendi 24 ore prima di utilizzarla.
    8.  Quando la utilizzerai, toglila dalla busta, asciugala, spennellala di olio EVO e rosolala in forno a 220°C. Servila a fette nappata con lo jus di agnello.

#### Carré di agnello al naturale
*   **Ingredienti:** 1 carré di agnello scalzato, 2 l acidificazione forte, 2 l marinatura 30:15, 100 g grasso di agnello CBT, Sale, Pepe, Burro chiarificato CBT.
*   **Procedimento:**
    1.  Acidifica il carré per 10 minuti, poi immergilo nella marinatura per 24 ore.
    2.  Scola, asciuga e copri le ossa con la pellicola.
    3.  Inseriscilo nella busta da cottura insieme al grasso di agnello e condizionalo sottovuoto utilizzando il soft air per evitare che le ossa forino la busta.
    4.  Cuoci a 54°C per 3 ore, poi abbatti in positivo e attendi 24 ore prima di utilizzarle.
    5.  Al momento dell'utilizzo, elimina busta e pellicola e asciugalo.
    6.  Fallo rosolare in padella con burro chiarificato regolando di sapore con sale e pepe, dopodiché affetta le costolette e servile.

#### Controfiletto di agnello al timo
*   **Ingredienti:** 1 controfiletto di agnello, 1 l acidificazione forte, 1 l marinatura 30:15, 100 g grasso di agnello CBT, Olio al timo CBT, Burro, Rametti di timo fresco, Aglio.
*   **Procedimento:**
    1.  Pulisci e acidifica per 10 minuti il controfiletto. Immergilo nella marinatura per 24 ore, poi scola e asciuga.
    2.  Trasferiscilo nella busta da cottura affinché rimanga ben steso.
    3.  Aggiungi nella busta il grasso di agnello e qualche goccia di olio al timo.
    4.  Condizionalo sottovuoto praticando un cuscinetto stretto.
    5.  Cuoci a 51°C per 3 ore, poi abbatti in positivo e attendi 24 ore prima di utilizzarlo.
    6.  Togli l'agnello dalla busta e asciugalo.
    7.  Fallo rosolare velocemente in padella con burro, timo e aglio, poi affetta e servi.

#### Costine di agnello al naturale
*   **Ingredienti:** 4 baffe di costine di agnello, 2 l acidificazione leggera, 2 l marinatura 30:30.
*   **Procedimento:**
    1.  Acidifica le costine per 10 minuti, poi falle marinare per 24 ore.
    2.  Scola e inseriscile nella busta da cottura.
    3.  Condizionale sottovuoto e cuocile a 68°C per 15 ore, poi apri la busta e separa la carne dai liquidi di cottura.
    4.  Abbatti le costine in positivo, mentre i liquidi andran no trattati per ottenere uno jus.
    5.  Condiziona le costine sottovuoto e conservale in positivo.
    6.  Per utilizzarle potrai rosolarle come meglio preferisci, partendo sempre dalle costine fredde.

#### Ragù bianco di agnello
*   **Ingredienti:** 5 kg costine e pance di agnello, 5 l acidificazione forte, 5 l marinatura 30:15, 1 kg carote a bastoncino CBT, 1 kg sedano rapa a bastoncino CBT, 1 kg cipolle a petali CBT, 300 g jus di agnello CBT, Olio al pepe nero CBT, Olio al rosmarino CBT, Burro di qualità, Burro chiarificato CBT, 20 g polvere di funghi porcini secchi CBT, 100 g riduzione di vino bianco.
*   **Procedimento:**
    1.  Disossa le costine e pulisci le pance di agnello da tutte le cartilagini. Con le ossa e le cartilagini fai un'essenza CBT poi filtrala e abbattila.
    2.  Taglia le carni a pezzi di 1 cm, poi acidificali per 10 minuti. Immergili nella marinatura per 12 ore, poi scolali.
    3.  Inserisci la carne nelle buste da cottura. Condiziona sottovuoto e cuoci a 64°C per 12 ore.
    4.  A cottura terminata, apri la busta e scola il contenuto, dividendo la carne dal liquido di cottura. Abbatti la carne in positivo.
    5.  Prendi il liquido di cottura e filtralo finemente, poi abbattilo in positivo per far sedimentare il grasso. Una volta raffreddato, separa il grasso e condizionalo sottovuoto.
    6.  Recupera il liquido di cottura, che da freddo apparirà come una gelatina, e lavoralo come uno jus CBT, riducendolo e montandolo con il burro, regolando di sale e aggiungendo qualche goccia di olio al pepe e olio al rosmarino.
    7.  Quando lo jus sarà pronto, unisci la polvere di funghi e la riduzione di vino bianco e amalgama bene per due minuti.
    8.  Rosola velocemente la carne con poco burro chiarificato e mettila da parte. Fai la stessa cosa con le carote, il sedano rapa e le cipolle.
    9.  Unisci la carne e le verdure rosolate allo jus mescolando bene e regola di sapore. Abbattilo in positivo.

### POLLAME

#### Petto di pollo alle erbe
*   **Ingredienti:** 1 grosso petto di pollo senza pelle, 1 l acidificazione forte, 1 l marinatura 40:40, Rosmarino, salvia, alloro, 1 g pepe bianco macinato, 100 g olio neutro, Olio EVO, Fiocchi di sale.
*   **Procedimento:**
    1.  Acidifica il petto di pollo per 10 minuti, poi trasferiscilo nella marinatura per 24 ore.
    2.  Scola e asciuga. Frulla l'olio con le erbe aromatiche e il pepe.
    3.  Inserisci nella busta da cottura il pollo e l'olio alle erbe, poi abbatti per stabilizzare i liquidi.
    4.  Condiziona sottovuoto cercando di creare un cuscinetto stretto.
    5.  Cuoci a a 58°C per 3 ore, mescolando la busta ogni ora, poi abbatti in positivo.
    6.  Togli il pollo dalla busta, asciugalo e spennellalo di olio EVO.
    7.  Fallo grigliare o rosolare per pochi minuti, poi servilo scaloppato con qualche fiocco di sale.

#### Ballottine di sovracoscia di pollo al limone
*   **Ingredienti:** 6 sovracosce di pollo con la pelle, 2 l acidificazione forte, 200 g purea di limoni per marinare CBT, 6 g transglutaminasi disciolta in 24 g acqua a 20°C, Burro chiarificato CBT, Jus di pollo CBT, Olio al limone CBT, Burro di qualità.
*   **Procedimento:**
    1.  Disossa le sovracosce, acidificale per 10 minuti, poi scola e asciuga.
    2.  Spalma uno strato abbondante di purea di limoni sulle sovracosce, sia sulla carne che sulla pelle.
    3.  Inseriscile nella busta da cottura, condizionale sottovuoto e lasciale marinare per 24 ore.
    4.  Scola e togli tutta la marinatura rimasta sulla carne.
    5.  Stendile su un foglio di pellicola e spennella la transglutaminasi sulla carne.
    6.  Avvolgile su sé stesse creando delle ballottine, stringendo bene e facendo due nodi sui lati.
    7.  Con la punta di un ago pratica dei fori sulla pellicola per favorire la fuoriuscita dell'aria in aspirazione.
    8.  Inseriscile nella busta da cottura e condizionale sottovuoto, poi lascia agire la colla per 12 ore in frigorifero.
    9.  Cuocile a 65°C per 5 ore, poi abbattile in positivo.
    10. Togli le ballottine da busta e pellicola, asciugale e falle rosolare in padella con il burro chiarificato.
    11. Fondi lo jus e montalo con il burro, aromatizzalo con l'olio al limone e regolalo di sapore e densità.
    12. Affetta le ballottine, nappale con lo jus e servi.

#### Cosce di pollo laccate
*   **Ingredienti:** 8 cosce di pollo, 2 l acidificazione forte, 2 l marinatura 50:50, 80 g grasso di pancetta affumicata stagionata CBT, 2 g cumino, 2 g paprika affumicata, 1 g aglio in polvere, 1 g senape in polvere, 10 g umami di cipolle CBT, 10 g umami di pomodori CBT.
*   **Procedimento:**
    1.  Prepara le cosce tagliando l'articolazione della zampa ed eliminando l'osso fine situato accanto al femore.
    2.  Acidificale per 10 minuti poi immergile nella marinatura per 24 ore.
    3.  Frulla il grasso di pancetta affumicata con le spezie.
    4.  Scola le cosce dalla marinatura e asciugale. Spalmale con il grasso speziato ed inseriscile nella busta da cottura.
    5.  Condiziona sottovuoto e cuocile a 68°C per 5 ore.
    6.  A cottura terminata apri la busta, scola le cosce dal liquido di cottura e abbattile in positivo.
    7.  Spennellale con gli umami precedentemente mescolati.
    8.  Mettile a laccare nel forno ventilato a 220°C fino a che non saranno asciutte sulla superficie. Ripeti questa operazione per altre due volte e servi.

#### Ali di pollo speziate
*   **Ingredienti:** 1 kg ali di pollo, 2 l acidificazione forte, 15 g sale, 10 g zucchero, 2 g paprika, 1 g aglio in polvere, 1,2 g pepe nero macinato, 1,6 g pepe bianco macinato, 2 g semi di coriandolo in polvere, 2 g chipotle in polvere, 60 g olio neutro.
*   **Procedimento:**
    1.  Pulisci e taglia le ali di pollo, poi acidificale per 10 minuti.
    2.  Miscela l'aglio e le spezie con sale e zucchero.
    3.  Scola le ali, asciugale sommariamente e condiscile con la miscela di spezie, poi trasferiscile nella busta da conservazione.
    4.  Condiziona sottovuoto e falle marinare per 24 ore in frigorifero.
    5.  Trascorso questo tempo, togli le ali dalla busta, unisci l'olio e trasferiscile nella busta da cottura.
    6.  Condiziona sottovuoto e cuoci a 72°C per 2 ore.
    7.  A cottura ultimata apri la busta, scola le ali dal liquido di cottura e abbattile in positivo.
    8.  Per rifinirle, sarà sufficiente rosolarle ad alte temperature, in forno, grill o bbq.

#### Paté di fegatini di pollo in terrina
*   **Ingredienti:** 500 g fegatini di pollo, 50 g riduzione di marsala, 100 g jus di manzo neutro CBT, 100 g burro, 10 g umami di cipolle CBT, 1 foglia di alloro, Olio al pepe nero CBT, Olio all'aglio CBT, Sale.
*   **Procedimento:**
    1.  Pulisci con cura i fegatini, tagliali in piccoli pezzi e condiscili con poco sale.
    2.  Trasferiscili nella busta da cottura con l'alloro e condiziona sottovuoto.
    3.  Cuocili a 62°C per 50 minuti.
    4.  A fine cottura apri la busta, elimina la foglia di alloro, trasferisci il contenuto nel mixer e frulla aggiungendo lo jus fuso, l'umami di cipolle e il burro freddo a dadini.
    5.  Regola di sapore con gli oli al pepe e all'aglio ed il sale, poi trasferisci il paté nella terrina foderata di pellicola.
    6.  Abbatti in positivo, poi metti la terrina nella busta da conservazione.
    7.  Condizionala sottovuoto e attendi 24 ore prima di utilizzarla.

#### Spiedini di pollo al limone e arancia
*   **Ingredienti:** 1 kg sovracosce di pollo, 2 l acidificazione forte, 100 g purea di limoni per marinare CBT, 100 g purea di arance per marinare CBT, Olio all'aglio CBT, Olio al rosmarino CBT, 200 g olio di semi.
*   **Procedimento:**
    1.  Amalgama le puree di limoni e arance.
    2.  Elimina la pelle e disossa le sovracosce, poi tagliale a bocconcini da 20/25 g l'uno.
    3.  Acidificali per 10 minuti, poi amalgamali nella pasta di agrumi e condizionali sottovuoto per 12 ore.
    4.  Trascorso questo tempo, apri la busta ed elimina buona parte delle puree di agrumi.
    5.  Inserisci i bocconcini nella busta da cottura insieme all'olio precedentemente mescolato agli oli aromatici e condizionali sottovuoto, applicando il cuscinetto largo.
    6.  Cuoci a 62°C per 2 ore.
    7.  A fine cottura apri la busta e separa la carne dal liquido di cottura.
    8.  Abbatti la carne in positivo, il liquido andrà eliminato.
    9.  Monta gli spiedini con i bocconcini di pollo e arrostiscili velocemente, poi sala e servi.

#### Galletto al limone
*   **Ingredienti:** 1 galletto da 500/600 g, 2 l acidificazione forte, 50 g purea di limoni per marinare CBT, 100 g olio neutro, 1 g pepe bianco in grani.
*   **Procedimento:**
    1.  Apri il galletto sulla schiena e disossalo, lasciando solamente l'osso nelle ali.
    2.  Acidificalo per 10 minuti, poi scola e asciuga.
    3.  Spennellalo con la purea di limoni poi condizionalo sottovuoto e fallo marinare per 24 ore.
    4.  Trascorso questo tempo, toglilo dalla busta e con una spatola di gomma elimina la parte di marinatura eccedente.
    5.  Frulla l'olio neutro con il pepe e inseriscilo nella busta da cottura insieme al galletto.
    6.  Condiziona sottovuoto cercando di creare un cuscinetto largo e cuoci a 64°C per 2 ore.
    7.  A fine cottura apri la busta, separa il galletto dal liquido e abbattilo in positivo.
    8.  Al momento dell'utilizzo estrai il galletto dalla busta, asciugalo, spennellalo di olio e arrostiscilo come preferisci.

#### Galletto alla diavola
*   **Ingredienti:** 1 galletto da 500/600 g, 2 l acidificazione forte, Rub piccante, 100 g olio neutro, Olio EVO.
*   **Procedimento:**
    1.  Apri il galletto sulla schiena, elimina la colonna vertebrale e puliscilo da eventuali residui di interiora.
    2.  Acidificalo per 10 minuti, poi scola, asciuga e spolvera generosamente con il rub.
    3.  Inseriscilo nella busta da cottura, condizionalo sottovuoto e fallo marinare 12 ore in frigorifero.
    4.  Trascorso questo tempo, apri la busta e aggiungi l'olio neutro, poi condizionalo di nuovo sottovuoto.
    5.  Cuoci a 68°C per 4 ore.
    6.  A cottura ultimata apri la busta, separa il galletto dal liquido di cottura e abbattilo in positivo.
    7.  Al momento dell'utilizzo, estrai il galletto dalla busta, asciugalo e spennellalo di olio EVO.
    8.  Fallo rosolare senza bruciare la pelle, su una piastra, grill, bbq oppure in forno.

#### Gallina in brodo
*   **Ingredienti:** 1 gallina, 2 l acidificazione forte, 2 l marinatura 40:40, 1,5 l essenza vegetale CBT, 50 g riduzione di marsala, 2 foglie di alloro, 2 g pepe bianco in grani.
*   **Procedimento:**
    1.  Pulisci la gallina, fiammeggiala ed elimina tutti gli eventuali residui di interiora.
    2.  Acidificala per 10 minuti, poi falla marinare per 24 ore.
    3.  Trascorso questo tempo prelevala dalla marinatura, legala e inseriscila nella busta da cottura insieme all'essenza, marsala, alloro e pepe.
    4.  Abbatti per stabilizzare i liquidi e condiziona sottovuoto praticando 3 sgasature.
    5.  Cuoci a 64°C per 24 ore.
    6.  A cottura ultimata, abbatti in positivo e lasciala insaporire per 24 ore prima di utilizzarla.
    7.  Apri la busta e separa la gallina dal brodo, il quale apparirà gelatinoso.
    8.  Scalda il brodo fino a 94°C, poi filtralo con una etamina e mettilo a ridurre fino a raggiungere la concentrazione di sapore desiderata, dopodiché abbattilo in positivo.
    9.  Metti nella busta da cottura la gallina, il brodo chiarificato e concentrato e condiziona sottovuoto.
    10. Al momento dell'utilizzo, rigenera la busta a 62°C per 1 ora poi aprila, seziona la gallina e servila con il brodo in accompagnamento.

#### Gallina in galantina
*   **Ingredienti:** 1 gallina disossata, 2 l acidificazione forte, 2 l marinatura 40:40, 300 g macinato di vitello, 300 g macinato di maiale, 200 g lingua salmistrata CBT, 100 g lardo stagionato CBT, 50 g tartufo nero estivo a bastoncini CBT, 100 g riduzione di marsala, 50 g pistacchi pelati e tostati, 2 uova crude, Sale, pepe bianco macinato.
*   **Procedimento:**
    1.  Acidifica la gallina per 10 minuti, poi trasferiscila nella marinatura per 24 ore.
    2.  Trascorso questo tempo prelevala dalla marinatura e asciugala.
    3.  Stendi la gallina sulla pelle e pareggia la carne per coprire tutte le zone dove ne è priva.
    4.  Prepara il ripieno mescolando carni macinate, lardo e lingua tagliati a dadi di 1/2 cm, marsala, uova crude, pistacchi e tartufo.
    5.  Regola di sale e pepe, poi condizionalo sottovuoto per eliminare tutta l'aria incorporata durante la lavorazione.
    6.  Posiziona la farcitura nella parte centrale della gallina a contatto con la carne e arrotolala per formare un rotolo omogeneo.
    7.  Avvolgilo ben stretto con la pellicola e con la punta di un ago pratica dei fori in vari punti della pellicola per favorire la fuoriuscita dell'aria in aspirazione.
    8.  Inserisci il rotolo nella busta da cottura e condiziona sottovuoto.
    9.  Cuoci a 62°C per 24 ore, poi abbatti in positivo e attendi almeno 24 ore prima di utilizzarlo.
    10. Trascorso questo tempo, estrailo dalla busta e dalla pellicola e taglialo all'affettatrice a fette spesse.

#### Arrotolato di tacchino alle castagne
*   **Ingredienti:** 2,5 kg fesa di tacchino, 3 l acidificazione forte, 3 l marinatura 40:40, 200 g pancetta affumicata stagionata CBT, 1 uovo, 100 g Parmigiano Reggiano grattugiato, 100 g castagne al naturale CBT, 100 g grasso di pancetta affumicata stagionata CBT, Pepe macinato, Sale.
*   **Procedimento:**
    1.  Apri la fesa di tacchino a libro, ricavando dai ritagli 500 g di carne che servirà per il ripieno.
    2.  Acidifica sia la fesa di tacchino che i ritagli per 10 minuti, poi passa i ritagli al tritacarne insieme alla pancetta.
    3.  Fai marinare la fesa di tacchino a libro per 24 ore, poi scola e asciuga.
    4.  Impasta il trito di carne e pancetta con l'uovo, il Parmigiano Reggiano e le castagne affettate, poi regola di sale e pepe e fai sgasare per eliminare tutta l'aria inglobata durante la lavorazione.
    5.  Stendi la fesa di tacchino e distribuisci uno strato di 1 cm di farcia sulla superficie della carne, poi arrotolala per ottenere un cilindro omogeneo.
    6.  Lega il cilindro di fesa di tacchino con lo spago da cucina, poi spalmalo con la metà del grasso di pancetta affumicata.
    7.  Abbatti per stabilizzare, poi inserisci il cilindro nella busta da cottura e condiziona sottovuoto.
    8.  Cuoci a 65°C per 4 ore, poi toglilo dalla busta per dividere la carne dai liquidi persi in cottura e abbattilo in positivo.
    9.  Una volta freddo, ricondizionalo sottovuoto e attendi 24 ore prima di utilizzarlo.
    10. Togli l'arrotolato dalla busta e asciugalo, poi spalmalo con la parte del restante grasso di pancetta e fallo rosolare in forno a 240°C fino a completa doratura, spennellando di tanto in tanto sempre con il grasso di pancetta.

#### Arrosto di fesa di tacchino
*   **Ingredienti:** Mezza fesa di tacchino da 2 kg, 3 l acidificazione forte, 3 l marinatura 40:40, 100 g lardo stagionato CBT, Salvia, Rosmarino, Pepe nero in grani, Olio all'aglio CBT, Burro di qualità.
*   **Procedimento:**
    1.  Pulisci e acidifica la fesa di tacchino per 10 minuti, poi immergila nella marinatura per 24 ore.
    2.  Frulla il lardo con le erbe aromatiche ed il pepe, poi aggiungi qualche goccia di olio all'aglio.
    3.  Togli la fesa dalla marinatura, asciugala e legala con lo spago.
    4.  Distribuisci il lardo frullato su tutta la superficie della carne, poi trasferiscila nella busta da cottura.
    5.  Condiziona sottovuoto e cuoci a a 60°C per 5 ore, poi abbatti in positivo.
    6.  Apri la busta, separa la fesa dal liquido di cottura e abbattila in positivo.
    7.  Recupera il grasso dal liquido di cottura, filtralo dalle erbe aromatiche e usalo per spennellare la fesa.
    8.  Rosola la fesa in forno ventilato a 240°C, spennellando di tanto in tanto con il grasso di cottura, finché non sarà ben dorata.

#### Prosciuttino di fesa di tacchino al finocchietto e limone
*   **Ingredienti:** Mezza fesa di tacchino da 2 kg, 3 l acidificazione forte, 2 l marinatura 60:60, 1 g salnitro, 200 g olio neutro, 10 g finocchietto tritato, Olio all'aglio CBT, Olio al pepe nero CBT, Olio al limone CBT, Sale.
*   **Procedimento:**
    1.  Acidifica la fesa di tacchino per 10 minuti, poi scolala.
    2.  Stempera il salnitro nella marinatura.
    3.  Con l'apposita siringa inietta la marinatura nella fesa, distribuendola in tutto il suo volume.
    4.  Terminata questa operazione, inserisci la fesa nella busta da conservazione insieme a tutta la marinatura e condiziona sottovuoto applicando un cuscinetto stretto.
    5.  Lascia a marinare per 5 giorni a 2°C, avendo cura di muovere e massaggiare la fesa una volta al giorno.
    6.  Trascorso questo tempo, scola la fesa, asciugala e legala con lo spago.
    7.  Mescola l'olio neutro con gli oli aromatici e il finocchietto tritato per ottenere una concentrazione gradevole.
    8.  Inserisci la fesa nella busta da cottura con il mix di oli e condizionala sottovuoto.
    9.  Cuoci a 58°C per 5 ore, poi abbatti in positivo e attendi 24 ore prima di utilizzarlo.
    10. Togli il prosciuttino dalla busta, asciugalo e taglialo a fette sottili con un'affettatrice.

#### Spezzatino di sovracosce di tacchino
*   **Ingredienti:** 1 kg polpa di sovracosce di tacchino, 2 l acidificazione forte, 2 l marinatura 40:40, 100 g grasso di pancetta affumicata stagionata CBT, Olio al rosmarino CBT, Olio al limone CBT, 100 g olio neutro, 100 g brunoise di cipolle CBT, 200 g funghi champignon CBT, 200 g dadi di patate CBT, 150 g jus di pollo CBT, Olio EVO.
*   **Procedimento:**
    1.  Spella e taglia la polpa di sovracosce di tacchino a cubetti di 30 g l'uno, poi acidifica la carne per 10 minuti.
    2.  Immergila nella marinatura per 12 ore.
    3.  Trascorso questo tempo scolala dalla marinatura asciugandola bene.
    4.  Mescola il grasso di pancetta, gli oli aromatici e l'olio neutro, poi amalgama questo composto alla polpa di tacchino.
    5.  Trasferisci il tutto nella busta da cottura e condiziona sottovuoto.
    6.  Cuoci a 64°C per 2 ore, poi apri la busta, separa la carne dai liquidi di cottura e abbattila in positivo.
    7.  Fai decantare i liquidi di cottura, separa la parte grassa, chiarifica e riduci.
    8.  In una padella fai rosolare velocemente lo spezzatino di tacchino, poi trasferiscilo in una casseruola con metà del grasso di cottura, le cipolle, le patate, gli champignon, lo jus di pollo e il liquido di cottura ridotto.
    9.  Fai scaldare e ridurre a fuoco dolce per pochi minuti, quindi servi.
