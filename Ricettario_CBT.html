    3.  Cuoci a 62°C per 10 ore, mescolando delicatamente il contenuto della busta ogni 3/4 ore.
    4.  Per effetto della saturazione dei liquidi, al termine del terzo passaggio di canditura potrai trovare dello zucchero non completamente disciolto.
    5.  Preleva qualche goccia di sciroppo spremendo la polpa interna di un pezzo di zucca candita e misura la concentrazione zuccherina con il rifrattometro. Se non ha ancora raggiunto i 70°/72°Brix, effettua il quarto passaggio.

*   **Quarto passaggio di canditura (opzionale):**
    1.  Pesa la zucca, aggiungi un quantitativo di zuccheri pari a metà del suo peso e amalgama bene.
    2.  Inserisci il composto nella busta da cottura e condiziona sottovuoto praticando 3 sgasature.
    3.  Cuoci a 62°C per 10 ore, mescolando delicatamente il contenuto della busta ogni 3/4 ore.
    4.  Per effetto della saturazione dei liquidi, al termine del quarto passaggio di canditura potrai trovare dello zucchero non completamente disciolto.
    5.  Alla fine di questo passaggio preleva qualche goccia di sciroppo spremendo la polpa interna di un pezzo di zucca candita. Misura la concentrazione zuccherina con il rifrattometro la quale dovrà essere pari o di poco superiore ai 70°Brix.

*   **Finitura della mostarda di zucca:**
    1.  In una casseruola unisci gli sciroppi ricavati in precedenza e falli ridurre a fuoco dolce fino a raggiungere la concentrazione zuccherina di 70°/72°Brix, poi abbattili in positivo.
    2.  Stempera l'olio essenziale di senape nello sciroppo ridotto e freddo, poi uniscilo alla zucca amalgamando bene.
    3.  Trasferisci il composto nella busta da cottura e condiziona sottovuoto, poi cuoci a 88°C per 20 minuti, infine abbatti in positivo.
    4.  A questo punto la mostarda di zucca è pronta per il consumo.
    5.  Conservala nella busta sottovuoto insieme allo sciroppo in un luogo riparato dal calore e dalla luce.

## SUGGESTIONI

In questo capitolo ho raccolto una serie di suggestioni che culminano in preparazioni complete. Sono preparazioni appositamente studiate per essere duttili e personalizzabili, soprattutto in termini di aromatizzazioni e abbinamenti.
Lo scopo di queste suggestioni è stimolare la creatività, per poi applicarla alla propria realtà professionale.
Ogni piatto può comprendere preparazioni a cui corrispondono diverse tempistiche di realizzazione. Data la necessità di differire nel tempo le varie fasi delle lavorazioni, dove possibile, ho aggiunto consigli sulla conservazione, nell'attesa di avere tutti gli elementi pronti per la composizione del piatto.
Dove trovi riportato "(ric. prec.)" si riferisce ad una ricetta precedente inclusa nella stessa "Suggestione".

### Punta di petto di manzo, jus speziato e mostarda di zucca

#### Punta di petto per bollito
*   **Ingredienti:** 1 kg punta di petto di manzo, 2 l acidificazione leggera, 300 g essenza vegetale CBT, 1 bacca di anice stellato, 0,5 g fiori di cannella, 2 foglie di alloro, 1 g bacche di ginepro, 3 chiodi di garofano, 1 g pepe nero in grani, 4 g sale.
*   **Procedimento:**
    1.  Prepara la punta di petto acidificandola per 10 minuti, poi trasferiscila nella busta da cottura insieme all'essenza e alle spezie.
    2.  Abbatti per stabilizzare i liquidi.
    3.  Condiziona sottovuoto e cuoci a 58°C per 72 ore.
    4.  A fine cottura apri la busta, separa la carne dal liquido di cottura e abbattila in positivo.
    5.  Recupera il liquido di cottura, chiarificalo e riducilo per ottenere lo jus speziato.

#### Jus di manzo speziato
*   **Ingredienti:** 100 g jus di manzo CBT, Jus speziato CBT (ric. prec.), Burro di qualità.
*   **Procedimento:**
    1.  Metti i due jus in una casseruola e falli fondere a fuoco dolce.
    2.  Quando avranno raggiunto la giusta densità, aggiungi il burro poco per volta fino a consistenza desiderata.
    3.  Regola di sapore e tieni in caldo.

*   **Finitura del piatto:**
    *   **Ingredienti:** Mostarda di zucca in pezzi CBT.
    *   **Procedimento:**
        1.  Taglia dei dadi di carne di 3 cm di lato, condizionali sottovuoto e rigenerali in bagno termostatico.
        2.  Scalda lo jus speziato.
        3.  Su un piatto posiziona i dadi di carne nappati con lo jus, qualche pezzo di mostarda di zucca e servi.

### Coda di manzo al pepe, polenta alla salvia

#### Coda di manzo al pepe
*   **Ingredienti:** 2 code di manzo, 3 l acidificazione leggera, 3 l marinatura 30:30, 300 g grasso di rognone al pepe nero CBT, 100 g jus di manzo CBT, Burro di qualità, Sale.
*   **Procedimento:**
    1.  Taglia la coda a vertebre singole, poi acidificala per 10 minuti.
    2.  Trasferiscila nella marinatura per 24 ore, quindi scolala.
    3.  Inserisci la coda e il grasso di rognone nella busta da cottura condiziona sottovuoto.
    4.  Cuoci a 72°C per 48 ore, poi estraila dalla busta separando i liquidi di cottura che andranno abbattuti e tenuti da parte.
    5.  Disossa la coda ancora calda, cercando di non sfilacciarla troppo e abbattila in positivo.
    6.  Separa dai liquidi di cottura la parte del grasso e lavora la parte acquosa rimanente per ottenere uno jus CBT.
    7.  Una volta ottenuto lo jus di coda, aggiungi lo jus di manzo e montalo con il burro, regolando di sapore e densità.
    8.  Unisci lo jus montato alla coda amalgamando bene, poi trasferisci il tutto in un contenitore e abbatti in positivo.
    9.  Quando la coda sarà fredda e rassodata, toglila dal contenitore e condiziona sottovuoto nelle buste da cottura.

#### Polenta alla salvia
*   **Ingredienti:** Farina di mais per polenta, Burro alla salvia CBT, Sale.
*   **Procedimento:**
    1.  Fai una polenta seguendo il metodo tradizionale.
    2.  Quando sarà pronta aggiungi il burro alla salvia e amalgama bene.

*   **Finitura del piatto:**
    1.  Rigenera la coda in busta a 72°C per 20 minuti, poi servila direttamente sulla polenta.

### Cotoletta di vitello alla milanese

#### Carrè di vitello al naturale
*   **Ingredienti:** 1 carré di vitello da 5 coste, 4 l acidificazione forte, 4 l marinatura 40:40.
*   **Procedimento:**
    1.  Pulisci il carré di vitello da tutte le membrane e scalza le ossa.
    2.  Acidificalo per 10 minuti, poi fallo marinare per 24 ore.
    3.  Trascorso questo tempo, toglilo dalla marinatura e legalo utilizzando della pellicola alimentare idonea, coprendo anche le ossa.
    4.  Inseriscilo nella busta da cottura, condiziona sottovuoto e cuoci a 54°C per 3 ore, quindi abbatti in positivo.
    5.  Attendi almeno 24 ore prima di utilizzarlo.

*   **Finitura del piatto:**
    *   **Ingredienti:** 300 g uova intere, 2 g iota, 1 g xantano, 150 g farina, 250 g pangrattato, 300 g burro chiarificato CBT, Sale.
    *   **Procedimento:**
        1.  Frulla le uova con lo xantano e la iota.
        2.  Togli la carne dalla busta, slegala, asciugala e taglia le cotolette, una per ogni costola.
        3.  Infarinale, passale nell'uovo e successivamente nel pangrattato, poi ripeti ancora nell'uovo e nel pangrattato.
        4.  Metti il burro chiarificato in una casseruola, portalo a 190°C e friggi la cotoletta, sarà sufficiente un minuto per lato, quindi servi.

### Filetto di manzo che piacerebbe tanto a Rossini

#### Filetto di manzo al naturale
*   **Ingredienti:** 1 kg filetto scordonato (la parte centrale), 2 l acidificazione forte, 2 l marinatura 25:15.
*   **Procedimento:**
    1.  Pulisci il filetto eliminando con cura tutte le membrane di connettivo.
    2.  Acidificalo per 10 minuti, poi fallo marinare per 12 ore.
    3.  Trascorso questo tempo, toglilo dalla marinatura e asciugalo.
    4.  Stendi due o tre fogli di pellicola leggermente sovrapposti e usali per arrotolare il filetto.
    5.  Stringi il rotolo per ottenere un cilindro dalla forma omogenea.
    6.  Trasferiscilo nella busta da cottura e condizionalo sottovuoto.
    7.  Cuoci a 48°C per 2 ore e abbatti in positivo.
    8.  Attendi 24 ore prima di utilizzarlo.

#### Tartufo nero estivo al naturale
*   **Ingredienti:** 1 tartufo estivo da 70 g, Sale.
*   **Procedimento:**
    1.  Lava, pela e affetta il tartufo a lamelle di 2 mm, poi salalo con del sale finissimo.
    2.  Trasferiscilo nella busta da cottura in modo che sia ben steso e non sovrapposto.
    3.  Condizionalo sottovuoto praticando una sgasatura.
    4.  Cuocilo a 86°C per 10 minuti e abbatti in positivo.
    5.  Apri la busta e togli le lamelle di tartufo.
    6.  Con un coppapasta ricava dei dischi e con la parte eccedente fai una brunoise (servirà per la salsa Périgord).

#### Funghi finferli al burro
*   **Ingredienti:** 500 g funghi finferli, 40 g burro, Olio all'aglio CBT, Olio al timo CBT, Olio al pepe nero CBT, Sale.
*   **Procedimento:**
    1.  Ammorbidisci il burro e mescolalo con qualche goccia degli oli aromatici.
    2.  Pulisci con cura i funghi finferli, poi tagliali per uniformarne le dimensioni.
    3.  Salali leggermente, aggiungi il composto di burro e amalgama con delicatezza.
    4.  Trasferisci il tutto nella busta da cottura e condiziona sottovuoto praticando 5 sgasature.
    5.  Cuoci a 86°C per 25 minuti, poi abbatti in positivo.

#### Fegato grasso d'oca al naturale
*   **Ingredienti:** 1 fegato grasso d'oca intero.
*   **Procedimento:**
    1.  Lascia ammorbidire il fegato a temperatura ambiente, poi puliscilo senza scavarlo troppo.
    2.  Stendi due o tre fogli di pellicola leggermente sovrapposti e arrotolali intorno al fegato per ottenere un cilindro dalla forma omogenea.
    3.  Con la punta di un ago pratica qualche foro sulla pellicola per permettere alla macchina sottovuoto di estrarre l'aria inclusa nel rotolo.
    4.  Abbattilo in positivo per rassodare la superficie, poi trasferiscilo nella busta da cottura e condizionalo sottovuoto.
    5.  Cuoci a 54°C per 40 minuti, tuffalo in acqua e ghiaccio per 10 minuti e abbattilo in positivo.
    6.  Attendi 24 ore prima di utilizzarlo, successivamente toglilo dalla busta e dalla pellicola e taglialo a medaglioni dello spessore di 1,5 cm.
    7.  Stendili su una teglia rivestita da un foglio antiaderente e abbattili in negativo, poi conservali sottovuoto fino al momento dell'utilizzo.

#### Salsa Périgord
*   **Ingredienti:** 200 g jus di manzo CBT, 15 g brunoise di tartufo nero CBT (ric. prec.), 20 g riduzione di madeira, Burro di qualità, Olio al pepe nero CBT, Sale.
*   **Procedimento:**
    1.  Fondi lo jus di manzo, poi montalo con il burro freddo fino a raggiungere una emulsione stabile e vellutata.
    2.  Aggiungi il madeira poco alla volta, dopodiché unisci il tartufo e regola di sapore con l'olio aromatico ed il sale.
    3.  Tieni in caldo.

*   **Finitura del piatto:**
    *   **Ingredienti:** Burro chiarificato CBT, Burro di qualità, Timo, Aglio in camicia.
    *   **Procedimento:**
        1.  Togli il filetto dalla busta, asciugalo e taglialo a medaglioni alti 5 cm.
        2.  In una padella rosolali su tutti i lati con del burro chiarificato.
        3.  Elimina il burro chiarificato, aggiungi burro fresco, timo, aglio e fallo schiumare sul filetto per pochi attimi.
        4.  Scalda una padella di ferro e rosola velocemente i medaglioni di foie gras su entrambi i lati, direttamente da surgelati.
        5.  Apri la busta dei funghi e versane il contenuto in una padella.
        6.  Fai ridurre a fuoco dolce, regola di sapore.
        7.  Rigenera il tartufo a 50°C per pochi minuti.
        8.  Posiziona i funghi finferli sul piatto, appoggia il filetto, il medaglione di foie gras e nappa generosamente con la salsa. Sistema le lamelle di tartufo sopra al foie gras e servi.

### Flat iron steak, patate viola al rosmarino

#### Flat iron steak
*   **Ingredienti:** 1 flat iron steak, 2 l acidificazione forte, 2 l marinatura 25:15.
*   **Procedimento:**
    1.  Acidifica la flat iron steak per 10 minuti, poi immergila nella marinatura per 24 ore.
    2.  Trascorso questo tempo, scola e trasferiscila nella busta da cottura e condiziona sottovuoto.
    3.  Cuoci a 51°C per 7 ore e abbatti in positivo.
    4.  Attendi 24 ore prima di utilizzarla.

#### Patate viola al rosmarino
*   **Ingredienti:** 1 kg patate viola grosse, Sale, Olio al rosmarino CBT.
*   **Procedimento:**
    1.  Pela le patate e tagliale a parallelepipedo di circa 2 cm a lato per la lunghezza di 5 cm.
    2.  Condiscile con il sale e falle macerare per 10 minuti.
    3.  Elimina l'acqua di macerazione e condiscile con qualche goccia di olio al rosmarino.
    4.  Inseriscile nella busta da cottura e condiziona sottovuoto praticando una sgasatura, poi cuoci a 88°C per 30 minuti.
    5.  Abbatti in positivo.

*   **Finitura del piatto:**
    *   **Ingredienti:** Burro chiarificato CBT, Olio Evo.
    *   **Procedimento:**
        1.  Rigenera le patate a 80°C, toglile dalla busta e condiscile con poco olio EVO.
        2.  Togli la flat iron steak dalla busta e asciugala.
        3.  Taglia le porzioni e falle rosolare in padella con burro chiarificato.
        4.  Affetta la carne, disponila sul piatto di portata insieme alle patate viola e servi.

### Pancia di vitello dorata, jus alla liquirizia, cardi al burro nocciola

#### Pancia di vitello al naturale
*   **Ingredienti:** 1,5 kg pancia di vitello, 3 l acidificazione leggera, 2 l marinatura 30:30.
*   **Procedimento:**
    1.  Pulisci la pancia di vitello dalle membrane di tessuto connettivo più coriacee.
    2.  Falla acidificare per 10 minuti, poi scolala e immergila nella marinatura per 24 ore.
    3.  Trascorso questo tempo, toglila dalla marinatura, inseriscila nella busta da cottura e condizionala sottovuoto.
    4.  Cuocila a 64°C per 30 ore.
    5.  A cottura ultimata, apri la busta e separa la carne dal liquido di cottura e abbattili separatamente in positivo.
    6.  Il liquido di cottura, per mitigare la concentrazione di sale, dopo essere stato chiarificato e ridotto potrà essere unito ad uno jus non salato.
    7.  Conserva la pancia sottovuoto fino al momento dell'utilizzo.

#### Jus di vitello alla liquirizia
*   **Ingredienti:** Jus di vitello CBT, Liquirizia in polvere, Burro di qualità, Sale.
*   **Procedimento:**
    1.  In una casseruola fai fondere lo jus di vitello, poi montalo aggiungendo poco burro freddo a dadini per volta.
    2.  Quando sarà montato, aggiungi poca polvere di liquirizia stemperandola bene.
    3.  Regola di sapore e densità e tieni in caldo.

#### Cardi al burro nocciola
*   **Ingredienti:** 1 cardo, 200 g burro di qualità, Xantano, Sale.
*   **Procedimento:**
    1.  Metti il burro in una casseruola e fallo cuocere per ottenere un color nocciola.
    2.  Trasferiscilo subito in una bastardella posizionata su un bagnomaria ghiacciato e fallo raffreddare mescolandolo in continuazione finché non avrà la consistenza di una crema, poi aggiungi poco xantano frullandolo al burro.
    3.  Monda i cardi dalle spine e dai filamenti e lavali bene.
    4.  Tagliali a pezzi di 15 cm, condiscili con il sale e falli macerare per 10 minuti.
    5.  Inseriscili nella busta da cottura insieme al burro nocciola.
    6.  Condiziona sottovuoto praticando 3 sgasature, poi cuoci a 90°C per 2 ore.
    7.  A cottura ultimata abbatti in positivo.

*   **Finitura del piatto:**
    *   **Ingredienti:** Burro chiarificato CBT, Burro di qualità, Aglio in camicia, Rosmarino.
    *   **Procedimento:**
        1.  Togli la pancia dalla busta e se serve asciugala.
        2.  Taglia delle fette spesse e falle rosolare in padella con il burro chiarificato.
        3.  A rosolatura ultimata elimina il burro chiarificato.
        4.  Aggiungi del burro fresco, l'aglio in camicia e qualche rametto di rosmarino, e fai schiumare il burro sopra la carne per un minuto.
        5.  Apri la busta dei cardi e versa il contenuto in una padella.
        6.  Fai ridurre i liquidi a fuoco dolce, cercando di creare un'emulsione per nappare i cardi.
        7.  Regola di sapore e densità.
        8.  Affetta la carne, posizionala sul piatto insieme ai cardi e nappala con lo jus alla liquirizia.

### Pastrami, senape alle mele, patate dorate

#### Olio alle spezie per pastrami
*   **Ingredienti:** Olio al pepe nero CBT, Olio al pepe bianco CBT, Olio al rosmarino CBT, Olio ai semi di finocchio CBT, Olio all'aglio CBT, Olio al chipotle CBT.
*   **Procedimento:**
    1.  Miscela gli oli aromatici a tuo piacere.

#### Pastrami di manzo
*   **Ingredienti:** 2 kg punta di petto di manzo, 4 l acidificazione forte, 4 l marinatura 40:40, Olio alle spezie CBT (ric. prec.).
*   **Procedimento:**
    1.  Pulisci la punta di petto eliminando tutte le membrane di connettivo.
    2.  Acidificala per 10 minuti, poi immergila nella marinatura per 72 ore, capovolgendola ogni 24 ore.
    3.  Trascorso questo tempo, scolala bene dalla marinatura e falla affumicare a freddo per il tempo che desideri (io preferisco una affumicatura leggera di 30 minuti), dopodiché abbatti in positivo.
    4.  Quando sarà fredda, pennella la carne con la miscela di oli aromatici, poi inseriscila nella busta da cottura e condiziona sottovuoto.
    5.  Cuoci a 58°C per 72 ore, dopodiché abbatti in positivo.
    6.  Falla riposare in frigorifero per 24 ore prima di utilizzarla.

#### Senape alle mele
*   **Ingredienti:** 200 g semi di senape gialla, 600 g acqua fredda, 200 g ghiaccio, 200 g brunoise di mele CBT, 200 g senape di Dijon, 2 g sale.
*   **Procedimento:**
    1.  Inserisci nella busta da cottura i semi di senape, il sale, il ghiaccio e l'acqua fredda.
    2.  Condiziona sottovuoto praticando una sgasatura, poi lascia idratare per 3 ore.
    3.  Successivamente cuoci a 88°C per 3 ore.
    4.  A fine cottura apri la busta e scola i liquidi, quindi abbatti in positivo.
    5.  In una bastardella metti la senape, le mele preventivamente asciugate e la senape di Dijon.
    6.  Amalgama bene e conserva sottovuoto in frigorifero.

#### Patate dorate
*   **Ingredienti:** 4 grosse patate, Olio EVO, Sale.
*   **Procedimento:**
    1.  Pela le patate e tagliale a grossi cubi.
    2.  Salale generosamente e falle macerare per 10 minuti, poi elimina l'acqua di macerazione.
    3.  Inseriscile nella busta da cottura e condizionale sottovuoto praticando una sgasatura.
    4.  Cuoci a 88°C per 20 minuti e abbatti in positivo.
    5.  Togli le patate dalla busta e asciugale.
    6.  Ungile con l'olio e falle dorare in forno a 200°C, girandole di tanto in tanto per uniformare la doratura.

*   **Finitura del piatto:**
    *   **Ingredienti:** Pane in cassetta, Burro.
    *   **Procedimento:**
        1.  Taglia il pane a fette e imburralo su un lato.
        2.  Fallo dorare in padella solo sul lato imburrato.
        3.  Estrai il pastrami dalla busta, asciugalo e taglialo a fette di 3 mm.
        4.  Con il pane ed il pastrami prepara un sandwich, dove la parte imburrata starà a contatto con il pastrami.
        5.  Accompagnalo con la senape alle mele e alle patate dorate.

### Animelle di vitello, burro alla salvia, zucca e jus di tettina

#### Animelle di vitello al burro di cacao
*   **Ingredienti:** 1 kg animelle di vitello, 2 l acidificazione leggera, 1 l latte, 45 g sale, 200 g burro di cacao tritato.
*   **Procedimento:**
    1.  Pulisci le animelle eliminando la pellicina che le ricopre, tagliale a pezzi di 70 g circa e acidificale per 10 minuti, poi scolale.
    2.  Prepara una marinatura sciogliendo il sale nel latte freddo.
    3.  Immergi le animelle nella marinatura per 12 ore.
    4.  Trascorso questo tempo scolale, inseriscile nella busta da cottura insieme al burro di cacao e abbatti per stabilizzare i liquidi.
    5.  Condiziona sottovuoto e cuoci a 66°C per 1 ora mescolando ogni 20 minuti, dopodiché abbatti in positivo.

#### Burro alla salvia
*   **Ingredienti:** 100 g burro, 25 g foglie di salvia.
*   **Procedimento:**
    1.  Inserisci le foglie di salvia intere nella busta da cottura insieme al burro.
    2.  Condiziona sottovuoto praticando 3 sgasature.
    3.  Cuoci a 65°C per 2 ore.
    4.  Trascorso questo tempo, trasferisci la busta nella vasca a ultrasuoni a 50°C per 2 ore.
    5.  Apri la busta e setaccia pressando le foglie di salvia per ottenere tutto il liquido.
    6.  Abbattilo in un bagnomaria ghiacciato mescolando con una frusta per ripristinare l'emulsione fino a quando non raggiungerà una consistenza cremosa.
    7.  Trasferisci il burro in uno stampo e abbattilo in positivo.
    8.  Quando si sarà solidificato, condizionalo sottovuoto e conservalo in frigorifero.

#### Jus di tettina di vacca
*   **Ingredienti:** 100 g jus di tettina di vacca CBT, 40 g burro di qualità.
*   **Procedimento:**
    1.  Metti lo jus in una casseruola e fallo fondere a fuoco dolce.
    2.  Quando avrà raggiunto la giusta densità, aggiungi il burro poco per volta fino a consistenza desiderata. Regola di sapore e tieni in caldo.
    3.  Monta lo jus di tettina con il burro, regolalo di sapore e densità e tienilo da parte.

#### Zucca alla salvia
*   **Ingredienti:** 1 kg zucca, 110 g burro morbido, 7 g foglie di salvia, 1 g pepe bianco in grani, Noce moscata, 0,2 g xantano, Sale.
*   **Procedimento:**
    1.  Lava e sbuccia la zucca, poi tagliala a dadi della stessa grandezza.
    2.  Condisci con il sale e lascia macerare per 10 minuti, dopodiché elimina il liquido che avrà rilasciato.
    3.  Frulla il burro insieme allo xantano, alla salvia, al pepe bianco e ad una grattugiata di noce moscata.
    4.  Amalgama il burro alla zucca, trasferisci il composto nella busta da cottura e condiziona sottovuoto.
    5.  Precuoci a 55°C per 30 minuti e abbatti in positivo.
    6.  Cuoci a 86°C per 15 minuti e abbatti in positivo.

*   **Finitura del piatto:**
    1.  Rosola le animelle utilizzando il burro di cacao recuperato dalla busta.
    2.  A rosolatura ultimata, elimina il burro di cacao e a fuoco spento aggiungi il burro e salvia per mantecare le animelle, regola di sale e tieni in caldo.
    3.  Versa tutto il contenuto della busta della zucca in una padella a fuoco dolce fai prima ritirare i liquidi e poi glassare con la salsa che si sarà formata.
    4.  Disponi su un piatto la zucca, l'animella e nappa il tutto con jus di tettina ben caldo.

### Essenza calda e mousse di tettina

#### Essenza di tettina di vacca
*   **Ingredienti:** 5 kg tettina di vacca giovane, 2,5 l acqua.
*   **Procedimento:**
    1.  Taglia in piccoli pezzi la tettina e inseriscila nelle buste da cottura insieme all'acqua.
    2.  Abbatti per stabilizzare i liquidi e condiziona sottovuoto.
    3.  Cuoci a 86°C per 15 ore.
    4.  A cottura ultimata apri e scola la busta, per dividere la carne dal liquido di cottura.
    5.  Abbatti in positivo la carne mentre per il liquido procedi con la chiarificazione.
    6.  Una volta chiarificata l'essenza, falla ridurre a fuoco dolce fino a raggiungere il sapore di un brodo concentrato e saporito, senza dover aggiungere né sale né altro.
    7.  Abbattila in positivo e conservala sottovuoto.

#### Mousse di tettina di vacca
*   **Ingredienti:** 1 kg tettina di vacca CBT (ric. prec.), 250 g burro morbido, Olio al pepe nero CBT, Sale.
*   **Procedimento:**
    1.  Con un tritacarne riduci la tettina alla consistenza di un patè finissimo.
    2.  Trasferiscilo in una planetaria e montalo aggiungendo il burro a dadini.
    3.  Insaporisci con qualche goccia di olio al pepe nero e regola di sapore.

*   **Finitura del piatto:**
    1.  Distribuisci la mousse in piccole pirofile.
    2.  Scalda l'essenza e riempi dei bicchierini.
    3.  Servi subito.

### Cuore, mirtilli selvatici e pepe

#### Cuore di manzo al pepe
*   **Ingredienti:** 1 cuore di manzo, 2 l acidificazione forte, 2 l marinatura 25:15, 200 g grasso di rognone al pepe nero CBT.
*   **Procedimento:**
    1.  Pulisci il cuore dal grasso e dalle cartilagini dure, poi taglialo in quattro pezzi.
    2.  Acidificalo per 10 minuti, scolalo e mettilo a marinare per 12 ore.
    3.  Trascorso questo tempo, toglilo dalla marinatura e inseriscilo nella busta da cottura insieme al grasso di rognone al pepe nero.
    4.  Condizionalo sottovuoto e cuocilo a 50°C per 6 ore, poi abbatti in positivo.
    5.  Fallo riposare almeno 24 ore prima di utilizzarlo.

#### Mirtilli selvatici al naturale
*   **Ingredienti:** 250 g mirtilli selvatici.
*   **Procedimento:**
    1.  Lava e asciuga i mirtilli.
    2.  Trasferiscili nella busta da cottura e condizionali sottovuoto praticando una sgasatura.
    3.  Cuocili a 84°C per 15 minuti e abbatti in positivo.

*   **Finitura del piatto:**
    *   **Ingredienti:** Olio al pepe nero CBT, Sale in fiocchi.
    *   **Procedimento:**
        1.  Togli il cuore dalla busta, asciugalo e taglialo a fette sottili.
        2.  Togli i mirtilli dalla busta e mescolali delicatamente.
        3.  Posiziona il cuore sul piatto lasciando dello spazio tra una fetta e l'altra.
        4.  Aggiungi qualche cucchiaino di mirtilli e il loro succo tra uno spazio e l'altro.
        5.  Condisci con qualche goccia di olio al pepe nero e dei fiocchi di sale.

### Tartare di cuore di manzo, gel di polpo

#### Tartare di cuore di manzo al naturale
*   **Ingredienti:** 1 cuore di manzo, 2 l acidificazione forte, 2 l marinatura 25:15.
*   **Procedimento:**
    1.  Pulisci il cuore dal grasso e dalle cartilagini dure, poi taglialo in quattro pezzi.
    2.  Acidificalo per 10 minuti, scolalo e mettilo a marinare per 12 ore.
    3.  Trascorso questo tempo, toglilo dalla marinatura e inseriscilo nella busta da cottura.
    4.  Condizionalo sottovuoto e cuocilo a 48°C per 6 ore, poi abbatti in positivo.
    5.  Fallo riposare almeno 24 ore prima di utilizzarlo.

#### Gel di polpo
*   **Ingredienti:** 200 g essenza di polpo CBT, 100 g olio di vinacciolo, 12 g gellan, 1 g xantano.
*   **Procedimento:**
    1.  Mescola gellan e xantano, quindi inseriscili nella busta da cottura insieme all'essenza di polpo.
    2.  Condiziona sottovuoto e cuoci a 90°C per 30 minuti, mescolando ogni 5 minuti.
    3.  A cottura terminata abbatti in positivo.
    4.  Quando sarà fredda e solidificata, trasferisci la gelatina in una caraffa e montala con un frullatore ad immersione senza incorporare aria, aggiungendo l'olio a filo, fino a raggiungere una consistenza cremosa.
    5.  Successivamente sgasa il gel di polpo ottenuto e conservalo sottovuoto in frigorifero.

*   **Finitura del piatto:**
    *   **Ingredienti:** Olio Evo, Sale, Olio al pepe nero CBT.
    *   **Procedimento:**
        1.  Togli il cuore dalla busta, asciugalo e con un coltello rifilalo eliminando tutte le parti che non siano di carne rossa.
        2.  Tritalo come una tartare, poi condiscila con sale, olio Evo e qualche goccia di olio al pepe nero.
        3.  Disponila sul piatto e distribuisci sulla superfice il gel di polpo.

### Fegato di vitello all'alloro, cipolle e capperi

#### Fegato di vitello all'alloro
*   **Ingredienti:** 1 kg fegato di vitello, 2 l acidificazione forte, 2 l marinatura 30:15, 300 g grasso di rognone all'alloro CBT.
*   **Procedimento:**
    1.  Pulisci il fegato, elimina tutte le membrane e le parti coriacee.
    2.  Acidificalo per 10 minuti, scolalo e mettilo a marinare per 12 ore.
    3.  Trascorso questo tempo, toglilo dalla marinatura e inseriscilo nella busta da cottura insieme al grasso di rognone tritato.
    4.  Condiziona sottovuoto e cuoci a 63°C per 1 ora.
    5.  A fine cottura abbatti in positivo.
    6.  Attendi 24 ore prima di utilizzarlo.

#### Cipolle brasate ai capperi
*   **Ingredienti:** 500 g cipolle dorate affettate, 15 g polvere di capperi CBT, 6 g sale, 30 g zucchero, 25 g aceto di vino bianco, 60 g burro morbido, 0,3 g xantano.
*   **Procedimento:**
    1.  Frulla tutti gli ingredienti (tranne le cipolle) fino ad ottenere una crema densa.
    2.  Condisci le cipolle affettate con la crema ottenuta, amalgamando bene.
    3.  Trasferisci il contenuto nella busta da cottura e abbatti per stabilizzare i liquidi.
    4.  Condiziona sottovuoto praticando 3 sgasature e cuoci a 88°C per 3 ore, mescolando di tanto in tanto.
    5.  A fine cottura, apri la busta, separa le cipolle dai liquidi di cottura e abbattile in positivo.
    6.  Conserva i liquidi per la ricetta seguente.

#### Salsa di cipolle ai capperi
*   **Ingredienti:** I liquidi di cottura delle cipolle brasate ai capperi CBT (ric. prec.).
*   **Procedimento:**
    1.  Metti tutti i liquidi in una casseruola.
    2.  Fai ridurre di un terzo, poi frulla a caldo ottenendo una crema liscia e lucida.
    3.  Regola di sapore e densità e abbattila in positivo.

*   **Finitura del piatto:**
    1.  Togli il fegato dalla busta, asciugalo e con l'affettatrice ricava delle fette sottili.
    2.  Posiziona le fette di fegato sul piatto con un nido di cipolle brasate e decora con delle gocce di salsa.

### Fegato di vitello arrosto, scalogni fondenti e jus

#### Fegato di vitello al naturale
*   **Ingredienti:** 1 kg fegato di vitello, 2 l acidificazione forte, 2 l marinatura 30:15.
*   **Procedimento:**
    1.  Pulisci il fegato, rifilalo da tutte le membrane e le parti coriacee.
    2.  Acidificalo per 10 minuti, scolalo e mettilo a marinare per 12 ore.
    3.  Trascorso questo tempo, toglilo dalla marinatura e inseriscilo nella busta da cottura.
    4.  Condiziona sottovuoto e cuoci a 63°C per 1 ora.
    5.  A fine cottura abbatti in positivo.
    6.  Attendi 24 ore prima di utilizzarlo.

#### Scalogni fondenti
*   **Ingredienti:** 600 g scalogni, 15 g polvere di capperi CBT, 30 g zucchero, 25 g aceto di vino bianco, 60 g burro morbido, 0,3 g xantano.
*   **Procedimento:**
    1.  Pela gli scalogni e tagliali in due nel senso della lunghezza.
    2.  Frulla tutti gli ingredienti (tranne gli scalogni) fino ad ottenere una crema densa.
    3.  Condisci gli scalogni con la crema ottenuta, amalgamando bene.
    4.  Trasferisci il contenuto nella busta da cottura e abbatti per stabilizzare i liquidi.
    5.  Condiziona sottovuoto praticando 3 sgasature e cuoci a 88°C per 2 ore, mescolando di tanto in tanto e cercando di non rompere gli scalogni.
    6.  A fine cottura, apri la busta e separa gli scalogni dai liquidi rilasciati.
    7.  Abbatti in positivo e condizionali sottovuoto.
    8.  Conserva i liquidi per la ricetta seguente.

#### Jus di vitello allo scalogno
*   **Ingredienti:** Il liquido di cottura degli scalogni CBT (ric. prec.), 100 g jus di vitello CBT, Burro di qualità.
*   **Procedimento:**
    1.  Metti il liquido di cottura degli scalogni in una casseruola.
    2.  Fai ridurre di un terzo, dopodichè frulla a caldo ottenendo una crema liscia e lucida.
    3.  Fai fondere lo jus e incorpora poco alla volta la crema allo scalogno, fino ad ottenere una salsa liscia e vellutata, aiutandoti se necessario con qualche dado di burro freddo.
    4.  Regola di sapore e tieni in caldo.

*   **Finitura del piatto:**
    *   **Ingredienti:** Burro, Sale.
    *   **Procedimento:**
        1.  Estrai il fegato dalla busta e asciugalo.
        2.  Taglia dei tranci di 5 cm di lato e falli rosolare velocemente in una padella con del burro.
        3.  Rigenera gli scalogni nella busta.
        4.  Scalda lo jus.
        5.  Taglia il fegato a fette di mezzo cm, posizionale sul piatto con gli scalogni caldi, nappa con lo jus e servi.

### Funghi porcini, crema di midollo di manzo e gruè di cacao

#### Funghi porcini all'aglio e pepe
*   **Ingredienti:** 1 kg funghi porcini di media grandezza, Olio all'aglio CBT, Olio al pepe CBT, Sale.
*   **Procedimento:**
    1.  Pulisci perfettamente i porcini e tagliali in due nel senso della lunghezza.
    2.  Inseriscili nella busta da cottura e condizionali sottovuoto praticando 5 sgasature.
    3.  Cuocili a 86°C per 15 minuti e abbatti in positivo.

#### Crema di midollo di manzo
*   **Ingredienti:** 400 g midollo di manzo disossato. *1° preparazione:* 150 g panna, 5 g zucchero, 7 g sale, 20 g acqua. *2° preparazione:* 150 g acqua, 150 g latte, 2 g iota, 1 g xantano.
*   **Procedimento:**
    1.  Inserisci il midollo nella busta da cottura e condizionalo sottovuoto.
    2.  Cuocilo a 58°C per 1 ora, mescolandolo ogni 15 minuti.
    3.  A fine cottura apri la busta e filtra il contenuto attraverso un setaccio di acciaio a maglie strette, così da ricavare il midollo puro. I residui solidi andranno eliminati.
    4.  Abbatti il midollo liquido, mescolandolo di tanto in tanto per emulsionare la parte liquida con la parte grassa. Raffreddando, sarà abbastanza sodo da potersi tagliare con il coltello.
    5.  In un Thermomix metti tutti gli ingredienti della prima preparazione e scaldali a 65°C.
    6.  Aggiungi il midollo tagliato a pezzi e frulla bene.
    7.  Nel frattempo, in una casseruola unisci gli ingredienti della seconda preparazione e scaldali a 80°C per un minuto.
    8.  Unisci la crema al composto di midollo frullandolo fino a che non sarà omogeneo.
    9.  Abbatti in positivo e conservala sottovuoto.

*   **Finitura del piatto:**
    *   **Ingredienti:** Burro di qualità, Aglio, Gruè di cacao, Sale in fiocchi.
    *   **Procedimento:**
        1.  Scalda la crema di midollo a 55°C.
        2.  Togli i funghi dalla busta, asciugali e falli rosolare velocemente su entrambi i lati in una padella di ferro con il burro e l'aglio in camicia.
        3.  Versa sui piatti un velo di crema a specchio e posiziona un fungo.
        4.  Aggiungi qualche grano di gruè di cacao e dei fiocchi di sale.

### Midollo di manzo gratinato, salsa di aglio, prezzemolo e limone

#### Midollo di manzo al naturale
*   **Ingredienti:** 6 ossa di manzo con midollo tagliate a barchetta, 2 l acidificazione leggera, 2 l marinatura 40:40.
*   **Procedimento:**
    1.  Acidifica le ossa con midollo per 10 minuti, poi immergile nella marinatura per 12 ore.
    2.  Trascorso questo tempo prelevale dalla marinatura, scolale bene, inseriscile nella busta da cottura e condizionale sottovuoto.
    3.  Cuocile a 58°C per 1 ora e abbatti in positivo.

#### Salsa di aglio, prezzemolo e limone
*   **Ingredienti:** 60 g purea di aglio CBT, 2 g polvere di prezzemolo CBT, 15 g succo di limone, Olio al limone CBT, Olio al pepe nero CBT, Olio EVO, Xantano, Sale.
*   **Procedimento:**
    1.  Mescola la purea di aglio con la polvere di prezzemolo fino a che non sarà perfettamente stemperata.
    2.  Aggiungi qualche goccia di olio al limone e al pepe, poi il succo di limone e una piccola dose di xantano, frullando con un mixer ad immersione.
    3.  Aggiungi l'olio EVO a filo fino a raggiungere la consistenza di un'emulsione densa e vellutata.
    4.  Regola di sale, sgasa e condiziona sottovuoto.

*   **Finitura del piatto:**
    1.  Estrai le ossa dalla busta e posizionale su un cartoccio di carta da forno per non farle rovesciare.
    2.  Mettile in forno a 220°C per 5 minuti con la ventola al minimo.
    3.  Una volta gratinate, posizionale sui piatti e condiscile con la salsa di aglio, prezzemolo e limone.

### Nervetti di manzo con mostarda di mandarini, amarene e arance

#### Nervetti di manzo
*   **Ingredienti:** 2 zampe di bovino rasate, 5 l acidificazione forte, 3 l acqua, 60 g sale, 10 g pepe nero in grani, 2 stecche di cannella, 5 g bacche di ginepro, 5 g chiodi di garofano, 10 g bacche di anice stellato, 5 g semi di coriandolo, 10 foglie di alloro.
*   **Procedimento:**
    1.  Fiammeggia e pulisci perfettamente le zampe, poi sciacquale sotto l'acqua corrente.
    2.  Acidificale per 10 minuti, quindi scolale.
    3.  Inseriscile in una grossa busta da cottura insieme all'acqua, al sale e a tutte le spezie e aromi.
    4.  Abbatti per stabilizzare i liquidi, poi condiziona sottovuoto.
    5.  Cuoci a 74°C per 48 ore.
    6.  Terminata la cottura scola il contenuto della busta separando i liquidi di cottura.
    7.  Spolpa e disossa le zampe con cura, tenendo solo tendini, cartilagini e la pelle che dovrà essere affettata finemente.
    8.  Trasferisci il tutto in una bastardella e amalgamalo velocemente prima che si raffreddi, regolando di sapore con sale e pepe.
    9.  Una volta amalgamato, versa l'impasto in un contenitore quadrato, pressando bene per compattarlo in una forma regolare.
    10. Abbatti in positivo, dopodiché toglilo dalla forma e condizionalo sottovuoto.
    11. Attendi 24 ore prima di utilizzare i nervetti.

#### Mostarda di mandarini in crema
*   **Ingredienti:** Scorze di mandarini canditi CBT, Essenza di senape.
*   **Procedimento:**
    1.  Segui la ricetta degli agrumi canditi usando le scorze dei mandarini.
    2.  Una volta ottenuti, frullali in un hotmix scaldandoli a 85°C e aggiungendo un poco del loro sciroppo per ottenere una crema densa e liscia.
    3.  Aggiungi in sicurezza qualche goccia di essenza di senape, amalgama velocemente e lascia raffreddare a temperatura ambiente.
    4.  Una volta raffreddata la mostarda, conservala sottovuoto.

#### Mostarda di scorze di arance
*   **Ingredienti:** Scorze di arance candite CBT, Essenza di senape.
*   **Procedimento:**
    1.  Esegui la stessa procedura per confezionare le arance candite, e alla fine del procedimento aggiungi in sicurezza qualche goccia di senape, poi lascia raffreddare a temperatura ambiente.
    2.  Una volta raffreddata la mostarda, conservala sottovuoto.

*   **Finitura del piatto:**
    *   **Ingredienti:** Mostarda di amarene.
    *   **Procedimento:**
        1.  Estrai i nervetti dalla busta e con l'affettatrice ricava delle fette sottili.
        2.  Tagliale a quadrati regolari e disponile a scacchiera sul piatto.
        3.  Decorale con la mostarda di mandarini, di amarene e arance e servi.

### Rognone di vitello al caffè, topinambur dorati al miele

#### Rognone di vitello al caffè
*   **Ingredienti:** 1 rognone di vitello, 2 l acidificazione forte, 2 l marinatura 40:40, 200 g grasso di rognone al caffè CBT.
*   **Procedimento:**
    1.  Pulisci il rognone dalla membrana che lo ricopre e dalle cartilagini dure.
    2.  Acidificalo per 10 minuti, poi scolalo e immergilo nella marinatura per 12 ore.
    3.  Trascorso questo tempo, toglilo dalla marinatura e inseriscilo nella busta da cottura insieme al grasso di rognone al caffè spezzettato.
    4.  Condiziona sottovuoto e cuoci a 56°C per 1 ora e abbatti in positivo.

#### Topinambur dorati al miele
*   **Ingredienti:** 1 kg topinambur, 180 g miele, 60 g burro, 0,2 g xantano, Olio al pepe nero CBT, Sale.
*   **Procedimento:**
    1.  Pela e taglia i topinambur a dischetti di 2 cm di diametro e alti 1,5 cm.
    2.  Salali generosamente e falli macerare per 20 minuti.
    3.  Nel frattempo frulla il burro con il miele e lo xantano.
    4.  Trascorso il tempo di macerazione, elimina l'acqua rilasciata dai topinambur e aggiungi il composto di burro e miele amalgamando bene.
    5.  Trasferisci il tutto nella busta da cottura e condiziona sottovuoto praticando una sgasatura.
    6.  Cuoci a 88°C per 40 minuti e abbatti in positivo.

*   **Finitura del piatto:**
    1.  Rigenera il rognone a 50°C per 20 minuti.
    2.  Apri la busta dei topinambur e rovescia tutto il contenuto in una padella.
    3.  A fuoco dolce fai ridurre i succhi e quando la parte acquosa si sarà asciugata, incominceranno a rosolare.
    4.  Falli dorare su entrambi i lati, poi crea una salsa aggiungendo poca acqua e regolando di sapore.
    5.  Apri la busta del rognone e scolalo sulla placca forata.
    6.  Taglialo a fette di 1 cm e disponile sul piatto.
    7.  Accompagnalo con i medaglioni di topinambur e la salsa al miele.

### Lampredotto di manzo, salsa alle scorzonere e uvette

#### Lampredotto di manzo al naturale
*   **Ingredienti:** 1 lampredotto di manzo pulito, 2 l acidificazione leggera, 2 l marinatura 40:40, Essenza vegetale CBT.
*   **Procedimento:**
    1.  Acidifica il lampredotto per 10 minuti, poi immergilo nella marinatura per 24 ore.
    2.  Trascorso questo tempo, scolalo dalla marinatura e inseriscilo nella busta da cottura, aggiungendo pari peso di essenza vegetale.
    3.  Abbatti per stabilizzare i liquidi, condiziona sottovuoto e cuoci a 68°C per 12 ore.
    4.  A cottura terminata separa il lampredotto dal liquido di cottura e abbattilo in positivo.
    5.  Una volta freddo, elimina il grasso rappreso dalle pieghe del lampredotto e conservalo sottovuoto fino al momento dell'uso.
    6.  Filtra e riduci il liquido di cottura fino ad ottenere uno jus, come indicato nella sezione "Metodi" e abbattilo in positivo.

#### Salsa alle scorzonere e uvette
*   **Ingredienti:** 50 g jus di vitello CBT, 50 g jus di lampredotto CBT (ric. prec.), 50 g vino bianco, 50 g verdure per soffritto CBT, 10 g salsa di pomodoro CBT, 20 g brunoise di scorzonere CBT, 10 g uvetta sultanina, Olio al pepe nero CBT, Burro di qualità, Sale.
*   **Procedimento:**
    1.  Trita finemente le uvette.
    2.  Fai rosolare leggermente con poco burro le verdure per soffritto, le scorzonere e le uvette, quindi sfuma con il vino bianco e lascia evaporare.
    3.  Aggiungi gli jus, la salsa di pomodoro e qualche goccia di olio al pepe nero.
    4.  Amalgama il tutto e montalo con il burro, regolando di sapore e densità, poi tieni in caldo.

*   **Finitura del piatto:**
    1.  Rigenera il lampredotto a 70°C per 20 minuti, poi scolalo bene dai liquidi e taglialo a fette regolari.
    2.  Disponilo sul piatto e nappalo con la salsa ben calda e servi.

### Trippa nido d'ape alla milanese

#### Trippa di manzo nido d'ape
*   **Ingredienti:** 1 trippa di manzo nido d'ape, 2 l acidificazione leggera, 2 l marinatura 40:40, Acqua.
*   **Procedimento:**
    1.  Taglia la trippa in due pezzi per aprirla completamente, poi acidificala per 10 minuti.
    2.  Trasferiscila nella marinatura per 12 ore.
    3.  Trascorso questo tempo, scola la trippa dalla marinatura e inseriscila nelle buste da cottura tenendola ben stesa.
    4.  Aggiungi alla trippa metà del suo peso di acqua, quindi condiziona sottovuoto.
    5.  Cuoci a 74°C per 24 ore e abbatti in positivo.

#### Jus di trippa bovina
*   **Ingredienti:** 2 kg ritagli di trippa bovina, 1 kg acqua.
*   **Procedimento:**
    1.  Taglia la trippa a strisce fini, poi inseriscila nella busta da cottura e condizionala sottovuoto insieme all'acqua.
    2.  Cuoci a 86°C per 15 ore e a cottura ultimata, procedi a chiarificazione e riduzione.
    3.  Una volta ridotto, conservalo sottovuoto in positivo.

#### Fagioli zolfini
*   **Ingredienti:** 500 g fagioli zolfini secchi, 2 l acqua per ammollo, 2 l acqua per cottura, 2 spicchi di aglio in camicia, Alloro, rosmarino, salvia, 15 g sale.
*   **Procedimento:**
    1.  Metti i fagioli zolfini nella busta da conservazione insieme all'acqua di ammollo.
    2.  Condiziona sottovuoto e lasciali idratare in frigorifero per 4 ore.
    3.  Trascorso questo tempo apri la busta, scolali e risciacquali sotto acqua corrente.
    4.  Inseriscili nella busta da cottura insieme all'acqua per cottura, sale, aglio e ad un bouquet di erbe aromatiche.
    5.  Abbatti per stabilizzare i liquidi, poi condizionali sottovuoto praticando 3 sgasature.
    6.  Cuoci a 88°C per 2 ore e abbatti in positivo.

*   **Finitura del piatto:**
    *   **Ingredienti:** 100 g brunoise per soffritto CBT, 100 g fagioli zolfini CBT, 100 g jus di trippa CBT, 50 g jus di manzo CBT, 30 g umami di pomodori CBT, Burro di qualità, Olio al pepe nero CBT, Sale.
    *   **Procedimento:**
        1.  Prepara la salsa di condimento sciogliendo in una casseruola lo jus di trippa e lo jus di manzo.
        2.  Unisci la brunoise, l'umami di pomodori, i fagioli zolfini e qualche goccia di olio al pepe e quando sarà ben caldo montalo aggiungendo il burro freddo a dadini.
        3.  Regola di sapore e densità e tienila in caldo.
        4.  Rigenera la trippa a 80°C per 20 minuti, poi scolala dai liquidi di cottura, tagliala con un coppapasta rotondo e posizionala al centro del piatto.
        5.  Nappala con la salsa e servi.

### Costine di agnello laccate, carciofi aglio alloro e pepe

#### Costine di agnello al naturale
*   **Ingredienti:** 4 baffe di costine di agnello, 2 l acidificazione leggera, 2 l marinatura 30:30.

    2.  Trascorso questo tempo, scolale dalla marinatura e inseriscile nella busta da cottura.

#### Carciofi aglio alloro e pepe

    2.  Condiscili con sale, pepe, aglio e alloro tritati e poco olio EVO.

### Bombette

#### Coppa di maiale per bombette o involtini
*   **Ingredienti:** 1 coppa di maiale intera, 2 l acidificazione forte, 1 l marinatura 50:30.
*   **Procedimento:**
    1.  Acidifica la coppa per 10 minuti, poi scolala e immergila nella marinatura per 36 ore.
    2.  Trascorso questo tempo, scola dalla marinatura la carne e condizionala sottovuoto nella busta da cottura.
    3.  Cuocila a 58°C per 12 ore, abbatti in positivo e attendi 24 ore prima di utilizzarla.
    4.  Al momento dell'utilizzo estraila dalla busta, asciugala e dividila in due pezzi uguali praticando un taglio obliquo, così da ottenere delle fette dalla superficie più ampia possibile.

#### Clorofilla di prezzemolo
*   **Ingredienti:** 100 g foglie di prezzemolo, 400 g acqua fredda a 2°C.
*   **Procedimento:**
    1.  Metti a ghiacciare due litri di acqua in un contenitore abbastanza capiente per ottenere uno strato di ghiaccio di 3-4 cm e tienilo così fino al momento dell'utilizzo.
    2.  Monda e lava accuratamente le foglie di prezzemolo, trasferiscile in un frullatore insieme all'acqua.
    3.  Frullale velocemente senza scaldare il composto, dopodiché setaccialo attraverso un'etamina, strizzando bene il residuo solido, che andrà eliminato.
    4.  Trasferisci il liquido nella busta da cottura, abbatti per stabilizzarlo, poi condizionalo sottovuoto.
    5.  Cuoci a 64°C per 1 ora, mescolando ogni 10 minuti.
    6.  A fine cottura appoggia un canovaccio a trame fitte, bagnato e strizzato, ben steso sulla superficie del contenitore in cui si trova la lastra di ghiaccio, affinché lo copra completamente. I lembi del canovaccio devono fuoriuscire dai bordi del contenitore.
    7.  Apri la busta e versa sul canovaccio il contenuto, distribuendolo su tutta la superficie. In questo modo il ghiaccio raffredderà immediatamente la clorofilla preservandone le caratteristiche ed il colore, mentre lo straccio farà scolare l'acqua che si sarà separata durante la cottura.
    8.  Quando il composto si sarà raffreddato (ci vorranno 5/7 minuti), trasferisci il canovaccio sopra una griglia forata sempre tenendolo ben steso, per permettere all'acqua residua di gocciolare. Metti la griglia forata in frigorifero per 1 ora. In questa fase la clorofilla non andrà toccata.
    9.  Trascorso questo tempo, raccogli con una spatola la clorofilla, che risulterà molto densa e di un colore verde vivace. Inseriscila nella busta, condizionala sottovuoto e abbattila in negativo.
    10. Una volta scongelata si sarà separata l'acqua residua dalla clorofilla. Filtrala ulteriormente utilizzando un'etamina, per ottenere una clorofilla molto concentrata.

#### Purea di aglio
*   **Ingredienti:** 12 spicchi di aglio, Sale.
*   **Procedimento:**
    1.  Pela gli spicchi di aglio ed elimina le parti scure.
    2.  Inseriscili nella busta da cottura e condizionali sottovuoto praticando 3 sgasature.
    3.  Cuoci a 88°C per 1 ora e abbatti in positivo.
    4.  Preleva l'aglio dalla busta e frullalo fino a farlo diventare una purea densa.
    5.  Regola di sale e conserva sottovuoto o in positivo o in negativo.

#### Pancetta arrotolata stagionata
*   **Ingredienti:** 2 kg pancetta arrotolata stagionata.
*   **Procedimento:**
    1.  Taglia le corde esterne e l'involucro che avvolge la pancetta.
    2.  Spazzola le eventuali tracce di muffa e sciacquala sotto acqua corrente, poi inseriscila nella busta da cottura.
    3.  Condiziona sottovuoto e cuocila a 68°C per 12 ore.
    4.  A cottura ultimata toglila dalla busta, scola i liquidi e arrotolala ben stretta nella pellicola per mantenerla tale.
    5.  Abbattila in positivo e quando sarà fredda condizionala sottovuoto.

#### Confezionamento bombette
*   **Ingredienti:** Coppa di maiale CBT (ric. prec.), 400 g caciocavallo poco stagionato, Pancetta arrotolata stagionata CBT (ric. prec.), Olio al pepe nero CBT, Purea di aglio CBT (ric. prec.), Clorofilla di prezzemolo CBT (ric. prec.).
*   **Procedimento:**
    1.  Mescola, a tuo gusto, la purea di aglio con un po' di clorofilla di prezzemolo e qualche goccia di olio al pepe nero, per ottenere una crema che sarà il condimento delle bombette.
    2.  Con l'affettatrice taglia la coppa a fette di 2 mm di spessore.
    3.  Affetta la pancetta molto sottile.
    4.  Taglia il caciocavallo in bastoncini di mezzo cm di lato e lunghi 2,5 cm.
    5.  Stendi le fette di coppa, spalma un leggero strato di crema di aglio e prezzemolo, aggiungi una fetta ben stesa di pancetta e posiziona un bastoncino di caciocavallo nella parte bassa della fetta.
    6.  Piega verso l'interno i lati più lunghi della fetta di coppa, costringendo i lati estremi del formaggio, poi arrotola partendo sempre dalla parte del formaggio. Così facendo otterrai delle bombette chiuse perfettamente.
    7.  Ripeti questa operazione fino ad esaurimento degli ingredienti, poi avvolgi ben stretta ogni bombetta nella pellicola da cottura.
    8.  Con la punta di un ago fai qualche forellino sulla pellicola, dopo inserisci le bombette nella busta da cottura e condizionale sottovuoto.
    9.  Cuocile a 65°C per 20 minuti, quindi abbatti in positivo o in negativo.

*   **Finitura del piatto:**
    *   **Ingredienti:** Olio EVO, Sale, pepe macinato.
    *   **Procedimento:**
        1.  Togli le bombette dalla busta e dalla pellicola, poi infilane quattro pezzi su due spiedini paralleli.
        2.  Ungile con poco olio e rosolale a fuoco dolce, regola di sale e pepe e servi.

### Cassoeula

#### Jus di cassoeula
*   **Ingredienti:** 2 kg verza, 300 g cipolle, 150 g carote, 75 g sedano, 2 kg musetto di maiale, 300 g riduzione di vino bianco, 1 l acqua fredda, 100 g salsa di pomodoro CBT.
*   **Procedimento:**
    1.  Pulisci e affetta finemente tutte le verdure.
    2.  Taglia il musetto a pezzi regolari.
    3.  Mescola le verdure insieme al musetto di maiale, poi aggiungi il vino bianco e la salsa di pomodoro.
    4.  Lascia riposare un'ora in frigorifero affinché le verdure possano macerarsi.
    5.  Trasferisci il tutto in più buste da cottura e aggiungi l'acqua dividendola proporzionalmente per ogni busta.
    6.  Condiziona sottovuoto praticando 3 sgasature.
    7.  Cuoci a 86°C per 15 ore, dopodiché per ottenere lo jus procedi con filtrazione, chiarificazione e riduzione.
    8.  Durante il processo di chiarificazione conserva a parte il grasso di affioramento, servirà per il condimento delle verze.

#### Verza stufata per cassoeula
*   **Ingredienti:** 2 Kg verza, Jus di cassoeula CBT (ric. prec.), 100 g grasso di cassoeula CBT (ric. prec.), 300 g brunoise per soffritto CBT, Semi di coriandolo, carvi, cannella, chiodi di garofano, noce moscata, anice stellato, Sale.
*   **Procedimento:**
    1.  Tosta le spezie secondo le proporzioni che preferisci e pestale nel mortaio fino a ottenere una polvere fine.
    2.  Pulisci e affetta grossolanamente la verza, condiscila con il sale e lasciala macerare per 10 minuti.
    3.  Trascorso questo tempo elimina l'acqua che avrà rilasciato, aggiungi lo jus tagliato a pezzi, il grasso di affioramento, la brunoise e la polvere delle spezie amalgamando bene il tutto.
    4.  Trasferisci questo composto nelle buste da cottura e condiziona sottovuoto praticando 3 sgasature.
    5.  Cuoci a 88°C per 2 ore, dopodiché apri la busta, separa le verze dal liquido di cottura e abbattili in positivo.
    6.  Conserva la verza sottovuoto fino al momento dell'utilizzo.
    7.  I liquidi, compresa la parte grassa, saranno l'essenza di verze per la cottura delle costine.

#### Costine di maiale per cassoeula
*   **Ingredienti:** 2 kg costine di maiale alte 6 cm, 3 l acidificazione leggera, 3 l marinatura 30:30, Essenza di verze CBT (ric. prec.).
*   **Procedimento:**
    1.  Taglia le costine ad osso singolo e acidificale per 10 minuti.
    2.  Falle marinare per 24 ore e in seguito scolale.
    3.  Inseriscile nella busta da cottura e condizionale sottovuoto insieme all'essenza di verze, praticando 2 sgasature.
    4.  Cuoci a 68°C per 12 ore, scola la carne dal liquido di cottura e abbattila in positivo.
    5.  Conserva sottovuoto le costine fino al momento dell'uso.
    6.  Abbatti il liquido di cottura, sgrassalo e tienilo da parte per la composizione della cassoeula.

#### Essenza di cassoeula
*   **Ingredienti:** I liquidi ricavati dalla cottura delle costine CBT.
*   **Procedimento:**
    1.  Filtra e chiarifica i liquidi, poi falli ridurre finché non otterrai un'essenza molto concentrata e saporita.
    2.  Abbatti in positivo e tienila da parte.

#### Composizione della cassoeula
*   **Ingredienti:** 1 kg musetto di maiale CBT (ric. prec.), 500 g cotenne di maiale CBT, 1 kg verzini CBT, Verza stufata per cassoeula CBT (ric. prec.), Costine di maiale CBT (ric. prec.), Essenza di cassoeula CBT (ric. prec.), Poco grasso di cassoeula CBT (ric. prec.), Poco burro, Mix di oli aromatici di salvia e rosmarino CBT.
*   **Procedimento:**
    1.  Taglia il musetto e le cotenne a pezzi di 5 cm circa.
    2.  Mescola tutti gli ingredienti nelle proporzioni che preferisci.
    3.  Regola di sapore con sale e pepe e il mix di oli aromatici.
    4.  Condizionali sottovuoto in buste da cottura e conservali in positivo.

*   **Finitura del piatto:**
    1.  Rigenera le buste di cassoeula a 74°C per 25 minuti.
    2.  Apri le buste e disponi il contenuto sui piatti di portata, servi.

### Coppa di maiale iberico, patate sabbiate ai jalapeños verdi, jus di maiale allo jerez e pepe verde

#### Coppa di maiale iberico al naturale
*   **Ingredienti:** 1 coppa di maiale iberico, 2 l acidificazione forte, 2 l marinatura 40:40.
*   **Procedimento:**
    1.  Pulisci e acidifica la coppa per 10 minuti, quindi scolala e mettila a marinare per 24 ore.
    2.  Trascorso questo tempo, scola la carne dalla marinatura.
    3.  Avvolgila ben stretta nella pellicola ottenendo un cilindro omogeneo e con la punta di un ago fora il rotolo in diversi punti.
    4.  Inseriscila nella busta da cottura, condiziona sottovuoto e cuoci a 58°C per 12 ore, poi abbatti in positivo.

#### Patate sabbiate ai jalapeños verdi
*   **Ingredienti:** 1 kg patate novelle, 150 g farina per polenta istantanea, 10 g fiocchi di jalapeños verdi, Olio EVO, Sale.
*   **Procedimento:**
    1.  Lava le patate pulendo perfettamente la buccia, poi tagliale a rondelle alte mezzo centimetro.
    2.  Salale abbondantemente e falle macerare per 20 minuti.
    3.  Scolale dall'acqua che avranno rilasciato e inseriscile in modo ordinato nelle buste da cottura.
    4.  Condiziona sottovuoto praticando una sgasatura, cuoci a 88°C per 20 minuti e abbatti in positivo.
    5.  Frulla a impulsi i fiocchi di jalapeños verdi insieme alla farina per polenta, per uniformare le dimensioni.
    6.  Estrai le patate dalla busta, ungile con l'olio evo e ricoprile con uno strato leggero di panatura ai jalapeños.

#### Jus di maiale allo jerez
*   **Ingredienti:** 100 g jus di maiale CBT, 25 g jerez, Olio al pepe verde CBT, 50 g burro, Sale.
*   **Procedimento:**
    1.  Fondi lo jus di maiale, poi unisci lo jerez e fai evaporare l'alcool.
    2.  Aggiungi qualche goccia di olio al pepe verde, quindi montalo con il burro, regolalo di sapore e densità e tienilo da parte.

*   **Finitura del piatto:**
    *   **Ingredienti:** Burro chiarificato CBT.
    *   **Procedimento:**
        1.  Togli la coppa dalla busta e asciugala.
        2.  Ricava dei medaglioni alti 4 cm e falli rosolare nel burro chiarificato.
        3.  Scalda le patate sabbiate e lo jus.
        4.  Disponi i medaglioni di coppa sul piatto insieme alle patate, poi nappali con lo jus di maiale al jerez e servi.

### Coppa di maialino dorata e croccante, cannolo di peperone di Carmagnola e cipolla di Giarratana, jus alla senape

#### Coppa di maialino al naturale
*   **Ingredienti:** 1 coppa di maialino con la cotenna, 2 l acidificazione leggera, 2 l marinatura 50:30.
*   **Procedimento:**
    1.  Acidifica la coppa per 10 minuti, quindi immergila nella marinatura per 24 ore.
    2.  Trascorso questo tempo, scola dalla marinatura la carne e trasferiscila nella busta da cottura.
    3.  Condiziona sottovuoto e cuoci a 68°C per 12 ore, poi apri la busta e separa la coppa dal liquido di cottura.
    4.  Abbatti la coppa in positivo, mentre i liquidi andranno trattati in modo da ottenere uno jus.

#### Jus di maiale alla senape
*   **Ingredienti:** Jus di maiale CBT, Jus di coppa di maialino CBT (ric. prec.), Senape in pasta, Sale, Burro.
*   **Procedimento:**
    1.  Fondi lo jus di maiale insieme allo jus di coppa salato e montalo con il burro.
    2.  Aggiungi poca senape per volta fino a raggiungere il sapore desiderato.
    3.  Regola di sale e densità e tienilo da parte.

#### Peperoni di Carmagnola al naturale
*   **Ingredienti:** 4 peperoni rossi di Carmagnola, Sale.
*   **Procedimento:**
    1.  Lava e asciuga i peperoni, poi fiammeggiali per bruciare tutta la buccia.
    2.  Spazzolali e lavali per averli pelati a vivo.
    3.  Ricava dai peperoni delle grosse falde senza semi.
    4.  Salali leggermente e falli macerare per 10 minuti.
    5.  Trascorso questo tempo, scola i peperoni dai liquidi che avranno rilasciato.
    6.  Inseriscili nella busta da cottura e condizionali sottovuoto, praticando 3 sgasature.
    7.  Precuocili a 55°C per 30 minuti e abbatti in positivo.
    8.  Successivamente cuocili a 88°C per 30 minuti, quindi abbatti in positivo.

#### Cipolla di Giarratana umami
*   **Ingredienti:** 2 cipolle di Giarratana, Sale.
*   **Procedimento:**
    1.  Pela le cipolle e tagliale a petali della larghezza di 2 cm.
    2.  Salale leggermente e falle macerare per 10 minuti.
    3.  Trascorso questo tempo scolale dai liquidi che avranno rilasciato.
    4.  Inseriscile nella busta da cottura e condizionale sottovuoto, praticando 3 sgasature.
    5.  Cuoci a 88°C per 3 ore, poi apri la busta e scolale perfettamente attraverso un setaccio per separare le cipolle dal liquido che avranno rilasciato in cottura.
    6.  Abbatti le cipolle in positivo.
    7.  Metti il liquido di cottura in una casseruola e fallo ridurre a fuoco dolce finché non raggiungerà la temperatura di 102°C, poi abbatti in positivo.
    8.  Amalgama le cipolle con la riduzione ottenuta e conservala sottovuoto.

*   **Finitura del piatto:**
    *   **Ingredienti:** Olio EVO, Sale.
    *   **Procedimento:**
        1.  Estrai le falde dei peperoni dalla busta e con un coltello ottieni dei grossi quadrati regolari.
        2.  Posiziona qualche petalo di cipolla sulla parte bassa dei peperoni e arrotolali ottenendo così dei cannoli ripieni di cipolla.
        3.  Condiscili con olio e sale e scaldali in forno per qualche minuto.
        4.  Prendi la coppa e con un coltellino incidi la cotenna a rombi.
        5.  Spennellala con l'olio e mettila in forno a 240°C fino a completa doratura.
        6.  Taglia la coppa a fette spesse, posizionala sui piatti di portata e nappala con lo jus alla senape.
        7.  Aggiungi un cannolo di peperone e servi.

*   **Ingredienti:** 1 kg cavolo cappuccio rosso, 100 g aceto di vino rosso, 100 g acqua, 75 g zucchero, 10 g sale, 2 g semi di cumino, 2 g pepe nero in grani, Sale per macerare.

    9.  Cuocile a 88°C per 30 minuti, poi abbatti in positivo.

#### Jus di maiale affumicato alle spezie
*   **Ingredienti:** 200 g jus di maiale CBT, 5 g umami di cipolle CBT, 5 g umami di peperoni rossi CBT, 60 g grasso di coppa CBT (ric. prec.), Burro di qualità.
*   **Procedimento:**
    1.  Fondi lo jus di maiale, aggiungi gli umami e successivamente il grasso della cottura e una parte di burro freddo a dadini per montarlo.
    2.  Una volta montato, regola di sapore e densità e tieni in caldo.

*   **Finitura del piatto:**
    *   **Ingredienti:** Panini morbidi, Cipolle rosse in agrodolce di lamponi CBT.
    *   **Procedimento:**
        1.  Rigenera in busta il pulled pork a 60°C per 20 minuti.
        2.  Apri la busta e utilizzalo direttamente per farcire i panini.
        3.  Condisci la carne con lo jus affumicato, aggiungi il cavolo bianco e le cipolle, chiudi il panino e servi.

### Secreto di maiale iberico, patate arrosto, jus ai peperoni

#### Secreto di maiale iberico al naturale
*   **Ingredienti:** 3 secreti di maiale iberico interi, 3 l acidificazione forte, 3 l marinatura 30:20, 15 g transglutaminase da sciogliere in 75 g di acqua fredda a 20°C (da fare poco prima dell'uso).
*   **Procedimento:**
    1.  Fai acidificare i secreti per 10 minuti, poi scola e asciuga.
    2.  Spennella la soluzione di transglutaminase sul lato superiore del primo secreto.
    3.  Posizionaci sopra il secondo secreto in modo che i bordi combacino con quelli sottostanti.
    4.  Spennella anche la superficie del secondo secreto con la transglutaminase e coprilo con l'ultimo dei tre secreti.
    5.  Avvolgili con della pellicola in modo che possano rimanere in forma, poi inseriscili nella busta da conservazione e condiziona sottovuoto.
    6.  Metti in frigorifero per 12 ore, affinché possa agire la transglutaminase.
    7.  Successivamente, togli il secreto da busta e pellicola e fallo marinare per 24 ore.
    8.  Trascorso questo tempo, scola il secreto, condizionalo sottovuoto in una busta da cottura e cuocilo a 55°C per 12 ore, quindi abbatti in positivo.

#### Patate arrosto
*   **Ingredienti:** 1 kg patate, Sale, 20 g polvere di cipolle CBT, 50 g senape in pasta, Paprika dolce, 50 g olio.
*   **Procedimento:**
    1.  Pela e taglia le patate a cubi di 2 cm di lato.
    2.  Salale generosamente e lasciale macerare per 20 minuti.
    3.  Scolale dall'acqua che avranno rilasciato, poi condiscile con senape, polvere di cipolle, paprika ed infine l'olio.
    4.  Inserisci tutto il composto nella busta da cottura e condiziona sottovuoto praticando una sgasatura.
    5.  Cuoci a 88°C per 20 minuti e abbatti in positivo.

#### Jus di maiale ai peperoni
*   **Ingredienti:** 100 g jus di maiale CBT, 10 g umami di peperoni rossi CBT, Burro di qualità, Sale.
*   **Procedimento:**
    1.  Fondi lo jus e montalo con il burro freddo fino ad ottenere una emulsione stabile e vellutata.
    2.  Aggiungi l'umami poco per volta, poi regola di sale e di densità.

*   **Finitura del piatto:**
    *   **Ingredienti:** Olio EVO.
    *   **Procedimento:**
        1.  Togli il secreto dalla busta, asciugalo e taglialo a fette spesse.
        2.  Ungilo con poco olio e griglialo su tutti i lati.
        3.  Apri la busta delle patate e versa il contenuto su una teglia coperta con carta da forno.
        4.  Aggiungi un filo di olio EVO e falle arrostire in forno a 220°C mescolandole di tanto in tanto per uniformare la doratura.
        5.  Affetta il secreto, posizionalo sul piatto insieme alle patate e nappalo con lo jus.

### Anatra all'arancia

#### Cosce d'anatra all'arancia
*   **Ingredienti:** 8 cosce d'anatra, 2 l acidificazione leggera, 200 g purea di arance per marinare CBT, 250 g grasso di anatra all'aglio e alloro CBT.
*   **Procedimento:**
    1.  Pulisci le cosce di anatra, acidificale per 10 minuti e scolale.
    2.  Spalma uno strato abbondante di purea di arance su tutta la superficie delle cosce, quindi condizionale sottovuoto e lasciale marinare per 24 ore.
    3.  Trascorso questo tempo, estrai le cosce dalla busta ed elimina sommariamente la purea di arance.
    4.  Inseriscile nella busta da cottura, condizionale sottovuoto insieme al grasso di anatra aromatizzato e cuoci a 68°C per 18 ore.
    5.  A cottura ultimata, separa le cosce dal liquido rilasciato.
    6.  Il liquido di cottura andrà sgrassato, chiarificato, ridotto e successivamente inserito nello jus di anatra in fase di finitura del piatto.
    7.  Abbatti in positivo la carne, poi condizionala sottovuoto fino al momento dell'utilizzo.

#### Petto d'anatra all'arancia
*   **Ingredienti:** 8 petti d'anatra, 2 l acidificazione forte, 200 g purea di arance per marinare CBT.
*   **Procedimento:**
    1.  Pulisci i petti di anatra, acidificali per 10 minuti e scolali.
    2.  Spalma uno strato abbondante di purea di arance su tutta la superficie dei petti, condizionali sottovuoto nella busta da conservazione e lasciali marinare per 24 ore.
    3.  Trascorso questo tempo, estraili dalla busta ed elimina sommariamente la parte eccedente di marinatura, poi arrotola ogni petto nella pellicola creando dei cilindri ben stretti e dalla forma omogenea.
    4.  Metti sottovuoto nella busta da cottura e cuoci a 54°C per 2 ore e mezza, poi abbatti in positivo e attendi 24 ore prima di utilizzarli.

#### Fichi semidry
*   **Ingredienti:** 8 fichi maturi e sodi, Zucchero a velo.
*   **Procedimento:**
    1.  Lava i fichi e tagliali a metà.
    2.  Spolverali di zucchero a velo e falli disidratare per 2 ore in essiccatore a 70°C.
    3.  Abbattili in positivo, poi trasferiscili nella busta da cottura e condizionali sottovuoto.
    4.  Precuocili a 55°C per 30 minuti e abbattili in positivo.
    5.  Successivamente cuocili a 84°C per 20 minuti e abbattili in positivo.

#### Ciliegie al naturale
*   **Ingredienti:** 8 ciliegie grosse e sode.
*   **Procedimento:**
    1.  Elimina il picciolo dalle ciliegie e lavale.
    2.  Inseriscile nella busta da cottura e condiziona sottovuoto praticando una sgasatura.
    3.  Precuocile a 55°C per 30 minuti e abbatti in positivo.
    4.  Successivamente cuocile a 84°C per 12 minuti, quindi abbattile in positivo.

#### Susine semidry
*   **Ingredienti:** 8 susine piccole e sode, Zucchero a velo.
*   **Procedimento:**
    1.  Lava le susine, tagliale a metà ed elimina il nocciolo.
    2.  Disponile sui vassoi dell'essiccatore e falle disidratare per 2 ore a 70°C, poi abbattile in positivo.
    3.  Trascorso questo tempo inseriscile nella busta da cottura e condizionale sottovuoto.
    4.  Precuocile a 55°C per 30 minuti e abbattile in positivo.
    5.  Successivamente cuocile a 84°C per 20 minuti quindi abbatti in positivo.

*   **Finitura del piatto:**
    *   **Ingredienti:** Jus di anatra CBT montato, Scorze d'arancia candite CBT tagliate a filettini, Burro chiarificato CBT, Burro di qualità, Rametti di timo fresco, 2 spicchi di aglio in camicia, Grand Marnier.
    *   **Procedimento:**
        1.  Rosola nel burro chiarificato le cosce di anatra e i petti, poi elimina il burro della rosolatura e aggiungi il burro normale, il timo e l'aglio in camicia e fallo schiumare sulla carne.
        2.  Scalda lo jus di anatra e aromatizzalo aggiungendo poco Grand Marnier.
        3.  In una padella scalda i fichi, le susine e le ciliegie con poco burro normale e regola di sale.
        4.  Disponi sul piatto la coscia, il petto tagliato e la frutta al burro.
        5.  Nappa la carne con lo jus e decora con qualche filettino di scorza di arancia.

### Pastille di piccione

#### Ali di piccione al naturale
*   **Ingredienti:** 2 kg ali di piccione, 2 l acidificazione forte, 200 g grasso di piccione CBT.
*   **Procedimento:**
    1.  Acidifica le ali di piccione per 10 minuti, poi scolale e asciugale.
    2.  Salale, mescolale al grasso di piccione e inseriscile nella busta da cottura.
    3.  Condiziona sottovuoto e cuoci a 66°C per 4 ore.
    4.  A fine cottura apri la busta, scola le ali dal liquido di cottura e disossale con cura, ricavando la polpa priva di qualsiasi residuo coriaceo, quindi abbattila in positivo.
    5.  Abbatti il liquido di cottura e separa la parte grassa, servirà per la ricetta successiva.

#### Burro aromatico per pastilla
*   **Ingredienti:** 150 g burro, 100 g acqua, 0,4 g pistilli zafferano, 5 g bacche di anice stellato, 10 g pepe nero in grani, 3 g semi di coriandolo, 3 g cardamomo, 1 g curcuma in polvere, 3 g cannella regina in polvere, 2 g zenzero in polvere.
*   **Procedimento:**
    1.  Tosta tutte le spezie (tranne quelle in polvere) e raffreddale.
    2.  Mescola l'acqua con tutte le spezie, comprese quelle in polvere e versale in un blender. Frulla fino ad ottenere un composto liscio.
    3.  Inseriscile nella busta da cottura, condiziona sottovuoto e lascia riposare in frigorifero per 12 ore.
    4.  Trascorso questo tempo apri la busta, aggiungi il burro e condiziona sottovuoto nuovamente.
    5.  Cuoci a 86°C per 2 ore e trasferiscilo nella vasca a ultrasuoni per 2 ore a 50°C.
    6.  Terminato questo trattamento di estrazione, scola e strizza i residui delle spezie dal burro, poi fallo raffreddare in un bagnomaria ghiacciato mescolando di tanto in tanto per ricreare l'emulsione.

#### Ripieno della pastilla
*   **Ingredienti:** 1 kg carne delle ali di piccione CBT (ric. prec.), 100 g fondo di cottura sgrassato CBT (ric. prec.), 200 g uvetta, 200 g mandorle pelate fritte, 300 g cipolle umami CBT, 50 g burro aromatico per pastilla CBT (ric. prec.), 400 g tuorlo, Sale.
*   **Procedimento:**
    1.  Amalgama tutti gli ingredienti e passali al tritacarne con la piastra da 5 mm.
    2.  Regola di sale e condiziona sottovuoto fino al suo utilizzo.

*   **Finitura del piatto:**
    *   **Ingredienti:** 100 g tuorli, Fogli di carta di riso per involtini, Olio per friggere, Zucchero a velo, Cannella in polvere.
    *   **Procedimento:**
        1.  Taglia la carta di riso a strisce larghe, spennellala con il tuorlo e aggiungi un cucchiaino di ripieno sulla parte bassa, poi confeziona dei triangoli cercando di tenere la pasta ben stretta attorno al ripieno.
        2.  Spennella con il tuorlo anche la superficie esterna e successivamente abbattili in negativo.
        3.  Una volta surgelati, friggili a 170°C fino a che non saranno croccanti.
        4.  Asciugali sulla carta assorbente e servili con una generosa spolverata di zucchero a velo e cannella in polvere.

### Piccione al ginepro, cuore di cavolo nero

#### Petto di piccione al naturale
*   **Ingredienti:** 6 petti di piccione, 2 l acidificazione forte, 2 l marinatura 25:15.
*   **Procedimento:**
    1.  Pulisci i petti di piccione e acidificali per 10 minuti, poi falli marinare per 12 ore.
    2.  Trascorso questo tempo, toglili dalla marinatura e asciugali.
    3.  Con l'aiuto della pellicola alimentare forma un cilindro stretto e con la punta di un ago fora in diversi punti la pellicola.
    4.  Trasferiscili nella busta da cottura e condizionali sottovuoto.
    5.  Cuoci a 52°C per 50 minuti e abbatti in positivo.
    6.  Attendi 24 ore prima di utilizzarli.

#### Cosce di piccione arrosto
*   **Ingredienti:** 12 cosce di piccione, 2 l acidificazione forte, 2 l marinatura 25:15, 100 g grasso di piccione CBT (o altro volatile), Olio all'aglio CBT, Olio all'alloro CBT, Olio al timo CBT.
*   **Procedimento:**
    1.  Pulisci e scalza l'osso delle cosce, acidificale per 10 minuti, poi scolale e trasferiscile nella marinatura per 12 ore.
    2.  Nel frattempo fai un mix con i tre oli aromatici e uniscilo al grasso di piccione.
    3.  Trascorso questo tempo togli le cosce dalla marinatura e asciugale.
    4.  Distribuisci il grasso sulle cosce, poi inseriscile nella busta da cottura e condiziona sottovuoto.
    5.  Cuoci a 62°C per 3 ore, quindi abbatti in positivo.

#### Paté di fegatini di piccione
*   **Ingredienti:** 150 g fegatini di piccione, 10 g burro all'aglio CBT, 10 g burro all'alloro CBT, 10 g burro al pepe lungo del Bengala CBT, Sale.
*   **Procedimento:**
    1.  Pulisci con cura i fegatini di piccione e tagliali in piccoli pezzi.
    2.  Condiscili con poco sale, poi trasferisci il composto nella busta da cottura, unisci i burri aromatici e condiziona sottovuoto.
    3.  Cuocili a 62°C per 40 minuti e abbatti in positivo.
    4.  Una volta raffreddati, togli il contenuto dalla busta, mettilo in una bastardella e lavoralo vigorosamente con una spatola di gomma, per rendere il composto liscio e uniforme.
    5.  Regolalo di sapore, inseriscilo nella busta da cottura e condizionalo sottovuoto.

#### Cavolo nero al naturale
*   **Ingredienti:** 500 g cuori di cavolo nero, 500 g acqua, 7,5 g sale.
*   **Procedimento:**
    1.  Stempera il sale nell'acqua.
    2.  Lava i cuori di cavolo nero, scolali bene e inseriscili nella busta da cottura insieme all'acqua e al sale.
    3.  Condizionali sottovuoto praticando 5 sgasature.
    4.  Cuoci a 90°C per 1 ora e abbatti in positivo.

*   **Finitura del piatto:**
    *   **Ingredienti:** Jus di piccione CBT, Olio al ginepro CBT, Burro chiarificato CBT, Burro di qualità, Aglio, Bacche di ginepro, Sale, Pepe.
    *   **Procedimento:**
        1.  Fondi lo jus e montalo con il burro freddo. Quando sarà montato aggiungi qualche goccia di olio al ginepro e regola di sapore e densità.
        2.  Togli i petti di piccione dalla busta e dalla pellicola e asciugali.
        3.  Rosolali sulla pelle con il burro chiarificato, dopodiché elimina il burro chiarificato, aggiungi il burro, aglio in camicia e bacche di ginepro e fai schiumare, regolando di sapore.
        4.  Ripeti la stessa operazione per le cosce.
        5.  Togli il cavolo nero dalla busta, asciugalo e fallo saltare in padella con poco burro fuso, giusto il tempo di riscaldarsi, regola di sapore e tieni da parte.
        6.  Rigenera i fegatini a 50°C, poi trasferiscili in una ciotola e forma delle quenelle.
        7.  Quando sarà tutto caldo, impiatta con armonia tutti gli elementi, nappa la carne con lo jus di piccione al ginepro e servi.

### Riccioli di foie gras al naturale e fava di Tonka

#### Foie gras d'oca al naturale
*   **Ingredienti:** 1 foie gras d'oca intero.
*   **Procedimento:**
    1.  Lascia ammorbidire il foie gras a temperatura ambiente e devenalo.
    2.  Arrotolalo nella pellicola per ottenere un cilindro compatto.
    3.  Rassodalo in abbattitore poi inseriscilo nella busta da cottura e condizionalo sottovuoto.
    4.  Cuocilo a 54°C per 40 minuti, quindi raffreddalo velocemente in un bagnomaria ghiacciato.
    5.  Fallo riposare 24 ore in frigorifero, poi abbattilo in negativo.
    6.  Togli la busta e la pellicola dalla parte di foie gras che intendi utilizzare.
    7.  Senza scongelarlo taglialo con l'affettatrice affinché si formino dei riccioli.
    8.  Posizionali immediatamente sul piatto, condisci con qualche fiocco di sale e servi.

*   **Finitura del piatto:**
    *   **Ingredienti:** 1 fava di Tonka, Fiocchi di sale.
    *   **Procedimento:**
        1.  Tosta delicatamente la fava di Tonka.
        2.  Togli la busta e la pellicola dal foie gras che intendi utilizzare.
        3.  Senza scongelarlo taglialo con l'affettatrice affinché si formino dei riccioli.
        4.  Posizionali immediatamente sul piatto e con una Microplane da spezie spolverizzalo con la fava di Tonka grattugiata.
        5.  Condisci con qualche fiocco di sale e servi.

### Terrina di foie gras d'oca, polvere di carote nere in agrodolce, confettura di cipolle rosse, anice stellato e cannella

#### Terrina di foie gras d'oca
*   **Ingredienti:** 1 foie gras d'oca da 500 g, 20 g riduzione di calvados, 5 g zucchero di canna grezzo, 8 g sale integrale, 0,5 g pepe bianco macinato.
*   **Procedimento:**
    1.  Lascia ammorbidire il fegato a temperatura ambiente e devenalo.
    2.  Sezionalo in pezzi regolari di 2 cm circa e condiscilo con il sale, lo zucchero, il pepe e il calvados, mescolando bene.
    3.  Distribuisci il foie gras negli anelli di acciaio da 6 cm rivestiti di pellicola e racchiudilo come un pacchetto.
    4.  Stabilizzali in abbattitore, poi condizionali sottovuoto nelle buste da cottura.
    5.  Falli marinare 12 ore, quindi cuocili a 54°C per 30 minuti.
    6.  A fine cottura tuffali in un bagnomaria ghiacciato, per farli rassodare nel minor tempo possibile.
    7.  Una volta abbattuti trasferiscili in frigorifero e attendi 24 ore prima di utilizzarli.

#### Confettura di cipolle rosse, anice stellato e cannella
*   **Ingredienti:** 1 kg cipolle rosse, 500 g zucchero, 6 g pectina gialla, 6 g sale, 2 g bacche di anice stellato, 6 g stecche di cannella.
*   **Procedimento:**
    1.  Pela e taglia le cipolle a fette di mezzo centimetro di larghezza seguendo la fibra.
    2.  Mescola zucchero, pectina e sale.
    3.  Unisci le cipolle alle polveri mescolando bene, poi inseriscile nella busta da cottura insieme alle spezie.
    4.  Abbatti per stabilizzare i liquidi e condiziona sottovuoto praticando 3 sgasature.
    5.  Lascia macerare in frigorifero per 2 ore e dopo cuoci a 88°C per 2 ore mescolando ogni 20 minuti.
    6.  A fine cottura lo zucchero dovrà essere completamente sciolto.
    7.  Apri la busta e filtra lo sciroppo ottenuto attraverso un setaccio.
    8.  Elimina le spezie e abbatti le cipolle in positivo.
    9.  Metti lo sciroppo in una casseruola e fallo ridurre a fuoco dolce fino a che non raggiungerà la concentrazione di 72°Brix.
    10. Abbattilo in positivo dopodiché unisci le cipolle precedentemente abbattute amalgamando bene.
    11. Condiziona sottovuoto e conserva in frigorifero.

#### Polvere di carote nere in agrodolce
*   **Ingredienti:** 1 kg carote nere, 200 g aceto di vino rosso, 200 g acqua, 200 g zucchero, 8 g sale.
*   **Procedimento:**
    1.  In una pentola fai bollire per 2 minuti tutti gli ingredienti tranne le carote, poi abbatti in positivo.
    2.  Pela le carote e tagliale a fette di 2 mm.
    3.  Inserisci l'agrodolce e le carote nella busta da cottura, quindi abbattile per stabilizzare i liquidi.
    4.  Condizionale sottovuoto praticando 3 sgasature, poi cuocile a 88°C per 2 ore e abbatti in positivo.
    5.  Attendi 24 ore prima di utilizzarle.
    6.  Estrai le carote dalla busta, scolale e frullale finemente.
    7.  Stendi il frullato di carote su dei tappetini antiaderenti e fallo essiccare a 70°C.
    8.  Una volta completamente essiccato, frullalo fino ad ottenere una polvere.
    9.  Conserva sottovuoto in frigorifero.

*   **Finitura del piatto:**
    1.  Togli la terrina dalla busta e scartala dalla pellicola.
    2.  Falla rotolare nella polvere di carote e taglia il medaglione in due.
    3.  Metti la confettura di cipolle in un piccolo bicchiere da portata.
    4.  Posiziona il foie gras e la confettura su un piatto da portata e servi.

### Uovo di quaglia, spinacini, fonduta di Parmigiano Reggiano

#### Uovo di quaglia
*   **Ingredienti:** 12 uova di quaglia.
*   **Procedimento:**
    1.  Chiudi le uova in una garza, senza stringerle troppo, per scongiurare urti durante la cottura che potrebbero incrinare il guscio.
    2.  Mettile a cuocere a 63°C per 40 minuti, dopodiché se servono subito abbassa la temperatura a 50°C fino al momento dell'utilizzo.
    3.  In caso di un utilizzo successivo, abbattile in positivo con modalità soft, per poi rigenerarle quando serviranno a 50°C per 20 minuti.

#### Spinacini al naturale
*   **Ingredienti:** 1 kg spinacini novelli, 3 g sale.
*   **Procedimento:**
    1.  Condisci gli spinacini con il sale, poi inseriscili nelle buste da cottura distribuendoli in modo uniforme.
    2.  Condiziona sottovuoto praticando 5 sgasature.
    3.  Cuoci a 86°C per 8 minuti gli spinacini, dopodiché abbatti in positivo.

#### Fonduta di Parmigiano Reggiano
*   **Ingredienti:** 500 g Parmigiano Reggiano grattugiato, 500 g panna fresca, 250 g latte, 15 g amido di riso, 15 g amido di mais.
*   **Procedimento:**
    1.  Mescola gli amidi al Parmigiano Reggiano e aggiungi la panna stemperando i grumi.
    2.  Inserisci il composto nella busta da cottura, aggiungi il latte e abbatti per stabilizzare i liquidi.
    3.  Condiziona sottovuoto e lascia la busta in frigorifero per 3 ore affinché il formaggio si reidrati.
    4.  Successivamente cuoci a 85°C per 1 ora, mescolando il contenuto ogni 15 minuti.
    5.  A cottura ultimata abbatti la fonduta in positivo.

*   **Finitura del piatto:**
    1.  Rigenera gli spinaci a 80°C per 3 minuti, toglili dalla busta, asciugali e componi un nido al centro del piatto.
