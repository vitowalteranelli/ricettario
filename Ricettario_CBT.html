### CORTILE

#### Petto d'anatra al naturale
*   **Ingredienti:** 8 petti d'anatra puliti, 2 l acidificazione forte, 2 l marinatura 30:30, Burro chiarificato CBT.
*   **Procedimento:**
    1.  Pulisci i petti di anatra, acidificali per 10 minuti poi scolali e immergili nella marinatura per 24 ore.
    2.  Trascorso questo tempo, toglili dalla marinatura e asciugali.
    3.  Arrotola ogni petto nella pellicola creando dei cilindri ben stretti e dalla forma omogenea.
    4.  Con un ago pratica qualche foro sulla pellicola, per permettere la fuoriuscita dell'aria durante l'aspirazione.
    5.  Condiziona sottovuoto nella busta da cottura e cuoci a 54°C per 2 ore e mezza, poi abbatti in positivo e attendi 24 ore prima di utilizzarli.
    6.  Al momento dell'utilizzo, elimina busta e pellicola e asciugali.
    7.  Rosolali nella padella (partendo da fredda) con il burro chiarificato, per permettere alla pelle di rosolare a dovere.

#### Petto d'anatra laccato
*   **Ingredienti:** 2 petti d'anatra grossi, 2 l acidificazione forte, 2 l marinatura 40:40, 100 g miele, 20 g riduzione di aceto di vino bianco, 5 g bacche di anice stellato, 1/2 stecca di lemongrass, 2 g semi di coriandolo, 2 g pepe nero macinato.
*   **Procedimento:**
    1.  Pulisci e acidifica i petti d'anatra per 10 minuti, poi immergili nella marinatura per 24 ore.
    2.  Inserisci nella busta da cottura il miele, le spezie precedentemente pestate nel mortaio, la riduzione di aceto e il lemongrass affettato.
    3.  Condiziona sottovuoto e cuoci per 1 ora a 86°C mescolando ogni 15 minuti, poi apri la busta e filtra il contenuto per separare tutte le parti solide e ottenere il miele aromatizzato per la laccatura, poi fallo raffreddare a temperatura ambiente.
    4.  Scola e asciuga i petti d'anatra.
    5.  Inseriscili nella busta da cottura e condizionali sottovuoto.
    6.  Cuocili a 54°C per 2 ore e mezza, poi abbatti in positivo e attendi 24 ore prima di utilizzarli.
    7.  Toglili dalla busta e asciugali, poi con un coltello incidi la pelle a rombi.
    8.  Rosola i petti in padella solamente dalla parte della pelle.
    9.  Quando sarà rosolata, trasferisci i petti su una teglia da forno e spennellali con la laccatura al miele.
    10. Mettili in forno ventilato a 160°C fino a che non sarà asciutta la laccatura, poi ripeti questa operazione per altre 2 volte.
    11. Affetta il petto d'anatra e servi.

#### Cosce d'anatra confit
*   **Ingredienti:** 8 cosce d'anatra, 2 l acidificazione leggera, 2 l marinatura 30:30, Olio al pepe nero CBT, 250 g grasso di anatra CBT, 100 g jus di anatra CBT, Burro chiarificato CBT.
*   **Procedimento:**
    1.  Pulisci le cosce di anatra, acidificale per 10 minuti, poi immergile nella marinatura per 24 ore.
    2.  Trascorso questo tempo, scolale, asciugale e inseriscile nella busta da cottura insieme al grasso di anatra e a qualche goccia di olio al pepe nero.
    3.  Condizionale sottovuoto e cuoci a 68°C per 18 ore.
    4.  A fine cottura, apri la busta e scola il liquido dalla carne.
    5.  Il liquido di cottura andrà trattato come uno jus e successivamente inserito nello jus di anatra CBT, mentre i grassi di affioramento opportunamente purificati possono essere conservati per altre preparazioni.
    6.  Abbatti in positivo la carne, poi condizionala sottovuoto e conservala in frigorifero.
    7.  Al momento dell'utilizzo elimina la busta, asciuga la carne e rosolala nella padella di ferro con del burro chiarificato.

#### Foie gras ai due pepi
*   **Ingredienti:** 1 foie gras d'oca intero, 5 g pepe nero macinato, 5 g pepe di Giamaica, 30 g riduzione di porto bianco, Sale integrale.
*   **Procedimento:**
    1.  Ammorbidisci il foie gras a temperatura ambiente e devenalo.
    2.  Pesta grossolanamente i due pepi e mescolali con una presa di sale.
    3.  Con un pennello bagna con il porto bianco il foie gras e successivamente distribuisci la miscela di sale e pepi.
    4.  Avvolgi ben stretto il foie gras nella pellicola, poi con la punta di un ago pratica dei piccoli fori per favorire l'estrazione dell'aria durante la fase di aspirazione.
    5.  Stabilizzalo in abbattitore poi inseriscilo nella busta da cottura e condizionalo sottovuoto.
    6.  Cuocilo a 54°C per 40 minuti, dopodiché tuffalo in un bagnomaria ghiacciato per 10 minuti, poi abbattilo in positivo.
    7.  Passate 24 ore, elimina busta e pellicola, scalda la lama di un coltello nell'acqua bollente e taglia dei medaglioni di 1 cm di altezza e servi.

#### Riccioli di foie gras al naturale
*   **Ingredienti:** 1 foie gras d'oca intero, Sale in fiocchi.
*   **Procedimento:**
    1.  Lascia ammorbidire il foie gras a temperatura ambiente e devenalo.
    2.  Arrotolalo nella pellicola per ottenere un cilindro compatto.
    3.  Rassodalo in abbattitore poi inseriscilo nella busta da cottura e condizionalo sottovuoto.
    4.  Cuocilo a 54°C per 40 minuti, poi raffreddalo velocemente in un bagnomaria ghiacciato.
    5.  Fallo riposare 24 ore in frigorifero, poi abbattilo in negativo.
    6.  Togli la busta e la pellicola dalla parte di foie gras che intendi utilizzare.
    7.  Senza scongelarlo taglialo con l'affettatrice affinché si formino dei riccioli.
    8.  Posizionali immediatamente sul piatto, condisci con qualche fiocco di sale e servi.

#### Torchon di foie gras al calvados
*   **Ingredienti:** 1 foie gras d'oca da 500 g, 20 g riduzione di calvados, 5 g zucchero di canna grezzo, 10 g sale integrale, 0,5 g pepe bianco macinato fine.
*   **Procedimento:**
    1.  Ammorbidisci il foie gras a temperatura ambiente e devenalo, poi taglialo a dadini di 2 cm.
    2.  Stempera il sale, lo zucchero e il pepe nel calvados e usa questo composto per condire i dadi di foie gras.
    3.  Stendi un foglio doppio di pellicola e adagia al centro il foie gras per conferirgli una forma cilindrica del diametro di 5 cm.
    4.  Avvolgi ben stretto il foie gras nella pellicola, poi con la punta di un ago pratica dei piccoli fori per favorire l'estrazione dell'aria durante la fase di aspirazione.
    5.  Abbatti in positivo per stabilizzarlo, poi inseriscilo nella busta da cottura e condiziona sottovuoto.
    6.  Cuocilo a 54°C per 30 minuti dopodiché tuffalo in un bagnomaria ghiacciato per 10 minuti, poi abbattilo in positivo.
    7.  Passate 24 ore, elimina busta e pellicola, scalda la lama di un coltello nell'acqua bollente e taglia dei medaglioni di 1 cm di altezza e servi.

#### Arrostino di coscia d'oca al calvados e mele
*   **Ingredienti:** 8 cosce d'oca, 3 l acidificazione forte, 3 l marinatura 40:40, 300 g retina di maiale, 100 g lardo stagionato CBT, 200 g mele a dadini CBT, 50 g calvados, Burro di qualità, Rosmarino, Aglio, Pepe nero macinato.
*   **Procedimento:**
    1.  Togli la pelle e disossa le cosce d'oca aprendole a libro, acidificale per 10 minuti poi trasferiscile nella marinatura per 24 ore.
    2.  Trascorso questo tempo scola e asciuga.
    3.  Prepara un battuto di lardo con aglio, rosmarino e pepe.
    4.  Stendi le cosce con la parte interna rivolta verso l'alto e distribuisci sulle carni uno strato di battuto di lardo, poi richiudile nella loro forma originale.
    5.  Avvolgi le cosce in un giro di retina di maiale, poi legale strette con lo spago.
    6.  Inseriscile nella busta da cottura, condizionale sottovuoto e cuocile a 66°C per 18 ore.
    7.  Terminata la cottura apri la busta, scola le cosce dai liquidi e abbattile in positivo.
    8.  Filtra, sgrassa, chiarifica e riduci il liquido di cottura.
    9.  In una padella rosola gli arrostini su tutta la superficie con poco burro, poi sfumali con il calvados e aggiungi le mele e il liquido di cottura ridotto.
    10. Regola di sapore e densità la salsa, poi togli lo spago dagli arrostini e servili nappati con la salsa e le mele.

#### Coscia d'oca confit
*   **Ingredienti:** 8 cosce d'oca, 2 l acidificazione leggera, 2 l marinatura 40:40, 300 g grasso d'oca CBT, 2 spicchi di aglio, 6 foglie di alloro, 10 g pepe nero in grani, 2 g chiodi di garofano, Jus d'oca montato CBT, Burro chiarificato CBT.
*   **Procedimento:**
    1.  Pulisci e acidifica le cosce di oca per 10 minuti, poi immergile nella marinatura per 12 ore.
    2.  Trascorso questo tempo, scolale e asciugale.
    3.  Frulla il grasso d'oca con aglio, alloro, pepe e chiodi di garofano.
    4.  Distribuisci il grasso aromatizzato sulle cosce, poi inseriscile nella busta da cottura.
    5.  Condiziona sottovuoto e cuoci a 68°C per 18 ore.
    6.  A cottura ultimata apri la busta, dividi le cosce dal liquido di cottura e abbattile in positivo.
    7.  Filtra, sgrassa, chiarifica e riduci il liquido di cottura.
    8.  Falle rosolare le cosce in padella con poco burro chiarificato finché la pelle non risulterà croccante, poi servile nappate con lo jus ben caldo.

#### Cosce di piccione arrostite
*   **Ingredienti:** 12 cosce di piccione, 2 l acidificazione forte, 2 l marinatura 25:15, 100 g grasso di piccione CBT (o altro grasso di volatile CBT), Olio all'aglio CBT, Olio all'alloro CBT, Olio al timo CBT, Burro chiarificato CBT, Burro di qualità, Aglio, Timo, Jus di piccione montato CBT.
*   **Procedimento:**
    1.  Pulisci e scalza l'osso delle cosce, acidificale per 10 minuti, trasferiscile nella marinatura per 12 ore.
    2.  Nel frattempo fai un mix con i tre oli aromatici e uniscili al grasso di piccione.
    3.  Trascorso questo tempo, toglile dalla marinatura e asciugale.
    4.  Distribuisci il grasso sulle cosce, poi inseriscile nella busta da cottura e condiziona sottovuoto.
    5.  Cuoci a 62°C per 3 ore, poi dividi la carne dal liquido di cottura e abbattila in positivo.
    6.  Conservale sottovuoto fino al loro utilizzo.
    7.  All'occorrenza estrai le cosce dalle buste, asciugale, falle rosolare nel burro chiarificato e successivamente falle schiumare con burro di qualità, aglio in camicia e timo.
    8.  Fondi lo jus di piccione, regolalo di sapore e densità.
    9.  Servi le cosce di piccione nappate con lo jus caldo.

#### Paté di fegatini di piccione
*   **Ingredienti:** 150 g fegatini di piccione, 10 g burro all'aglio CBT, 10 g burro all'alloro CBT, 10 g burro al pepe lungo del Bengala CBT, Sale.
*   **Procedimento:**
    1.  Pulisci con cura i fegatini di piccione e tagliali in piccoli pezzi.
    2.  Condiscili con poco sale, poi trasferisci il composto nella busta da cottura, unisci i burri aromatici e condiziona sottovuoto.
    3.  Cuocili a 62°C per 40 minuti, poi abbatti in positivo.
    4.  Una volta raffreddati, togli il contenuto dalla busta, mettilo in una bastardella e lavoralo vigorosamente con una spatola di gomma, per rendere il composto liscio e uniforme.
    5.  Regolalo di sapore e condizionalo sottovuoto fino al momento dell'utilizzo.
    6.  Per utilizzarlo, sarà sufficiente lavorarlo con una spatola ed il contenuto comincerà ad acquisire un gradevole colore rosso.

#### Petto di piccione arrosto
*   **Ingredienti:** 6 petti di piccione, 2 l acidificazione forte, 2 l marinatura 25:15, Burro chiarificato CBT, Burro di qualità, Aglio e timo.
*   **Procedimento:**
    1.  Pulisci i petti di piccione e acidificali per 10 minuti, poi falli marinare per 12 ore.
    2.  Trascorso questo tempo toglili dalla marinatura e asciugali.
    3.  Avvolgili con la pellicola formando un cilindro stretto e con la punta di un ago foralo in diversi punti.
    4.  Trasferiscili nella busta da cottura e condizionali sottovuoto.
    5.  Cuoci a 52°C per 50 minuti, poi abbatti in positivo.
    6.  Attendi 24 ore prima di utilizzarli.
    7.  Elimina pellicola e busta, asciugali e falli rosolare prima nel burro chiarificato e successivamente falli schiumare con burro fresco, aglio e timo.

#### Coniglio in porchetta
*   **Ingredienti:** 1 coniglio eviscerato da 1,3 kg, 2 l acidificazione forte, 2 l marinatura 30:30, Pancetta arrotolata stagionata CBT, Olio all'aglio CBT, Olio al pepe nero CBT, Olio al rosmarino CBT.
*   **Procedimento:**
    1.  Disossa il coniglio avendo cura di mantenere la carne in un unico pezzo senza forarlo.
    2.  Acidificalo per 10 minuti, poi immergilo nella marinatura per 12 ore.
    3.  Trascorso questo tempo, scola il coniglio e asciugalo.
    4.  Nel frattempo prepara un mix con gli oli aromatici e taglia la pancetta arrotolata a fette finissime.
    5.  Stendi il coniglio sul tagliere, pareggia le altezze e spennellalo con il mix di oli aromatici su tutta la superficie.
    6.  Arrotola il coniglio per ottenere un cilindro compatto, ricoprilo con le fette di pancetta e legalo con lo spago.
    7.  Avvolgilo nella pellicola e con un ago pratica dei fori in vari punti per permettere all'aria di uscire in fase di aspirazione.
    8.  Inseriscilo nella busta da cottura, condizionalo sottovuoto e cuocilo a 64°C per 6 ore, poi abbatti in positivo.
    9.  Estrai il coniglio da busta e pellicola, poi togli i residui di pancetta e asciugalo.
    10. Spennellalo di olio e fallo rosolare in forno a 240°C fino a doratura, poi servi.

#### Lombetti di coniglio al timo e bacon
*   **Ingredienti:** 4 lombetti di coniglio disossati, 1 l acidificazione forte, 1 l marinatura 40:40, Pancetta affumicata stagionata CBT da affettare, Olio al timo CBT, Burro di qualità, Aglio.
*   **Procedimento:**
    1.  Taglia i lombetti in due, acidificali per 10 minuti poi immergili nella marinatura per 24 ore.
    2.  Trascorso questo tempo scola e asciugali.
    3.  Ungi i lombetti con l'olio al timo, poi ricoprili con delle fette sottili di pancetta.
    4.  Avvolgili con la pellicola formando dei cilindri stretti e con la punta di un ago forali in diversi punti per favorire l'estrazione dell'aria in fase di aspirazione, poi inseriscili nella busta da cottura.
    5.  Condizionali sottovuoto e cuocili a 60°C per 1 ora, poi abbattili in positivo.
    6.  Apri la busta, togli la pellicola e asciugali e falli rosolare velocemente con il burro e l'aglio in camicia.

#### Tonno di coniglio
*   **Ingredienti:** 1 coniglio eviscerato da 1,3 kg, 2 l acidificazione forte, 200 g essenza vegetale CBT, 16 g sale, 2 g pepe nero in grani, 1 g chiodi di garofano, 2 foglie di alloro, 200 g olio EVO, Olio alla salvia CBT, Olio all'aglio CBT, Olio al pepe nero CBT.
*   **Procedimento:**
    1.  Taglia a pezzi il coniglio, poi acidificalo per 10 minuti e scolalo.
    2.  Inserisci i pezzi di coniglio nella busta da cottura insieme all'essenza, sale, pepe, alloro e chiodi di garofano.
    3.  Condiziona sottovuoto e cuoci a 68°C per 6 ore.
    4.  A cottura terminata scola il coniglio dal liquido di cottura, elimina gli aromi e disossalo sfilacciando la polpa, poi abbattila in positivo.
    5.  Prepara una miscela con l'olio EVO e gli oli aromatici mescolandoli a tuo gusto.
    6.  Amalgama il coniglio sfilacciato all'olio Evo aromatizzato, poi trasferisci il composto nella busta e condiziona sottovuoto.
    7.  Conserva in frigorifero e attendi almeno 48 ore prima di consumarlo.

### ALTRE CARNI

#### Stufato d'asino
*   **Ingredienti:** 2 kg polpa di coscia d'asino, 3 l acidificazione, 3 l marinatura 30:15, 1 kg cipolle a petali CBT, 200 g riduzione di vino rosso, 50 g salsa di pomodoro CBT, 3 chiodi di garofano, 1 bacca di anice stellato, Pepe nero macinato, 80 g burro, Amido di riso, Sale.
*   **Procedimento:**
    1.  Taglia la polpa di asino a spezzatino, acidificala per 10 minuti, poi immergila nella marinatura per 24 ore.
    2.  Scola la carne e trasferiscila in una bastardella insieme a cipolle, chiodi di garofano, anice stellato, riduzione di vino rosso, salsa di pomodoro e ad una generosa macinata di pepe nero.
    3.  Dividi il composto nelle buste da cottura e condiziona sottovuoto.
    4.  Cuoci a 66°C per 18 ore, poi apri la busta, separa i liquidi ed elimina anice stellato e chiodi di garofano.
    5.  Metti i liquidi in casseruola e falli ridurre a fuoco dolce finché non avranno raggiunto la giusta concentrazione di sapore.
    6.  Stempera poco amido di riso in acqua fredda e aggiungilo al sugo, fino ad ottenere una salsa legata.
    7.  Unisci la salsa sullo stufato caldo, amalgama e servi.

#### Spezzatino di capriolo in salmì
*   **Ingredienti:** 1 kg polpa di coscia di capriolo, 2 l acidificazione forte, 2 l marinatura 40:20, 50 g grasso di rognone al pepe nero CBT, 50 g grasso di rognone al ginepro CBT, 100 g grasso neutro di rognone CBT, 100 g riduzione di vino rosso, 100 g jus di manzo CBT, Burro di qualità.
*   **Procedimento:**
    1.  Taglia la polpa del capriolo a bocconcini, acidificala per 10 minuti poi trasferiscila nella marinatura per 24 ore.
    2.  Trascorso questo tempo, scola la carne dalla marinatura e inseriscila nella busta da cottura insieme al grasso di rognone al pepe nero e ginepro.
    3.  Condiziona sottovuoto e cuoci a 64°C per 24 ore.
    4.  A cottura ultimata apri la busta e separa i liquidi di cottura dalla carne, poi sgrassali, chiarificali e riducili come uno jus CBT.
    5.  Fondi lo jus di manzo e lo jus di capriolo e montali con il burro, dopodiché aggiungi la riduzione di vino poco per volta, fino a raggiungere la consistenza desiderata.
    6.  Aggiungi lo jus alla carne amalgamando bene, poi abbatti in positivo.
    7.  Inserisci lo spezzatino nella busta da cottura e condizionalo sottovuoto.
    8.  Per utilizzarlo rigeneralo a 64°C per 20 minuti.

#### Filetto di cavallo al pepe e rosmarino
*   **Ingredienti:** 1 kg filetto di cavallo, 2 l acidificazione forte, 2 l marinatura 30:15, Olio al rosmarino CBT, Olio al pepe nero CBT.
*   **Procedimento:**
    1.  Pulisci e acidifica il filetto per 10 minuti, poi immergilo nella marinatura per 12 ore.
    2.  Trascorso questo tempo preleva la carne dalla marinatura, asciugala e massaggiala con un mix fatto con i due oli aromatici.
    3.  Avvolgi il filetto nella pellicola per ottenere un cilindro omogeneo, poi con la punta di un ago pratica dei fori per favorire l'estrazione dell'aria in fase di aspirazione.
    4.  Inserisci il filetto nella busta da cottura e condizionala sottovuoto.
    5.  Cuoci a 52°C per 3 ore, poi abbatti in positivo e attendi 24 ore prima di utilizzarlo.
    6.  Questo filetto può essere utilizzato come medaglioni in padella o alla griglia, oppure freddo a carpaccio.

#### Controfiletto di cervo al ginepro
*   **Ingredienti:** 1 controfiletto di cervo, 1 l acidificazione forte, 1 l marinatura 30:15, 100 g grasso di rognone neutro CBT, 5 g bacche di ginepro, 5 g pepe bianco in grani, 1 g bacche di anice stellato, 1 foglia di alloro, Burro di qualità, Aglio.
*   **Procedimento:**
    1.  Pulisci il controfiletto dalle membrane di connettivo poi taglialo in tre parti.
    2.  Acidificalo per 10 minuti, poi immergilo nella marinatura per 24 ore.
    3.  Trascorso questo tempo, scolalo dalla marinatura e asciugalo.
    4.  Frulla il grasso di rognone con le spezie e l'alloro.
    5.  Spalma un leggero strato di grasso di rognone aromatizzato sul controfiletto, poi avvolgilo ben stretto nella pellicola per ottenere un cilindro omogeneo.
    6.  Con la punta di un ago fora la pellicola in diversi punti per favorire l'estrazione dell'aria in fase di aspirazione.
    7.  Inserisci il controfiletto nella busta da cottura e condizionalo sottovuoto.
    8.  Cuoci a 51°C per 3 ore, poi abbatti in positivo e attendi 24 ore prima di consumarlo.
    9.  Togli il filetto dalla busta e asciugalo, poi fallo rosolare velocemente in padella con burro e aglio in camicia, quindi servilo con gli accompagnamenti che preferisci.

#### Spezzatino di cinghiale alle cipolle
*   **Ingredienti:** 1 kg polpa di coscia di cinghiale, 2 l acidificazione forte, 2 l marinatura 40:40, 300 g cipolle a petali CBT, 100 g salsa di pomodoro CBT, 100 g riduzione vino bianco, Olio al pepe nero CBT, Olio al pepe bianco CBT, 20 g burro alla salvia CBT.
*   **Procedimento:**
    1.  Taglia la polpa del cinghiale a dadi, acidificala per 10 minuti poi trasferiscila nella marinatura per 24 ore.
    2.  Scola la carne, trasferiscila in una bastardella e unisci la salsa di pomodoro, la riduzione di vino, le cipolle, il burro alla salvia e qualche goccia di oli ai pepi.
    3.  Amalgama bene e trasferisci il composto nella busta da cottura.
    4.  Abbatti per stabilizzare i liquidi poi condiziona sottovuoto e cuoci a 66°C per 18 ore.
    5.  A cottura terminata apri la busta, scola i liquidi e falli ridurre della metà, poi riuniscili allo spezzatino e abbatti in positivo.
    6.  Metti lo spezzatino nelle buste da cottura e condizionalo sottovuoto.
    7.  Al momento dell'uso rigeneralo a 65°C per 20 minuti e servi.

#### Cosce di fagiano dorate
*   **Ingredienti:** 2 cosce di fagiano, 1 l acidificazione forte, 1 l marinatura 40:40, 150 g grasso d'anatra CBT, Olio al rosmarino CBT, Olio all'aglio CBT, Olio al pepe nero CBT, Burro chiarificato CBT.
*   **Procedimento:**
    1.  Pulisci e acidifica le cosce di fagiano, poi immergile nella marinatura per 12 ore.
    2.  Trascorso questo tempo, scolale e asciugale.
    3.  Ammorbidisci e mescola il grasso d'anatra con gli oli aromatici.
    4.  Inserisci le cosce e il grasso nella busta da cottura e condiziona sottovuoto.
    5.  Cuoci a 68°C per 12 ore.
    6.  A cottura ultimata apri la busta, scola la carne dal liquido di cottura e abbattila in positivo.
    7.  Rosola le cosce nella padella con burro chiarificato fino ad ottenere la pelle dorata e croccante.

#### Petto di Faraona al profumo di mandarino
*   **Ingredienti:** 2 petti di faraona con pelle, 1 l acidificazione forte, 50 g purea di mandarini per marinare CBT, Burro chiarificato CBT.
*   **Procedimento:**
    1.  Acidifica i petti di faraona per 10 minuti poi scola e asciuga.
    2.  Spalmali con la purea di mandarini, poi inseriscili nella busta da conservazione e condiziona sottovuoto.
    3.  Lascia marinare per 24 ore, poi apri la busta e con una spatola di gomma elimina tutta la marinatura eccedente.
    4.  Avvolgili con la pellicola formando un cilindro stretto e con la punta di un ago forala in diversi punti.
    5.  Trasferiscili nella busta da cottura e condizionali sottovuoto.
    6.  Cuoci a 60°C per 3 ore, poi abbatti in positivo.
    7.  Estrai i petti dalla busta e pellicola, asciugali e falli rosolare in padella con il burro chiarificato fino a completa doratura.

#### Sella e cosce di lepre, salsa all'armagnac e funghi porcini secchi
*   **Ingredienti:** 1 lepre da 2/3 kg, 1,5 l acidificazione forte, 1,5 l marinatura 30:15, 10 g transglutaminasi sciolti in 40 g acqua a 20°C, 20 g lardo stagionato tritato CBT, 20 g grasso di rognone al ginepro CBT, 20 g grasso di rognone ai chiodi di garofano CBT, 20 g grasso di rognone all'alloro CBT, 20 g grasso di rognone al pepe nero CBT, 20 g grasso di rognone al timo CBT, 100 g jus di lepre CBT, Burro di qualità, 50 g armagnac, 5 g polvere di funghi porcini CBT.
*   **Procedimento:**
    1.  Disossa la lepre separando le cosce e la sella.
    2.  Acidifica le carni per 10 minuti, poi scola e asciuga.
    3.  Stendi la sella di lepre e le cosce sul tagliere e spennella la transglutaminasi sulla parte interna delle carni.
    4.  Arrotola su se stessa la sella e chiudi le cosce nella forma originaria.
    5.  Avvolgi sia la sella che le cosce ben strette nella pellicola e con un ago pratica dei fori in vari punti per permettere all'aria di uscire in fase di aspirazione.
    6.  Inserisci nella busta da conservazione la sella arrotolata e in un'altra busta le cosce ricomposte e lascia agire la colla in frigorifero per 12 ore.
    7.  Trascorso questo tempo, elimina busta e pellicola e immergi le carni nella marinatura per 12 ore, dopodiché scola e asciuga.
    8.  Ammorbidisci i grassi ed il lardo e amalgamali.
    9.  Spennella le carni con il grasso aromatico, poi riavvolgile nella pellicola e inseriscile nelle buste da cottura, sella in una busta e cosce in un'altra.
    10. Cuoci la sella a 55°C per 2 ore e le cosce a 58°C per 2 ore e mezzo, poi abbatti in positivo e attendi 24 ore prima di utilizzarle.
    11. Fondi lo jus di lepre e montalo con il burro, aggiungi la polvere di funghi porcini e l'armagnac poco per volta, poi regola di sapore e densità.
    12. Togli dalla busta sella e cosce, asciuga e fai rosolare con il burro spumeggiante.
    13. Scaloppali, posizionali sul piatto e nappali con lo jus, quindi servili.

#### Quaglie al tartufo estivo
*   **Ingredienti:** 4 quaglie, 2 l acidificazione forte, 2 l marinatura 40:40, 20 g tartufo estivo CBT a fette, 80 g grasso d'oca CBT, 5 g polvere di funghi porcini CBT, 3 g pepe bianco macinato, 60 g jus di pollo CBT, 20 g cognac, Burro di qualità, Burro chiarificato CBT.
*   **Procedimento:**
    1.  Disossa le quaglie separando petti e cosce, acidificali per 10 minuti poi immergili nella marinatura per 12 ore, successivamente scola e asciuga.
    2.  Frulla il grasso d'oca con la polvere di funghi e il pepe bianco, poi spalma le cosce con il grasso aromatizzato e inseriscile nella busta da cottura.
    3.  Condizionale sottovuoto praticando il cuscinetto largo e cuocile a 64°C per 2 ore, poi abbatti in positivo.
    4.  Posiziona i petti di quaglia con la carne rivolta verso l'alto, poi appoggia due fette di tartufo su di una metà e chiudila avvolgendola nella pellicola.
    5.  Inserisci nella busta da cottura e cuocili a 58°C per 1 ora, poi abbatti in positivo.
    6.  Estrai le cosce e i petti dalla busta, asciugali e rosolali velocemente in padella con il burro chiarificato.
    7.  Fondi lo jus e montalo con il burro, poi aggiungi il cognac e regolalo di sapore e densità.
    8.  Impiatta la quaglia nappandola con lo jus.

#### Cosce di rane alla provenzale
*   **Ingredienti:** 1 kg cosce di rane, 2 l acidificazione forte, 2 l marinatura 40:40, 250 g burro di qualità, 100 g riduzione di vino bianco, Olio all'aglio CBT, Prezzemolo, Pepe nero macinato grosso.
*   **Procedimento:**
    1.  Pulisci e acidifica le cosce di rane per 10 minuti, poi immergile nella marinatura per 6 ore.
    2.  Frulla il burro ammorbidito insieme al vino bianco, prezzemolo e pepe nero, poi aggiungi qualche goccia di olio all'aglio.
    3.  Scola e asciuga le cosce di rane, poi inseriscile nella busta da cottura con il burro aromatizzato.
    4.  Condiziona sottovuoto e cuoci a 60°C per 1 ora.
    5.  A cottura ultimata, scola le cosce dal burro e abbattile in positivo.
    6.  Filtra e chiarifica il burro, poi abbattilo in positivo.
    7.  Prendi una buona dose del burro chiarificato ottenuto, fondilo in una padella e rosola velocemente le cosce di rane fino a doratura, poi servile subito.

#### Lumache in umido come una bourguignonne
*   **Ingredienti:** *Per sgusciare:* 1 kg lumache già sbavate, 2 l acidificazione forte, 2 l acqua, 30 g sale, Bicarbonato. *Per la cottura:* La polpa delle lumache, 200 g essenza vegetale CBT, 3 g sale, 50 g burro all'aglio CBT, 50 g burro al pepe nero CBT, 20 g clorofilla di prezzemolo CBT, 50 g riduzione di vino bianco allo scalogno, 50 g burro di qualità, Sale.
*   **Procedimento:**
    1.  Acidifica le lumache per 10 minuti, poi scolale e inseriscile nella busta da cottura insieme all'acqua e al sale.
    2.  Condiziona sottovuoto praticando 3 sgasature, poi cuoci a 88°C per 30 minuti e abbatti in positivo.
    3.  Scola le lumache dall'acqua, sgusciale, puliscile dall'intestino e sciacquale bene con acqua e bicarbonato, poi trasferisci la polpa nella busta da cottura insieme all'essenza e al sale.
    4.  Abbatti per stabilizzare i liquidi, inseriscile nella busta da cottura e condiziona sottovuoto.
    5.  Cuoci a 72°C per 12 ore e abbatti in positivo.
    6.  Una volta raffreddate scola le lumache dal liquido di cottura e sciacquale sotto acqua corrente per eliminare tutta la bava residua.
    7.  Frulla il burro neutro insieme ai burri aromatici, alla clorofilla di prezzemolo e alla riduzione di vino bianco e regola di sale, poi amalgamalo alle lumache e inserisci il composto nella busta da cottura.
    8.  Condiziona sottovuoto e cuoci a 72°C per 1 ora mescolando ogni 10 minuti, poi abbatti in positivo.

## PESCI

#### Alici marinate
*   **Ingredienti:** 30 alici freschissime, 1 l acidificazione forte, 1 l marinatura 35:20, Olio neutro, Olio all'aglio CBT, Olio al limone CBT, Olio al prezzemolo CBT.
*   **Procedimento:**
    1.  Pulisci le alici eliminando testa e interiora, lava via il sangue.
    2.  Acidificale per 10 minuti e scolale.
    3.  Immergile nella marinatura per 3 ore, poi scolale per bene.
    4.  Mescola l'olio neutro ai tre oli aromatici secondo il tuo gusto, poi inseriscilo nella busta da cottura insieme alle alici nella misura sufficiente a mantenerle in sospensione.
    5.  Abbatti per stabilizzare i liquidi, poi metti sottovuoto e applica un cuscinetto largo.
    6.  Cuoci a 40°C per 20 minuti, dopodiché abbatti in negativo e conserva in surgelatore per il tempo necessario alla bonifica dall'Anisakis.
    7.  Decongela le alici, scolale dall'olio ed elimina la spina centrale. Conservale in frigorifero fino al momento dell'utilizzo.

#### Filetti di anguilla all'alloro e carbone di porri
*   **Ingredienti:** 1 kg filetti di anguilla, 2 l acidificazione forte, 2 l marinatura 35:20, 25 g olio al carbone di porri CBT, 10 g olio al pepe bianco CBT, 50 g olio neutro, 2 foglie di alloro.
*   **Procedimento:**
    1.  Taglia i filetti di anguilla a tranci di 7 cm, acidificali per 10 minuti e successivamente immergili nella marinatura per 4 ore.
    2.  Trascorso questo tempo scola l'anguilla e asciugala.
    3.  Frulla l'olio neutro con le foglie di alloro, poi uniscilo all'olio al carbone di porri e all'olio al pepe bianco.
    4.  Condisci i filetti di anguilla con la miscela di oli aromatici e inserisci il tutto nella busta da cottura.
    5.  Abbatti per stabilizzare i liquidi, poi condiziona sottovuoto praticando un cuscinetto largo.
    6.  Cuoci a 72°C per 30 minuti, poi abbatti in positivo.
    7.  Conserva in frigorifero fino al momento dell'uso.
    8.  Prima dell'utilizzo rigenera l'anguilla a 70°C per 10 minuti, poi scola dai liquidi e servi.

#### Anguilla glassata
*   **Ingredienti:** 1 kg filetti di anguilla, 2 l acidificazione forte, 100 g sale, 100 g zucchero. *Per la salsa:* 320 g salsa di soia, 160 g sake, 80 g mirin, 60 g olio di sesamo, 240 g zucchero, Sale.
*   **Procedimento:**
    1.  Mescola il sale allo zucchero.
    2.  Pulisci e taglia l'anguilla a tranci di 5 cm, acidificala per 10 minuti, poi scola e asciuga.
    3.  Fai rotolare i tranci di anguilla nella miscela di sale e zucchero affinché tutta la superficie ne sia ricoperta da uno strato abbondante.
    4.  Trasferiscili nella busta da conservazione e condizionali sottovuoto.
    5.  Falli marinare in frigorifero per 1 ora, così da far agire il sale e lo zucchero.
    6.  Nel frattempo metti lo zucchero per la salsa in una casseruola e fai un caramello biondo, dopo aggiungi tutti gli ingredienti e fai ridurre fino ad ottenere la consistenza di uno sciroppo denso, poi abbatti in positivo.
    7.  Trascorso questo tempo, apri la busta dei tranci di anguilla e sciacquali sotto l'acqua corrente fredda per eliminare la marinatura.
    8.  Asciugali e spennellali con la salsa, poi inseriscili nella busta da cottura.
    9.  Cuoci a 72°C per 45 minuti.
    10. A cottura ultimata apri la busta, separa i tranci di anguilla dal liquido di cottura e abbattili in positivo.
    11. Fai ridurre il liquido di cottura a fuoco dolce, poi abbattilo in positivo.
    12. Unisci anguilla e salsa ridotta e condiziona sottovuoto, poi conserva in frigorifero.
    13. Al momento dell'utilizzo, rigenera l'anguilla a 70°C per 10 minuti.

#### Astice confit
*   **Ingredienti:** 1 astice vivo, 1 l acidificazione forte, 200 g olio EVO, Sale e pepe.
*   **Procedimento:**
    1.  Metti in abbattitore l'astice per semi congelarlo, quando le carni si saranno rassodate lo sguscerai con più facilità.
    2.  Una volta ricavate coda e chele sgusciate, acidificale per 10 minuti.
    3.  Scolale, condiscile generosamente con sale e pepe e lasciale insaporire per un'ora in frigorifero.
    4.  Trascorso questo tempo, inseriscile nella busta da cottura e condizionale sottovuoto applicando un cuscinetto stretto.
    5.  Cuoci a 54°C per 45 minuti, poi abbatti in positivo.
    6.  Conserva in frigorifero fino al momento dell'utilizzo.

#### Baccalà al naturale
*   **Ingredienti:** 6 tranci da 200 g baccalà dissalato, 1 l acidificazione forte, Olio neutro, Sale.
*   **Procedimento:**
    1.  Acidifica i tranci di baccalà per 10 minuti, poi scolali ed eventualmente condiscili con il sale.
    2.  Inserisci singolarmente i tranci di baccalà nelle buste da cottura con una dose di olio neutro sufficiente a tenerli in sospensione e separati fra loro.
    3.  Abbatti per stabilizzare i liquidi, poi condiziona sottovuoto e applica un cuscinetto stretto.
    4.  Cuoci a 46°C per 20 minuti, dopodiché abbatti in negativo e conserva in surgelatore per il tempo necessario alla bonifica dall'Anisakis.
    5.  Al momento dell'uso decongela il baccalà come da procedura e successivamente rigeneralo a 46°C per 10 minuti.

#### Baccalà mantecato
*   **Ingredienti:** 1 kg baccalà dissalato con la pelle, 1 l acidificazione forte, 150 g Olio EVO.
*   **Procedimento:**
    1.  Taglia il baccalà in grossi pezzi, elimina le lische, sciacqualo e controlla che la dissalatura sia stata fatta a dovere.
    2.  Se non è così prosegui con la dissalatura fino al raggiungimento del grado di sapidità ideale.
    3.  Acidifica il baccalà per 10 minuti, poi scolalo e inseriscilo nella busta da cottura insieme all'olio.
    4.  Abbatti in positivo per stabilizzare i liquidi poi condiziona sottovuoto.
    5.  Cuoci a 54°C per 15 minuti.
    6.  A cottura ultimata scola il baccalà dai liquidi di cottura, elimina la pelle e trasferiscilo in una planetaria.
    7.  Nel frattempo, in una casseruola riduci di due terzi i liquidi di cottura.
    8.  Fai montare il baccalà aggiungendo i liquidi ridotti e ben caldi, fino ad ottenere un composto soffice e omogeneo.
    9.  Il baccalà mantecato si potrà consumare sia caldo che freddo.

#### Pelle di baccalà soffiata
*   **Ingredienti:** 500 g pelli di baccalà, 1 l acidificazione leggera, 500 g acqua, Olio per friggere, 5 g sale.
*   **Procedimento:**
    1.  Pulisci le pelli da eventuali residui di polpa di pesce, lavale poi falle acidificare per 10 minuti.
    2.  Scolale e inseriscile nella busta da cottura con acqua e sale.
    3.  Abbatti per stabilizzare i liquidi, poi condiziona sottovuoto e cuoci a 70°C per 30 minuti.
    4.  A cottura terminata, apri la busta e scola con delicatezza le pelli dal liquido di cottura.
    5.  Stendile sui fogli antiaderenti, trasferiscili in essiccatore a 70°C.
    6.  Quando saranno completamente disidratate e secche ponile in un contenitore ermetico e conservale in un luogo asciutto.
    7.  Attendi almeno 24 ore prima di utilizzarle.
    8.  Per soffiare le pelli, friggile in olio abbondante a 190°C per pochi secondi e poi scolale su carta assorbente.

#### Trippa di baccalà al naturale
*   **Ingredienti:** 1 kg trippe di baccalà, 2 l acidificazione leggera, 1,5 l acqua, 10 g sale.
*   **Procedimento:**
    1.  Pulisci le trippe di baccalà, tagliale a listarelle e acidificale per 10 minuti.
    2.  Inseriscile nella busta da cottura con acqua e sale, poi condiziona sottovuoto.
    3.  Cuocile a 74°C per 2 ore, poi abbattile in positivo e conservale in frigorifero fino al momento dell'uso.
    4.  Per utilizzarle rigenerale a 70°C per 20 minuti, scolale dal liquido di cottura e condiscile secondo la ricetta da eseguire.

#### Trancio di branzino al naturale
*   **Ingredienti:** 6 tranci di branzino da 200 g dello spessore di 3 cm, con pelle squamata, 2 l acidificazione forte, 2 l marinatura neutra 35:20, Olio neutro.
*   **Procedimento:**
    1.  Acidifica per 10 minuti i filetti di branzino, poi trasferiscili nella marinatura per 6 ore.
    2.  Trascorso questo tempo, scolali e inseriscili nelle buste da cottura, aggiungendo una dose di olio sufficiente a mantenere i filetti in sospensione e separati fra loro.
    3.  Abbatti per stabilizzare i liquidi, quindi condiziona sottovuoto applicando il cuscinetto stretto.
    4.  Cuoci a 52°C per 15 minuti, poi abbatti in negativo.
    5.  Prima di utilizzarli, conservali in surgelatore per il tempo necessario alla bonifica dall'Anisakis.

#### Calamari al naturale
*   **Ingredienti:** 6 calamari interi da 150 g l'uno, 2 l acidificazione forte, Sale.
*   **Procedimento:**
    1.  Pulisci i calamari, spellali e dividi i ciuffi dai corpi e lavali.
    2.  Acidificali per 10 minuti, poi scolali e asciugali.
    3.  Condiscili con il sale, inserisci corpi e ciuffi in distinte buste da cottura e condizionali sottovuoto.
    4.  Cuoci a 58°C per 20 minuti i corpi e per 25 minuti i ciuffi, poi abbatti in positivo.

#### Vellutata di canocchie
*   **Ingredienti:** 1 kg canocchie, Olio Evo, Olio al pepe nero CBT.
*   **Procedimento:**
    1.  Sguscia le canocchie per prelevare la polpa dalle code.
    2.  Inseriscila nella busta da cottura e condizionala sottovuoto.
    3.  Cuoci a 52°C per 20 minuti, poi apri la busta e setacciane il contenuto che in cottura si sarà liquefatto completamente.
    4.  Abbatti la polpa in positivo e condizionala sottovuoto divisa in porzioni.
    5.  Al momento dell'uso, rigenera a 50°C per 10 minuti, quindi apri la busta e distribuiscila nei piatti di portata.
    6.  Condisci con poco olio EVO e qualche goccia di olio al pepe nero e servi.

#### Cannolicchi al naturale
*   **Ingredienti:** 1 kg cannolicchi spurgati, 200 g acqua, 6 g sale.
*   **Procedimento:**
    1.  Stempera il sale nell'acqua.
    2.  Posiziona i cannolicchi nelle buste da cottura e unisci la soluzione salina.
    3.  Abbatti per stabilizzare i liquidi, poi condiziona sottovuoto praticando 3 sgasature.
    4.  Cuoci a 58°C per 20 minuti, poi abbatti in positivo.
    5.  Conservali in frigorifero fino al momento dell'uso.

#### Capesante al lemongrass
*   **Ingredienti:** 500 g noci di capesante, 1 l acidificazione forte, 1 l marinatura 35:20, 10 g olio al pepe bianco CBT, 100 g burro di cacao al lemongrass CBT.
*   **Procedimento:**
    1.  Trita il burro di cacao insieme all'olio al pepe bianco.
    2.  Pulisci le noci di capesante, acidificale per 10 minuti poi trasferiscile nella marinatura per 8 ore.
    3.  Trascorso questo tempo, scolale dalla marinatura, asciugale e distribuiscile in modo omogeneo nella busta da cottura con il burro di cacao.
    4.  Condiziona sottovuoto e cuoci a 48°C per 15 minuti, poi abbatti in positivo e conserva in frigorifero fino al momento dell'uso.
    5.  Al momento dell'utilizzo togli il contenuto dalla busta e asciuga sia le capesante che il burro di cacao solidificato.
    6.  Fallo fondere in una padella e rosola velocemente le capesante sui due lati.
    7.  Regola di sapore e servi.

#### Coralli di capesante al naturale
*   **Ingredienti:** 500 g coralli di capesante, 1 l acidificazione forte, 1 l marinatura 35:20, Olio neutro.
*   **Procedimento:**
    1.  Pulisci i coralli delle capesante senza romperli e acidificali per 10 minuti poi trasferiscili nella marinatura per 8 ore.
    2.  Trascorso questo tempo, scolali dalla marinatura e inseriscili nella busta da cottura con una dose di olio sufficiente a mantenerli in sospensione.
    3.  Condiziona sottovuoto e cuoci a 48°C per 15 minuti, poi abbatti in positivo.
    4.  Conserva in frigorifero fino al momento dell'uso.
    5.  I coralli di capesante si possono consumare tal quali oppure in crema dopo essere stati frullati e setacciati.

#### Noci di capesante al naturale
*   **Ingredienti:** 500 g noci di capesante, 1 l acidificazione forte, 1 l marinatura 35:20, Olio neutro.
*   **Procedimento:**
    1.  Pulisci le noci di capesante, acidificale per 10 minuti poi trasferiscile nella marinatura per 8 ore.
    2.  Trascorso questo tempo, scolale dalla marinatura, asciugale e distribuiscile in modo omogeneo nelle buste da cottura insieme all'olio neutro nella misura sufficiente a tenerle in sospensione e separate fra loro.
    3.  Condiziona sottovuoto e cuoci a 48°C per 15 minuti, poi abbatti in positivo.
    4.  Conserva in frigorifero fino al momento dell'uso.

#### Cozze al naturale
*   **Ingredienti:** 1 kg cozze, 200 g acqua, 3 g sale.
*   **Procedimento:**
    1.  Monda e pulisci le cozze, poi inseriscile nelle buste da cottura.
    2.  Stempera il sale nell'acqua e uniscila nella busta insieme alle cozze.
    3.  Abbatti per stabilizzare i liquidi, poi condiziona sottovuoto praticando 3 sgasature.
    4.  Cuoci a 82°C per 15 minuti, quindi abbatti in positivo.
    5.  Conservale in frigorifero fino al momento dell'uso.

#### Cozze in guazzetto
*   **Ingredienti:** 1 kg cozze, 160 g pomodori ciliegini, 50 g riduzione di vino bianco, 100 g acqua, 3 rametti di prezzemolo, 0,5 g pepe nero macinato, 1 spicchio di aglio, Olio EVO.
*   **Procedimento:**
    1.  Monda e pulisci le cozze.
    2.  Taglia grossolanamente i pomodori, il prezzemolo e l'aglio, poi mescolali ad acqua, pepe nero, riduzione di vino bianco e successivamente amalgamali alle cozze.
    3.  Inserisci il composto nelle buste da cottura e condiziona sottovuoto praticando 3 sgasature.
    4.  Cuoci a 82°C per 15 minuti, poi abbatti in positivo e conserva in frigorifero.
    5.  Al momento dell'utilizzo rigenera le cozze, poi apri la busta e distribuisci il contenuto nel piatto di servizio.
    6.  Concludi con una generosa dose di olio EVO e servi.

#### Fasolari al naturale
*   **Ingredienti:** 1 kg fasolari spurgati, 500 g acqua, 7,5 g sale.
*   **Procedimento:**
    1.  Stempera il sale nell'acqua.
    2.  Posiziona i fasolari nelle buste da cottura e unisci la soluzione salina.
    3.  Abbatti per stabilizzare i liquidi, poi condiziona sottovuoto praticando 3 sgasature.
    4.  Cuoci a 62°C per 20 minuti, quindi abbatti in positivo.
    5.  Conservali in frigorifero fino al momento dell'uso.

#### Mattonella di gamberi rosa all'orientale
*   **Ingredienti:** 1 kg gamberi rosa, 50 g jus di baccalà CBT, 80 g panna fresca, 2 l acidificazione forte, 2 g olio al pepe nero CBT, 10 g olio di sesamo, Sale.
*   **Procedimento:**
    1.  Ricava le code dai gamberi rosa, sgusciale ed elimina il budello.
    2.  Falle acidificare 10 minuti, poi scolale.
    3.  Abbatti a 0°C e poi frullale insieme a tutti gli altri ingredienti fino ad ottenere un impasto liscio.
    4.  Regola di sapore e trasferisci il composto nella busta da cottura.
    5.  Condiziona sottovuoto praticando 3 sgasature, poi forma una mattonella.
    6.  Cuoci a 50°C per 20 minuti, quindi abbatti in positivo.
    7.  Al momento dell'uso togli la mattonella di gamberi dalla busta, tagliala a cubetti e servila con il condimento che preferisci.

#### Code di gamberi rossi agli agrumi
*   **Ingredienti:** 500 g code di gamberi rossi, 1 l acidificazione forte, Olio neutro, Olio al limone CBT, Olio al lemongrass CBT, Olio all'arancia CBT, Sale.
*   **Procedimento:**
    1.  Sguscia le code di gambero mantenendo attaccata la parte finale ed elimina il budello.
    2.  Acidificale per 10 minuti, poi scolale e condiscile prima con il sale, dopo con qualche goccia di olio al limone, arancia e lemongrass.
    3.  Inserisci le code di gamberi nel numero che preferisci nelle buste da cottura con l'olio neutro nella misura sufficiente a tenerli in sospensione e separati fra loro, poi condiziona sottovuoto applicando il cuscinetto largo.
    4.  Cuoci a 48°C per 25 minuti, poi abbatti in positivo o in negativo secondo necessità.

#### Granchio reale al burro limone e aglio
*   **Ingredienti:** 1 kg zampe di granchio reale, 1 l acidificazione forte, 100 g burro di qualità morbido, 15 g aglio, 15 g scorza di limone, 10 g foglie di prezzemolo, 1,5 g pepe bianco macinato, 1,5 g sale.
*   **Procedimento:**
    1.  Fai un trito fine con aglio, prezzemolo e scorza di limone, poi amalgamalo al burro ammorbidito aggiungendo pepe e sale.
    2.  Taglia a pezzi e incidi le zampe di granchio reale per togliere la carne senza romperla.
    3.  Falla acidificare per 10 minuti, quindi scola e asciuga.
    4.  Appoggia ogni pezzo di granchio su un foglio di pellicola, poi con una spatola distribuisci un sottile strato di burro aromatizzato su tutta la superficie della polpa.
    5.  Avvolgi la pellicola per ottenere dei cilindri omogenei e ben stretti.
    6.  Con la punta di un ago pratica dei fori sulla pellicola per favorire la fuoriuscita dell'aria in fase di aspirazione.
    7.  Abbattili per stabilizzarli, poi inseriscili nel numero che preferisci nelle buste da cottura e condiziona sottovuoto.
    8.  Cuoci a 56°C per 45 minuti, dopo abbatti in positivo.

#### Mazzancolle al naturale
*   **Ingredienti:** 1 kg mazzancolle, 2 l acidificazione forte, Olio neutro, Sale.
*   **Procedimento:**
    1.  Sguscia le mazzancolle mantenendole intere e lasciando la parte finale della coda.
    2.  Elimina il budello, condiscile con il sale, poi trasferiscile insieme all'olio neutro nelle buste da cottura nel numero che preferisci.
    3.  Abbatti per stabilizzare i liquidi, poi condiziona sottovuoto applicando un cuscinetto largo.
    4.  Cuoci a 52°C per 25 minuti, poi abbatti in positivo o in negativo secondo necessità.

#### Moscardini alla mediterranea
*   **Ingredienti:** 4 moscardini da 150 g, 400 g salsa di pomodoro CBT, 6 g origano, 3 g pepe nero macinato, 3 foglia di alloro, 1 spicchio di aglio, 60 g olio Evo.
*   **Procedimento:**
    1.  Pulisci i moscardini, falli arricciare tuffandoli per pochi secondi in acqua bollente e salata, dopodiché abbattili in positivo.
    2.  Nel frattempo, amalgama tutti gli altri ingredienti.
    3.  Una volta raffreddati, inserisci i moscardini nella busta da cottura con il composto di salsa di pomodoro e spezie, poi condiziona sottovuoto.
    4.  Cuocili a 66°C per 9 ore.
    5.  A cottura ultimata apri la busta, separa i moscardini dal liquido di cottura e abbattili in positivo.
    6.  Filtra il liquido di cottura, trasferiscilo in una casseruola e fallo ridurre fino ad ottenere una salsa densa e saporita, dopo filtrala e abbattila in positivo.
    7.  Unisci la salsa ai moscardini nella busta da cottura, poi condiziona sottovuoto e conserva in frigorifero fino al momento dell'utilizzo.

#### Ostriche al naturale
*   **Ingredienti:** Ostriche, Soluzione salina all'1,5%.
*   **Procedimento:**
    1.  Posiziona le ostriche una a fianco all'altra nelle buste da cottura, in un numero idoneo per riempirle a metà.
    2.  Unisci la soluzione salina alle ostriche fino a sommergerle completamente.
    3.  Abbatti per stabilizzare i liquidi, quindi condiziona sottovuoto praticando 3 sgasature.
    4.  Cuoci a 58°C per 30 minuti, poi abbatti in positivo.
    5.  Apri la busta e scola le ostriche dall'acqua di cottura, aprile e servi.

#### Palamita al naturale
*   **Ingredienti:** 6 tranci di palamita con la pelle di 160 g dello spessore di 3 cm, 2 l acidificazione forte, 2 l marinatura 35:20, Olio neutro.
*   **Procedimento:**
    1.  Acidifica per 10 minuti i tranci di palamita, poi trasferiscili nella marinatura per 6 ore.
    2.  Trascorso questo tempo, scolali e inseriscili singolarmente nelle buste da cottura, aggiungendo una dose di olio sufficiente a mantenerli in sospensione.
    3.  Abbatti per stabilizzare i liquidi, poi condiziona sottovuoto applicando il cuscinetto stretto.
    4.  Cuoci a 50°C per 18 minuti, abbatti in negativo e conserva in surgelatore per il tempo necessario alla bonifica dall'Anisakis.

#### Burger di palamita e salicornia
*   **Ingredienti:** 1 kg palamita (polpa pulita), 100 g salicornia CBT, 2 l acidificazione forte, 5 g sale, 5 g olio al pepe nero CBT.
*   **Procedimento:**
    1.  Taglia la palamita a pezzi e acidificala per 10 minuti.
    2.  Scola, asciuga e macinala con tritacarne a fori grossi.
    3.  Taglia la salicornia a pezzi di mezzo cm, poi amalgamala al macinato di palamita, al sale e all'olio al pepe nero.
    4.  Forma dei burger negli anelli di acciaio alti 2 cm e abbattili per stabilizzarli.
    5.  Inseriscili singolarmente nelle buste da cottura e condizionali sottovuoto.
    6.  Cuocili a 44°C per 18 minuti, poi abbattili in positivo.
    7.  Al momento dell'utilizzo, estrai i burger dalla busta e dagli anelli, asciugali e falli rosolare velocemente con il metodo che più preferisci.

#### Palamita confit
*   **Ingredienti:** 1 palamita da 2 kg, 2 l acidificazione forte, 200 g sale fine, 200 g zucchero, 400 g olio EVO.
*   **Procedimento:**
    1.  Mescola sale e zucchero.
    2.  Sfiletta la palamita con cura, poi seleziona la parte alta del filetto e taglia dei trancetti da 2 cm di spessore.
    3.  Acidificali per 10 minuti, dopodiché scolali e falli rotolare nella miscela di sale e zucchero affinché tutta la superficie ne sia ricoperta da uno strato abbondante.
    4.  Trasferiscili nella busta da conservazione e condizionali sottovuoto.
    5.  Falli marinare in frigorifero per 2 ore.
    6.  Trascorso questo tempo, apri la busta e sciacqua i trancetti di palamita sotto acqua corrente fredda.
    7.  Asciugali sommariamente e inseriscili, nel numero che preferisci, nelle buste da cottura con una quantità di olio EVO sufficiente a ricoprirli e tenerli separati fra loro.
    8.  Abbatti per stabilizzare i liquidi e condiziona sottovuoto applicando un cuscinetto largo.
    9.  Cuoci a 42°C per 25 minuti, dopodiché abbatti in negativo e conserva in surgelatore per il tempo necessario alla bonifica dall'Anisakis.

#### Pesce sciabola al naturale
*   **Ingredienti:** 1 kg filetto di pesce sciabola, 2 l marinatura forte, 1 l marinatura 35:20, Olio neutro.
*   **Procedimento:**

    2.  Trascorso questo tempo scolali dalla marinatura, asciugali e inseriscili, nel numero che preferisci, nelle buste da cottura, tenendoli affiancati.
    3.  Aggiungi una dose di olio sufficiente a tenerli in sospensione e separati fra loro, poi abbatti per stabilizzare i liquidi.
    4.  Condiziona sottovuoto applicando il cuscinetto largo.
    5.  Cuoci a 48°C per 15 minuti, poi abbatti in negativo e conserva in surgelatore per il tempo necessario alla bonifica dall'Anisakis.

#### Arrostino di pesce spada al naturale
*   **Ingredienti:** 1 kg polpa di pesce spada, 2 l acidificazione forte, 2 l marinatura 35:20, Olio neutro.
*   **Procedimento:**

    2.  Trascorso questo tempo, scola e asciuga il pesce spada, poi inserisci i trancetti singolarmente nelle buste da cottura.

    6.  Al momento dell'uso, dopo averlo decongelato, estrai i trancetti dalla busta, asciugali e falli rosolare velocemente in padella utilizzando olio e aromi a piacere.

#### Dadini di pesce spada ai sapori mediterranei
*   **Ingredienti:** 1 kg polpa di pesce spada, 2 l acidificazione forte, 2 l marinatura 35:20, 5 g olio all'aglio CBT, 5 g olio al peperoncino CBT, 5 g olio all'origano CBT, 5 g olio al basilico CBT, Olio EVO, Olio neutro.

#### Polpo al naturale
*   **Ingredienti:** 1 polpo da 1,5 kg.
*   **Procedimento:**

    3.  Una volta raffreddati, inserisci i tentacoli e la testa nella busta da cottura e condiziona sottovuoto.

#### Medaglioni di rana pescatrice al naturale
*   **Ingredienti:** 1 kg filetto di rana pescatrice, 2 l acidificazione forte, 2 l marinatura 35:20, Olio neutro.
*   **Procedimento:**
    1.  Pulisci il filetto dalle pellicine, taglialo a medaglioni alti 3 cm e acidificali per 10 minuti.
    2.  Scolali e inseriscili nella marinatura per 6 ore.
    3.  Trascorso questo tempo, toglili dalla marinatura.
    4.  Asciugali e inseriscili nel numero che preferisci nelle buste da cottura con l'olio neutro, in misura sufficiente a tenerli in sospensione e separati fra loro.
    5.  Condiziona sottovuoto applicando un cuscinetto stretto.
    6.  Cuoci a 54°C per 20 minuti, poi abbatti in negativo e conserva in surgelatore per il tempo necessario alla bonifica dall'Anisakis.

#### Guance di rana pescatrice ai capperi e vino bianco
*   **Ingredienti:** 1 kg guance di rana pescatrice, 2 l acidificazione forte, 2 l marinatura 35:20, 30 g polvere di capperi CBT, 10 g umami di cipolle CBT, 250 g riduzione di vino bianco, 100 g jus di baccalà CBT, Burro di qualità.
*   **Procedimento:**
    1.  Pulisci le guance dalle pellicine e acidificale per 10 minuti.
    2.  Scolale e inseriscile nella marinatura per 6 ore.
    3.  Trascorso questo tempo, estrai le guance dalla marinatura e asciugale.
    4.  Stempera la polvere di capperi e l'umami di cipolle nel vino bianco.
    5.  Inserisci le guance di rana pescatrice nel numero che preferisci nelle buste da cottura e successivamente dividi equamente il composto di riduzione di vino in ogni busta.
    6.  Abbatti per stabilizzare i liquidi e condiziona sottovuoto applicando un cuscinetto largo.
    7.  Cuoci a 54°C per 20 minuti.
    8.  A cottura terminata apri la busta, separa le guance dal liquido di cottura e abbattile in negativo.
    9.  Condizionale sottovuoto e conservale in surgelatore per il tempo necessario alla bonifica dall'Anisakis.
    10. Fondi lo jus di baccalà, unisci il liquido di cottura delle guance e fallo ridurre, poi montalo con il burro per ottenere una salsa cremosa e regola di sapore.
    11. Abbatti in negativo, condiziona sottovuoto e conserva insieme alle guance.
    12. Al momento dell'utilizzo, rigenera guance e salsa. Togli le guance dalla busta, asciugale su carta assorbente e impiattale nappandole con la salsa.

#### Medaglioni di rana pescatrice in porchetta
*   **Ingredienti:** 1 kg filetto di rana pescatrice, 2 l acidificazione forte, 2 l marinatura 35:20, 150 g grasso di pancetta affumicata stagionata CBT, 10 g olio al pepe nero CBT, 10 g finocchietto fresco, 5 g olio all'aglio CBT.

    4.  Trascorso questo tempo, togli i medaglioni di rana pescatrice dalla marinatura e asciugali.
    5.  Amalgama i medaglioni al composto di grasso e aromi e inseriscili nel numero che preferisci nelle buste da cottura.
    6.  Condiziona sottovuoto praticando un cuscinetto largo.

#### Filetto di ricciola al naturale
*   **Ingredienti:** 6 tranci di ricciola da 160 g dello spessore di 3 cm con la pelle squamata, 2 l acidificazione forte, 2 l marinatura 35:20, Olio neutro.

#### Filetto di rombo al naturale
*   **Ingredienti:** 1 kg filetti di rombo, 2 l acidificazione forte, 2 l marinatura 35:20, 250 g olio neutro.

#### Filetti di rombo all'aneto e limone
*   **Ingredienti:** 1 kg filetti di rombo, 2 l acidificazione forte, 2 l marinatura 35:20, 20 g scorza di limone, 20 g aneto, 20 g olio al pepe nero CBT, 250 g olio EVO.

    5.  Abbatti per stabilizzare i liquidi, poi condiziona sottovuoto applicando il cuscinetto stretto.

    2.  Frullala con un thermomix o un pacojet, per ottenere una pasta liscia e omogenea.
    3.  Condiscila con la panna, il nero di seppia, gli oli aromatici e il sale.
    4.  Abbattila in positivo per stabilizzarla, poi sgasala per eliminare tutta l'aria incorporata durante la lavorazione.
    5.  Trasferiscila nella busta da cottura e condizionala sottovuoto per ottenere una mattonella dello spessore di 2 cm.
    6.  Cuocila a 52°C per 18 minuti, poi abbatti in positivo.
    7.  Al momento dell'uso incidi i lati della busta ed eliminala.
    8.  Taglia la mattonella a cubi di 2 cm e poi scaldali a 60°C per 1 minuto.
    9.  Posizionali sul piatto, condiscili a piacere e servi.

#### Seppie al naturale
*   **Ingredienti:** 20 mantelli di seppie da 50 g l'uno circa, 1 l acidificazione forte, Sale.
*   **Procedimento:**
    1.  Pulisci le seppie ed elimina le pellicine che le ricoprono, poi acidificale per 10 minuti.
    2.  Scola, asciuga e condisci con il sale.
    3.  Inseriscile ben distese nella busta da cottura e condiziona sottovuoto.
    4.  Cuoci a 60°C per 20 minuti, poi abbatti in positivo e conserva in frigorifero fino al momento dell'uso.

#### Seppie arrotolate al limone
*   **Ingredienti:** 20 mantelli di seppie da 50 g l'uno circa, 1 l acidificazione forte, 20 g olio al limone CBT, Sale.
*   **Procedimento:**
    1.  Pulisci le seppie e elimina le pellicine che le ricoprono, poi acidificale per 10 minuti.
    2.  Scola, asciuga, condisci con il sale e successivamente con l'olio al limone.
    3.  Arrotola ogni manto di seppia su sé stesso, poi avvolgilo nella pellicola per ottenere un cilindro stretto e omogeneo.
    4.  Con la punta di un ago pratica alcuni fori sulla pellicola per favorire l'estrazione dell'aria in fase di aspirazione, dopodiché trasferiscili nel numero che preferisci nelle buste da cottura.
    5.  Condiziona sottovuoto e cuoci a 60°C per 20 minuti, poi abbatti in positivo e conserva in frigorifero fino al momento dell'uso.

#### Sgombro al naturale
*   **Ingredienti:** 10 filetti di sgombro, 2 l acidificazione forte, 2 l marinatura 35:20, Olio neutro.
*   **Procedimento:**
    1.  Pulisci, togli le lische e acidifica per 10 minuti i filetti di sgombro, poi tagliali a pezzi regolari di 5 cm.
    2.  Immergili nella marinatura per 4 ore, quindi scola e asciuga.
    3.  Inserisci i filetti di sgombro singolarmente nelle buste da cottura.
    4.  Aggiungi l'olio neutro nella misura sufficiente a tenere in sospensione il pesce.
    5.  Abbatti per stabilizzare i liquidi, poi condiziona sottovuoto applicando un cuscinetto stretto.
    6.  Cuoci a 44°C per 15 minuti, poi abbatti in negativo e conserva in surgelatore per il tempo necessario alla bonifica dall'Anisakis.
    7.  Al momento dell'uso, rigenera lo sgombro per pochi minuti, poi scolalo dall'olio e servilo.

#### Burger di sogliola arrotolata al limone e salvia
*   **Ingredienti:** 6 sogliole da 300 g, 2 l acidificazione forte, 2 l marinatura 35:20, 10 g olio al limone CBT, 10 g olio alla salvia CBT, 10 g olio al pepe bianco CBT.
*   **Procedimento:**
    1.  Spella le sogliole da entrambi i lati, sfilettale e taglia la polpa per il senso della lunghezza in strisce della larghezza di 2 cm.
    2.  Acidifica i filettini di sogliola per 10 minuti, poi trasferiscili nella marinatura per 6 ore.
    3.  Trascorso questo tempo scolali dalla marinatura e asciugali.
    4.  Mescola i tre oli aromatici e con questo mix spennella i filetti di sogliola.
    5.  Posiziona i filetti di sogliola arrotolandoli con ordine negli anelli di acciaio alti 2 cm e abbattili per stabilizzarli.
    6.  Inserisci singolarmente gli anelli nelle buste da cottura e condiziona sottovuoto.
    7.  Cuoci a 48°C per 20 minuti, poi abbatti in positivo.
    8.  Al momento dell'utilizzo, toglili dalla busta e dagli anelli, asciugali e falli rosolare velocemente con il metodo che più preferisci.

#### Stoccafisso al latte e cipolle
*   **Ingredienti:** 1 kg polpa pulita di stoccafisso ammollato, 2 l acidificazione leggera, 200 g latte, 100 g umami di cipolle CBT, 200 g latte, 50 g Parmigiano Reggiano grattugiato, 100 g acciughe sott'olio, 300 g olio EVO, 2 g olio all'aglio CBT, 2 g pepe nero macinato, Sale.
*   **Procedimento:**
    1.  Taglia la polpa di stoccafisso a pezzi e acidificala per 10 minuti, scolala e condiscila con il sale.
    2.  In una padella fai rosolare velocemente la brunoise di cipolle con poco olio EVO, poi abbatti in positivo.
    3.  Trita finemente le acciughe e stemperale nel rimanente olio EVO.
    4.  In una bastardella unisci stoccafisso, cipolle, umami di cipolle, latte, Parmigiano Reggiano, olio e acciughe, pepe nero, olio all'aglio, poi amalgama bene e regola di sapore.
    5.  Trasferisci il composto nella busta da cottura e condiziona sottovuoto.
    6.  Cuoci a 72°C per 3 ore, mescolando ogni 20 minuti.
    7.  A cottura ultimata apri la busta e separa i liquidi e mettili a ridurre in una casseruola fino a che non si saranno addensati, quindi uniscili allo stoccafisso amalgamando bene.
    8.  Regola di sapore, poi abbatti in positivo.
    9.  Condiziona sottovuoto e conserva in frigorifero fino al momento dell'utilizzo.

#### Trancio di tonno al naturale
*   **Ingredienti:** 1 kg tonno rosso senza pelle, 2 l acidificazione forte, 2 l marinatura 35:20, Olio neutro.
*   **Procedimento:**
    1.  Pulisci il tonno e taglialo a tranci da 150 g e dello spessore di 4 cm.
    2.  Acidifica i tranci per 10 minuti poi trasferiscili nella marinatura per 12 ore.
    3.  Trascorso questo tempo scolali dalla marinatura, asciugali e inseriscili singolarmente nelle buste da cottura insieme all'olio nella misura sufficiente per tenerli in sospensione.
    4.  Abbatti per stabilizzare i liquidi, poi condiziona sottovuoto applicando il cuscinetto stretto.
    5.  Cuoci a 42°C per 30 minuti, poi abbatti in negativo e conservali in surgelatore per il tempo necessario alla bonifica dall'Anisakis.
    6.  Per l'utilizzo decongela come da procedura e scola il tonno dall'olio.
    7.  Rosolalo velocemente su tutta la superficie, poi affettalo, condisci a piacere e servi.

#### Tataki di ventresca di tonno
*   **Ingredienti:** 1 kg ventresca di tonno, 2 l acidificazione forte, 2 l marinatura 35:20, Olio Evo.
*   **Procedimento:**
    1.  Pulisci la ventresca dalla pelle e dalle membrane che la ricoprono, poi tagliala a tranci da 150 g.
    2.  Acidificala per 10 minuti poi trasferiscila nella marinatura per 12 ore.
    3.  Trascorso questo tempo scola i tranci di ventresca dalla marinatura, asciugali e inseriscili singolarmente nelle buste da cottura insieme all'olio nella misura sufficiente a tenerli in sospensione.
    4.  Abbatti per stabilizzare i liquidi, poi condiziona sottovuoto applicando il cuscinetto stretto.
    5.  Cuoci a 40°C per 30 minuti, poi abbatti in negativo.
    6.  Per l'utilizzo decongela la ventresca come da procedura e scolala dall'olio.
    7.  Rosolala velocemente su tutta la superficie, poi affettala, condisci a piacere e servi.

#### Triglia al naturale
*   **Ingredienti:** 6 filetti di triglia squamati da 70 g l'uno, 1 l acidificazione forte, 1 l marinatura 35:20, Olio neutro.
*   **Procedimento:**
    1.  Pulisci e spina i filetti di triglie, acidificali per 10 minuti e trasferiscili nella marinatura per 6 ore.
    2.  Trascorso questo tempo, scolali e inserisci due filetti in ogni busta da cottura, aggiungendo una dose di olio sufficiente a tenerli in sospensione e separati fra loro.
    3.  Abbatti per stabilizzare i liquidi, poi condiziona sottovuoto applicando il cuscinetto stretto.
    4.  Cuoci a 48°C per 15 minuti, poi abbatti in negativo e conserva in surgelatore per il tempo necessario alla bonifica dall'Anisakis.

#### Filetto di trota al naturale
*   **Ingredienti:** 1 filetto di trota con la pelle, squamata e spinata, 2 l acidificazione forte, 2 l marinatura 35:20, Olio neutro.
*   **Procedimento:**
    1.  Taglia il filetto di trota a tranci dalla forma armonica e regolare di circa 5/6 cm, acidificali per 10 minuti, poi trasferiscili nella marinatura per 6 ore.
    2.  Trascorso questo tempo, scolali e inseriscili nel numero che preferisci nelle buste da cottura, aggiungendo una dose di olio sufficiente a tenerli in sospensione e separati fra loro.
    3.  Abbatti per stabilizzare i liquidi, poi condiziona sottovuoto applicando il cuscinetto stretto.
    4.  Cuoci a 48°C per 18 minuti e abbatti in positivo.
    5.  Conserva i tranci in frigorifero fino al momento dell'uso.

#### Vongole al naturale
*   **Ingredienti:** 1 kg vongole, 500 g acqua, 7,5 g sale.
*   **Procedimento:**
    1.  Stempera il sale nell'acqua.
    2.  Monda, spurga e lava le vongole, poi inseriscile nelle buste da cottura e unisci la soluzione salina.
    3.  Abbatti per stabilizzare i liquidi e condiziona sottovuoto praticando 3 sgasature.
    4.  Cuoci a 85°C per 20 minuti, poi abbatti in positivo.
    5.  Conservale in frigorifero fino al momento dell'uso.

#### Lupini al naturale
*   **Ingredienti:** 1 kg lupini, 500 g acqua, 7,5 g sale.
*   **Procedimento:**
    1.  Stempera il sale nell'acqua.
    2.  Monda, spurga e lava i lupini, poi inseriscili nelle buste da cottura e unisci la soluzione salina.
    3.  Abbatti per stabilizzare i liquidi e condiziona sottovuoto praticando 3 sgasature.
    4.  Cuoci a 82°C per 20 minuti, poi abbatti in positivo.
    5.  Conservali in frigorifero fino al momento dell'uso.

## VERDURE

#### Purea di aglio
*   **Ingredienti:** 1 kg aglio.
*   **Procedimento:**
    1.  Pela l'aglio mantenendolo il più intatto possibile, poi elimina solamente la parte scura della radice.
    2.  Inserisci gli spicchi d'aglio sbucciati nella busta da cottura e condizionali sottovuoto praticando 3 sgasature.
    3.  Cuoci a 88°C per 1 ora, poi abbatti in positivo.
    4.  Una volta freddo estrai l'aglio dalla busta e frullalo per ridurlo in una purea liscia.
    5.  Sgasa la purea d'aglio e conservala sottovuoto in frigorifero.

#### Spuma di aglione della Valdichiana
*   **Ingredienti:** 400 g purea di aglione della Valdichiana CBT, 200 g panna, 150 g latte, 100 g acqua, 7 g zucchero, 8 g sale, 2,5 g iota, 1 g xantano.
*   **Procedimento:**
    1.  Mescola zucchero, sale, iota e xantano.
    2.  Nella busta da cottura inserisci panna, latte, acqua, la purea di aglione ed infine le polveri.
    3.  Abbatti per stabilizzare i liquidi, condiziona sottovuoto e poi mescola il contenuto della busta per sciogliere gli ingredienti.
    4.  Cuoci a 85°C per 30 minuti mescolando ogni 5 minuti, dopo apri la busta e setaccia il contenuto.
    5.  Trasferisci il composto in un sifone e caricalo con due cartucce.
    6.  Tieni il sifone in caldo a 50°C.

#### Purea di asparagi
*   **Ingredienti:** 1 kg asparagi.
*   **Procedimento:**
    1.  Lava, monda e pela gli asparagi, poi affettali finemente.
    2.  Inseriscili nella busta da cottura e condizionali sottovuoto praticando 5 sgasature.
    3.  Cuoci a 86°C per 20 minuti, poi abbatti in positivo.
    4.  Estrai gli asparagi dalla busta, frullali e setacciali per eliminare le fibre coriacee.
    5.  Sgasa la purea e conservala sottovuoto in frigorifero fino al momento dell'uso.

#### Asparagi al naturale
*   **Ingredienti:** 1 kg asparagi, 1 l acqua, 15 g sale.
*   **Procedimento:**
    1.  Pulisci, lava e pela gli asparagi, poi stempera il sale nell'acqua.
    2.  Inserisci gli asparagi nella busta da cottura insieme ad una quantità di acqua e sale pari a metà del loro peso, poi condiziona sottovuoto praticando 5 sgasature.
    3.  Cuoci a 86°C per 18 minuti e abbatti in positivo.
    4.  Conserva in frigorifero fino al momento dell'uso.

#### Rape rosse arrostite all'olio al carbone di porri
*   **Ingredienti:** 5 rape rosse di piccole dimensioni, Olio al carbone di porri CBT, Sale.
*   **Procedimento:**
    1.  Lava con cura le rape rosse e asciugale.
    2.  Mettile per qualche minuto sulle braci a calore fortissimo affinché la buccia si arrostisca per bene, poi abbattile in positivo.
    3.  Condiscile con il sale e l'olio al carbone di porri, inseriscile nella busta da cottura e cuocile a 88°C per 3 ore, quindi abbattile in positivo.
    4.  Conservale sottovuoto in frigorifero.

#### Broccoli al naturale
*   **Ingredienti:** 1 kg broccoli, 1 l acqua, 20 g sale.
*   **Procedimento:**
    1.  Taglia i broccoli a cime, poi lavali e scolali.
    2.  Stempera il sale nell'acqua, poi inseriscila nella busta da cottura insieme ai broccoli.
    3.  Condiziona sottovuoto praticando 5 sgasature.
    4.  Cuoci a 88°C per 25 minuti e abbatti in positivo.
    5.  Conservali in frigorifero fino al momento dell'uso.

#### Brunoise per soffritto
*   **Ingredienti:** 500 g brunoise di cipolle CBT, 250 g brunoise di carote CBT, 125 g brunoise di sedano CBT.
*   **Procedimento:**
    1.  Amalgama le verdure, poi inseriscile nelle buste da conservazione.
    2.  Condizionale sottovuoto e conservale in frigorifero fino al momento dell'uso.
    3.  Per utilizzarle basterà farle soffriggere o stufare per pochi minuti, oppure usarle tal quali.

#### Carciofi all'aglio e alloro
*   **Ingredienti:** 12 carciofi, 1 spicchio di aglio, 2 foglie di alloro, Pepe nero macinato, Sale, Olio EVO.
*   **Procedimento:**
    1.  Pulisci i carciofi lasciando 10 cm di gambo e tagliali a metà.
    2.  Condiscili con sale, pepe, l'aglio tagliato a fette, l'alloro spezzettato ed infine l'olio EVO.
    3.  Inseriscili ordinatamente nella busta da cottura e condizionali sottovuoto praticando 5 sgasature.
    4.  Cuoci a 90°C per 30 minuti, poi abbatti in positivo.
    5.  Conserva in positivo fino al momento dell'uso.

#### Carciofi interi al naturale
*   **Ingredienti:** 12 carciofi, Sale.
*   **Procedimento:**
    1.  Pulisci i carciofi lasciando 10 cm di gambo.
    2.  Condiscili con sale, poi inseriscili ordinatamente nella busta da cottura e condizionali sottovuoto praticando 5 sgasature.
    3.  Cuoci a 90°C per 30 minuti, poi abbatti in positivo.
    4.  Conserva in positivo fino al momento dell'uso.

#### Brunoise di carote
*   **Ingredienti:** 1 kg carote, Sale.
*   **Procedimento:**
    1.  Lava, monda e pela le carote.
    2.  Tagliale a brunoise da mezzo centimetro di lato, poi condiscile con il sale e falle macerare per 10 minuti.
    3.  Trascorso questo tempo, elimina il liquido che avranno rilasciato e inseriscile nella busta da cottura.
    4.  Condizionale sottovuoto praticando 2 sgasature.
    5.  Cuocile a 88°C per 1 ora, poi abbattile in positivo.
    6.  Conserva in frigorifero fino al momento dell'uso.

#### Carote a bastoncini
*   **Procedimento:** Vedi ricetta "brunoise di carote" ma con taglio a bastoncino.

#### Carote baby al cumino
*   **Ingredienti:** 1 kg carote baby, 100 g burro, 4 g semi di cumino, 2 g pepe bianco in grani, 5 g umami di cipolle CBT, 1,5 g xantano, Sale.
*   **Procedimento:**
    1.  Tosta i semi di cumino e il pepe per due minuti, poi pestali finemente nel mortaio.
    2.  In una casseruola fondi il burro, aggiungi le spezie macinate e falle imbiondire, poi trasferiscili in una caraffa e frullali con l'umami di cipolle e lo xantano, regola di sale e infine abbatti in positivo.
    3.  Lava, monda e pela le carote, poi condiscile con il sale e falle macerare per 20 minuti.
    4.  Trascorso questo tempo elimina il liquido che avranno rilasciato e inseriscile nella busta da cottura insieme al composto di burro e aromi.
    5.  Condiziona sottovuoto praticando 3 sgasature.
    6.  Cuocile a 86°C per 40 minuti, poi abbatti in positivo.
    7.  Apri e versa il contenuto della busta in una padella, poi falle rosolare per qualche minuto a fuoco dolce.
    8.  Regola di sapore e servi.

#### Carote in agrodolce al lemongrass
*   **Ingredienti:** 1 kg carote, 100 g aceto di vino bianco, 100 g acqua, 75 g zucchero, 8 g sale, 1 stecca di lemongrass, 2 g pepe bianco in grani.
*   **Procedimento:**
    1.  In una casseruola unisci acqua, aceto, zucchero, sale, lemongrass e pepe e falli sobbollire per due minuti, poi abbatti in positivo.
    2.  Lava, monda e pela le carote, poi tagliale nella forma che preferisci e inseriscile nella busta da cottura insieme all'agrodolce.
    3.  Condizionale sottovuoto praticando 3 sgasature.
    4.  Cuocile a 86°C per 40 minuti, poi abbatti in positivo.
    5.  Conserva in frigorifero fino al momento dell'uso.

#### Cardi al naturale
*   **Ingredienti:** 1 kg cardi, Sale.
*   **Procedimento:**
    1.  Lava le coste dei cardi e private dei filamenti, poi condiscili con il sale e falli macerare per 10 minuti.
    2.  Elimina i liquidi che avranno rilasciato, poi inseriscili nelle buste da cottura.
    3.  Condiziona sottovuoto praticando 5 sgasature.
    4.  Cuocili a 90°C per 4 ore, quindi abbattili in positivo.
    5.  Conservali in frigorifero fino al momento dell'uso.

#### Cardi al burro nocciola
*   **Ingredienti:** 1 kg cardi, 200 g burro, Pepe nero macinato, Sale.
*   **Procedimento:**
    1.  Lava le coste dei cardi e private dei filamenti, poi condiscile con il sale e falle macerare per 10 minuti.
    2.  Nel frattempo cuoci il burro in una casseruola fino a farlo diventare color nocciola, dopodiché abbattilo in positivo.
    3.  Elimina i liquidi che avranno rilasciato i cardi, aggiungi una generosa macinata di pepe, poi inseriscili nelle buste da cottura dividendo equamente il burro.
    4.  Condiziona sottovuoto praticando 5 sgasature.
    5.  Successivamente cuocili a 90°C per 2 ore, quindi abbattili in positivo.
    6.  Al momento dell'uso apri la busta e versa tutto il contenuto in una padella.
    7.  Fai scaldare i cardi a fuoco dolce mescolando spesso finché i liquidi si emulsioneranno per creare una salsa liscia.
    8.  Regola di sapore e servi.

#### Cavoletti di Bruxelles al naturale
*   **Ingredienti:** 1 kg cavoletti di Bruxelles, 1 l acqua, 15 g sale.
*   **Procedimento:**
    1.  Monda, lava e taglia in due i cavoletti di Bruxelles (in caso di cavoletti di piccola taglia possono cuocere interi).
    2.  Stempera il sale nell'acqua, poi inseriscila nella busta da cottura insieme ai broccoli.
    3.  Condiziona sottovuoto praticando 5 sgasature.
    4.  Cuoci a 88°C per 25 minuti, poi abbatti in positivo.
    5.  Conservali in frigorifero fino al momento dell'uso.

#### Cavolfiore al naturale
*   **Ingredienti:** 1 kg cavolfiori, 1 l acqua, 20 g sale.
*   **Procedimento:**
    1.  Taglia i cavolfiori a cimette, poi lavali e scolali.
    2.  Stempera il sale nell'acqua, poi inseriscila nella busta da cottura insieme ai cavolfiori.
    3.  Condiziona sottovuoto praticando 3 sgasature.
    4.  Cuoci a 86°C per 25 minuti, poi abbatti in positivo.
    5.  Conservali in frigorifero fino al momento dell'uso.

#### Cavolfiori in agrodolce all'anice stellato
*   **Ingredienti:** 1 kg cavolfiore, 100 g aceto di vino bianco, 100 g acqua, 75 g zucchero, 8 g sale, 2 bacche di anice stellato.
*   **Procedimento:**
    1.  In una casseruola unisci acqua, aceto, zucchero, sale e anice stellato. Falli sobbollire per due minuti, poi abbatti in positivo.
    2.  Lava, monda e pela il cavolfiore, taglialo nella forma che preferisci, poi inseriscilo nella busta da cottura insieme all'agrodolce.
    3.  Condizionalo sottovuoto praticando 3 sgasature.
    4.  Cuoci a 88°C per 40 minuti, poi abbatti in positivo.
    5.  Conserva in frigorifero fino al momento dell'uso.

#### Cavolo nero al naturale
*   **Ingredienti:** 500 g cuori di cavolo nero, 500 g acqua, 7,5 g sale.
*   **Procedimento:**
    1.  Stempera il sale nell'acqua.
    2.  Lava i cuori di cavolo nero, scolali bene, poi inseriscili nella busta da cottura insieme all'acqua e al sale.
    3.  Condizionali sottovuoto praticando 5 sgasature.
    4.  Cuoci a 90°C per 1 ora, poi abbatti in positivo.
    5.  Conserva in frigorifero fino al momento dell'uso.

#### Cavolo cappuccio rosso in agrodolce
*   **Ingredienti:** 1 kg cavolo cappuccio rosso, 100 g aceto di vino rosso, 100 g acqua, 75 g zucchero, 10 g sale, 2 g semi di cumino, 2 g pepe nero in grani, Sale per macerare.
*   **Procedimento:**
    1.  Fai tostare il cumino ed il pepe per due minuti, poi pestali grossolanamente al mortaio.
    2.  In una casseruola unisci acqua, aceto, zucchero, sale, cumino e pepe.
    3.  Falli sobbollire per 2 minuti, poi abbatti in positivo.
    4.  Una volta raffreddato filtra l'agrodolce dai residui solidi.
    5.  Lava e monda il cavolo rosso, quindi taglialo a fette alte 3 mm.
    6.  Sfoglialo, condiscilo con il sale e fallo macerare per 10 minuti.
    7.  Trascorso questo tempo elimina il liquido che avrà rilasciato e inseriscilo nella busta da cottura insieme all'agrodolce.
    8.  Condiziona sottovuoto praticando 3 sgasature.
    9.  Cuocile a 88°C per 30 minuti, poi abbatti in positivo.
    10. Conserva in frigorifero fino al momento dell'uso.

#### Ceci al naturale
*   **Ingredienti:** 500 g ceci secchi, 2 l acqua per ammollo, 2 l acqua per cottura, 15 g sale.
*   **Procedimento:**
    1.  Sciacqua i ceci e inseriscili nella busta da conservazione insieme all'acqua di ammollo.
    2.  Condiziona sottovuoto e lasciali idratare in frigorifero per 8 ore.
    3.  Trascorso questo tempo, apri la busta, scolali e sciacquali sotto l'acqua corrente.
    4.  Inseriscili nella busta da cottura insieme all'acqua per cottura e al sale.
    5.  Abbatti per stabilizzare i liquidi, poi condiziona sottovuoto praticando 3 sgasature.
    6.  Cuoci a 88°C per 3 ore e abbatti in positivo.
    7.  Conserva in frigorifero fino al momento dell'uso.

#### Cetriolini in agrodolce aromatico
*   **Ingredienti:** 1 kg cetriolini, 150 g aceto di vino bianco, 150 g acqua, 100 g zucchero, 15 g sale, 2 g semi di coriandolo, 2 g pepe nero in grani, 2 g senape gialla in grani, Sale per macerare.
*   **Procedimento:**
    1.  In una casseruola unisci acqua, aceto, zucchero, sale, coriandolo, senape e pepe e falli sobbollire per 2 minuti, poi abbatti in positivo.
    2.  Taglia i cetriolini in due nel senso della lunghezza e condiscili con il sale.
    3.  Condizionali sottovuoto praticando 3 sgasature e falli macerare per 2 ore.
    4.  Trascorso questo tempo apri la busta, scolali dai liquidi che avranno rilasciato e asciugali.
    5.  Trasferiscili nella busta da cottura insieme all'agrodolce e le spezie e condizionali sottovuoto praticando 3 sgasature.
    6.  Cuocili a 88°C per 20 minuti, poi abbatti in positivo.
    7.  Conservali in frigorifero e attendi 24 ore prima di consumarli.

#### Cipolline borettane brasate
*   **Ingredienti:** 1 kg cipolle borettane, 60 g burro, 30 g riduzione di vino bianco, 20 g zucchero, 10 g sale, 10 g burro all'alloro CBT, 10 g burro al pepe nero CBT, 0,2 g xantano.
*   **Procedimento:**
    1.  Pela e monda le cipolline.
    2.  Frulla tutti gli altri ingredienti fino ad ottenere una crema omogenea, poi amalgamala alle cipolline.
    3.  Inserisci il composto nella busta da cottura e cuoci a 88°C per 3 ore, mescolando ogni 30 minuti.
    4.  A cottura ultimata abbatti in positivo.
    5.  Al momento dell'uso trasferisci il liquido di cottura in una casseruola e fallo ridurre quasi del tutto, poi aggiungi le cipolline e falle dorare, infine aggiungi poca acqua per ripristinare l'emulsione e ottenere una salsa che ricopra le cipolline.
    6.  Regola di sapore e servi.

#### Brunoise di cipolle
*   **Ingredienti:** 1 kg cipolle, Sale.
*   **Procedimento:**
    1.  Lava e pela le cipolle.
