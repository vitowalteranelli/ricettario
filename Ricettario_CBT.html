## FRUTTA E DOLCI

#### Fili di scorze di agrumi leggermente sciroppate
*   **Ingredienti:** 100 g scorze di agrumi (solo la parte colorata senza albedo), 400 g acqua, 200 g sciroppo 2:1.
*   **Procedimento:**
    1.  Taglia le scorze a julienne, poi inseriscile nella busta da cottura con l'acqua.
    2.  Condiziona sottovuoto praticando 3 sgasature.
    3.  Cuoci a 88°C per 1 ora e a cottura terminata, apri la busta ed elimina l'acqua di cottura.
    4.  Unisci le scorze allo sciroppo e successivamente trasferisci il composto nella busta da cottura.
    5.  Abbatti per stabilizzare i liquidi, poi condiziona sottovuoto praticando 3 sgasature.
    6.  Cuoci a 62°C per 6 ore, poi abbatti in positivo e conserva in frigorifero.

#### Albicocche al naturale
*   **Ingredienti:** 1 kg albicocche sode.
*   **Procedimento:**
    1.  Lava, taglia a metà le albicocche e togli i noccioli.
    2.  Inseriscile nella busta da cottura e condizionale sottovuoto praticando 3 sgasature.
    3.  Precuoci a 55°C per 30 minuti, poi abbattile in positivo.
    4.  Successivamente cuocile a 84°C per 20 minuti quindi abbatti in positivo.
    5.  Conservale in frigorifero fino al momento dell'utilizzo.

#### Albicocche sciroppate alla vaniglia
*   **Ingredienti:** 1 kg albicocche sode, 500 g sciroppo 2:1, 1 bacca di vaniglia.
*   **Procedimento:**
    1.  Lava e taglia a metà le albicocche, togliendo i noccioli.
    2.  Mescolale allo sciroppo e ai semi grattati dalla bacca di vaniglia e inserisci il tutto nella busta da cottura.
    3.  Condiziona sottovuoto praticando 2 sgasature.
    4.  Precuocile a 55°C per 30 minuti poi abbatti in positivo.
    5.  Successivamente, cuoci a 84°C per 20 minuti mescolando ogni 5 minuti.
    6.  Abbatti in positivo e conserva in frigorifero.

#### Purea dolce di albicocche
*   **Ingredienti:** 1 kg albicocche mature, 400 g zucchero, 2 g acido citrico.
*   **Procedimento:**
    1.  Lava le albicocche, elimina i noccioli e tagliale a pezzi.
    2.  Miscela lo zucchero all'acido citrico poi mescolalo alle albicocche.
    3.  Inserisci il composto nella busta da cottura e condiziona sottovuoto praticando 2 sgasature.
    4.  Cuoci a 86°C per 30 minuti mescolando ogni 10 minuti.
    5.  A fine cottura tutto lo zucchero dovrà essere sciolto.
    6.  Abbatti in positivo e una volta raffreddate, apri la busta e dividi la polpa dallo sciroppo.
    7.  Frulla e setaccia la polpa per ottenere una purea liscia, poi conservala sottovuoto.
    8.  Recupera lo sciroppo e conservalo sottovuoto per altre preparazioni.

#### Ananas al naturale
*   **Ingredienti:** 1 ananas.
*   **Procedimento:**
    1.  Pela l'ananas e taglialo a pezzi di 2 cm.
    2.  Inseriscilo nella busta da cottura e condizionalo sottovuoto praticando 2 sgasature.
    3.  Precuoci a 55°C per 30 minuti poi abbatti in positivo.
    4.  Successivamente cuoci a 84°C per 20 minuti.
    5.  Abbatti in positivo e conserva in frigorifero.

#### Ananas alla cannella
*   **Ingredienti:** 1 ananas, 100 g zucchero, 5 g cannella in polvere.
*   **Procedimento:**
    1.  Pela l'ananas e taglia la polpa in tronchetti di 2,5 cm di lato e lunghi 10/15 cm.
    2.  Ricopri i tronchetti di ananas con uno strato spesso di zucchero miscelato con la cannella.
    3.  Inseriscili nella busta da cottura e condizionali sottovuoto praticando 3 sgasature.
    4.  Precuoci a 55°C per 30 minuti poi abbatti in positivo.
    5.  Successivamente cuoci a 84°C per 25 minuti.
    6.  A fine cottura lo zucchero dovrà essere completamente sciolto.
    7.  Abbatti in positivo e conserva in frigorifero.
    8.  Al momento dell'uso scola i tronchetti di ananas dal succo che avranno rilasciato e ricava delle fette di mezzo cm, poi usale secondo necessità.

#### Succo d'ananas
*   **Ingredienti:** 1 ananas maturo.
*   **Procedimento:**
    1.  Pela e taglia l'ananas in piccoli pezzi.
    2.  Inseriscilo nella busta da cottura, condiziona sottovuoto e cuoci a 86°C per 30 minuti poi abbatti in positivo.
    3.  Apri la busta e tutto il contenuto, sia il succo che la polpa.
    4.  Passa la polpa all'estrattore, poi unisci il succo a quello recuperato dalla busta.
    5.  Filtra il succo all'etamina e conservalo sottovuoto in frigorifero.

#### Gel di ananas
*   **Ingredienti:** 250 g succo di ananas CBT, 60 g zucchero, 6 g gellan, 0,8 g xantano, 1,5 g succo di limone.
*   **Procedimento:**
    1.  Mescola lo zucchero, il gellan e lo xantano.
    2.  Nella busta da cottura inserisci il succo di ananas e il mix di polveri.
    3.  Abbatti per stabilizzare i liquidi poi condiziona sottovuoto e mescola per sciogliere ed amalgamare il composto.
    4.  Cuoci a 90°C per 30 minuti mescolando ogni 10 minuti poi abbatti in positivo.
    5.  Una volta raffreddato, estrai dalla busta il blocco di gelatina che si sarà formato.
    6.  Frullalo insieme al succo di limone fino ad ottenere un gel denso.
    7.  Sgasa il gel di ananas, condizionalo sottovuoto e conservalo in frigorifero.

#### Banana caramellata alla fava di Tonka
*   **Ingredienti:** 6 banane sode, 250 g zucchero, 40 g rhum scuro, 30 g burro di qualità, 2 g fava di Tonka.
*   **Procedimento:**
    1.  Fondi lo zucchero in una casseruola fino ad ottenere un caramello biondo, sfumalo con il rhum, poi aggiungi il burro amalgamandolo al caramello.
    2.  Stendi il caramello su un tappetino antiaderente e fallo raffreddare.
    3.  Una volta raffreddato spaccalo a pezzi e frullalo con la fava di Tonka grattugiata fino a ridurlo in polvere fine.
    4.  Pela le banane, ricoprile con la polvere di caramello e inseriscile nelle busta da cottura.
    5.  Condizionale sottovuoto praticando 2 sgasature, precuocile a 55°C per 30 minuti, poi abbatti in positivo.
    6.  Successivamente cuoci a 84°C per 20 minuti poi abbatti in positivo.
    7.  Apri la busta e separa il liquido di cottura dalle banane.
    8.  Trasferiscilo in una casseruola e fallo ridurre a fuoco dolce fino ad ottenere una salsa densa e gelatinosa, poi unisci le banane.
    9.  Conservale in frigorifero fino al momento dell'uso.

#### Succo di banane
*   **Ingredienti:** 1 kg polpa di banane mature, 40 g succo di limone, 250 g zucchero.
*   **Procedimento:**
    1.  Mescola il succo di limone allo zucchero e successivamente alla polpa di banane.
    2.  Inserisci il composto nella busta da cottura e condiziona sottovuoto praticando 2 sgasature.
    3.  Cuoci a 84°C per 25 minuti mescolando ogni 5 minuti, poi abbatti in positivo.
    4.  A cottura ultimata lo zucchero dovrà essere completamente sciolto.
    5.  Una volta raffreddato il composto, setaccialo per ricavare un succo privo di residui solidi.
    6.  Sgasalo, condizionalo sottovuoto e conservalo in positivo fino al momento dell'uso.

#### Carpaccio dolce di anguria alla vaniglia
*   **Ingredienti:** 1 kg polpa di anguria senza semi, 1 kg zucchero, 1 bacca di vaniglia.
*   **Procedimento:**
    1.  Stempera i semi grattati dalla vaniglia nello zucchero.
    2.  Avvolgi l'anguria con uno strato spesso di zucchero, attendi qualche minuto che si inumidisca e inserisci nella busta da cottura insieme a tutto lo zucchero residuo.
    3.  Condiziona sottovuoto praticando 5 sgasature, poi precuoci a 55°C per 1 ora e mezza e abbatti in positivo.
    4.  Successivamente cuoci a 86°C per 1 ora e mezza mescolando ogni 10 minuti.
    5.  A fine cottura lo zucchero dovrà essere completamente sciolto.
    6.  Abbatti in negativo, servirà ad ammorbidire ulteriormente la polpa dell'anguria.
    7.  Per utilizzare l'anguria, scongelala lentamente, estraila dalla busta eliminando i liquidi rilasciati e affettala come fosse un carpaccio.

#### Castagne al naturale
*   **Ingredienti:** 1 kg castagne sbucciate e pelate, 500 g acqua, 10 g sale.
*   **Procedimento:**
    1.  Sciogli a freddo il sale nell'acqua.
    2.  Inserisci nella busta da cottura le castagne e l'acqua salata poi condiziona sottovuoto praticando 5 sgasature.
    3.  Successivamente cuoci a 88°C per 1 ora, poi abbatti in positivo.
    4.  Una volta raffreddate scolale dal liquido di cottura e conservale sottovuoto in frigorifero.

#### Ciliegie sciroppate
*   **Ingredienti:** 1 kg ciliegie grosse e sode, 250 g zucchero, 1 g acido citrico.
*   **Procedimento:**
    1.  Mescola l'acido citrico allo zucchero.
    2.  Elimina il picciolo, lava le ciliegie e inseriscile nella busta da cottura.
    3.  Inserisci il composto nella busta da cottura e condiziona sottovuoto praticando 2 sgasature.
    4.  Successivamente cuocile a 84°C per 20 minuti mescolando ogni 5 minuti.
    5.  A fine cottura lo zucchero dovrà essere completamente sciolto.
    6.  Abbatti in positivo e conservale in frigorifero.

#### Ciliegie al naturale
*   **Ingredienti:** 1 kg ciliegie grosse e sode.
*   **Procedimento:**
    1.  Elimina il picciolo dalle ciliegie e lavale.
    2.  Inseriscile nella busta da cottura e condiziona sottovuoto praticando una sgasatura.
    3.  Precuoci a 55°C per 30 minuti e abbatti in positivo.
    4.  Successivamente cuocile a 84°C per 12 minuti poi abbattile in positivo.
    5.  Conservale in frigorifero fino al momento dell'uso.

#### Composta di ciliegie
*   **Ingredienti:** 1 kg ciliegie grosse e sode, 250 g zucchero, 6 g pectina, 1 g acido citrico.
*   **Procedimento:**
    1.  Mescola l'acido citrico e la pectina allo zucchero.
    2.  Togli il picciolo, lava le ciliegie e inseriscile nella busta da cottura e condiziona sottovuoto.
    3.  Precuoci a 55°C per 30 minuti e abbatti in positivo.
    4.  Estraile dalla busta, togli i noccioli alle ciliegie e mescolale con lo zucchero e l'acido citrico.
    5.  Inserisci il composto nella busta da cottura e condiziona sottovuoto praticando 2 sgasature.
    6.  Successivamente cuocile a 84°C per 20 minuti mescolando ogni 5 minuti.
    7.  A fine cottura lo zucchero dovrà essere completamente sciolto e dovrà essersi formato uno sciroppo.
    8.  Scola lo sciroppo dalle ciliegie e mettilo in una casseruola.
    9.  Fallo ridurre a fuoco dolce fino a raggiungere la concentrazione zuccherina di 74°Brix.
    10. Aggiungi le ciliegie allo sciroppo e continua a cuocere per 5 minuti.
    11. Abbatti in positivo e conservale sottovuoto in frigorifero.

#### Crema di cacao speziata
*   **Ingredienti:** 1 l acqua, 250 g zucchero, 80 g cacao in polvere, 50 g amido di mais, 50 g amido di riso, 50 g burro fresco, 3 g cannella in stecche, 2 g pepe nero in grani, 1 g sale integrale, Mezza bacca di vaniglia, 0,5 g fava di Tonka, 0,5 g bacche di anice stellato, 0,4 g chiodi di garofano, 0,2 g cardamomo.
*   **Procedimento:**
    1.  Tosta per due minuti tutte le spezie tranne la vaniglia e lo zenzero, poi pestali grossolanamente nel mortaio.
    2.  Miscela lo zucchero con gli amidi, il cacao e il sale.
    3.  Inserisci nella busta da cottura le spezie tostate e pestate, la miscela di polveri, i semi e la bacca della vaniglia, il burro di cacao e l'acqua.
    4.  Abbatti per stabilizzare i liquidi, poi condiziona sottovuoto e mescola per sciogliere ed amalgamare tutti gli ingredienti.
    5.  Cuoci a 86°C per 30 minuti mescolando ogni 5 minuti.
    6.  A cottura ultimata, apri la busta e setaccia la crema per eliminare i residui solidi.
    7.  Abbattila in positivo e condizionala sottovuoto.
    8.  Conservala in frigorifero fino al momento dell'uso.

#### Cioccolato bianco caramellato
*   **Ingredienti:** 1 tavoletta di cioccolato bianco da 200 g.
*   **Procedimento:**
    1.  Inserisci la tavoletta di cioccolato intera nella busta da cottura e condiziona sottovuoto.
    2.  Cuoci a 86°C per 8 ore poi abbatti in positivo.
    3.  Una volta raffreddato, il cioccolato bianco caramellato è pronto per l'utilizzo.

#### Crema inglese alla vaniglia
*   **Ingredienti:** 800 g latte, 200 g panna, 300 g tuorlo setacciato, 150 g zucchero, 1 bacca di vaniglia.
*   **Procedimento:**
    1.  Inserisci nella busta da cottura il latte, la panna, il tuorlo e i semi grattati dalla vaniglia.
    2.  Abbatti per stabilizzare i liquidi, poi condiziona sottovuoto e mescola per sciogliere ed amalgamare il composto.
    3.  Cuoci a 76°C per 40 minuti mescolando ogni 10 minuti, quindi abbatti in positivo.
    4.  Apri la busta e setaccia la crema per eliminare eventuali grumi.
    5.  Conservala sottovuoto in frigorifero.

#### Crema pasticcera alla vaniglia
*   **Ingredienti:** 750 g latte, 250 g panna, 250 g tuorlo setacciato, 35 g amido di mais, 35 g amido di riso, 10 g colla di pesce, 1 bacca di vaniglia.
*   **Procedimento:**
    1.  Miscela lo zucchero con gli amidi, poi stemperali nella panna.
    2.  Inserisci nella busta da cottura il latte, la miscela di panna, il tuorlo, la colla di pesce spezzettata e i semi grattati dalla bacca di vaniglia.
    3.  Abbatti per stabilizzare i liquidi, poi condiziona sottovuoto e mescola per sciogliere ed amalgamare il composto.
    4.  Cuoci a 84°C per 1 ora mescolando ogni 10 minuti, poi abbatti in positivo.
    5.  Apri la busta e setaccia la crema per eliminare eventuali grumi.
    6.  Lavorala con la frusta per farle guadagnare lucentezza e utilizzala.

#### Latte condensato caramellato alla vaniglia (dulce de leche)
*   **Ingredienti:** 500 g latte condensato, 1 bacca di vaniglia.
*   **Procedimento:**
    1.  Apri, gratta i semi della bacca di vaniglia e inseriscili insieme al latte condensato nella busta da cottura.
    2.  Abbatti per stabilizzare i liquidi poi condiziona sottovuoto.
    3.  Cuoci a 86°C per 8 ore mescolando la busta ogni ora.
    4.  A cottura terminata abbatti in positivo, dopodiché il latte condensato caramellato è pronto per essere utilizzato.

#### Composta di fichi al limone
*   **Ingredienti:** 1 kg fichi maturi, 500 g zucchero, 8 g pectina, 50 g succo di limone, Le scorze di 1 limone non trattato.
*   **Procedimento:**
    1.  Miscela lo zucchero alla pectina.
    2.  Lava e taglia i fichi a spicchi.
    3.  Amalgamali allo zucchero e inseriscili nella busta da cottura con il succo e le scorze del limone.
    4.  Abbatti per stabilizzare i liquidi.
    5.  Condiziona sottovuoto praticando una sgasatura poi cuoci a 84°C per 1 ora mescolando ogni 10 minuti.
    6.  A fine cottura lo zucchero dovrà essere completamente sciolto.
    7.  Abbatti in positivo e attendi 12 ore prima di consumare la composta.

#### Fichi semidry
*   **Ingredienti:** 1 kg fichi maturi e sodi, 100 g zucchero a velo.
*   **Procedimento:**
    1.  Lava i fichi e tagliali a metà.
    2.  Spolverale di zucchero a velo e falli disidratare per 2 ore in essiccatore a 70°C.
    3.  Abbatti in positivo, poi trasferiscili nella busta da cottura e condizionali sottovuoto utilizzando il soft air.
    4.  Precuoci a 55°C per 30 minuti e abbatti in positivo.
    5.  Successivamente cuocili a 84°C per 20 minuti, quindi abbattili in positivo.
    6.  Conserva in frigorifero fino al momento dell'uso.

#### Fragole sciroppate
*   **Ingredienti:** 1 kg fragole piccole e sode, 500 g zucchero.
*   **Procedimento:**
    1.  Lava le fragole, togli il picciolo e mescolale allo zucchero.
    2.  Inserisci il composto nella busta da cottura e condiziona sottovuoto utilizzando il soft air.
    3.  Precuoci a 55°C per 30 minuti poi abbatti in positivo.
    4.  Successivamente cuoci a 84°C per 20 minuti.
    5.  A cottura terminata lo zucchero dovrà essere completamente sciolto.
    6.  Abbatti in positivo e conserva sottovuoto in frigorifero.

#### Purea dolce di fragole
*   **Ingredienti:** 1 kg fragole, 400 g zucchero, 100 g sciroppo di glucosio in polvere.
*   **Procedimento:**
    1.  Mescola insieme lo zucchero e lo sciroppo di glucosio in polvere.
    2.  Elimina il picciolo e lava le fragole, poi mescolale al mix di zuccheri.
    3.  Trasferiscile nella busta da cottura e condiziona sottovuoto praticando 3 sgasature.
    4.  Cuoci a 84°C per 20 minuti mescolando ogni 5 minuti.
    5.  A cottura terminata lo zucchero dovrà essere completamente sciolto.
    6.  Apri la busta e filtra il contenuto attraverso un setaccio fine per separare lo sciroppo dalle fragole.
    7.  Abbatti in positivo sia fragole che sciroppo.
    8.  Frulla e setaccia le fragole per ottenere una purea liscia.
    9.  Sgasa la purea ottenuta, condizionala sottovuoto e conservala in frigorifero fino al suo utilizzo.
    10. La purea di fragole si può utilizzare tal quale o come ingrediente per altre ricette.
    11. Recupera lo sciroppo di fragole e conservalo sottovuoto per altre preparazioni.

#### Ganache al cioccolato bianco
*   **Ingredienti:** 600 g cioccolato bianco, 250 g panna fresca, 70 g burro, 35 g destrosio.
*   **Procedimento:**
    1.  Trita il cioccolato e taglia a dadini il burro.
    2.  Inserisci tutti gli ingredienti nella busta da cottura e abbatti per stabilizzare i liquidi.
    3.  Condiziona sottovuoto e cuoci a 66°C per 1 ora mescolando ogni 10 minuti.
    4.  A fine cottura, apri la busta e trasferisci la ganache liquida in un contenitore.
    5.  Frullala con un mixer ad immersione per omogeneizzarla, poi abbattila in positivo.
    6.  Successivamente conservala sottovuoto in frigorifero.

#### Ganache al cioccolato fondente e menta
*   **Ingredienti:** 600 g cioccolato fondente, 250 g infusione di panna alla menta CBT, 70 g burro, 35 g sciroppo di glucosio.
*   **Procedimento:**
    1.  Trita il cioccolato e taglia a dadini il burro.
    2.  Inserisci tutti gli ingredienti nella busta da cottura e abbatti per stabilizzare i liquidi.
    3.  Condiziona sottovuoto e cuoci a 66°C per 1 ora mescolando ogni 10 minuti.
    4.  A fine cottura, apri la busta e trasferisci la ganache liquida in un contenitore.
    5.  Frullala con un mixer ad immersione per omogeneizzarla, poi abbattila in positivo.
    6.  Successivamente conservala sottovuoto in frigorifero.

#### Ganache al cioccolato fondente
*   **Ingredienti:** 600 g cioccolato fondente, 250 g panna fresca, 70 g burro, 35 g sciroppo di glucosio, 35 g destrosio.
*   **Procedimento:**
    1.  Trita il cioccolato e taglia a dadini il burro.
    2.  Inserisci tutti gli ingredienti nella busta da cottura e abbatti per stabilizzare i liquidi.
    3.  Condiziona sottovuoto e cuoci a 66°C per 1 ora mescolando ogni 10 minuti.
    4.  A fine cottura, apri la busta e trasferisci la ganache liquida in un contenitore.
    5.  Frullala con un mixer ad immersione per omogeneizzarla, poi abbattila in positivo.
    6.  Successivamente conservala sottovuoto in frigorifero.

#### Infusione di pesche essiccate
*   **Ingredienti:** 500 g acqua, 50 g pesche essiccate CBT.
*   **Procedimento:**
    1.  Inserisci nella busta da cottura l'acqua e le pesche, poi condiziona sottovuoto praticando 3 sgasature.
    2.  Cuoci a 88°C per 30 minuti, poi apri la busta e filtra il contenuto.
    3.  Questa infusione, naturalmente dolce, può essere consumata sia calda che fredda.

#### Lemon curd
*   **Ingredienti:** 100 g succo di limone, 100 g tuorlo setacciato, 250 g zucchero, 15 g colla di pesce, 220 g burro tagliato.
*   **Procedimento:**
    1.  Spezzetta la colla di pesce e taglia il burro a dadini.
    2.  Stempera lo zucchero con il succo di limone, poi inseriscilo nella busta da cottura insieme agli altri ingredienti.
    3.  Abbatti per stabilizzare i liquidi, poi condiziona sottovuoto e mescola il contenuto nella busta per sciogliere ed amalgamare il composto.
    4.  Cuoci a 66°C per 40 minuti, mescolando ogni 10 minuti.
    5.  A cottura ultimata abbatti in positivo.

#### Limoncello
*   **Ingredienti:** 500 g alcool 98° Vol, 150 g scorze di limone non trattato, 1 kg sciroppo di zucchero 1:1.
*   **Procedimento:**
    1.  Inserisci le scorze di limone nella busta da cottura insieme all'alcool.
    2.  Condiziona sottovuoto e cuoci a 60°C per 2 ore.
    3.  Trascorso questo tempo trasferisci la busta nella vasca a ultrasuoni per un'altra ora a freddo, poi abbatti in positivo.
    4.  Scola e filtra l'infusione con un'etamina poi uniscila allo sciroppo mescolando bene.
    5.  Terminata questa operazione il limoncello è pronto per essere imbottigliato e consumato.

#### Mascarpone caramellato
*   **Ingredienti:** 500 g mascarpone.
*   **Procedimento:**
    1.  Inserisci il mascarpone nella busta da cottura e condizionalo sottovuoto praticando una sgasatura.
    2.  Cuoci a 86°C per 8 ore, mescolando ogni ora.
    3.  A fine cottura apri la busta e scola il mascarpone rilasciato.
    4.  Trasferisci il mascarpone in una caraffa e omogeneizzala con un frullatore ad immersione.
    5.  Abbatti in positivo e conservalo sottovuoto in frigorifero.

#### Apple caramel
*   **Ingredienti:** 500 g purea asciutta di mele CBT, 75 g burro morbido, 40 g zucchero, 10 g sciroppo di glucosio, 1 g sale.
*   **Procedimento:**
    1.  Frulla tutti gli ingredienti, ottenendo una crema liscia e densa.
    2.  Stendila su una teglia ricoperta da un tappetino antiaderente e mettila nel forno ventilato a 160°C per 1 ora mescolando ogni 15 minuti.
    3.  Al termine della cottura frulla il composto, poi impastalo con le mani per uniformarlo.
    4.  Abbatti in positivo e conserva l'apple caramel sottovuoto in frigorifero.
    5.  All'utilizzo sarà da ammorbidire a temperatura ambiente per un'ora, poi si potrà lavorare secondo necessità.

#### Dadini di mele al naturale
*   **Ingredienti:** 4 mele golden.
*   **Procedimento:**
    1.  Lava, pela le mele e ricava dalla polpa una brunoise di 5 mm di lato.
    2.  Inserisci i dadini di mele nella busta da cottura e condizionali sottovuoto praticando 3 sgasature.
    3.  Precuocili a 55°C per 30 minuti poi abbatti in positivo.
    4.  Successivamente cuocili a 84°C per 12 minuti quindi abbatti in positivo.
    5.  Conservali sottovuoto in frigorifero fino al momento dell'utilizzo.

#### Purea di mele al naturale
*   **Ingredienti:** 2 kg mele.
*   **Procedimento:**
    1.  Lava, pela le mele ed elimina il torsolo.
    2.  Affettale finemente, inseriscile nella busta da cottura e condizionale sottovuoto praticando 3 sgasature.
    3.  Cuoci a 86°C per 30 minuti poi abbatti in positivo.
    4.  Frulla le mele per ottenere una purea liscia, poi sgasale per togliere tutta l'aria incorporata durante la lavorazione.
    5.  Condizionala sottovuoto e conservala in frigorifero.

#### Mele al ginepro
*   **Ingredienti:** 4 mele, 3 g bacche di ginepro, 15 g sale fine.
*   **Procedimento:**
    1.  Tosta le bacche di ginepro e successivamente pestale nel mortaio insieme al sale fine per ottenere una polvere sottile ed omogenea.
    2.  Lava e pela le mele, tagliale in due e elimina il torsolo.
    3.  Ricava tre spicchi per ogni metà mela e torniscili leggermente.
    4.  Condiscili generosamente con il sale al ginepro, poi inseriscili nella busta da cottura.
    5.  Condiziona sottovuoto praticando 5 sgasature.
    6.  Precuocile a 55°C per 30 minuti e abbatti in positivo.
    7.  Successivamente cuoci a 84°C per 15 minuti, quindi abbatti in positivo e conserva in frigorifero.
    8.  Queste mele sono un ottimo contorno per piatti di maiale o selvaggina.

#### Mele caramellate
*   **Ingredienti:** 4 mele, 250 g zucchero, 30 g burro di qualità, 1 bacca di vaniglia.
*   **Procedimento:**
    1.  Fondi lo zucchero in una casseruola fino ad ottenere un caramello biondo, poi aggiungi il burro amalgamandolo al caramello.
    2.  Stendi il caramello su un tappetino antiaderente e fallo raffreddare.
    3.  Una volta raffreddato spaccalo a pezzi e frullalo con i semi della bacca di vaniglia fino a ridurlo in polvere fine.
    4.  Lava, pela le mele ed elimina i torsoli, poi ricava 6 spicchi ben torniti da ogni mela.
    5.  Amalgama le mele alla polvere di caramello alla vaniglia, poi trasferisci il composto nella busta da cottura.
    6.  Condiziona sottovuoto praticando 5 sgasature.
    7.  Precuoci a 55°C per 30 minuti e abbatti in positivo.
    8.  Successivamente cuoci a 84°C per 20 minuti, poi apri la busta e separa le mele dal liquido di cottura.
    9.  Trasferisci il liquido di cottura in una casseruola e fallo ridurre fino a raggiungere la temperatura di 105°C, poi unisci le mele amalgamando e abbatti in positivo.
    10. Conservale sottovuoto in frigorifero fino al momento dell'uso.

#### Mostarda di mele
*   **Ingredienti:** 1 kg purea asciutta di mele CBT, 500 g zucchero, 15/20 gocce di olio essenziale di senape.
*   **Procedimento:**
    1.  Inserisci la purea di mele, lo zucchero e le gocce di olio essenziale di senape nella busta da cottura.
    2.  Condiziona sottovuoto e cuoci a 86°C per 30 minuti, mescolando ogni 10 minuti.
    3.  A cottura terminata lo zucchero dovrà essere completamente sciolto.
    4.  Abbatti la mostarda in positivo, è conservala in frigorifero fino al momento dell'uso.

#### Mele sciroppate
*   **Ingredienti:** 1 kg mele, 250 g zucchero.
*   **Procedimento:**
    1.  Lava, pela le mele, tagliale a metà e elimina il torsolo.
    2.  Mescola le mele allo zucchero e inserisci il tutto nella busta da cottura.
    3.  Condiziona sottovuoto praticando 5 sgasature.
    4.  Precuocile a 55°C per 30 minuti e abbatti in positivo.
    5.  Successivamente cuoci a 84°C per 20 minuti, mescolando ogni 5 minuti.
    6.  A cottura terminata lo zucchero dovrà essere completamente sciolto.
    7.  Abbatti in positivo e conserva in frigorifero.

#### Succo e purea asciutta di mele
*   **Ingredienti:** 2 kg mele.
*   **Procedimento:**
    1.  Lava, pela le mele ed elimina i torsoli, affettale a spicchi regolari ed inseriscile nella busta da cottura.
    2.  Condizionale sottovuoto praticando 3 sgasature.
    3.  Cuocile a 86°C per 30 minuti poi toglile dalla busta e frullale finché la purea risulta liscia.
    4.  Trasferisci in un'etamina e fanne gocciolare tutta la parte liquida finché non risulti completamente asciutta.
    5.  Abbatti in positivo il succo e la purea di mele e conservali sottovuoto in frigorifero fino al momento dell'uso.

#### Spuma di mele
*   **Ingredienti:** 500 g succo di mele CBT, 100 g zucchero, 10 g colla di pesce, 1,5 g xantano.
*   **Procedimento:**
    1.  Mescola lo xantano allo zucchero e stemperalo nella metà del succo.
    2.  Inseriscilo nella busta da cottura aggiungendo il restante succo e la colla di pesce spezzettata.
    3.  Abbatti per stabilizzare i liquidi, condiziona sottovuoto poi mescola il contenuto della busta per sciogliere gli ingredienti.
    4.  Cuoci a 60°C per 20 minuti mescolando ogni 5 minuti.
    5.  A cottura ultimata, setaccia il composto e inseriscilo in un sifone caricandolo con 2 o 3 cartucce.
    6.  Abbattilo in positivo e lascialo in frigorifero per 3 ore prima di utilizzarlo.

#### Succo di melagrane
*   **Ingredienti:** 4 melagrane.
*   **Procedimento:**
    1.  Apri e sgrana le melagrane.
    2.  Inserisci i semi nella busta da cottura e condiziona sottovuoto praticando 2 sgasature.
    3.  Cuoci a 84°C per 20 minuti dopodiché abbatti in positivo.
    4.  Manipola la busta spremendo con forza i semi al suo interno.
    5.  Apri, scola e setaccia per recuperare tutto il succo di melagrane.
    6.  Conservalo sottovuoto in frigorifero fino al momento dell'utilizzo.

#### Gel fluido di melagrane
*   **Ingredienti:** 500 g succo di melagrane CBT, 100 g zucchero, 15 g gellan, 1 g xantano.
*   **Procedimento:**
    1.  Mescola lo zucchero, il gellan e lo xantano.
    2.  Nella busta da cottura inserisci il succo delle melagrane e il mix di polveri.
    3.  Manipola la busta per sciogliere gli ingredienti, poi abbatti per stabilizzare i liquidi e condiziona sottovuoto.
    4.  Cuoci a 90°C per 30 minuti mescolando ogni 10 minuti poi abbatti in positivo.
    5.  Una volta raffreddato, estrai dalla busta il blocco di gelatina che si sarà formato.
    6.  Frullalo fino ad ottenere un gel denso, poi sgasalo e condizionalo sottovuoto.
    7.  Conservalo sottovuoto in frigorifero fino al momento dell'utilizzo.

#### Infusione di panna alla menta
*   **Ingredienti:** 500 g panna fresca, 50 g foglie di menta.
*   **Procedimento:**
    1.  Inserisci le foglie di menta e la panna nella busta da cottura.
    2.  Abbatti per stabilizzare i liquidi e successivamente condiziona sottovuoto praticando 2 sgasature.
    3.  Cuoci a 65°C per 2 ore, poi trasferisci la busta nella vasca a ultrasuoni a 50°C per 1 ora, poi abbatti in positivo.
    4.  Una volta fredda apri la busta e filtra la panna dalle foglie strizzandole.
    5.  Condiziona sottovuoto la panna e conservala in positivo.

#### Succo di mirtilli
*   **Ingredienti:** 1 kg mirtilli.
*   **Procedimento:**
    1.  Lava e inserisci i mirtilli nella busta da cottura e condiziona sottovuoto praticando una sgasatura.
    2.  Cuoci a 84°C per 20 minuti, dopodiché abbatti in positivo.
    3.  Manipola la busta spremendo i mirtilli al suo interno.
    4.  Apri, scola e setaccia per recuperare tutto il succo.
    5.  Conservalo sottovuoto fino al momento dell'utilizzo.

#### Gel fluido di mirtilli
*   **Ingredienti:** 500 g succo di mirtilli CBT, 100 g zucchero, 15 g gellan, 1 g xantano.
*   **Procedimento:**
    1.  Mescola lo zucchero, il gellan e lo xantano.
    2.  Nella busta da cottura inserisci il succo di mirtilli e il mix di polveri.
    3.  Abbatti per stabilizzare i liquidi, poi condiziona sottovuoto e mescola per sciogliere ed amalgamare il composto.
    4.  Cuoci a 90°C per 30 minuti mescolando ogni 10 minuti poi abbatti in positivo.
    5.  Una volta raffreddato togli dalla busta il blocco di gelatina che si sarà formato.
    6.  Frullalo fino ad ottenere un gel denso, poi sgasalo e condizionalo sottovuoto.

#### Panna cotta al mirto
*   **Ingredienti:** 1 l panna fresca, 500 g latte, 300 g zucchero, 8 g iota, 2,5 g farina di semi di carrube, 60 g purea di mirto.
*   **Procedimento:**
    1.  Miscela lo zucchero con la iota e la farina di semi di carrube, poi mescolali alla panna.
    2.  Inserisci tutti gli ingredienti nella busta da cottura e abbatti per stabilizzare i liquidi.
    3.  Condiziona sottovuoto e cuoci a 80°C per 1 ora mescolando ogni 10 minuti.
    4.  A cottura terminata apri la busta e cola direttamente negli stampi oppure abbattila in panna cotta in positivo o in negativo.
    5.  Per lavorarla andrà sciolta a 80°C.

#### Panna cotta alla vaniglia
*   **Ingredienti:** 1 l panna fresca, 500 g latte, 300 g zucchero, 8 g iota, 2,5 g farina di semi di carrube, 1 bacca di vaniglia.
*   **Procedimento:**
    1.  Apri la bacca di vaniglia, gratta i semi e stemperali in 50 g di zucchero.
    2.  Miscela il restante zucchero con la iota e la farina di semi di carrube, poi mescolali nella panna.
    3.  Inserisci tutti gli ingredienti nella busta da cottura, abbatti per stabilizzare i liquidi, poi condiziona sottovuoto e mescola per sciogliere ed amalgamare il composto.
    4.  Cuoci a 80°C per 1 ora mescolando ogni 10 minuti.
    5.  A cottura terminata, cola la panna cotta direttamente negli stampi oppure abbattila in positivo o in negativo.
    6.  Per lavorarla andrà sciolta a 80°C.

#### Crema di patate dolci all'arancia e cannella
*   **Ingredienti:** 1 kg patate dolci pelate, 400 g panna fresca, 150 g zucchero, 1 stecca di cannella, La scorza di 1 arancia non trattata.
*   **Procedimento:**
    1.  Affetta finemente le patate dolci, poi mescola insieme a panna, zucchero, scorza d'arancia e cannella.
    2.  Inserisci il composto nella busta da cottura e abbatti per stabilizzare i liquidi.
    3.  Condiziona sottovuoto praticando una sgasatura, poi cuoci a 88°C per 30 minuti.
    4.  A cottura ultimata apri la busta, elimina la scorza d'arancia e la cannella e frulla il contenuto fino ad ottenere una crema liscia.
    5.  Setaccia la crema e abbattila in positivo.
    6.  Una volta fredda, sgasala e conservala sottovuoto in frigorifero.

#### Fiori di patate dolci allo zafferano
*   **Ingredienti:** 2 grosse patate dolci dalla polpa arancione, 200 g sciroppo 2:1, 0,5 g pistilli di zafferano leggermente tostato.
*   **Procedimento:**
    1.  Lava e pela le patate.
    2.  Ricava delle fette da mezzo cm e poi tagliale con il coppa pasta a forma di fiore.
    3.  Frulla lo sciroppo con i pistilli di zafferano.
    4.  Posiziona ben stesi i fiori di patate dolci nella busta da cottura e aggiungi lo sciroppo con lo zafferano.
    5.  Condiziona sottovuoto praticando 5 sgasature e applicando il cuscinetto largo.
    6.  Cuoci a 86°C per 30 minuti e a cottura terminata abbatti in positivo.
    7.  Conserva in frigorifero fino al momento dell'utilizzo.

#### Pere Martin Sec al vin brulé
*   **Ingredienti:** 12 pere Martin Sec, 2 l vino rosso corposo, 500 g zucchero, 2 stecche di cannella, 5 chiodi di garofano, La scorza di mezza arancia, La scorza di mezzo limone, 2 bacche di anice stellato.
*   **Procedimento:**
    1.  Metti il vino a sobbollire, poco per volta, fino a che non sarà ridotto a 500 g.
    2.  Aggiungi lo zucchero e le spezie e fai sobbollire per 5 minuti, poi abbatti in positivo.
    3.  Una volta raffreddato, filtralo dalle spezie e tienilo da parte.
    4.  Pela le pere e inseriscile nella busta da cottura insieme allo sciroppo al vin brulé.
    5.  Condiziona sottovuoto praticando 5 sgasature, poi applica un cuscinetto stretto.
    6.  Precuoci a 55°C per 30 minuti e abbatti in positivo.
    7.  Successivamente cuoci a 88°C per 1 ora mescolando ogni 10 minuti, poi abbatti in positivo.
    8.  Conserva in frigorifero e attendi 24 ore prima di utilizzarle.

#### Pere al naturale
*   **Ingredienti:** 1 kg pere sode.
*   **Procedimento:**
    1.  Lava, taglia a metà le pere e togli i torsoli.
    2.  Inseriscile nella busta da cottura e condizionale sottovuoto praticando 5 sgasature.
    3.  Precuoci per 30 minuti a 55°C, poi abbattile in positivo.
    4.  Successivamente cuocile a 88°C per 20 minuti, quindi abbatti in positivo.
    5.  Conservale in frigorifero fino al momento dell'utilizzo.

#### Pere allo zafferano
*   **Ingredienti:** 1 kg pere sode, 250 g zucchero, 1 g pistilli di zafferano.
*   **Procedimento:**
    1.  Tosta leggermente lo zafferano poi frullalo con lo zucchero.
    2.  Pela le pere, tagliale a metà e elimina i torsoli.
    3.  Mescola le pere allo zucchero e zafferano poi inserisci il composto nella busta da cottura.
    4.  Condiziona sottovuoto praticando 5 sgasature.
    5.  Precuoci a 55°C per 30 minuti e abbatti in positivo.
    6.  Successivamente cuoci a 88°C per 1 ora mescolando ogni 10 minuti.
    7.  A cottura terminata lo zucchero dovrà essere completamente sciolto.
    8.  Abbatti in positivo e attendi 24 ore prima di utilizzarle.

#### Purea di pere al naturale
*   **Ingredienti:** 2 kg pere mature.
*   **Procedimento:**
    1.  Lava e pela le pere, elimina i torsoli.
    2.  Affettale finemente, inseriscile nella busta da cottura e condizionale sottovuoto praticando 4 sgasature.
    3.  Cuoci a 88°C per 30 minuti, poi abbatti in positivo.
    4.  Frulla le pere per ottenere una purea liscia, poi sgasale per togliere tutta l'aria incorporata durante la lavorazione.
    5.  Conservala sottovuoto in frigorifero.

#### Pesche al naturale
*   **Ingredienti:** 1 kg pesche sode.
*   **Procedimento:**
    1.  Lava, taglia a metà le pesche e togli il nocciolo.
    2.  Inseriscile nella busta da cottura e condizionale sottovuoto praticando 3 sgasature.
    3.  Precuoci a 55°C per 30 minuti, poi abbattile in positivo.
    4.  Successivamente cuocile a 84°C per 25 minuti, quindi abbatti in positivo.
    5.  Conservale in frigorifero fino al momento dell'utilizzo.

#### Composta di pesche
*   **Ingredienti:** 1 kg pesche mature, 200 g zucchero, 6 g pectina, 50 g succo di limone, Le scorze di 1 limone non trattato.
*   **Procedimento:**
    1.  Miscela lo zucchero alla pectina.
    2.  Lava, taglia le pesche a brunoise e inseriscile nella busta da cottura.
    3.  Condizionale sottovuoto praticando 3 sgasature.
    4.  Cuocile a 86°C per 1 ora poi abbatti in positivo.
    5.  Trasferisci il contenuto della busta in una bastardella e unisci lo zucchero con la pectina, il succo e le scorze del limone amalgamando bene.
    6.  Abbatti per stabilizzare i liquidi, poi condiziona sottovuoto.
    7.  Falle cuocere a 84°C per 20 minuti.
    8.  A cottura terminata, scola la busta dai liquidi e falli ridurre in una casseruola fino ad arrivare alla concentrazione zuccherina di 62°Brix.
    9.  Unisci allo sciroppo la polpa delle pesche, continua a cuocere per 2 minuti amalgamandole poi abbatti in positivo.
    10. Condiziona sottovuoto e conserva in frigorifero.

#### Pesche essiccate
*   **Ingredienti:** 1 kg pesche mature e sode.
*   **Procedimento:**
    1.  Lava le pesche, denocciolale e tagliale a fette regolari di 2 mm.
    2.  Inserisci le fette di pesche nella busta da cottura condizionale sottovuoto e cuocile a 86°C per 20 minuti.
    3.  Successivamente togli le fette di pesca dalla busta e trasferiscile in essiccatore.
    4.  Fai disidratare completamente a 70°C e una volta secche lasciale raffreddare a temperatura ambiente.
    5.  Conservale in un contenitore ermetico.

#### Pesche sciroppate
*   **Ingredienti:** 1 kg pesche sode, 250 g zucchero.
*   **Procedimento:**
    1.  Lava e taglia in due le pesche eliminando i noccioli.
    2.  Mescola le pesche allo zucchero poi inserisci il composto nella busta da cottura.
    3.  Condiziona sottovuoto praticando 3 sgasature.
    4.  Precuoci a 55°C per 30 minuti e abbatti in positivo.
    5.  Successivamente cuoci a 84°C per 25 minuti mescolando ogni 5 minuti.
    6.  A cottura terminata lo zucchero dovrà essere completamente sciolto.
    7.  Abbatti in positivo e conservale in frigorifero.

#### Purea di pesche
*   **Ingredienti:** 1 kg pesche mature.
*   **Procedimento:**
    1.  Lava, denocciola e affetta finemente le pesche.
    2.  Inseriscile nella busta da cottura e condizionale sottovuoto praticando 3 sgasature.
    3.  Cuocile a 88°C per 1 ora, poi abbatti in positivo.
    4.  Frulla il contenuto della busta per ottenere una purea liscia.
    5.  Sgasala, condizionala sottovuoto e conservala in frigorifero.

#### Composta di rabarbaro
*   **Ingredienti:** 1 kg rabarbaro, 500 g zucchero, 10 g pectina.
*   **Procedimento:**
    1.  Miscela la pectina allo zucchero.
    2.  Lava e taglia il rabarbaro a dadi di 2 cm, poi mescolalo a zucchero e pectina.
    3.  Inserisci il composto nella busta da cottura e condiziona sottovuoto praticando 4 sgasature.
    4.  Cuoci a 62°C per 40 minuti mescolando ogni 10 minuti.
    5.  A fine cottura lo zucchero dovrà essere completamente sciolto.
    6.  Apri la busta e scola il rabarbaro dallo sciroppo.
    7.  Trasferisci lo sciroppo in una casseruola e fallo ridurre a fuoco dolce fino a che non raggiungerà la concentrazione zuccherina di 72° Brix, dopodiché unisci il rabarbaro e continua a cuocere per 2 minuti.
    8.  A cottura ultimata abbatti in positivo la composta di rabarbaro.
    9.  Condizionala sottovuoto e conservala in frigorifero.

#### Tronchetti di rabarbaro zuccherato
*   **Ingredienti:** 1 kg rabarbaro, 1 kg zucchero (circa).
*   **Procedimento:**
    1.  Lava e taglia il rabarbaro a tronchetti di 5 cm, poi aggiungi una quantità di zucchero pari a metà del suo peso e amalgama bene.
    2.  Trasferisci il composto nella busta da cottura e condiziona sottovuoto praticando 5 sgasature.
    3.  Lascia macerare per 2 ore, poi cuoci a 62°C per 40 minuti mescolando ogni 10 minuti.
    4.  Abbatti in positivo, poi apri la busta e scola delicatamente il rabarbaro dallo sciroppo.
    5.  Aggiungi per la seconda volta una quantità di zucchero pari a metà del suo peso e amalgama bene.
    6.  Trasferisci il composto nella busta da cottura e cuoci a 62°C per 40 minuti.
    7.  A cottura terminata lo zucchero dovrà essere completamente sciolto.
    8.  Apri la busta, scola il rabarbaro dallo sciroppo, stendilo sui tappetini antiaderenti e fallo essiccare fino a che la superficie non risulti appiccicosa.
    9.  Ricopri con uno strato spesso il rabarbaro di zucchero semolato, poi rimettilo nell'essiccatore per completare l'asciugatura.
    10. Una volta asciutto, trasferiscilo in un contenitore ermetico e conservalo.

#### Purea e sciroppo di rabarbaro
*   **Ingredienti:** 1 kg rabarbaro, 1 kg zucchero (circa).
*   **Procedimento:**
    1.  Lava e taglia il rabarbaro a tronchetti di 5 cm.
    2.  Aggiungi una quantità di zucchero pari a metà del suo peso e amalgama bene.
    3.  Trasferisci il composto nella busta da cottura e condiziona sottovuoto praticando 5 sgasature.
    4.  Lascia macerare per 2 ore, poi cuoci a 62°C per 40 minuti mescolando ogni 10 minuti.
    5.  A cottura terminata lo zucchero dovrà essere completamente sciolto.
    6.  Abbatti in positivo, apri la busta e separa il rabarbaro dallo sciroppo.
    7.  Aggiungi al rabarbaro una quantità di zucchero pari a metà del suo peso e amalgama bene.
    8.  Trasferisci il contenuto nella busta da cottura, condiziona sottovuoto e cuoci a 62°C per 40 minuti mescolando ogni 10 minuti.
    9.  Apri la busta, separa il rabarbaro dallo sciroppo e frullalo per ottenere una purea liscia, poi abbattila in positivo e condizionala sottovuoto.
    10. Unisci gli sciroppi ricavati dalle due cotture, abbattili in positivo e condizionali sottovuoto.
    11. Conserva in frigorifero sia la purea che lo sciroppo.

#### Sciroppo alla menta
*   **Ingredienti:** 50 g foglie di menta, 100 g acqua, 100 g zucchero.
*   **Procedimento:**
    1.  Lava le foglie di menta e inseriscile nella busta da cottura insieme allo zucchero e all'acqua.
    2.  Condiziona sottovuoto e cuoci a 65°C per 1 ora mescolando ogni 10 minuti.
    3.  A cottura terminata lo zucchero dovrà essere completamente sciolto.
    4.  Successivamente trasferisci la busta nella vasca a ultrasuoni a 50°C per 1 ora.
    5.  Apri la busta e scola lo sciroppo pressando le foglie di menta.
    6.  Una volta raccolto conservalo sottovuoto in frigorifero.

#### Sedano sciroppato
*   **Ingredienti:** 1 kg sedano, 2 l acidificazione forte, 350 g sciroppo 1:1.
*   **Procedimento:**
    1.  Monda e lava le coste di sedano, poi pelalo per togliere tutti i filamenti.
    2.  Taglialo a bastoncini e acidificalo per 10 minuti.
    3.  Scolalo e inseriscilo nella busta da cottura insieme allo sciroppo.
    4.  Condiziona sottovuoto praticando 3 sgasature e applicando il cuscinetto stretto.
    5.  Precuocilo a 55°C per 30 minuti e abbatti in positivo.
    6.  Successivamente cuocilo a 88°C per 20 minuti mescolando ogni 5 minuti.
    7.  A cottura ultimata abbatti in positivo.

#### Susine sciroppate
*   **Ingredienti:** 1 kg susine sode, 500 g sciroppo 2:1.
*   **Procedimento:**
    1.  Lava le susine, tagliale a metà e elimina i noccioli.
    2.  Inseriscile nella busta da cottura e condiziona sottovuoto praticando 3 sgasature.
    3.  Precuoci a 55°C per 30 minuti e abbatti in positivo.
    4.  Successivamente apri la busta, aggiungi lo sciroppo e condiziona sottovuoto.
    5.  Cuocile a 84°C per 15 minuti mescolando ogni 5 minuti.
    6.  Abbattile in positivo e conservale in frigorifero.

#### Susine al naturale
*   **Ingredienti:** 1 kg susine sode.
*   **Procedimento:**
    1.  Lava, taglia a metà le susine e togli i noccioli.
    2.  Inseriscile nella busta da cottura e condizionale sottovuoto praticando 3 sgasature.
    3.  Precuoci a 55°C per 30 minuti poi abbattile in positivo.
    4.  Successivamente cuocile a 84°C per 20 minuti quindi abbatti in positivo.
    5.  Conservale in frigorifero fino al momento dell'utilizzo.

#### Susine semidry
*   **Ingredienti:** 1 kg susine sode.
*   **Procedimento:**
    1.  Lava le susine, tagliale a metà ed elimina i noccioli.
    2.  Spolverale di zucchero a velo e falle disidratare in essiccatore a 70°C per 2 ore.
    3.  Abbatti in positivo poi trasferiscile nella busta da cottura e condizionale sottovuoto.
    4.  Precuocile a 55°C per 30 minuti e abbattile in positivo.
    5.  Successivamente cuocile a 84°C per 20 minuti poi abbatti in positivo.
    6.  Conservale sottovuoto in frigorifero.

#### Gel fluido di uva fragola
*   **Ingredienti:** 500 g succo di uva fragola CBT, 100 g zucchero, 15 g gellan, 1 g xantano.
*   **Procedimento:**
    1.  Mescola lo zucchero, il gellan e lo xantano.
    2.  Nella busta da cottura inserisci il succo di uva fragola e il mix di polveri.
    3.  Manipola la busta per sciogliere gli ingredienti poi abbatti per stabilizzare i liquidi e condiziona sottovuoto.
    4.  Cuoci a 90°C per 30 minuti mescolando ogni 10 minuti poi abbatti in positivo.
    5.  Una volta raffreddato, estrai dalla busta il blocco di gelatina che si sarà formato.
    6.  Frullalo fino ad ottenere un gel denso, poi sgasalo e condizionalo sottovuoto.

#### Succo di uva fragola
*   **Ingredienti:** 1 kg uva fragola.
*   **Procedimento:**
    1.  Lava e sgrana l'uva fragola.
    2.  Inseriscila nella busta da cottura e condiziona sottovuoto praticando 3 sgasature.
    3.  Cuoci a 84°C per 20 minuti, dopodiché abbatti in positivo.
    4.  Manipola la busta spremendo l'uva al suo interno.
    5.  Apri, scola e setaccia per recuperare tutto il succo di uva.
    6.  Conservalo sottovuoto fino al momento dell'utilizzo.

#### Zabaione al marsala
*   **Ingredienti:** 250 g tuorlo setacciato, 500 g marsala, 350 g zucchero, 0,3 g tara.
*   **Procedimento:**
    1.  Preleva 400 g di marsala, mettilo in una casseruola e fallo sobbollire a fuoco dolce fino ridurlo a 200 g, poi abbattilo in positivo.
    2.  Trasferisci tuorlo, zucchero, tara, la marsala e la riduzione di marsala nella busta da cottura.
    3.  Abbatti per stabilizzare i liquidi poi condiziona sottovuoto e mescola per sciogliere ed amalgamare il composto.
    4.  Cuoci a 66°C per 25 minuti mescolando ogni 5 minuti.
    5.  A cottura ultimata abbatti in positivo.
    6.  Al momento dell'utilizzo apri la busta e setaccia lo zabaione per separare eventuali grumi.
    7.  Si può montare in planetaria oppure nel sifone.

#### Purea dolce di zucca
*   **Ingredienti:** 1 kg polpa di zucca violina o butternut, 250 g sciroppo 2:1.
*   **Procedimento:**
    1.  Affetta finemente la zucca e inseriscila nella busta da cottura insieme allo sciroppo.
    2.  Abbatti per stabilizzare i liquidi, poi condiziona sottovuoto praticando 2 sgasature.
    3.  Cuoci a 88°C per 30 minuti poi abbatti in positivo.
    4.  Trasferisci il composto nel bicchiere del frullatore ed omogeneizzalo.
    5.  Sgasa la purea di zucca, condizionala sottovuoto e conservala in frigorifero.
    6.  Questa purea può essere utilizzata per realizzare salse dolci, bavaresi, gelati ecc.

#### Zucca sciroppata
*   **Ingredienti:** 1 zucca violina o butternut, 500 g sciroppo 2:1.
*   **Procedimento:**
    1.  Lava e pela la zucca, poi elimina i semi.
    2.  Tagliala a fette sottili di 2 mm e inseriscile nella busta da cottura insieme allo sciroppo.
    3.  Abbatti per stabilizzare i liquidi poi condiziona sottovuoto praticando 3 sgasature.
    4.  Precuoci a 55°C per 30 minuti e abbatti in positivo.
    5.  Successivamente cuoci a 84°C per 12 minuti mescolando ogni 4 minuti.
    6.  Abbatti in positivo e conserva in frigorifero.

## GELATI E SORBETTI

#### Base per sorbetto al limone
*   **Ingredienti:** 437 g acqua, 216 g zucchero, 105 g destrosio, 25 g inulina, 3 g tara, 10 g scorze di limone grattugiate, 312 g succo di limone.
*   **Procedimento:**
    1.  Miscela tutti gli ingredienti in polvere, poi inseriscili nella busta da cottura insieme alle scorze di limone e all'acqua.
    2.  Abbatti per stabilizzare i liquidi, poi condiziona sottovuoto e mescola per sciogliere ed amalgamare il composto.
    3.  Cuoci a 76°C per 40 minuti mescolando ogni 5 minuti, poi abbatti in positivo.
    4.  Una volta raffreddata, apri la busta e setaccia il composto per eliminare le scorze.

## CANDITI

### Scorze di agrumi candite – metodo Marco Pirotta

*Nota introduttiva:* I tempi della cottura delle scorze in acqua sono indicativi e legati alla qualità, allo spessore e alla fibra delle scorze stesse e sono stimati dai 40 minuti del mandarino alle 2 ore del cedro. Controlla con il tatto l'effettiva morbidezza degli agrumi prima di fermare la cottura. Le quantità di zuccheri da aggiungere sono espresse in proporzione al peso delle scorze ad ogni passaggio di canditura. Non unire nella stessa busta diverse varietà di agrumi.

*   **Ingredienti:** Agrumi non trattati dalla buccia edibile, Zucchero semolato, Sciroppo di glucosio in polvere, Acqua.

*   **Preparazione e cottura delle scorze:**
    1.  Lava gli agrumi, tagliali a spicchi e preleva la scorza comprensiva dell'albedo avendo cura di eliminare ogni traccia di polpa e succo.
    2.  Con la punta di un ago pratica dei fori su tutta la superficie delle scorze.
    3.  Pesale e trasferiscile nella busta da cottura insieme ad una quantità d'acqua pari a 4 volte il loro peso.
    4.  Abbatti per stabilizzare i liquidi e in seguito condiziona sottovuoto praticando 4 sgasature.
    5.  Cuoci a 88°C per il tempo necessario ad ammorbidire le scorze (da 40 min a 3 ore).
    6.  A cottura ultimata scola le scorze dall'acqua di cottura, abbattile in positivo e condizionale sottovuoto. Successivamente congelale e conservale per almeno 24 ore prima di utilizzarle.
    7.  Per iniziare il processo di canditura scongela le scorze ed elimina il liquido che rilasceranno.
    8.  Prepara una miscela di zuccheri composta dall'80% di zucchero semolato e dal 20% di sciroppo di glucosio in polvere (esempio: 800 g zucchero + 200 g di sciroppo di glucosio in polvere).

*   **Primo passaggio di canditura:**
    1.  Pesa le scorze, aggiungi una quantità di zuccheri pari a metà del loro peso e amalgama bene.
    2.  Inserisci il composto nella busta da cottura e condiziona sottovuoto praticando 3 sgasature.
    3.  Cuoci a 62°C per 16 ore, mescolando delicatamente il contenuto della busta ogni 3/4 ore.
    4.  Trascorso questo tempo tutto lo zucchero dovrà essere disciolto in uno sciroppo (42°C/45°Brix circa).
    5.  Apri la busta, separa lo sciroppo dalle scorze e abbatti entrambi in positivo.
    6.  Conserva a parte lo sciroppo.

*   **Secondo passaggio di canditura:**
    1.  Pesa le scorze e aggiungi un quantitativo di zuccheri pari a metà del loro peso e amalgama bene.
    2.  Inserisci il composto nella busta da cottura e condiziona sottovuoto praticando 3 sgasature.
    3.  Cuoci a 62°C per 16 ore, mescolando delicatamente il contenuto della busta ogni 3/4 ore.
    4.  Trascorso questo tempo tutto lo zucchero dovrà essere disciolto in uno sciroppo (61°C/65°Brix circa).
    5.  Apri la busta, separa le scorze dallo sciroppo e abbatti entrambi in positivo.
    6.  Unisci lo sciroppo al precedente e conservalo a parte.

*   **Terzo passaggio di canditura:**
    1.  Pesa le scorze e aggiungi un quantitativo di zuccheri pari a metà del loro peso e amalgama bene.
    2.  Inserisci il composto nella busta da cottura e condiziona sottovuoto praticando 3 sgasature.
    3.  Cuoci a 62°C per 16 ore, mescolando delicatamente il contenuto della busta ogni 3/4 ore.
    4.  Per effetto della saturazione dei liquidi, al termine del terzo passaggio di canditura potrai trovare dello zucchero non completamente disciolto.
    5.  Preleva qualche goccia di sciroppo spremendo la polpa interna di un pezzo di scorza e controlla con il rifrattometro. Se non ha ancora raggiunto i 70°Brix, effettua il passaggio successivo. Se la concentrazione zuccherina è intorno ai 68° Brix, nel quarto passaggio aggiungi solamente un quarto del peso di zuccheri.

*   **Quarto passaggio di canditura (opzionale):**
    1.  Pesa le scorze e aggiungi un quantitativo di zuccheri pari a metà o ad un quarto del loro peso (a seconda della concentrazione zuccherina data dal grado Brix precedente) e amalgama bene.
    2.  Inserisci il composto nella busta da cottura e condiziona sottovuoto praticando 3 sgasature.
    3.  Cuoci a 62°C per 16 ore, mescolando delicatamente il contenuto della busta ogni 3/4 ore.
    4.  Per effetto della saturazione dei liquidi, al termine del quarto passaggio di canditura potrai trovare degli zuccheri non completamente disciolti.
    5.  Alla fine di questo passaggio preleva qualche goccia di sciroppo spremendo la polpa interna di un pezzo di scorza candita. Misura la concentrazione zuccherina con il rifrattometro la quale dovrà essere pari o superiore ai 70°Brix.

*   **Finitura dei canditi:**
    1.  In una casseruola unisci gli sciroppi ricavati in precedenza e falli ridurre a fuoco dolce fino a raggiungere la concentrazione zuccherina di 70°/72°Brix, poi abbattili in positivo.
    2.  Inserisci tutto il contenuto della busta dell'ultimo passaggio di canditura in una bastardella e unisci lo sciroppo ridotto, amalgamando bene.
    3.  Trasferisci il composto nella busta da cottura e condiziona sottovuoto, quindi cuoci a 88°C per 20 minuti, infine abbatti in positivo.
    4.  A questo punto i canditi saranno pronti per il consumo. Conservali nella busta sottovuoto insieme allo sciroppo in un luogo riparato dal calore e dalla luce.
    5.  Per utilizzarli scolali dallo sciroppo e tagliali nella forma che preferisci.

### Mandarini cinesi canditi – metodo Marco Pirotta

*   **Ingredienti:** Mandarini cinesi non trattati e dalla buccia edibile, Zucchero semolato, Sciroppo di glucosio in polvere, Acqua.

*   **Preparazione e cottura dei mandarini:**
    1.  Lava i mandarini cinesi, poi con la punta di un ago pratica dei fori su tutta la superficie e che trapassino i frutti.
    2.  Pesali e trasferiscili nella busta da cottura insieme ad una quantità d'acqua pari al peso della frutta.
    3.  Abbatti per stabilizzare i liquidi e successivamente condiziona sottovuoto praticando 4 sgasature.
    4.  Cuoci a 88°C per 2 ore.
    5.  A cottura ultimata scola i mandarini dall'acqua, raffreddali e congelali per almeno 24 ore prima di utilizzarli.
    6.  Per iniziare il processo di canditura scongela i mandarini ed elimina il liquido che rilasceranno.
    7.  Prepara una miscela di zuccheri composta dall'80% di zucchero semolato e dal 20% di sciroppo di glucosio in polvere (esempio: 800 g zucchero + 200 g di sciroppo di glucosio in polvere).

*   **Primo passaggio di canditura:**
    1.  Pesa i mandarini, aggiungi pari peso di acqua e metà peso di zuccheri e amalgama bene (esempio: 100 g mandarini, 100 g acqua, 50 g zuccheri).
    2.  Inserisci il composto di mandarini, zuccheri e acqua nella busta da cottura e condiziona sottovuoto praticando 3 sgasature.
    3.  Cuoci a 62°C per 16 ore, mescolando delicatamente il contenuto della busta ogni 3/4 ore.
    4.  Trascorso questo tempo tutto lo zucchero dovrà essere disciolto in uno sciroppo (25°/30°Brix circa).
    5.  Apri la busta, separa lo sciroppo dai mandarini e abbatti entrambi in positivo.

*   **Secondo passaggio di canditura:**
    1.  Pesa i mandarini e aggiungi pari peso di sciroppo della prima canditura e metà peso di zuccheri amalgamando bene (esempio: 100 g mandarini, 100 g sciroppo, 50 g zuccheri).

    1.  Pesa i mandarini e aggiungi pari peso di sciroppo della seconda canditura e metà peso di zuccheri amalgamando bene (esempio: 100 g mandarini, 100 g sciroppo, 50 g zuccheri).

*   **Quarto passaggio di canditura:**
    1.  Pesa i mandarini e aggiungi pari peso di sciroppo della terza canditura e metà peso di zuccheri amalgamando bene (esempio: 100 g mandarini, 100 g sciroppo, 50 g zuccheri).

*   **Quinto passaggio di canditura:**
    1.  Pesa i mandarini e aggiungi pari peso di sciroppo della quarta canditura e metà peso di zuccheri amalgamando bene (esempio: 100 g mandarini, 100 g sciroppo, 50 g zuccheri).
    2.  Inserisci il composto di mandarini, sciroppo e zuccheri nella busta da cottura e condiziona sottovuoto praticando 3 sgasature.

### Fragole candite – metodo Marco Pirotta

*   **Ingredienti:** Fragole fresche e sode, Zucchero semolato, Sciroppo di glucosio in polvere.

    3.  Per iniziare il processo di canditura scongela le fragole ed elimina il liquido che rilasceranno.
    4.  Prepara una miscela di zuccheri composta dall'80% di zucchero semolato e dal 20% di sciroppo di glucosio in polvere (esempio: 800 g zucchero + 200 g di sciroppo di glucosio in polvere).

    3.  Cuoci a 62°C per 15 ore, mescolando delicatamente il contenuto ogni 10 minuti durante la prima ora, successivamente ogni ora.
    4.  Trascorso questo tempo tutto lo zucchero dovrà essere disciolto in uno sciroppo (30°/32°Brix circa).

*   **Quarto passaggio di canditura (opzionale):**
    1.  Pesa le fragole e aggiungi pari peso di sciroppo della terza canditura e metà peso di zuccheri amalgamando bene (esempio: 100 g fragole, 100 g sciroppo, 50 g zuccheri).
    2.  Inserisci il composto di fragole, sciroppo e zuccheri nella busta da cottura e condiziona sottovuoto praticando 3 sgasature.
    3.  Cuoci a 62°C per 15 ore, mescolando delicatamente il contenuto della busta ogni ora.
    4.  Alla fine di questo passaggio preleva qualche goccia di sciroppo spremendo la polpa interna di un pezzo di fragola candita. Misura la concentrazione zuccherina con il rifrattometro la quale dovrà essere pari o di poco superiore ai 70°Brix.

*   **Finitura dei canditi:**

### Marron glacé – metodo Marco Pirotta

*   **Ingredienti:** Marroni, Zucchero semolato, Sciroppo di glucosio in polvere, Baccelli di vaniglia (1 baccello per ogni kg di marroni), Acqua.

*   **Preparazione e cottura dei marroni:**
    1.  Sbuccia e pela i marroni senza intaccare i frutti che vanno mantenuti integri.
    2.  Avvolgi ogni frutto nella garza chiudendola con un giro di spago.
    3.  Pesali e trasferiscili nella busta da cottura insieme allo stesso peso di acqua.
    4.  Abbatti per stabilizzare i liquidi e successivamente condiziona sottovuoto praticando 4 sgasature.
    5.  Cuoci a 88°C per 2 ore.
    6.  A cottura ultimata abbattili in positivo e poi separa i marroni dal liquido di cottura, il quale andrà conservato e utilizzato come base per lo sciroppo di canditura.
    7.  Congela per almeno 24 ore prima di utilizzarli.
    8.  Per iniziare il processo di canditura scongela i marroni.
    9.  Prepara una miscela di zuccheri composta dall'80% di zucchero semolato e dal 20% di sciroppo di glucosio in polvere (esempio: 800 g zucchero + 200 g di sciroppo di glucosio in polvere).

    1.  Pesa i marroni e aggiungi lo stesso peso di acqua di cottura, metà peso di zuccheri, i semi prelevati e il baccello della vaniglia (esempio: 200 g di marroni + 200 g di acqua + 100 g di zuccheri + ¼ di baccello di vaniglia).
    2.  Inserisci il composto nella busta da cottura e condiziona sottovuoto praticando 3 sgasature.
    3.  Cuoci a 62°C per 16 ore, mescolando delicatamente il contenuto della busta ogni 3/4 ore.
    4.  Trascorso questo tempo tutto lo zucchero dovrà essere disciolto in uno sciroppo (26°/30°Brix circa).

    1.  Pesa i marroni e aggiungi pari peso di sciroppo della prima canditura e metà peso di zuccheri amalgamando bene (esempio: 200 g marroni + 200 g di sciroppo + 100 g di zuccheri).
    2.  Inserisci il composto nella busta da cottura e condiziona sottovuoto praticando 3 sgasature.
    3.  Cuoci a 62°C per 16 ore, mescolando delicatamente il contenuto della busta ogni 3/4 ore.
    4.  Trascorso questo tempo tutto lo zucchero dovrà essere disciolto in uno sciroppo (44°/48°Brix circa).
    5.  Apri la busta, separa i marroni dallo sciroppo e abbatti entrambi in positivo.

*   **Terzo passaggio di canditura:**
    1.  Pesa i marroni e aggiungi pari peso di sciroppo della seconda canditura e metà peso di zuccheri amalgamando bene (esempio: 200 g marroni + 200 g di sciroppo + 100 g di zuccheri).

    3.  Cuoci a 62°C per 16 ore, mescolando delicatamente il contenuto della busta ogni 3/4 ore.
    4.  Trascorso questo tempo tutto lo zucchero dovrà essere disciolto in uno sciroppo (56°/60°Brix circa).
    5.  Apri la busta, separa i marroni dallo sciroppo e abbatti entrambi in positivo.

*   **Quarto passaggio di canditura:**
    1.  Pesa i marroni e aggiungi pari peso di sciroppo della terza canditura e metà peso di zuccheri amalgamando bene (esempio: 200 g marroni + 200 g di sciroppo + 100 g di zuccheri).
    2.  Inserisci il composto nella busta da cottura e condiziona sottovuoto praticando 3 sgasature.
    3.  Cuoci a 62°C per 16 ore, mescolando delicatamente il contenuto della busta ogni 3/4 ore.
    4.  Trascorso questo tempo tutto lo zucchero dovrà essere disciolto in uno sciroppo (64°/66°Brix circa).
    5.  Apri la busta, separa i marroni dallo sciroppo e abbatti entrambi in positivo.

*   **Quinto passaggio di canditura (opzionale):**
    1.  Pesa i marroni e aggiungi pari peso di sciroppo della quarta canditura e metà peso di zuccheri amalgamando bene (esempio: 200 g marroni + 200 g di sciroppo + 100 g di zuccheri).

### Zenzero candito – metodo Marco Pirotta

*   **Ingredienti:** Zenzero fresco, Zucchero semolato, Sciroppo di glucosio in polvere.

*   **Preparazione e cottura zenzero:**
    1.  Pela e taglia controfibra lo zenzero a fette spesse, poi trasferiscilo nella busta da cottura e condizionalo sottovuoto praticando 5 sgasature.
    2.  Cuocilo a 88°C per 3 ore, poi congelalo per almeno 24 ore.
    3.  Per iniziare il processo di canditura scongela lo zenzero ed elimina il liquido che rilascerà.
    4.  Prepara una miscela di zuccheri composta dall'80% di zucchero semolato e dal 20% di sciroppo di glucosio in polvere (esempio: 800 g zucchero + 200 g di sciroppo di glucosio in polvere).

*   **Primo passaggio di canditura:**
    1.  Pesa lo zenzero e uniscilo ad una quantità di zuccheri pari a metà del suo peso e amalgama bene (esempio: 100 g zenzero, 50 g zuccheri).
    2.  Inserisci il composto nella busta da cottura e condiziona sottovuoto praticando 3 sgasature.
    3.  Cuoci a 62°C per 16 ore, mescolando delicatamente il contenuto della busta ogni 3/4 ore.
    4.  Trascorso questo tempo tutto lo zucchero dovrà essere disciolto in uno sciroppo (38°/40°Brix circa).
    5.  Apri la busta, separa lo sciroppo dallo zenzero e abbatti entrambi in positivo.
    6.  Conserva lo sciroppo a parte.

*   **Secondo passaggio di canditura:**
    1.  Aggiungi allo zenzero un quantitativo di zuccheri pari a metà del suo peso.
    2.  Amalgama bene poi inserisci il composto nella busta da cottura e condiziona sottovuoto praticando 3 sgasature.
    3.  Cuoci a 62°C per 12 ore, mescolando il contenuto ogni 3/4 ore.
    4.  Trascorso questo tempo tutto lo zucchero dovrà essere disciolto in uno sciroppo (60°/62°Brix circa).
    5.  Apri la busta, separa lo zenzero dallo sciroppo e abbatti entrambi in positivo.
    6.  Unisci lo sciroppo ricavato dal primo passaggio di canditura e conserva a parte.

*   **Terzo passaggio di canditura:**
    1.  Aggiungi allo zenzero un quantitativo di zuccheri pari a metà del suo peso.
    2.  Amalgama bene poi inserisci il composto nella busta da cottura e abbatti in positivo.
    3.  Una volta freddo, condiziona sottovuoto e cuoci a 62°C per 10 ore, mescolando delicatamente il contenuto della busta ogni 3/4 ore.
    4.  Per effetto della saturazione dei liquidi, al termine del terzo passaggio di canditura potrai trovare dello zucchero non completamente disciolto.
    5.  Preleva qualche goccia di sciroppo dal centro di un pezzo di zenzero e misura la concentrazione zuccherina con il rifrattometro. Se non ha ancora raggiunto i 70°/72°Brix, effettua un ulteriore passaggio di canditura.

*   **Finitura dello zenzero candito:**
    1.  In una casseruola unisci gli sciroppi ricavati in precedenza e falli ridurre a fuoco dolce fino a raggiungere la concentrazione zuccherina di 70°/72°Brix, poi abbattili in positivo.
    2.  Inserisci tutto il contenuto della busta dell'ultimo passaggio di canditura in una bastardella e unisci lo sciroppo ridotto, amalgamando bene.
    3.  Trasferisci il composto nella busta da cottura e condiziona sottovuoto, poi cuoci a 88°C per 20 minuti, infine abbatti in positivo.
    4.  A questo punto lo zenzero è pronto per il consumo. Conservalo nella busta sottovuoto insieme allo sciroppo in un luogo riparato dal calore e dalla luce.
