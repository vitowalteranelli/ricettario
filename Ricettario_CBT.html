#### Cipolle di Giarratana umami
*   **Ingredienti:** 1 kg cipolle di Giarratana, 5 g sale.
*   **Procedimento:**
    1.  Pela le cipolle e tagliale a petali larghi 2 cm.
    2.  Condiscile con il sale amalgamandolo bene, poi inseriscile nella busta da cottura.
    3.  Condiziona sottovuoto praticando 5 sgasature, poi cuoci a 88°C per 3 ore.
    4.  A cottura terminata apri la busta e separa le cipolle dal liquido di cottura e lasciale scolare per 1 ora, poi abbattile in positivo.
    5.  Trasferisci il liquido delle cipolle in una casseruola, poi fallo ridurre a fuoco dolce fino a raggiungere la temperatura di 102°C.
    6.  Abbattilo in positivo e amalgamalo alle cipolle.
    7.  Condizionale sottovuoto e conserva in frigorifero fino al momento dell'uso.

#### Cime di rapa al naturale
*   **Ingredienti:** 1 kg cime di rapa, 1 l acqua, 15 g sale.
*   **Procedimento:**
    1.  Monda, lava e taglia le cime di rapa.
    2.  Stempera il sale nell'acqua, poi inseriscila nella busta da cottura insieme alle cime di rapa.
    3.  Condiziona sottovuoto praticando 5 sgasature.
    4.  Cuoci a 90°C per 25 minuti, poi abbatti in positivo.
    5.  Conservale in frigorifero fino al momento dell'uso.

#### Cipolle rosse brasate
*   **Ingredienti:** 1 kg cipolle rosse, 12 g sale, 60 g zucchero, 60 g aceto di vino lambrusco, 10 g burro al pepe nero CBT, 120 g burro morbido, 0,2 g xantano.
*   **Procedimento:**
    1.  Metti in un blender tutti gli ingredienti tranne le cipolle e frulla fino ad ottenere una crema omogenea.
    2.  Pela e taglia le cipolle a fette fini e amalgamale alla crema.
    3.  Inserisci il composto nella busta da cottura e condiziona sottovuoto praticando 3 sgasature.
    4.  Cuoci a 88°C per 3 ore.
    5.  A cottura ultimata apri la busta e separa le cipolle dal liquido di cottura.
    6.  Lascia raffreddare il liquido di cottura e quando avrà raggiunto i 50°C frullalo per emulsionarlo.
    7.  Unisci l'emulsione alle cipolle e abbattile in positivo.
    8.  Conservale sottovuoto in frigorifero fino al momento dell'uso.

#### Cipolle rosse in agrodolce di lamponi
*   **Ingredienti:** 3 cipolle rosse, 200 g aceto di vino rosso, 200 g acqua, 150 g zucchero, 200 g lamponi, 16 g sale.
*   **Procedimento:**
    1.  In una pentola fai bollire per 2 minuti tutti gli ingredienti tranne le cipolle.
    2.  A cottura ultimata setaccia l'agrodolce per togliere i residui solidi e abbatti in positivo.
    3.  Pela le cipolle e tagliale a petali dello larghezza di 1 cm.
    4.  Inserisci l'agrodolce e le cipolle nella busta da cottura e condizionale sottovuoto praticando 3 sgasature.
    5.  Cuocile a 84°C per 40 minuti, poi raffredda e abbatti in positivo.
    6.  Conserva in frigorifero fino al momento dell'uso.

#### Cipolline borettane in agrodolce
*   **Ingredienti:** 1 kg cipolline borettane, 200 g aceto di vino bianco, 200 g acqua, 150 g zucchero, 2 foglie di alloro, 2 g pepe nero in grani, 0,5 g chiodi di garofano, 20 g sale.

    1.  In una pentola fai bollire per 2 minuti tutti gli ingredienti tranne le cipolline e abbatti in positivo.
    2.  Pela e monda le cipolline, poi inseriscile nella busta da cottura insieme all'agrodolce e condizionale sottovuoto praticando 2 sgasature.
    3.  Cuocile a 84°C per 40 minuti, poi raffredda e abbatti in positivo.
    4.  Conserva in frigorifero fino al momento dell'uso.

#### Cipollotti al naturale
*   **Ingredienti:** 1 kg cipollotti, Sale.
*   **Procedimento:**
    1.  Monda i cipollotti dalle radici e dalle foglie coriacee e lavali.
    2.  Condiscili con il sale e falli macerare per 10 minuti.
    3.  Trascorso questo tempo, elimina il liquido che avranno rilasciato e inseriscili nella busta da cottura.
    4.  Condizionali sottovuoto praticando 4 sgasature e cuocili a 88°C per 1 ora, poi abbattili in positivo.
    5.  Conserva in frigorifero fino al momento dell'uso.

#### Coste al naturale
*   **Ingredienti:** 1 kg coste, Sale.
*   **Procedimento:**
    1.  Monda e lava le coste, poi dividi le foglie dai gambi.
    2.  Condiscile con il sale, poi inserisci separatamente le foglie e i gambi in due buste da cottura e condiziona sottovuoto praticando 5 sgasature.
    3.  Cuoci a 88°C per 10 minuti le foglie e per 20 minuti i gambi, dopodiché abbatti in positivo.
    4.  Al momento dell'uso togli le coste dalla busta e rifiniscile a tuo piacere.

#### Fagioli bianchi di spagna al naturale
*   **Ingredienti:** 500 g fagioli bianchi di spagna secchi, 2 l acqua per ammollo, 2 l acqua per cottura, 15 g sale, 2 spicchi di aglio in camicia, Alloro, rosmarino, salvia, 2 g pepe in grani, Olio EVO.

    3.  Trascorso questo tempo, apri la busta, scolali e risciacquali sotto l'acqua corrente.
    4.  Inseriscili nella busta da cottura insieme all'acqua per cottura, sale, aglio, pepe e ad un bouquet di erbe aromatiche.

#### Fagioli zolfini "al fiasco"
*   **Ingredienti:** 500 g fagioli zolfini secchi, 2 l acqua per ammollo, 2 l acqua per cottura, 15 g sale, 2 spicchi di aglio in camicia, Alloro, rosmarino, salvia.

    1.  Metti i fagioli zolfini nella busta da conservazione insieme all'acqua di ammollo.
    2.  Condizionali sottovuoto e lasciali idratare in frigorifero per 4 ore.
    3.  Trascorso questo tempo, apri la busta, scolali e risciacquali sotto l'acqua corrente.
    4.  Inseriscili nella busta da cottura insieme all'acqua per cottura, sale, aglio e ad un bouquet di erbe aromatiche.

#### Fagiolini al naturale

#### Finocchi alla liquirizia
*   **Ingredienti:** 1 finocchio, 30 g burro morbido, 30 g di zucchero, 2 g radice di liquirizia in polvere, Poco xantano, Sale.
*   **Procedimento:**

    3.  Trasferisci il composto nella busta da cottura e condiziona sottovuoto praticando 3 sgasature.
    4.  Cuoci a 86°C per 30 minuti, poi abbatti in positivo.
    5.  Al momento dell'utilizzo apri, versa il contenuto in una padella e fai rosolare a fuoco dolce i finocchi utilizzando il condimento già presente nella busta.

#### Finocchi al naturale

#### Funghi cardoncelli, aglio olio e peperoncino

    6.  Togli il contenuto della busta e trasferiscilo in una padella.
    7.  Fai ridurre i liquidi e una volta ridotti inizia a rosolare i funghi.
    8.  Regola di sapore e servi.

#### Melanzane baby alla mediterranea

#### Melanzana viola al naturale
*   **Ingredienti:** 1 kg melanzana viola, Sale.

#### Olive nolche condite

#### Pannocchie al burro salato

#### Patate fritte ultrasoniche (omaggio a Modernist Cuisine)
*   **Ingredienti:** 4 grosse patate da friggere, 1 l acqua, 15 g sale, Sale.
*   **Procedimento:**
    1.  Sciogli a freddo il sale nell'acqua.
    2.  Pela le patate e tagliale per ricavare dei grossi parallelepipedi.
    3.  Inserisci le patate nella busta da cottura insieme all'acqua pari a metà del loro peso.
    4.  Condiziona sottovuoto praticando una sgasatura, poi cuoci a 88°C per 30 minuti.
    5.  A cottura ultimata, trasferisci con delicatezza la busta delle patate nella vasca a ultrasuoni.
    6.  Fai sonicare per 1 ora e mezza in acqua fredda muovendo per una volta la busta dopo 45 minuti.
    7.  Successivamente apri la busta sulla placca forata e scola le patate avendo cura di non romperle.
    8.  Trasferisci le patate sulle griglie di un essiccatore e falle disidratare a freddo sulla superficie per almeno 2 ore, finché la superficie non sarà completamente asciutta.
    9.  Trascorso questo tempo, friggile in abbondante olio a 160°C per 5/7 minuti, dopodiché abbattile in negativo.
    10. Al momento dell'utilizzo friggi le patate ancora surgelate a 190°C fino a completa doratura.

    4.  Precuocile a 55°C per 30 minuti e abbattile in positivo.

    6.  Abbatti in positivo e conserva in frigorifero fino al momento dell'uso.

#### Patate da purè o gnocchi
*   **Ingredienti:** 1 kg patate.
*   **Procedimento:**
    1.  Lava, pela e affetta le patate.
    2.  Inseriscile nella busta da cottura e condiziona sottovuoto praticando una sgasatura.
    3.  Cuoci a 88°C per 1 ora.
    4.  A fine cottura, abbatti in positivo e conserva almeno 12 ore prima di utilizzarla per retrogadare gli amidi.
    5.  Al momento dell'utilizzo rigenera a 88°C per 20 minuti poi apri la busta, passale nello schiacciapatate e falle raffreddare a temperatura ambiente.

#### Patate ratte al grasso di pancetta affumicata stagionata e chipotle
*   **Ingredienti:** 1 kg patate ratte, 100 g grasso di pancetta affumicata stagionata CBT, 20 g olio al chipotle CBT, Sale.
*   **Procedimento:**
    1.  Lava bene le patate e tagliale in due nel senso della lunghezza.
    2.  Condiscile con il sale e lasciale macerare per 10 minuti, poi elimina il liquido che avranno rilasciato.
    3.  Mescola il grasso di pancetta all'olio al chipotle e uniscilo alle patate amalgamando bene.
    4.  Trasferisci il composto nella busta da cottura e condiziona sottovuoto praticando una sgasatura.
    5.  Cuoci a 88°C per 25 minuti, poi abbatti in positivo.
    6.  Al momento dell'uso versa il contenuto della busta, grasso compreso.

#### Patate ratte al grasso di pancetta affumicata stagionata e chipotle (Continuazione)
*   **Ingredienti:** 1 kg patate ratte, 100 g grasso di pancetta affumicata stagionata CBT, 20 g olio al chipotle CBT, Sale.
*   **Procedimento:**
    1.  Lava bene le patate e tagliale in due nel senso della lunghezza.
    2.  Condiscile con il sale e lasciale macerare per 10 minuti, poi elimina il liquido che avranno rilasciato.
    3.  Mescola il grasso di pancetta all'olio al chipotle e uniscilo alle patate amalgamando bene.
    4.  Trasferisci il composto nella busta da cottura e condiziona sottovuoto praticando una sgasatura.
    5.  Cuoci a 88°C per 25 minuti, poi abbatti in positivo.
    6.  Al momento dell'uso versa il contenuto della busta, grasso compreso, su una teglia ricoperta di carta assorbente e asciuga le patate.
    7.  Sciogli il grasso in una padella di ferro e rosola a fuoco vivo le patate, prima sul lato del taglio e successivamente sulla pelle.
    8.  Regola di sapore e servi.

#### Patate viola al rosmarino
*   **Ingredienti:** 1 kg patate viola, Olio al rosmarino CBT, Sale.
*   **Procedimento:**
    1.  Pela le patate e tagliale a parallelepipedi di circa 2 cm a lato per la lunghezza di 5 cm.
    2.  Condiscile con il sale e falle macerare per 10 minuti.
    3.  Elimina l'acqua di macerazione e condiscile con qualche goccia di olio al rosmarino.
    4.  Inseriscile nella busta da cottura e condiziona sottovuoto praticando una sgasatura.
    5.  Cuoci a 88°C per 30 minuti.
    6.  Abbatti in positivo e conserva in frigorifero fino al momento dell'uso.

#### Peperoncini sott'olio
*   **Ingredienti:** 200 g peperoncini freschi, 200 g olio EVO, Sale.
*   **Procedimento:**
    1.  Lava e pulisci i peperoncini da picciolo e semi, poi tagliali a rondelle di mezzo cm.
    2.  Salali generosamente e falli macerare per 30 minuti.
    3.  Trascorso questo tempo, sciacquali sotto l'acqua corrente fredda, poi scola e asciuga.
    4.  Trasferiscili nella busta da cottura insieme all'olio.
    5.  Abbatti per stabilizzare i liquidi, poi condiziona sottovuoto praticando 3 sgasature e applicando il cuscinetto stretto.
    6.  Cuoci a 88°C per 20 minuti, poi abbatti in positivo.

#### Purea di peperoncini piccanti
*   **Ingredienti:** 1 kg peperoncini piccanti, Sale.
*   **Procedimento:**
    1.  Lava e monda i peperoncini dal picciolo e da tutti i semi, poi affettali finemente.
    2.  Condiscili con poco sale e lasciali macerare per 10 minuti, dopodiché elimina il liquido che avranno rilasciato.
    3.  Inserisci i peperoncini nella busta da cottura e condiziona sottovuoto praticando 3 sgasature.
    4.  Cuoci a 88°C per 30 minuti, poi abbatti in positivo.
    5.  Una volta raffreddato frulla il composto della busta fino ad ottenere una purea liscia.
    6.  Conservala sottovuoto in frigorifero fino al momento dell'uso.

#### Peperoni jalapeños in agrodolce
*   **Ingredienti:** 1 kg peperoni jalapeños, 100 g aceto di vino bianco, 100 g acqua, 75 g zucchero, 1 stecca di lemongrass, 30 g zenzero fresco, 10 g sale.
*   **Procedimento:**
    1.  In una casseruola unisci acqua, sale, aceto, zucchero, lemongrass e zenzero e falli sobbollire per 2 minuti.
    2.  A cottura terminata abbattili in positivo, poi setacciali dagli aromi.
    3.  Lava e taglia i jalapeños eliminando il picciolo ed una parte di semi, poi inseriscili nella busta da cottura insieme all'agrodolce.
    4.  Condizionali sottovuoto praticando 3 sgasature.
    5.  Cuocili a 88°C per 30 minuti, poi abbatti in positivo.
    6.  Conserva in frigorifero fino al momento dell'uso.

#### Peperoni al naturale
*   **Ingredienti:** 1 kg peperoni, Sale.
*   **Procedimento:**
    1.  Lava, monda e taglia i peperoni in tre o quattro falde.
    2.  Condiscili con il sale, poi inseriscili nella busta da cottura e condizionali sottovuoto praticando 5 sgasature.
    3.  Precuocili a 55°C per 30 minuti e abbatti in positivo.
    4.  Successivamente cuoci a 88°C per 30 minuti, poi abbatti in positivo.
    5.  Conserva in frigorifero fino al momento dell'uso.

#### Peperoni in agrodolce all'origano e rosmarino
*   **Ingredienti:** 1 kg peperoni, 100 g aceto di vino bianco, 100 g acqua, 75 g zucchero, 10 g sale, 3 g origano secco, 4 g aghi di rosmarino, 2 g pepe nero in grani.
*   **Procedimento:**
    1.  In una casseruola unisci acqua, sale, aceto, zucchero, origano, rosmarino e pepe e fai sobbollire per 2 minuti.
    2.  A cottura terminata abbattili in positivo, poi setaccia gli aromi dall'agrodolce.
    3.  Lava, monda e taglia i peperoni a listarelle di mezzo cm, poi inseriscili nella busta da cottura insieme all'agrodolce.
    4.  Condizionali sottovuoto praticando 3 sgasature.
    5.  Cuocili a 86°C per 40 minuti, poi abbatti in positivo.
    6.  Conservali in frigorifero fino al momento dell'uso.

#### Peperoni in peperonata
*   **Ingredienti:** 1 kg peperoni, 10 g sale, 2 g olio all'aglio CBT, 2 g olio all'origano CBT, 2 g olio al pepe nero CBT, 20 g umami di pomodori CBT, 10 g umami di cipolle CBT, 30 g olio EVO.
*   **Procedimento:**
    1.  Fiammeggia con una torcia a gas i peperoni per carbonizzare la pelle e successivamente eliminala completamente spazzolandoli e lavandoli sotto acqua corrente.
    2.  Mondali da picciolo e semi e tagliali a listarelle di 1 cm.
    3.  Condiscili con il sale e una volta sciolto unisci tutti gli altri ingredienti amalgamando bene.
    4.  Inseriscili nella busta da cottura e condiziona sottovuoto praticando 5 sgasature.
    5.  Precuocili a 55°C per 30 minuti e abbatti in positivo.
    6.  Successivamente cuoci a 88°C per 1 ora.
    7.  A cottura terminata, apri la busta, separa i peperoni dal liquido di cottura e lasciali scolare per 1 ora, poi abbattili in positivo.
    8.  Trasferisci il liquido dei peperoni in una casseruola e poi fallo ridurre a fuoco dolce fino a che non raggiunga una consistenza sciropposa.
    9.  Regola di sapore, poi abbatti in positivo.
    10. Amalgama il sugo ai peperoni, poi condiziona sottovuoto e conserva in frigorifero fino al momento dell'uso.

#### Peperoni umami
*   **Ingredienti:** 1 kg peperoni, 5 g sale.
*   **Procedimento:**
    1.  Fiammeggia con una torcia a gas i peperoni per carbonizzare la pelle e successivamente eliminala completamente spazzolandoli e lavandoli sotto acqua corrente.
    2.  Mondali da picciolo e semi e tagliali a listarelle di 1 cm.
    3.  Condiscili con il sale amalgamandolo bene, poi inseriscili nella busta da cottura.
    4.  Condiziona sottovuoto praticando 5 sgasature, poi cuoci a 88°C per 1 ora.
    5.  A cottura terminata apri la busta e separa i peperoni dal liquido di cottura e lasciali scolare per 1 ora, poi abbattili in positivo.
    6.  Trasferisci il liquido dei peperoni in una casseruola e fallo ridurre a fuoco dolce fino a raggiungere la temperatura di 102°C.
    7.  Abbattilo in positivo poi amalgamalo ai peperoni.
    8.  Condizionali sottovuoto e conservali in frigorifero fino al momento dell'uso.

#### Crema di piselli
*   **Ingredienti:** 500 g piselli, Olio EVO, Sale.
*   **Procedimento:**
    1.  Inserisci nella busta da cottura e condiziona sottovuoto i piselli praticando una sgasatura.
    2.  Cuocili a 84°C per 20 minuti e abbatti in positivo.
    3.  Estrai i piselli dalla busta, frullali e setacciali per eliminare tutte le bucce.
    4.  Trasferisci la purea di piselli in un blender e frulla aggiungendo l'olio EVO a filo, fino ad ottenere una crema morbida.
    5.  Regola di sale e condiziona sottovuoto.
    6.  Conserva in frigorifero fino al momento dell'utilizzo.

#### Pomodori ciliegino confit
*   **Ingredienti:** 1 kg pomodori ciliegino, 15 g sale, 15 g zucchero, 5 g olio al timo CBT, 5 g olio al pepe nero CBT.
*   **Procedimento:**
    1.  Lava i pomodori e incidi la pelle.
    2.  Condiscili con sale, zucchero e gli oli aromatici.
    3.  Inseriscili nella busta da cottura, poi condiziona sottovuoto praticando 2 sgasature.
    4.  Precuoci a 55°C per 30 minuti e abbatti in positivo.
    5.  Successivamente cuoci a 88°C per 25 minuti.
    6.  A cottura ultimata, apri la busta e scola i pomodorini.
    7.  Sbucciali e uniscili al liquido di cottura per condirli ulteriormente.
    8.  Scolali leggermente dal liquido, posizionali sui vassoi dell'essiccatore ricoperti dai tappetini antiaderenti e falli essiccare a 70°C per 2/3 ore circa.
    9.  Quando saranno disidratati a sufficienza, abbattili in positivo e conservali in un contenitore ermetico.

#### Porri al naturale
*   **Ingredienti:** 5 porri, Sale.
*   **Procedimento:**
    1.  Monda i porri dalle radici e dalle foglie coriacee, poi condiscili con il sale.
    2.  Inseriscili nella busta da cottura e condizionali sottovuoto praticando 5 sgasature.
    3.  Cuoci a 88°C per 25 minuti e abbatti in positivo.
    4.  Conserva in frigorifero fino al momento dell'uso.

#### Porri all'olio al carbone di porri
*   **Ingredienti:** 5 porri, 30 g olio al carbone di porri, Sale.
*   **Procedimento:**
    1.  Monda i porri dalle radici e dalle foglie coriacee, poi condiscili con il sale.
    2.  Inseriscili nella busta da cottura insieme all'olio al carbone di porri e condizionali sottovuoto praticando 5 sgasature.
    3.  Cuoci a 88°C per 25 minuti e abbatti in positivo.
    4.  Conserva in frigorifero fino al momento dell'uso.

#### Puntarelle al naturale
*   **Ingredienti:** 1 kg puntarelle, 1 l acqua, 15 g sale.
*   **Procedimento:**
    1.  Monda e lava le puntarelle.
    2.  Stempera il sale nell'acqua, poi inseriscila nella busta da cottura insieme alle puntarelle.
    3.  Condiziona sottovuoto praticando 5 sgasature.
    4.  Cuoci a 88°C per 20 minuti e abbatti in positivo.
    5.  Conservale in frigorifero fino al momento dell'uso.

#### Radicchio tardivo all'agro leggero
*   **Ingredienti:** 500 g punte di radicchio tardivo, 30 g zucchero, 20 g aceto di vino rosso, 8 g sale.
*   **Procedimento:**
    1.  Stempera il sale e lo zucchero nell'aceto fino a completo dissolvimento.
    2.  Condisci le punte di radicchio con l'aceto, poi inserisci il composto nella busta da cottura.
    3.  Condiziona sottovuoto praticando 2 sgasature e cuoci a 88°C per 15 minuti.
    4.  Abbatti in positivo e conserva in frigorifero fino al momento dell'uso.

#### Scalogni brasati al dragoncello
*   **Ingredienti:** 1 kg scalogni, 12 g sale, 60 g zucchero, 60 g aceto di vino bianco, 10 g burro al pepe nero CBT, 120 g burro, 0,2 g xantano.
*   **Procedimento:**
    1.  Metti in un blender tutti gli ingredienti tranne gli scalogni e frulla fino ad ottenere una crema omogenea.
    2.  Pela e taglia gli scalogni in due nel senso della lunghezza, poi amalgamali alla crema.
    3.  Inserisci il composto nella busta da cottura e condiziona sottovuoto praticando 3 sgasature.
    4.  Cuoci a 88°C per 2 ore.
    5.  A cottura ultimata apri la busta e separa gli scalogni dal liquido di cottura.
    6.  Lascia raffreddare il liquido di cottura e quando avrà raggiunto i 50°C frullalo per emulsionarlo.
    7.  Unisci l'emulsione agli scalogni e abbatti in positivo.
    8.  Conserva sottovuoto in frigorifero fino al momento dell'uso.
    9.  Per l'utilizzo basterà rigenerare la busta a 60°C per 15 minuti.

#### Brunoise di scorzonere
*   **Ingredienti:** 1 kg scorzonere, Sale.
*   **Procedimento:**
    1.  Lava, monda e pela le scorzonere, poi tagliale a brunoise di mezzo cm.
    2.  Condiscile con il sale e lasciale macerare per 10 minuti, poi elimina il liquido che avranno rilasciato.
    3.  Inseriscile nella busta da cottura e condizionale sottovuoto praticando una sgasatura.
    4.  Cuoci a 88°C per 30 minuti, poi abbatti in positivo.
    5.  Conserva in frigorifero fino al momento dell'uso.

#### Brunoise di sedano
*   **Ingredienti:** 1 kg sedano, Sale.
*   **Procedimento:**
    1.  Monda e lava il sedano.
    2.  Taglialo a brunoise da mezzo cm di lato, poi condiscilo con il sale e fallo macerare per 10 minuti.
    3.  Trascorso questo tempo, elimina il liquido che avrà rilasciato e inserisci il sedano nella busta da cottura.
    4.  Condizionalo sottovuoto praticando 3 sgasature.
    5.  Cuocilo a 88°C per 1 ora, poi abbattilo in positivo.
    6.  Conserva in frigorifero fino al momento dell'uso.

#### Sedano rapa a bastoncini
*   **Ingredienti:** 1 grosso sedano rapa, Sale.
*   **Procedimento:**
    1.  Lava, monda e pela il sedano rapa.
    2.  Taglialo a bastoncini di mezzo cm di larghezza per 1,5 cm di lunghezza, poi condiscilo con il sale e fallo macerare per 10 minuti.
    3.  Trascorso questo tempo, elimina il liquido che avranno rilasciato e inserisci il sedano nella busta da cottura.
    4.  Condiziona sottovuoto praticando 2 sgasature.
    5.  Cuocili a 88°C per 1 ora, quindi abbatti in positivo.
    6.  Conserva in frigorifero fino al momento dell'uso.

#### Sedano rapa ai funghi porcini secchi
*   **Ingredienti:** 1 grosso sedano rapa, Sale, 50 g polvere di funghi porcini secchi CBT.
*   **Procedimento:**
    1.  Lava, pela e taglia il sedano rapa a grossi parallelepipedi.
    2.  Condiscilo con il sale e fallo macerare per 10 minuti.
    3.  Elimina i liquidi dalla macerazione e ricoprilo con uno strato di polvere di funghi.
    4.  Inseriscilo nella busta da cottura e condizionalo sottovuoto praticando 5 sgasature.
    5.  Cuocilo a 88°C per 2 ore, quindi abbatti in positivo.
    6.  Al momento dell'utilizzo rigeneralo a 80°C per 10 minuti poi sfilalo dalla busta, affetta e servi.

#### Spinaci o spinacini al naturale
*   **Ingredienti:** 1 kg spinaci o spinacini puliti, 3 g sale.
*   **Procedimento:**
    1.  Condisci gli spinaci con il sale, poi inseriscili nelle buste da cottura distribuendoli in modo uniforme.
    2.  Condiziona sottovuoto praticando 5 sgasature.
    3.  Cuoci a 86°C per 10 minuti gli spinaci e per 8 minuti gli spinacini, dopodiché abbatti in positivo.
    4.  Al momento dell'uso toglili dalla busta, sfogliali e rifiniscili a tuo piacere.

#### Tartufo nero estivo al naturale
*   **Ingredienti:** 500 g tartufo estivo, Sale.
*   **Procedimento:**
    1.  Lava, pela e affetta il tartufo a lamelle di 2 mm, poi salalo con del sale finissimo.
    2.  Trasferiscilo nella busta da cottura in modo che steso e non sovrapposto.
    3.  Condizionalo sottovuoto praticando una sgasatura.
    4.  Cuocilo a 86°C per 10 minuti, poi abbatti in positivo.
    5.  Conserva in frigorifero fino al momento dell'uso.

#### Topinambur dorati al miele
*   **Ingredienti:** 1,5 kg topinambur, 160 g miele, 60 g burro, 0,3 g xantano, Pepe bianco macinato, Sale.
*   **Procedimento:**
    1.  Lascia ammorbidire il burro e frullalo con il miele, lo xantano e un pizzico di pepe bianco.
    2.  Lava, pela e taglia i topinambur, poi condiscili con il sale e falli macerare per 10 minuti.
    3.  Trascorso questo tempo elimina l'acqua che avranno rilasciato e unisci la miscela di miele, burro, xantano e pepe amalgamando bene.
    4.  Inserisci il composto nella busta da cottura e condiziona sottovuoto praticando 3 sgasature.
    5.  Cuoci a 88°C per 2 ore, poi abbatti in positivo.
    6.  Apri la busta, separa i topinambur dal liquido di cottura e falli rosolare leggermente in una padella.
    7.  Aggiungi ai topinambur il liquido di cottura e fallo ridurre a fuoco dolce fino a perfetta glassatura.
    8.  Regola di sapore e servi.

#### Topinambur interi al naturale
*   **Ingredienti:** 1 kg topinambur della stessa grandezza, Sale.
*   **Procedimento:**
    1.  Lava e spazzola i topinambur per eliminare ogni traccia di terra.
    2.  Condiscili con il sale e inseriscili nella busta da cottura.
    3.  Condizionali sottovuoto praticando 3 sgasature, poi cuocili a 88°C per 2 ore.
    4.  A cottura terminata abbattili in positivo.
    5.  Conserva in frigorifero fino al momento dell'uso.

#### Trombette di Albenga in agrodolce alla menta
*   **Ingredienti:** 1 kg trombette di Albenga, 100 g aceto di vino bianco, 100 g acqua, 75 g zucchero, 10 g sale, 15 g foglie di menta fresca, 2 g pepe nero in grani.
*   **Procedimento:**
    1.  In una casseruola unisci acqua, aceto, zucchero, sale, menta e pepe e falli sobbollire per 2 minuti, poi abbatti in positivo.
    2.  Lava, monda e taglia le trombette a rondelle dello spessore di mezzo cm, poi inseriscile nella busta da cottura insieme all'agrodolce.
    3.  Condizionale sottovuoto praticando 3 sgasature.
    4.  Cuocile a 84°C per 30 minuti, poi abbatti in positivo.
    5.  Conserva in frigorifero fino al momento dell'uso.

#### Verza in cassoeula
*   **Ingredienti:** 1 kg verza, 100 g brunoise di verdure per soffritto CBT, 50 g jus di maiale montato CBT, 50 g salsa di pomodoro CBT, 1 g miscela di polvere (semi di coriandolo, di carvi, cannella, chiodi di garofano, noce moscata, anice stellato), Sale.
*   **Procedimento:**
    1.  Pulisci e affetta grossolanamente la verza, condiscila con il sale e lasciala macerare per 10 minuti.
    2.  Trascorso questo tempo elimina il liquido che avrà rilasciato, poi aggiungi lo jus tagliato a pezzi, la salsa di pomodoro, la brunoise e la polvere delle spezie amalgamando bene il tutto.
    3.  Trasferisci questo composto nelle buste da cottura e condiziona sottovuoto praticando 3 sgasature.
    4.  Cuoci a 88°C per 2 ore, dopodiché apri la busta e separa le verze dal liquido di cottura.
    5.  Trasferisci il liquido in una casseruola e fallo ridurre finché non sarà denso.
    6.  Regolalo di sapore e riuniscilo alle verze amalgamando bene.
    7.  Abbatti il composto in positivo, poi conservalo sottovuoto in frigorifero.

#### Zucca alla salvia
*   **Ingredienti:** 1 kg zucca, 110 g burro morbido, 7 g foglie di salvia, 1 g pepe bianco in grani, Noce moscata, 0,2 g xantano, Sale.
*   **Procedimento:**
    1.  Lava e sbuccia la zucca, poi tagliala a dadi della stessa grandezza.
    2.  Condisci con il sale e lascia macerare per 10 minuti, dopodiché elimina il liquido che avrà rilasciato.
    3.  Frulla il burro insieme allo xantano, alla salvia, al pepe bianco e ad una grattugiata di noce moscata.
    4.  Amalgama il burro alla zucca, trasferisci il composto nella busta da cottura e condiziona sottovuoto.
    5.  Precuoci a 55°C per 30 minuti e abbatti in positivo.
    6.  Cuoci a 86°C per 15 minuti, poi abbatti in positivo.
    7.  Conserva sottovuoto fino al momento dell'uso.
    8.  Per utilizzarla, versa il contenuto della busta in una padella e rosola a fuoco dolce.
    9.  A rosolatura avvenuta, regola di sale e servi.

#### Zucca al naturale
*   **Ingredienti:** 1 zucca dalla polpa soda, Sale.
*   **Procedimento:**
    1.  Lava, elimina i semi e taglia la zucca nella forma desiderata.
    2.  Condiscila con il sale poi inseriscila nella busta da cottura e condiziona sottovuoto praticando 2 sgasature.
    3.  Precuocila a 55°C per 30 minuti e abbatti in positivo.
    4.  Successivamente cuoci a 86°C per 15/20 minuti, secondo il tipo di zucca utilizzato.
    5.  Abbatti in positivo e conserva in frigorifero al momento dell'uso.

#### Zucchine al naturale
*   **Ingredienti:** 1 kg zucchine, Sale.
*   **Procedimento:**
    1.  Lava, monda ed elimina la parte centrale spugnosa.
    2.  Tagliale a cubetti di 1 cm poi condiscile con il sale e lasciale macerare per 10 minuti.
    3.  Elimina l'acqua che avranno rilasciato e inseriscile nella busta da cottura.
    4.  Condiziona sottovuoto praticando 3 sgasature.
    5.  Cuoci a 88°C per 20 minuti, poi abbatti in positivo.
    6.  Conserva in frigorifero fino al momento dell'uso.

## ESSENZE

#### Essenza di manzo
*   **Ingredienti:** 2 kg biancostato di manzo disossato, 1 l acqua.
*   **Procedimento:**
    1.  Taglia in piccoli pezzi il biancostato, poi inseriscilo nella busta da cottura insieme all'acqua.

#### Essenza vegetale
*   **Ingredienti:** 1 l acqua, 500 g cipolle, 250 g carote, 125 g sedano.
*   **Procedimento:**
    1.  Lava, monda le verdure e affettale finemente.
    2.  Inseriscile nella busta da cottura con l'acqua, poi abbatti per stabilizzare i liquidi.
    3.  Condiziona sottovuoto e cuoci a 88°C per 4 ore e successivamente trasferisci la busta nella vasca a ultrasuoni a 50°C per 1 ora.
    4.  A cottura terminata abbatti in positivo.
    5.  Apri la busta, scola e strizza le verdure da tutti i liquidi.
    6.  Filtra l'essenza con una etamina e conserva sottovuoto in frigorifero.

*   **Ingredienti:** 100 g acqua fredda, 1 g zafferano in pistilli.
*   **Procedimento:**
    1.  Tosta delicatamente lo zafferano, poi inseriscilo nella busta da cottura insieme all'acqua.
    2.  Condiziona sottovuoto e cuoci a 40°C per 30 minuti.
    3.  Trascorso questo tempo, trasferiscilo nella vasca a ultrasuoni a freddo per altri 30 minuti.
    4.  Abbatti in negativo e conserva sottovuoto fino al momento dell'utilizzo.

    7.  Filtra, chiarifica e riduci alla temperatura di 102°C come illustrato nella sezione "Metodi", poi abbatti in positivo.
    8.  Trasferisci lo jus nella busta da conservazione e condizionalo sottovuoto.
    9.  Conservalo in positivo o negativo secondo necessità.

    3.  Taglia il burro a dadini e aggiungine poco per volta allo jus mescolando con una frusta.
    4.  Quando il burro sarà incorporato completamente regola di sapore e densità, poi abbatti in positivo.
    5.  Conservalo sottovuoto in positivo o in negativo secondo necessità.

## GRASSI PURIFICATI

#### Burro chiarificato
*   **Ingredienti:** 1 kg burro.
*   **Procedimento:**
    1.  Inserisci il burro nella busta da cottura e condiziona sottovuoto.
    2.  Cuoci a 65°C per 1 ora senza mai muovere la busta.
    3.  A cottura terminata, togli la busta dalla vasca e procedi con la separazione della parte acquosa, come illustrato nella sezione "Metodi".
    4.  Recuperato il burro chiarificato, trasferiscilo in uno stampo e abbattilo in positivo.
    5.  Quando si sarà solidificato, condizionalo sottovuoto e conservalo in frigorifero.

#### Grasso di rognone
*   **Ingredienti:** 1 kg grasso di rognone di vitello.
*   **Procedimento:**
    1.  Passa al tritacarne il grasso di rognone, inseriscilo nella busta da cottura e condizionalo sottovuoto.
    2.  Cuoci a 65°C per 1 ora, mescolando la busta ogni 15 minuti.
    3.  A cottura terminata, apri la busta e filtra il grasso liquido attraverso un setaccio a maglie fini, per eliminare tutte le sostanze solide.
    4.  Recuperato grasso purificato, trasferiscilo in uno stampo e abbattilo in positivo.
    5.  Se rimanessero residui acquosi, procedi con la separazione come illustrato nella sezione "Metodi".
    6.  Una volta pronto, condizionalo sottovuoto e conservalo in frigorifero.

#### Grasso di pancetta affumicata stagionata
*   **Ingredienti:** Il grasso recuperato e filtrato dalla cottura della pancetta affumicata stagionata.
*   **Procedimento:**
    1.  Inserisci il grasso di pancetta nella busta da cottura e condizionalo sottovuoto.
    2.  Cuoci a 65°C per 1 ora senza mai muovere la busta.
    3.  A cottura terminata togli la busta dalla vasca e procedi con la separazione della residuale parte acquosa, come illustrato nella sezione "Metodi".
    4.  Recuperato il grasso purificato, trasferiscilo in uno stampo e abbattilo in positivo.
    5.  Quando si sarà solidificato, condizionalo sottovuoto e conservalo in frigorifero.

#### Strutto di maiale
*   **Ingredienti:** 1 kg grasso di maiale. (Nota: per ottenere lo strutto è preferibile usare il grasso surrenale, più dolce e delicato).
*   **Procedimento:**
    1.  Taglia a pezzi il grasso e macinalo nel tritacarne utilizzando una trafila grossa.
    2.  Trasferisci il composto nella busta da cottura, condiziona sottovuoto e cuoci a 86°C per 15 ore.
    3.  A cottura ultimata apri la busta e separa il liquido di cottura dalle parti solide, pressando e setacciando il più possibile.
    4.  Abbatti in negativo il liquido ottenuto e una volta surgelato, elimina dal grasso la parte acquosa che si sarà sedimentata sul fondo.
    5.  Condiziona sottovuoto il grasso e procedi con la separazione della residuale parte acquosa come illustrato nella sezione "Metodi".
    6.  Ottenuto lo strutto (o la sugna) condizionalo sottovuoto e conservalo in positivo o in negativo.

#### Grasso di agnello
*   **Ingredienti:** Il grasso recuperato e filtrato dalla cottura dello jus di agnello.
*   **Procedimento:**
    1.  Inserisci il grasso di agnello nella busta da cottura e condizionalo sottovuoto.

    3.  A cottura terminata togli la busta dalla vasca e procedi con la separazione della residuale parte acquosa, come illustrato nella sezione "Metodi".

## GRASSI AROMATIZZATI

#### Burro al finocchietto
*   **Ingredienti:** 100 g burro, 25 g finocchietto fresco.
*   **Procedimento:**
    1.  Inserisci il finocchietto tritato nella busta da cottura insieme al burro.
    2.  Condiziona sottovuoto praticando 3 sgasature.
    3.  Cuoci a 65°C per 2 ore.
    4.  Trascorso questo tempo trasferisci la busta nella vasca a ultrasuoni a 50°C per 2 ore.
    5.  Apri la busta e setaccia pressando il finocchietto per ottenere tutto il liquido.
    6.  Abbattilo in un bagnomaria ghiacciato mescolando con una frusta per ripristinare l'emulsione fino a quando non raggiungerà una consistenza cremosa.
    7.  Trasferisci il burro in uno stampo e abbattilo in positivo.
    8.  Quando si sarà solidificato, condizionalo sottovuoto e conservalo in frigorifero.

#### Olio ai semi di finocchio
*   **Ingredienti:** 100 g olio di vinacciolo, 25 g semi di finocchio, 25 g acqua.
*   **Procedimento:**
    1.  Tosta i semi di finocchio per 2 minuti, poi pestali grossolanamente nel mortaio.
    2.  Trasferisci i semi di finocchio pestati nella busta da cottura insieme all'acqua, condiziona sottovuoto e lascia in infusione per 12 ore.
    3.  Trascorso questo tempo, apri un angolo della busta e aggiungi l'olio.
    4.  Condiziona sottovuoto, mescola i semi all'olio e cuoci a 86°C per 2 ore.
    5.  Terminata la cottura trasferisci la busta nella vasca a ultrasuoni a 50°C per 2 ore.
    6.  Apri la busta e setaccia pressando i semi di finocchio per ottenere tutto il liquido.
    7.  Fai decantare l'olio dalla eventuale frazione di liquidi che si depositeranno sul fondo, poi separali utilizzando il metodo illustrato per il burro chiarificato CBT.
    8.  Conservalo in frigorifero chiuso in un contenitore ermetico.

#### Olio al peperoncino fresco

## UMAMI DI VERDURE

#### Umami di asparagi
*   **Ingredienti:** 5 kg parature e gambi di asparagi.
*   **Procedimento:**
    1.  Lava e affetta finemente le parature e i gambi degli asparagi.
    2.  Inseriscili nella busta da cottura e condizionali sottovuoto praticando 5 sgasature.
    3.  Cuoci a 88°C per 1 ora, poi abbatti in positivo.
    4.  Apri la busta e passa gli asparagi in un estrattore per ricavarne il liquido privo della polpa.
    5.  Se dovesse contenere ancora tracce di polpa, filtralo attraverso una etamina.
    6.  Metti il succo di asparagi in una casseruola e fallo ridurre a fuoco dolce fino ad arrivare alla temperatura di 102°C, dopodiché abbatti in positivo.
    7.  Alla fine del procedimento, l'umami avrà l'aspetto di uno sciroppo molto denso.
    8.  Conservalo sottovuoto in frigorifero.

*   **Ingredienti:** 5 kg carote.
*   **Procedimento:**

## POLVERI E TERRE

#### Polvere blu di cavolo cappuccio
*   **Ingredienti:** 250 g cavolo cappuccio, 2 g sale, 0,3 g bicarbonato.
*   **Procedimento:**
    1.  Monda, lava e affetta finemente il cavolo cappuccio, condiscilo con sale e bicarbonato e fallo macerare per 30 minuti, poi scolalo dai liquidi che avrà rilasciato.
    2.  Trasferiscilo nella busta da cottura e condiziona sottovuoto praticando 3 sgasature.
    3.  Cuoci a 88°C per 2 ore, poi abbatti in positivo.
    4.  Apri la busta, versane il contenuto nel bicchiere del frullatore e omogeneizzalo.
    5.  Stendi la purea ottenuta su tappetini antiaderenti e mettila in essiccatore a 60°C/70°C fino a completa disidratazione.
    6.  Toglila dai tappetini, spezza le lastre di cavolo cappuccio essiccato e polverizzale.
    7.  Setaccia secondo la grana che preferisci, poi conserva la polvere al fresco in un contenitore ermetico.

#### Polvere di amidi pregelatinizzati

## SALSE

#### Salsa carbonara
*   **Ingredienti:** 500 g tuorlo setacciato, 450 g essenza di guanciale stagionata CBT, 240 g Pecorino Romano grattugiato, 20 g pepe nero CBT, 20 g amido di riso.
*   **Procedimento:**
    1.  Mescola bene gli amidi e il Pecorino Romano.
    2.  In una bastardella unisci il tuorlo, l'essenza di guanciale e qualche goccia di olio al pepe nero.
    3.  Aggiungi il mix di amidi e Pecorino Romano amalgamandoli senza incorporare aria.
    4.  Mettili in abbattitore per stabilizzare i liquidi, poi sgasali più volte finché smetteranno di gonfiarsi sotto l'azione della macchina sottovuoto.
    5.  Trasferisci il composto nella busta da cottura e condiziona sottovuoto.
    6.  Lascia la busta in frigorifero per 3 ore affinché il formaggio si reidrati.
    7.  Cuoci a 66°C per 75 minuti mescolando ogni 15 minuti. A cottura terminata abbatti in positivo.

    1.  Mescola insieme gli amidi, poi stemperali in 400 g di essenza di Pecorino Romano senza incorporare aria.
    2.  Inserisci il composto nella busta da cottura con il resto dell'essenza di Pecorino Romano.
    3.  Abbatti per stabilizzare i liquidi, poi condiziona sottovuoto e mescola per sciogliere ed amalgamare il composto.
    4.  Cuoci a 86°C per 30 minuti mescolando ogni 5 minuti.
    5.  Abbatti in positivo e conserva in frigorifero.

#### Salsa di Parmigiano Reggiano, cappone e panna
*   **Ingredienti:** 150 g essenza di cappone CBT, 400 g Parmigiano Reggiano grattugiato, 200 g essenza di Parmigiano Reggiano CBT, 200 g panna fresca.
*   **Procedimento:**
    1.  Inserisci tutti gli ingredienti nella busta da cottura.
    2.  Abbatti per stabilizzare i liquidi, poi condiziona sottovuoto e mescola per sciogliere ed amalgamare il composto.
    3.  Lascia la busta in frigorifero per 3 ore affinché il formaggio si reidrati.
    4.  Cuoci a 76°C per 40 minuti mescolando ogni 5 minuti.
    5.  A cottura ultimata, apri la busta e frulla la salsa per omogeneizzarla.
    6.  Abbatti in positivo, poi condiziona sottovuoto e conserva in frigorifero fino al momento dell'uso.

#### Salsa al burro bianco
*   **Ingredienti:** 150 g burro di qualità, 50 g riduzione di vino bianco, 50 g riduzione di aceto di vino bianco, 1 g sale, 0,8 g tara, 0,2 g guar.
*   **Procedimento:**
    1.  Miscela il sale alla tara ed al guar.
    2.  Inserisci nella busta da cottura il burro tagliato a dadini, le riduzioni di vino e aceto ed infine la miscela di polveri.
    3.  Massaggia la busta per mescolare sommariamente gli ingredienti poi condiziona sottovuoto.
    4.  Cuoci a 66°C per 1 ora, mescolando le prime due volte ogni 5 minuti e successivamente dopo ogni 10 minuti.
    5.  A cottura terminata, abbatti in positivo e conserva in frigorifero.

#### Salsa di cavolfiore alla panna
*   **Ingredienti:** 600 g cime di cavolfiore, 150 g panna, 100 g latte, 50 g riduzione di vino bianco allo scalogno, 20 g burro di qualità, 6 g sale, 2 g olio al pepe nero CBT.
*   **Procedimento:**
    1.  Affetta le cime di cavolfiore, poi inseriscile nella busta da cottura insieme a tutti gli altri ingredienti.
    2.  Abbatti per stabilizzare i liquidi, quindi condiziona sottovuoto praticando 3 sgasature.
    3.  Cuoci a 88°C per 40 minuti mescolando ogni 10 minuti.
    4.  A cottura ultimata, frulla finemente il composto, setaccia e abbatti in positivo.
    5.  Conservalo sottovuoto in frigorifero fino al momento dell'uso.

#### Bagna caoda
*   **Ingredienti:** 400 g aglio pelato, 500 g latte, 800 g burro di qualità, 600 g acciughe dissalate, 1 g xantano.
*   **Procedimento:**
    1.  Inserisci nella busta da cottura il latte e l'aglio, pulito solo della radice.
    2.  Abbatti per stabilizzare i liquidi, poi condiziona sottovuoto praticando 3 sgasature.
    3.  Cuoci a 86°C per 1 ora, quindi abbatti in positivo.
    4.  Attendi 24 ore prima di utilizzarlo.
    5.  Trascorso questo periodo, scola l'aglio dal latte.
    6.  Inserisci nella busta da cottura l'aglio cotto, il burro, le acciughe e lo xantano.
    7.  Condiziona sottovuoto e cuoci a 86°C per 5 ore, mescolando ogni 30 minuti.
    8.  A cottura ultimata versa il contenuto della busta in un blender e frullalo fino ad ottenere un composto liscio ed omogeneo.
    9.  Trasferisci il composto in una bastardella e abbatti in positivo, mescolando di tanto in tanto per mantenere stabile l'emulsione.
    10. Quando sarà raffreddata, condiziona sottovuoto e conserva in frigorifero.

#### Salsa olandese
*   **Ingredienti:** 250 g burro, 150 g tuorlo setacciato, 30 g riduzione di vino bianco, scalogno e dragoncello, 100 g riduzione di vino bianco, 5 g sale, 2 g olio al pepe nero CBT, 2 g olio al limone CBT, 0,3 g xantano.
*   **Procedimento:**
    1.  Miscela lo xantano al sale e taglia il burro a dadini.
    2.  Inseriscili con tutti gli altri ingredienti nella busta da cottura, condiziona sottovuoto poi mescola per uniformare il composto.
    3.  Cuoci a 66°C per 30 minuti, mescolando ogni 5 minuti le prime due volte e successivamente ogni 10 minuti.
    4.  A cottura ultimata abbatti la salsa in positivo.
    5.  Al momento dell'utilizzo falla ammorbidire a temperatura ambiente per 10 minuti, poi frullala per pochi attimi con un frullatore ad immersione per omogeneizzarla e lucidarla.

#### Salsa di pomodoro
*   **Ingredienti:** 5 kg pomodori con i rametti. (Nota: questa salsa di pomodoro concentra la ricchezza gustativa e aromatica della tipologia di pomodoro utilizzato, esaltando tutti i sapori ed il senso di umami. Oltre al pomodoro non sono previsti altri ingredienti i quali potranno essere aggiunti a piacere solamente a cottura ultimata. Si consiglia di usare pomodori freschissimi e profumati).
*   **Procedimento:**
    1.  Stacca i pomodori dai rametti e lava entrambi.
    2.  Taglia i pomodori a metà, inseriscili nella busta da cottura insieme ai rametti poi condiziona sottovuoto praticando 2 sgasature.
    3.  Cuocili a 88°C per 1 ora e abbattili in positivo.
    4.  Preleva il contenuto della busta eliminando i rametti e passalo al passaverdure per separare semi e bucce.
    5.  Recupera il passato e i liquidi e mettili in casseruola a ridurre a fuoco dolce, mescolando fino a raggiungere la temperatura di 102°C.
    6.  Abbatti in positivo e conservalo sottovuoto.

#### Emulsione di cipolle rosse brasate
*   **Ingredienti:** I liquidi di cottura delle cipolle rosse brasate CBT (pag.430), Poco xantano.
*   **Procedimento:**
    1.  Metti i liquidi di cottura in una casseruola e falli ridurre di un terzo a fuoco dolce.
    2.  Toglili dal fuoco ed emulsionali in un blender aggiungendo all'occorrenza poco xantano fino ad ottenere una salsa vellutata.
    3.  Regola di sapore, abbatti in positivo e condiziona sottovuoto fino al momento dell'utilizzo.

#### Emulsione di agrodolce alle cipolle e lamponi
*   **Ingredienti:** 300 g liquido di cottura agrodolce di cipolle e lamponi CBT (pag.596), 100 g olio di vinacciolo, 0,3 g xantano.
*   **Procedimento:**
    1.  Fai ridurre in una casseruola a fuoco dolce il liquido dell'agrodolce di cipolle e lamponi.
    2.  Quando avrà raggiunto una consistenza sciropposa abbattilo in positivo.
    3.  Trasferisci la riduzione in una caraffa insieme all'olio e allo xantano e montala con un frullatore a immersione senza incorporare aria.
    4.  Ottenuta l'emulsione regola di sapore e conservala sottovuoto in frigorifero.

#### Confettura di cipolle rosse, anice stellato e cannella
*   **Ingredienti:** 1 kg cipolle rosse, 500 g zucchero, 6 g pectina gialla, 2 g bacche di anice stellato, 6 g stecche di cannella.
*   **Procedimento:**
    1.  Pela e taglia le cipolle seguendo la fibra a fette di mezzo centimetro di larghezza.
    2.  Mescola zucchero, pectina e sale.
    3.  Unisci le cipolle alle polveri mescolando bene, poi inseriscile nella busta da cottura insieme alle spezie.
    4.  Abbatti per stabilizzare i liquidi e condiziona sottovuoto praticando 3 sgasature.
    5.  Lascia macerare in frigorifero per 2 ore, poi cuoci a 88°C per 2 ore mescolando ogni 20 minuti.
    6.  A fine cottura lo zucchero dovrà essere completamente sciolto.
    7.  Apri la busta e filtra lo sciroppo dalle cipolle.
    8.  Elimina le spezie e abbatti le cipolle in positivo.
    9.  Metti lo sciroppo in una casseruola e fallo ridurre fino a che non raggiungerà la concentrazione di 72°Brix.
    10. Abbatti in positivo, dopodiché unisci le cipolle precedentemente abbattute amalgamando bene.
    11. Condiziona sottovuoto e conserva in frigorifero.

#### Ketchup di pomodoro
*   **Ingredienti:** 1 kg salsa di pomodoro CBT, 170 g riduzione di aceto di vino rosso, 30 g zucchero, 12 g sale, 16 g Worcestershire sauce.
*   **Procedimento:**
    1.  In una bastardella unisci e amalgama tutti gli ingredienti.
    2.  Inserisci il composto nella busta da cottura poi condiziona sottovuoto.
    3.  Cuoci a 88°C per 40 minuti mescolando ogni 10 minuti.
    4.  Abbatti in positivo e conserva in frigorifero.

#### Ketchup di carote nere
*   **Ingredienti:** 600 g carote nere, 400 g succo di mele CBT, 40 g miele, 60 g zucchero, 70 g riduzione di aceto di vino rosso, 8 g Worcestershire sauce, 8 g sale.
*   **Procedimento:**
    1.  Pela e affetta finemente le carote, poi inseriscile nella busta da cottura e cuocile a 88°C per 1 ora.
    2.  A fine cottura, toglile dalla busta e frullale con tutti gli altri ingredienti fino ad ottenere una consistenza liscia.
    3.  Trasferisci il composto in una casseruola e mescolando spesso fai ridurre i liquidi fino ad arrivare alla temperatura di 102°C.
    4.  Regola di sapore, abbatti in positivo e conserva sottovuoto.

#### Gel di prezzemolo, aglio e limone
*   **Ingredienti:** 80 g acqua, 12 g riduzione di aceto di vino bianco, 2,5 g tara, 0,2 g citrato di sodio, 2 g sale, 1 g clorofilla di prezzemolo CBT, 1 g olio all'aglio CBT, 1 g olio al limone CBT. (Nota: alla ricetta per mantenere il colore verde brillante puoi aggiungere pochi attimi prima del servizio del gel).
*   **Procedimento:**
    1.  Mescola il destrosio, il sale, la tara, la kappa ed il citrato di potassio, poi inseriscili nella busta da cottura insieme all'acqua e all'aceto.
    2.  Abbatti per stabilizzare i liquidi poi condiziona sottovuoto e mescola per sciogliere ed amalgamare il composto.
    3.  Cuoci a 90°C per 30 minuti mescolando ogni 10 minuti poi abbatti in positivo.
    4.  Al momento dell'utilizzo, trasferisci il contenuto della busta in una caraffa e aggiungi la clorofilla e gli oli aromatici, poi frulla con un mixer ad immersione fino ad ottenere un composto liscio ed omogeneo.
    5.  Sgasa il gel ottenuto e conservalo sottovuoto in frigorifero.

#### Salsa di olive nolche
*   **Ingredienti:** 500 g olive nolche, Olio EVO, Sale.
*   **Procedimento:**
    1.  Lava le olive e inseriscile nella busta da cottura stendole bene.
    2.  Condizionale sottovuoto praticando una sgasatura.
    3.  Precuoci a 55°C per 30 minuti, poi abbatti in positivo.
    4.  Successivamente cuocile a 84°C per 20 minuti, quindi abbatti in positivo.
    5.  Una volta raffreddate, schiaccia le olive nella busta ancora chiusa, spappolandole completamente per ricavarne la prima purea grossolana.
    6.  Apri la busta e setaccia finemente il contenuto eliminando noccioli e bucce.
    7.  Recupera la polpa e frullala aggiungendo poco olio EVO e sale, poi abbatti in positivo.

#### Gel di polpo
*   **Ingredienti:** 200 g essenza di polpo CBT, 100 g olio di vinacciolo, 12 g gellan, 1 g xantano.
*   **Procedimento:**
    1.  Mescola gellan e xantano, poi inseriscili nella busta da cottura insieme all'essenza di polpo.
    2.  Condiziona sottovuoto e cuoci a 90°C per 30 minuti, mescolando ogni 5 minuti.
    3.  A cottura ultimata abbatti in positivo.
    4.  Quando sarà fredda e solidificata, trasferisci la gelatina in una caraffa e montala con un frullatore ad immersione senza incorporare aria, aggiungendo l'olio a filo fino a raggiungere una consistenza cremosa.
    5.  Successivamente sgasa il gel ottenuto e conservalo sottovuoto in frigorifero.

#### Senape alle mele
*   **Ingredienti:** 200 g semi di senape gialla, 600 g acqua fredda, 200 g ghiaccio, 200 g brunoise di mele CBT, 200 g senape di Dijon, 2 g sale.
*   **Procedimento:**
    1.  Inserisci nella busta da cottura semi di senape, sale, ghiaccio, acqua e condizionali sottovuoto praticando una sgasatura.
    2.  Falli idratare per 3 ore, poi cuocili a 88°C per 3 ore.
    3.  A fine cottura apri la busta, scola i liquidi e abbatti in positivo.
    4.  In una bastardella metti la senape, le mele preventivamente asciugate e la senape di Dijon.
    5.  Amalgama bene e conserva sottovuoto in frigorifero.

#### Cacio e pepe
*   **Ingredienti:** 500 g Pecorino Romano grattugiato, 350 g acqua, 20 g pepe nero in grani, 20 g citrato di sodio.
*   **Procedimento:**
    1.  Tosta in una padella il pepe in grani per due minuti, poi pestalo grossolanamente nel mortaio.
    2.  Trasferisci tutti gli ingredienti nella busta da cottura, poi condiziona sottovuoto.
    3.  Mescola il contenuto e fallo riposare almeno 3 ore in frigorifero per idratare il Pecorino Romano e il pepe.
    4.  Trascorso questo tempo cuoci a 85°C per 1 ora e mezza, mescolando ogni 15 minuti.
    5.  A cottura ultimata abbatti in positivo e conserva in frigorifero fino al momento dell'uso.

#### Fonduta di fontina
*   **Ingredienti:** 500 g fontina grattugiata, 380 g latte, 50 g tuorlo setacciato, 100 g burro di qualità, 20 g olio al pepe bianco CBT, 5 g sale.
*   **Procedimento:**
    1.  Inserisci tutti gli ingredienti nella busta da cottura, poi abbatti per stabilizzare i liquidi.
    2.  Una volta raffreddati condiziona sottovuoto e mescola per uniformare l'impasto.
    3.  Trasferisci la busta in frigorifero per almeno 3 ore affinché il formaggio si reidrati.
    4.  Cuoci a 76°C per 1 ora mescolando ogni 10 minuti, poi abbatti in positivo.

#### Ragù alla bolognese
*   **Ingredienti:** 250 g macinato di maiale, 400 g macinato di manzo, 150 g pancetta tesa stagionata macinata, 200 g brunoise per soffritto CBT, 40 g riduzione di vino bianco, 40 g latte, 150 g salsa di pomodoro CBT, 5 g olio alla salvia CBT, 5 g olio al rosmarino CBT, 2 g olio al pepe nero CBT, 3 g foglie di alloro, 13 g sale.
*   **Procedimento:**
    1.  Fai rosolare singolarmente le carni macinate, poi abbattile in positivo.
    2.  Una volta raffreddate le carni uniscile a tutti gli altri ingredienti stemperandoli fino ad ottenere una mescola ben distribuita.
    3.  Trasferisci il composto nelle buste da cottura, condiziona sottovuoto e stendi il contenuto livellandolo.
    4.  Cuoci a 64°C per 4 ore, poi abbatti in positivo.
    5.  Conserva il ragù in frigorifero fino al momento dell'utilizzo.

#### Purea di limoni per marinare
*   **Ingredienti:** 1 kg limoni non trattati, 300 g zucchero, 200 g sale.
*   **Procedimento:**
    1.  Lava e affetta i limoni eliminando tutti i semi.
    2.  Unisci lo zucchero e il sale amalgamando bene, poi trasferisci il composto nella busta da cottura.
    3.  Condiziona sottovuoto praticando 3 sgasature.
    4.  Cuoci a 86°C per 1 ora e mezza mescolando ogni 10 minuti, dopodiché trasferisci il contenuto della busta in un frullatore fino ad ottenere un composto liscio ed omogeneo.
    5.  Abbatti la purea in positivo poi sgasala.
    6.  Condizionala sottovuoto e conservala in frigorifero fino al momento dell'utilizzo.

#### Purea di arance per marinare
*   **Ingredienti:** 1 kg arance non trattate, 200 g zucchero, 300 g sale.
*   **Procedimento:**
    1.  Lava e affetta le arance eliminando tutti i semi.
    2.  Unisci lo zucchero e il sale amalgamando bene, poi trasferisci il composto nella busta da cottura.
    3.  Condiziona sottovuoto praticando 3 sgasature.
    4.  Cuoci a 86°C per 1 ora e mezza mescolando ogni 10 minuti, dopodiché trasferisci il contenuto della busta in un frullatore fino ad ottenere un composto liscio ed omogeneo.
    5.  Abbatti la purea in positivo poi sgasala.
    6.  Condizionala sottovuoto e conservala in frigorifero fino al momento dell'utilizzo.

#### Purea di mandarini per marinare
*   **Ingredienti:** 1 kg mandarini non trattati, 200 g zucchero, 300 g sale.
*   **Procedimento:**
    1.  Lava e affetta i mandarini eliminando tutti i semi.
    2.  Unisci lo zucchero e il sale amalgamando bene, poi trasferisci il composto nella busta da cottura.
    3.  Condiziona sottovuoto praticando 3 sgasature.
    4.  Cuoci a 86°C per 1 ora e mezza mescolando ogni 10 minuti, dopodiché trasferisci il contenuto della busta in un frullatore fino ad ottenere un composto liscio ed omogeneo.
    5.  Abbatti la purea in positivo poi sgasala.
    6.  Condizionala sottovuoto e conservala in frigorifero fino al momento dell'utilizzo.
